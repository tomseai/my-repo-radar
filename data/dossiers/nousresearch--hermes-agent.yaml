project:
  name: Hermes Agent
  kind: application
  summary: >-
    A self-improving, multi-provider AI agent with a terminal UI, messaging
    gateway, persistent skills and memory, automations, and remote execution backends.
  best_for:
    - Individuals who want a long-running personal agent across terminal and messaging interfaces
    - Developers who need skills, scheduled tasks, subagents, and configurable model or tool backends
key_features:
  - Provides a streaming terminal UI with conversation history and slash commands
  - Runs one messaging gateway for Telegram, Discord, Slack, WhatsApp, Signal, Email, and CLI conversations
  - Creates and improves skills, retains memory, and searches past sessions with FTS5-based recall
  - Schedules unattended cron tasks and can delegate isolated subagents for parallel work
  - Supports MCP servers and terminal backends for local, Docker, SSH, Singularity, Modal, and Daytona execution
usage:
  interfaces:
    - terminal UI and CLI
    - messaging gateway
    - desktop application
  installation:
    - official shell installer for Linux, macOS, WSL2, and Termux
    - official PowerShell installer for native Windows
    - source checkout with uv
  setup: moderate
technology:
  languages:
    - Python
    - TypeScript
    - Rust
  notable_components:
    - SQLite FTS5
    - Docker
    - Model Context Protocol
    - Electron desktop shell
