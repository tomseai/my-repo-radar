strengths:
  - Pairs a full terminal interaction model with a single gateway for several messaging platforms
  - Integrates skills, persistent recall, automations, subagents, MCP, and multiple execution backends
  - Documents native Windows support as well as Unix-like and container or remote paths
caveats:
  - Model providers and optional tool backends may require separate credentials, services, or subscriptions
  - Messaging use requires gateway setup and the relevant platform configuration
  - Remote execution backends such as Docker, SSH, Modal, and Daytona add their own operational dependencies
  - The desktop package has its own version, while v0.18.2 is the matching primary Python-package and release-feed version
