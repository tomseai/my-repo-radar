strengths:
  - Creates a coherent workflow from scope clarification through durable execution
  - Provides explicit state, worktree isolation, and team coordination for larger coding tasks
  - Keeps CLI and JSON commands as the durable operational path when optional MCP integrations fail

caveats:
  - It augments Codex CLI; it is not a standalone coding agent or model
  - The recommended team runtime depends on tmux and is primarily designed for macOS or Linux
  - Native Windows and the Codex App are documented as less-supported paths
  - The --madmax convenience mode bypasses approvals and sandboxing and is only suitable for trusted environments

