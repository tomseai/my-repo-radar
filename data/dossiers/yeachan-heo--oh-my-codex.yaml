project:
  name: oh-my-codex
  kind: cli
  summary: A workflow and orchestration layer around OpenAI Codex CLI that adds
    reusable skills and roles, durable project state, planning flows, and optional
    multi-agent team execution.
  best_for:
    - Codex CLI users who want reusable planning and execution workflows
    - Larger trusted Git tasks that benefit from isolated worktrees and coordinated
      agents
key_features:
  - Provides independently invocable planning, durable goal execution, team
    coordination, code review, and quality-check skills
  - Stores project guidance, plans, logs, memory, and runtime state under .omx
  - Launches and coordinates team workers with dedicated worktrees and tmux-oriented
    runtime controls
  - Installs scoped AGENTS guidance, prompts, skills, hooks, and Codex configuration
    through setup
  - Offers CLI/JSON control-plane commands, with MCP retained as an optional
    compatibility or integration surface
  - Includes a Codex plugin layout and a VS Code extension for direct session control
    and monitoring
usage:
  interfaces:
    - CLI
    - Codex plugin
    - VS Code extension
    - MCP server
  installation:
    - npm global package
    - Codex plugin marketplace
    - build from source
  setup: high
technology:
  languages:
    - TypeScript
    - Rust
  notable_components:
