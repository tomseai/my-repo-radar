status:
  lifecycle: experimental
  archived: false
  latest_release: v0.23.0
  latest_release_at: 2026-11-19
strengths:
  - Presents one orchestration layer across several first-class and custom agent
    harnesses
  - Combines collaboration, sandbox deployment choices, and policy enforcement
    in the same runtime
  - Supports local use as well as Docker-based server deployment with multi-user
    authentication
caveats:
  - The README labels the project alpha
  - "Broad harness support brings substantial prerequisites: Python 3.12+, uv,
    git, and, for several harnesses, Node.js and tmux"
  - Windows support is explicitly degraded and lacks the native terminal
    wrappers and filesystem/network sandboxing
  - The release feed includes newer v0.24.0 nightlies. The latest stable
    release shown is v0.23.0, and the source declares version 0.24.0.dev0.
