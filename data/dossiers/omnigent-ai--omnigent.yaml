project:
  name: Omnigent
  kind: framework
  summary: >-
    An alpha open-source meta-harness and agent runtime that provides a common
    orchestration layer across coding-agent harnesses and custom agents, with
    collaborative sessions, sandbox targets, and configurable action and spend policies.
  best_for:
    - Developers who need to mix supported coding-agent harnesses and custom YAML agents
    - Teams that want shared agent sessions across terminal, browser, phone, or desktop interfaces
key_features:
  - Runs Claude Code, Codex, Cursor, OpenCode, Hermes, Pi, and custom YAML-defined agents through one layer
  - Synchronizes sessions, sub-agents, terminals, and files across terminal, browser, and phone access
  - Offers cloud sandbox targets and server-provisioned managed hosts for sessions
  - Applies policies for approvals, tool access, token spend, and action limits at server, agent, or session scope
  - Provides sharing, co-driving, and conversation-fork workflows for collaborators
