strengths:
  - Presents one orchestration layer across several first-class and custom agent harnesses
  - Combines collaboration, sandbox deployment choices, and policy enforcement in the same runtime
  - Supports local use as well as Docker-based server deployment with multi-user authentication
caveats:
  - The README labels the project alpha
  - "Broad harness support brings substantial prerequisites: Python 3.12+, uv, git, and, for several harnesses, Node.js and tmux"
  - Windows support is explicitly degraded and lacks the native terminal wrappers and filesystem/network sandboxing
  - The feed has a newer v0.0.1rc2 entry dated 2026-07-15 while source declares v0.6.0.dev0; v0.5.1 is treated as the latest established stable release, but release scope remains ambiguous
