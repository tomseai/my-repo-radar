project:
  name: LangChain.js
  kind: framework
  summary: >-
    A TypeScript framework for assembling LLM-powered applications from
    interoperable abstractions for agents, models, embeddings, vector stores,
    tools, retrievers, and third-party integrations across server and browser
    JavaScript runtimes.
  best_for:
    - TypeScript teams composing LLM applications from providers, tools, and
      data sources
    - Projects that need the same framework across Node.js, browser, edge, or
      serverless runtimes
key_features:
  - Standard interfaces for agents, chat and embedding models, vector stores,
    tools, and retrievers
  - Modular integrations for model providers, external systems, and data sources
  - Model interoperability that lets applications swap model implementations
  - Component-oriented abstractions for rapid prototyping and lower-level
    customization
  - Support for Node.js, Cloudflare Workers, Vercel or Next.js, Supabase Edge
    Functions, browsers, Deno, and Bun
usage:
  interfaces:
    - TypeScript library API
    - Node.js runtime
    - browser and edge runtimes
  installation:
    - npm package
    - pnpm package
    - yarn package
  setup: moderate
technology:
  languages:
    - TypeScript
  notable_components:
    - Node.js
    - pnpm
    - Turborepo
