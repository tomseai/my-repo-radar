project:
  name: Cole's AI Skills
  kind: plugin
  summary: >-
    A portable collection of coding-agent skills and optional Claude Code hooks
    for a prime-plan-implement-validate-review delivery loop, parallel
    worktrees, project guidance, and building a reusable AI workflow layer.
  best_for:
    - Developers who want editable, reusable instructions for an end-to-end
      coding-agent workflow
    - Teams standardizing planning, validation, review, worktrees, hooks, and
      agent context across repositories
key_features:
  - Plain-Markdown skills spanning codebase priming, product and
    architecture planning, implementation, validation, review, commits, and pull
    requests
  - A composable PIV loop that can run skill by skill or through one end-to-end
    orchestration skill
  - Worktree skills for preparing parallel branches and merging them through an
    integration branch
  - Meta-skills for authoring skills and rules, creating hooks, auditing
    workflow drift, and evolving an AI layer
  - Includes a read-only audit of agent configuration and guidance for building a source-monitoring digest
  - Copy-in Python hooks for secrets and destructive-command protection,
    dependency enforcement, tool logging, session context, test gates, and
    notifications
  - Installation as an updating Claude Code plugin or editable project/global
    files for Codex and many other agents
usage:
  interfaces:
    - Agent skill commands and SKILL.md instruction files
    - Claude Code plugin
    - npx skills command-line installer
    - Optional Claude Code lifecycle hooks
  installation:
    - Add coleam00/skills as a Claude Code plugin marketplace and install
      skills@cole-medin
    - Run npx skills add coleam00/skills for editable files, optionally
      selecting skills or target agents
    - Clone the repository and copy selected .claude/skills directories
  setup: moderate
technology:
  languages:
    - Markdown
    - Python
    - Shell
  notable_components:
    - Agent Skills SKILL.md format
    - PIV workflow
    - Git worktrees
    - Claude Code hooks and plugin manifest
