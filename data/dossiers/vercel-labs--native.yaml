project:
  name: Native SDK
  kind: framework
  summary: >-
    A declarative toolkit for compiling TypeScript-authored desktop interfaces
    to native executables, with optional embedded web content.
  best_for:
    - Developers building lightweight native desktop applications from TypeScript
    - Agent-driven UI workflows that benefit from deterministic record and replay
key_features:
  - Compiles declarative .native markup and TypeScript logic to native binaries
  - Provides components, design tokens, state architecture, and a development CLI
  - Provides testing and automation interfaces for inspecting and driving apps
  - Supports Zig cores and optional embedded web content
usage:
  interfaces:
    - command-line interface
    - TypeScript SDK
    - agent automation server
  installation:
    - npm install -g @native-sdk/cli
    - source checkout
  setup: moderate
technology:
  languages:
    - Zig
    - TypeScript
  notable_components:
    - native UI runtime
    - accessibility tree
