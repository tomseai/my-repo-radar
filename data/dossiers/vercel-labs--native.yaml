  notes: Permissive license with patent grant and notice requirements.
status:
  lifecycle: experimental
  archived: false
  latest_release: v0.11.1
  latest_release_at: 2026-11-09
strengths:
  - Targets genuinely native binaries while retaining a TypeScript authoring
    experience
  - Includes testing and automation workflows
caveats:
  - macOS support is the deepest; Linux and Windows are less mature and mobile
    support is experimental
  - The project is pre-1.0 and its custom UI model differs from browser
    frameworks
