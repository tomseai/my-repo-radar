project:
  name: Meridian
  kind: service
  summary: A local API proxy and dashboard connecting coding clients to
    Anthropic Claude through the Claude Agent SDK and, in preview, Google
    Antigravity through the signed-in agy CLI.
  best_for:
    - Connecting compatible coding clients to a signed-in Claude environment
      or trying the Antigravity preview
    - Running local, concurrent Claude-backed coding-agent sessions through a
      common endpoint
key_features:
  - Anthropic-compatible API plus OpenAI-compatible chat-completions and
    models endpoints
  - Streaming, session persistence and resume, concurrent sessions, and
    subagent model selection
  - Adapter instances and optional passthrough tool execution for connected
    clients
  - Optional persisted telemetry with configurable retention
  - CLI configuration, a browser dashboard, and a macOS desktop preview
  - npm, Nix, Home Manager, and Docker deployment documentation
usage:
  interfaces:
    - CLI
    - local HTTP API proxy
    - optional web dashboard
    - Apple Silicon macOS app preview
  installation:
    - npm global package
    - Nix flake or Home Manager
    - Docker
  setup: moderate
technology:
  languages:
    - TypeScript
  notable_components:
    - Claude Agent SDK
    - Anthropic-compatible API
    - OpenAI-compatible API
    - Bun
    - SQLite telemetry storage
license:
  spdx: MIT
