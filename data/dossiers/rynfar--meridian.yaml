  notes: The root MIT license requires retaining its copyright and permission
    notice in copies or substantial portions.
status:
  lifecycle: active
  archived: false
  latest_release: meridian-v1.93.0
  latest_release_at: 2026-11-17
strengths:
  - Lets tools using either of two common API formats connect to one local
    SDK-backed service
  - Documents direct SDK use rather than credential interception or binary
    patching
  - Provides deployment options beyond the standard global npm installation
caveats:
  - Provider permissions, model availability, and subscription limits apply.
    Antigravity uses a signed-in Google agy CLI
  - Docker deployment requires bringing authenticated Claude credentials or an
    OAuth-token profile into the container
  - The Antigravity preview has authenticated verification on macOS arm64.
    Linux and Windows verification was unfinished in the retained README
