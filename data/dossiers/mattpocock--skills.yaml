project:
  name: Skills For Real Engineers
  kind: plugin
  summary: >-
    A composable collection of coding-agent skills and Markdown guidance for
    structured engineering workflows, available through skills.sh and as a
    managed Claude Code plugin.
  best_for:
    - Teams wanting reusable agent instructions for planning, implementation, testing, debugging, and review
    - Developers who want to adapt installed skill files to their own project workflow
key_features:
  - Separates user-invoked orchestration skills from model-invoked reusable engineering disciplines
  - Includes workflows for grilling requirements, specifications, ticket decomposition, implementation, TDD, bug diagnosis, and code review
  - The setup skill records project-specific issue-tracker, triage-label, and documentation-location choices for other skills
  - skills.sh installation copies editable skills into a project, while the Claude Code plugin provides a managed updating bundle
  - Includes productivity skills for handoffs, teaching, and authoring or refining agent skills
usage:
  interfaces:
    - Agent skill commands and Markdown instruction files
    - skills.sh command-line installer
    - Claude Code plugin
  installation:
    - npx skills@latest add mattpocock/skills
    - Select /setup-matt-pocock-skills and run it once per repository
    - Alternatively install mattpocock-skills from the Matt Pocock Claude Code marketplace
  setup: moderate
technology:
  languages:
    - Markdown
    - Shell
  notable_components:
    - Agent Skills standard
    - skills.sh
    - Claude Code plugin
