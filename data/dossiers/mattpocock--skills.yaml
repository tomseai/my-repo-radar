strengths:
  - Covers an end-to-end engineering flow while keeping individual skills composable
  - Offers both editable project-local installation and a managed plugin option
  - Captures repository-specific workflow choices instead of hard-coding tracker or documentation conventions
caveats:
  - These are agent instructions and workflow guidance, so results depend on the selected agent and its surrounding harness
  - Engineering skills require the one-time setup step before use so tracker, label, and documentation conventions are known
  - Pick one installation method per agent to avoid duplicate skills. Managed plugin routes include Claude Code, Codex, GitHub Copilot, and VS Code.
  - The repository has breaking changes between releases, including renamed or removed skills, so existing invocations should be checked when updating
