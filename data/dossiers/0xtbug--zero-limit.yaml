status:
  lifecycle: active
  archived: false
  latest_release: v1.1.3
  latest_release_at: 2026-02-27
strengths:
  - Consolidates several coding-assistant quota views in a native cross-platform app
  - Provides both guided local-proxy setup and remote HTTPS-server connection
  - Offers official release artifacts for Windows, macOS, and Linux
caveats:
  - Quota monitoring and local proxy control depend on CLIProxyAPI rather than direct provider integrations
  - Each supported provider requires its own OAuth account and proxy configuration
  - The macOS application is not code-signed, so users may need to remove the quarantine attribute
  - Source builds require Node.js 20 or newer, pnpm, Rust, and the Tauri toolchain
