project:
  name: ZeroLimit
  kind: application
  summary: >-
    A cross-platform desktop application that uses CLIProxyAPI to monitor quota
    usage for supported AI coding-assistant accounts and manage a local proxy
    or connect to a remote HTTPS server.
  best_for:
    - Developers who use multiple supported AI coding-assistant accounts
    - Users who want a GUI for a local or remote CLIProxyAPI server
key_features:
  - One dashboard for supported Gemini, Claude, Codex, Antigravity, Kiro, and GitHub Copilot accounts
  - Visual per-account quota progress with manual refresh
  - Start, stop, and optionally auto-start a local CLIProxyAPI process
  - Guided onboarding that can download and configure the CLI proxy
  - System-tray operation, themes, and seven interface languages
usage:
  interfaces:
    - desktop GUI
    - system tray
  installation:
    - release binaries for Windows, macOS, and Linux
    - build from source with pnpm and Tauri
  setup: moderate
technology:
  languages:
    - TypeScript
    - Rust
  notable_components:
    - Tauri 2
    - React 19
    - CLIProxyAPI
