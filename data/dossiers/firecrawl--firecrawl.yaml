project:
  name: firecrawl
  kind: service
  summary: A web-content toolkit with a local CLI and MCP server, a hosted API, and a
    separately deployable self-hosted server for extracting and using website
    content.
  best_for:
    - Developers supplying web content to AI applications and agents
    - Teams choosing between a local parser, hosted web tools, and a self-hosted
      server
key_features:
  - Scrape, crawl, map, and batch-scrape websites locally or through hosted APIs
  - Convert pages to Markdown or structured data and handle JavaScript rendering for
    supported pages
  - Expose the local tools through an MCP server and a localhost API
  - Use Firecrawl Cloud for web search, Alexandria data sources, page interaction,
    and agent-powered research
usage:
  interfaces:
    - REST API
    - CLI
    - client SDKs
    - MCP server
  installation:
    - Firecrawl-hosted service
    - SDK packages
    - Docker Compose self-hosting
    - build from source
    - Firecrawl Local binary via Cargo
  setup: high
technology:
  languages:
    - TypeScript
    - Go
    - Python
    - Rust
  notable_components:
    - Playwright
    - Redis
    - PostgreSQL
    - Docker Compose
license:
