strengths:
  - Covers discovery, extraction, crawling, and interaction through a single API surface
  - Produces formats intended for LLM and agent consumption, including Markdown and structured data
  - Offers hosted, self-hosted, CLI, and multi-language SDK access paths
caveats:
  - The main codebase uses AGPL-3.0-or-later, while SDK and UI licensing varies by directory
  - Local development requires Node.js, Rust, pnpm, Redis, PostgreSQL, and environment configuration
  - Hosted-only features may differ from the open-source self-hosted implementation
