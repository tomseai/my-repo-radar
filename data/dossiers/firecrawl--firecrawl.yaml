status:
  lifecycle: active
  archived: false
  latest_release: v2.11.0
  latest_release_at: 2026-06-19
strengths:
  - Covers discovery, extraction, crawling, and interaction through a single API
    surface
  - Produces formats intended for LLM and agent consumption, including Markdown and
    structured data
  - Offers hosted, self-hosted, CLI, and multi-language SDK access paths
caveats:
  - The main codebase uses AGPL-3.0-or-later, while SDK and UI licensing varies by
    directory
  - Full server self-hosting requires queues, databases, and environment
    configuration; the standalone local tool has a separate, lighter setup
  - Local scraping and crawling run on the user’s machine; search and Alexandria
    require Firecrawl Cloud
  - The release feed mixes automated API image tags with project releases; the
    documented project tag is v2.11.0
