project:
  name: firecrawl
  kind: service
  summary: >-
    An API and SDK platform for web search, scraping, crawling, and browser
    interaction that returns AI-ready Markdown, structured data, and other content.
  best_for:
    - Developers supplying current web context to AI applications and agents
    - Teams that need search, extraction, crawling, and page interaction behind one API
key_features:
  - Search the web and retrieve page content from results
  - Scrape URLs into Markdown, HTML, screenshots, or structured JSON
  - Crawl a site, map its URLs, or batch-scrape many pages asynchronously
  - Interact with pages through prompts or actions such as clicking, scrolling, and typing
  - Run autonomous data-gathering requests through the Agent endpoint
  - Provide client SDKs for Python, Node.js, Go, Java, Rust, Ruby, .NET, and PHP
usage:
  interfaces:
    - REST API
    - CLI
    - client SDKs
  installation:
