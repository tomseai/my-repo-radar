project:
  name: PSNET
  kind: application
  summary: >-
    A native Rust TUI network monitor for Windows that combines connection and
    bandwidth views, listening-port inspection, packet details, GeoIP maps, LAN
    discovery, topology, alerts, and firewall controls in a standalone binary.
  best_for:
    - Windows users wanting a terminal-first overview of connections, services,
      devices, and traffic
    - Developers diagnosing local ports, adapters, process traffic, or network
      exposure without a full GUI suite
key_features:
  - Presents nine tabs for dashboards, connections, servers, packets, topology,
    alerts, firewall, devices, and networks
  - Resolves DNS names and fingerprints listening services and web technologies
  - Embeds GeoIP, server fingerprints, web signatures, and OUI vendor data
  - Discovers LAN devices and visualizes network topology and adapters
  - Supports per-application firewall actions and optional raw packet preview
usage:
  interfaces:
    - TUI
    - CLI
  installation:
    - Cargo package
    - Chocolatey package
    - WinGet package psmux.psnet
    - release binary or source checkout
  setup: low
technology:
  languages:
    - Rust
  notable_components:
    - Ratatui
    - Windows IP Helper API
    - WinSock
    - embedded GeoIP and OUI databases
