strengths:
  - Consolidates many Windows network diagnostics into one terminal interface
  - Ships embedded enrichment databases and needs no Npcap or WinPcap
    installation
  - Tagged Windows builds are signed by the release workflow
  - Multiple package channels and a small standalone binary simplify local
    adoption
caveats:
  - Windows 10 or 11 is required because collection and control use native
    Windows APIs
  - Administrator rights are needed for raw packet preview and some active
    controls
