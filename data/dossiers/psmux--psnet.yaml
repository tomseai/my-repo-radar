strengths:
  - Consolidates many Windows network diagnostics into one terminal interface
  - Ships embedded enrichment databases and needs no Npcap or WinPcap installation
  - Multiple package channels and a small standalone binary simplify local adoption
caveats:
  - Windows 10 or 11 is required because collection and control use native Windows APIs
  - Administrator rights are needed for raw packet preview and some active controls
  - The pinned README still links downloads and source cloning through the earlier marlocarlo namespace although the cataloged repository is psmux/psnet
