strengths:
  - A built-in agent provides a usable starting point without first installing a
    CLI agent
  - The shared interface can consolidate several supported agent backends and
    model providers
  - Team mode exposes delegation, parallel work, shared folders, and per-agent
    permissions in one workspace

caveats:
  - Model-backed workflows require configuring an API key, credentials, or a
    compatible local provider
  - External CLI-agent support depends on the required tool being installed and
    recognized locally
  - YOLO and full-auto modes bypass action confirmations, which raises the need
    for careful workspace and permission controls
  - Local development spans this Electron frontend and a separate AionCore
    backend repository

