project:
  name: AionUi
  kind: application
  summary: >-
    An open-source, cross-platform cowork application that supplies a built-in
    AI agent and a unified interface for compatible CLI agents, with local
    workspace access, multi-agent teams, model-provider configuration, MCP
    tools, remote WebUI access, and scheduled automation.
  best_for:
    - Individuals who want a desktop workspace for supervised AI-agent tasks
    - Teams coordinating supported coding agents on a shared local folder
key_features:
  - Built-in agent for file operations, web search, image generation, and MCP
    tools
  - Auto-detection and unified sessions for supported external CLI agents
  - Parallel team mode with leader delegation, task board, and asynchronous
    mailbox
  - MCP configuration that can be synchronized across configured agents
  - Cloud-model and local-model provider options, including OpenAI, Anthropic,
    and Ollama
  - WebUI and messaging-channel options for remote access and monitoring
  - Local SQLite storage for application data

usage:
  interfaces:
    - desktop GUI
    - web UI
    - messaging channels
  installation:
    - platform installer from GitHub Releases
    - Homebrew on macOS
    - build from source
  setup: moderate
