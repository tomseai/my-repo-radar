  interfaces:
    - Live Zoom sessions
    - YouTube playlist
    - GitHub Markdown episode catalog
    - Episode code directories
  installation:
    - Browse the README and linked recordings
    - Clone the repository to inspect or run an individual episode project
    - Follow the selected episode's Python or Node package manifest for dependencies
  setup: low
