project:
  name: AI That Works
  kind: course
  summary: >-
    A weekly live-coding and Q&A series with a repository of episode notes and
    selected code, focused on taking AI applications from demos toward
    production through practical engineering topics.
  best_for:
    - Engineers learning production-oriented AI techniques from episode-based examples
    - Participants who want live discussion alongside selected Python and TypeScript materials
key_features:
  - Weekly Tuesday Zoom sessions with a linked YouTube playlist for episodes
  - Episode catalog spanning classification, prompting, evaluations, context engineering, agent memory, multimodality, and coding agents
  - Selected episode code linked from the catalog, including Python and TypeScript projects
  - Pre-reading guidance for Git, Cursor, Claude Code, CodeLayer, BAML, Python, TypeScript, Go, uv, pnpm, and Go modules
  - Practical sessions and workshops framed around moving AI applications from demos to production
