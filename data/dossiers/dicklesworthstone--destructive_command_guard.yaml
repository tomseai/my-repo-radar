project:
  name: Destructive Command Guard (dcg)
  kind: cli
  summary: >-
    A Rust command-line guard and pre-execution hook for AI coding agents that
    detects and blocks configured destructive Git, shell, filesystem, database,
    cloud, and container commands before they run.
  best_for:
    - Adding configurable command-safety checks to supported AI coding agents
    - Preventing accidental destructive Git or shell operations in local repositories

key_features:
  - Pre-execution hooks for several AI coding-agent clients, including Codex CLI
  - Built-in rule packs for Git and filesystem operations, with optional domain-specific packs
  - Heredoc and inline-script scanning alongside direct command matching
  - Explain mode, allowlists, and configurable external YAML rule packs
  - Machine-readable hook output separated from human-oriented terminal output

usage:
  interfaces:
    - command-line interface
    - AI coding-agent hooks
    - CI scan mode
  installation:
    - official shell installer for Linux, macOS, and WSL
    - official PowerShell installer for native Windows
    - build from Rust source with Cargo
  setup: moderate

technology:
  languages:
    - Rust
  notable_components:
    - configurable rule packs
    - TOML configuration and YAML external packs

license:
  spdx: null
  name: MIT License with OpenAI/Anthropic Rider
  notes: >-
    The MIT grant is modified by a rider that grants no rights to named
    Restricted Parties, including OpenAI and Anthropic, and restricts providing
    the software or derivative works to them.

status:
  lifecycle: active
  archived: false
  latest_release: v0.6.9
  latest_release_at: 2026-07-18

strengths:
  - Blocks commands before execution instead of only reporting risks afterward
  - Covers agent hooks, direct CLI use, and CI-oriented scanning
  - Provides explicit rule explanations and scoped configuration mechanisms

caveats:
  - The custom rider makes the project unsuitable where its Restricted-Party terms apply
  - It is not a complete malware detector; obfuscated payloads and unsupported languages can evade scanning
  - Malformed hook input is allowed with an audit warning by default unless fail-closed mode is configured

