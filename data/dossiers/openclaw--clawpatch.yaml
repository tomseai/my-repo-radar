status:
  lifecycle: experimental
  archived: false
  latest_release: v0.8.4
  latest_release_at: 2026-10-21
strengths:
  - Review state, feature records, findings, and patch attempts are stored
    locally for auditability
  - The default review and revalidation paths use read-only provider constraints
  - The documented workflow keeps patch selection, review, commit, and
    pull-request creation explicit
caveats:
  - The tool is evolving, and provider capabilities and restrictions vary
  - A fix can modify the working tree and requires manual inspection and testing
    before committing
  - "Some provider safety depends on the underlying agent: ACP agents that
    bypass their own permissions may not be strictly sandboxed"
  - Automatic commits, pull requests, landing changes, rollback snapshots, and
    global process locks are not implemented
