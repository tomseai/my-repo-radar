project:
  name: Clawpatch
  kind: cli
  summary: >-
    An early command-line tool that maps a codebase into feature slices, reviews
    them through a local coding-agent provider, records findings, and supports
    an explicit, validated patch attempt for one selected finding.
  best_for:
    - Teams wanting an agent-assisted review workflow with persisted,
      inspectable findings
    - Developers who want to review and manually approve generated fixes in Git
      repositories
key_features:
  - Maps repository structure and language-specific features before review
  - Runs provider-backed reviews in parallel and persists findings under
    .clawpatch/
  - Produces Markdown or JSON reports and supports triage and revalidation of
    findings
  - Runs an explicit single-finding fix loop with configured validation commands
  - Can commit an applied patch attempt and open a draft pull request only
    through an explicit command
usage:
  interfaces:
    - Command-line interface
    - JSON and Markdown report output
  installation:
    - Install globally with pnpm add -g clawpatch
    - Build from source with pnpm install, pnpm build, and pnpm link --global
  setup: moderate
technology:
  languages:
    - TypeScript
  notable_components:
    - Node.js 22 or later
    - pnpm
    - Codex CLI provider
    - ACP-compatible coding-agent providers
