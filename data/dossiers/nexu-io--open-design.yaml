project:
  name: Open Design
  kind: application
  summary: >-
    A local-first desktop design workspace that uses coding agents, skills, and
    design systems to generate, preview, and export code-based design artifacts.
  best_for:
    - Designers and developers prototyping interface artifacts with a local coding agent
    - Teams that want reusable DESIGN.md-based brand and design-system inputs

key_features:
  - Generates web, desktop, and mobile prototypes from briefs and local agent workflows
  - Previews HTML artifacts in a sandboxed iframe and exports HTML, PDF, PPTX, or MP4
  - Supplies skills, design systems, plugins, a CLI, and an MCP server
  - Supports installed coding-agent CLIs and OpenAI-compatible BYOK endpoints
  - Provides packaged macOS and Windows desktop applications plus Docker deployment

usage:
  interfaces:
    - desktop app
    - CLI
    - MCP server
    - local web UI
  installation:
    - official macOS or Windows desktop download
    - od MCP install command
    - Docker Compose
    - build from source with pnpm
  setup: moderate

technology:
  languages:
    - TypeScript
    - JavaScript
  notable_components:
    - Electron
    - SQLite
    - Model Context Protocol
    - pnpm workspace

