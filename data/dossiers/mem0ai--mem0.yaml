strengths:
  - Covers embedded SDK, CLI, self-hosted, and managed deployment choices in
    one project
  - Supports multiple model and vector-store integrations rather than a single
    fixed backend
  - Provides concrete quickstarts and integrations for common agent workflows
caveats:
  - The library requires an LLM and embedding configuration; the documented
    defaults use OpenAI services
  - Hybrid retrieval adds NLP dependencies and a spaCy model download
  - Self-hosting requires Docker, PostgreSQL/pgvector, configuration secrets,
    and initial authentication setup
  - The repository publishes parallel SDK and CLI releases. The Python SDK
    release v2.2.1 is the primary version shown here, and ts-v3.3.1 identifies
    the separate Node SDK
