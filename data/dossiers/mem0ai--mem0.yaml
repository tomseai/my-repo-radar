strengths:
  - Covers embedded SDK, CLI, self-hosted, and managed deployment choices in one project
  - Supports multiple model and vector-store integrations rather than a single fixed backend
  - Provides concrete quickstarts and integrations for common agent workflows

caveats:
  - The library requires an LLM and embedding configuration; the documented defaults use OpenAI services
  - Hybrid retrieval adds NLP dependencies and a spaCy model download
  - Self-hosting requires Docker, PostgreSQL/pgvector, configuration secrets, and initial authentication setup
  - The repository publishes parallel SDK and CLI releases; v2.0.12 is the latest primary Python SDK release, while the Node SDK is v3.1.0

