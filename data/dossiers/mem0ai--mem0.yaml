project:
  name: Mem0
  kind: library
  summary: >-
    An AI-agent memory layer with Python and Node SDKs for extracting, storing,
    and retrieving persistent user, session, and agent context, plus optional
    self-hosted, CLI, and managed-platform deployment paths.
  best_for:
    - Adding long-term, personalized memory to an AI application or agent
    - Teams choosing between embedded SDK use, a self-hosted service, and a managed platform

key_features:
  - Memory APIs for adding and searching context scoped by user, agent, or session
  - Python and Node SDKs with configurable LLM, embedding, and vector-store dependencies
  - Hybrid retrieval using semantic, keyword, and entity signals when NLP support is installed
  - Self-hosted API and dashboard stack with authentication enabled by default
  - Node and Python CLIs for initializing, adding, and searching memories
  - Agent skills and integrations for coding-agent and AI SDK workflows

usage:
  interfaces:
    - Python SDK
    - Node SDK
    - CLI
    - self-hosted HTTP service and web dashboard
    - managed platform API
  installation:
    - pip install mem0ai
    - npm install mem0ai
    - Docker Compose self-hosting
    - global Node or Python CLI package
  setup: moderate

technology:
  languages:
    - Python
    - TypeScript
  notable_components:
