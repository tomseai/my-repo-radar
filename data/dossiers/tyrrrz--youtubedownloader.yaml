project:
  name: YoutubeDownloader
  kind: application
  summary: >-
    A cross-platform graphical application for downloading YouTube videos,
    playlists, and channels from URLs or search queries, with selectable media
    formats, languages, subtitles, tags, and account access for private content.
  best_for:
    - Downloading YouTube media, playlists, or channels through a desktop graphical interface
    - Selecting video formats and preserving alternate audio, subtitles, and media tags
key_features:
  - Downloads videos by URL, playlist, channel, or keyword search query
  - Lets users select video quality and output format
  - Embeds alternate-language audio tracks, subtitles, and media tags automatically
  - Supports YouTube-account login for private content
  - Publishes self-contained builds for Windows, Linux, and macOS architectures
usage:
  interfaces:
    - desktop graphical user interface
  installation:
    - stable GitHub release download
    - community-maintained Scoop package on Windows or AUR package on Arch Linux
  setup: low
