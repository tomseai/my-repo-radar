project:
  name: YoutubeDownloader
  kind: application
  summary: >-
    A cross-platform graphical application for downloading YouTube videos,
    playlists, and channels from URLs or search queries, with selectable media
    formats, languages, subtitles, tags, and account access for private content.
  best_for:
    - Downloading YouTube media, playlists, or channels through a desktop
      graphical interface
    - Selecting video formats and preserving alternate audio, subtitles, and
      media tags
key_features:
  - Downloads videos by URL, playlist, channel, or keyword search query
  - Lets users select video quality and output format
  - Embeds alternate-language audio tracks, subtitles, and media tags
    automatically
  - Supports YouTube-account login for private content
  - Publishes self-contained builds for Windows, Linux, and macOS architectures
usage:
  interfaces:
    - desktop graphical user interface
  installation:
    - stable GitHub release download
    - community-maintained Scoop package on Windows or AUR package on Arch Linux
  setup: low
technology:
  languages:
    - C#
  notable_components:
    - .NET
    - YoutubeExplode
    - FFmpeg
    - GitHub Actions release workflow
license:
  spdx: MIT
  name: MIT License
  notes: >-
    License.txt grants MIT terms to the software and documentation. The README
    also states separate project-use conditions in its introductory notice.
status:
  lifecycle: maintenance
  archived: false
  latest_release: 1.17.1
  latest_release_at: "2026-10-25"
strengths:
  - Combines URL, playlist, channel, and search-driven downloads in one
    cross-platform GUI
  - Provides media-selection features for quality, formats, alternate audio,
    subtitles, and tags
  - The pinned release workflow builds self-contained artifacts for Windows,
    Linux, and macOS targets
caveats:
  - It is explicitly marked maintenance in the pinned README, so new feature
    development should not be assumed
  - Community Scoop and AUR packages are independently published and may lag the
    latest release
  - The macOS download is not notarized. The release workflow packages separate
    instructions for launching the app.
  - Its interaction with YouTube relies on YoutubeExplode and can be affected by
    upstream service changes
  - The README describes separate project-use conditions alongside the MIT
    license.
