project:
  name: graphify
  kind: cli
  summary: >-
    A Python CLI and coding-assistant skill that maps code and selected project
    materials into a traversable knowledge graph, then supports focused query,
    path, explanation, report, and visual-graph workflows over that output.
  best_for:
    - Developers orienting coding agents in a medium or large codebase
    - Teams that need code, schema, and supporting-document relationships in one
      graph

key_features:
  - Parses code structure and cross-file relationships locally with tree-sitter
  - Produces graph.json, GRAPH_REPORT.md, and an interactive graph.html view
  - Queries, explains, and traces shortest paths between graph concepts
  - Labels relationships as extracted, inferred, or ambiguous
  - Installs query-first guidance for supported coding assistants
  - Provides optional MCP, graph-database, document, and media integrations

usage:
  interfaces:
    - CLI
    - coding-assistant skill
    - MCP server
    - interactive HTML graph
  installation:
    - uv tool install graphifyy
    - pipx install graphifyy
    - pip install graphifyy
  setup: moderate

technology:
  languages:
    - Python
  notable_components:
    - tree-sitter
    - NetworkX
    - Model Context Protocol

