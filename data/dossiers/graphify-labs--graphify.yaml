strengths:
  - Local AST extraction makes code-only graph construction possible without an LLM backend
  - The output combines machine-readable graph data, a report, and a browser-based view
  - Relationship provenance and confidence labels make inferred links distinguishable

caveats:
  - Documentation, papers, images, and transcripts use a semantic pass that can require a configured backend and consume tokens
  - Language coverage and some content formats depend on optional extras
  - The status and release are based on the locally cached release feed; archival state is not asserted from commit-pinned source files

