project:
  name: OmniParser
  kind: other
  summary: >-
    A Python-based screen-parsing project that turns UI screenshots into
    structured, understandable elements for vision-based GUI agents, with demos,
    model checkpoints, and OmniTool support for controlling a Windows 11 virtual
    machine.
  best_for:
    - Researchers and developers building vision-based GUI-agent or computer-use
      workflows
    - Experimenting with screenshot grounding before integrating a chosen vision
      model or agent

key_features:
  - Detects and describes screen elements to make GUI screenshots easier for
    vision models to ground
  - Provides version 2 model checkpoint instructions and a Gradio demonstration
  - Includes notebooks with simple examples
  - Includes OmniTool for controlling a Windows 11 VM with OmniParser and a
    supported vision model
  - Supports several named vision-model providers in OmniTool, including OpenAI,
    DeepSeek, Qwen, and Anthropic
  - Includes an evaluation setup adapted for the ScreenSpot Pro GUI-grounding
    benchmark

usage:
  interfaces:
    - Python scripts
    - Jupyter notebooks
    - Gradio web demo
    - Windows 11 virtual machine via OmniTool
  installation:
    - Conda environment
    - pip requirements installation
    - manual Hugging Face checkpoint download
    - Docker Compose VM configuration
  setup: high

