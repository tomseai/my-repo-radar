project:
  name: Etherpad
  kind: application
  summary: >-
    A self-hosted realtime collaborative text editor with authorship tracking,
    revision history, plugins, localization, and optional AI assistance.
  best_for:
    - Teams and communities that need a controllable collaborative document
      editor
    - Organizations that prefer self-hosting and no mandatory telemetry
key_features:
  - Supports simultaneous editing with authorship colors and shared presence
  - Retains complete revision history with a visual timeslider
  - Extends through plugins and supports more than one hundred languages
  - Offers optional AI features while allowing users to choose the model
