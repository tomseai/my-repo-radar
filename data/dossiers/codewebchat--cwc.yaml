project:
  name: CWC
  kind: plugin
  summary: >-
    An editor extension that turns selected workspace files into structured
    Markdown prompts for browser chatbots, configured model APIs, or agentic
    CLIs and helps apply the resulting edits.
  best_for:
    - VS Code users who want file-aware prompts for hosted chats or their own
      model APIs
    - Developers who want to move selected code context between the editor and
      web chat tools

key_features:
  - Context selection for workspace files and selected web documents
  - Prompt types for file edits, questions, cursor completions, and
    relevant-file discovery
  - Browser extension that fills prompts into supported web-chat interfaces
  - API tools for completions, context editing, intelligent updates, and commit
    messages
  - Saved workspaces, checkpoints, and configurable model-provider settings

usage:
  interfaces:
    - VS Code extension
    - browser extension
    - editor webview
    - model-provider APIs
  installation:
    - build locally using the repository installation script
    - build the editor extension from source with pnpm
  setup: moderate

technology:
  languages:
    - TypeScript
  notable_components:
    - Visual Studio Code Extension API
    - React
    - Node.js
    - Webpack

