strengths:
  - Combines token diagnostics, automatic interventions, and session-continuity
    tooling in one supported-assistant integration
  - Documents several installation paths instead of requiring a single
    coding-assistant runtime
  - Separates metered actions from estimated savings in its dashboard
caveats:
  - The project reports metered session data and modeled savings separately.
    Upstream describes a small output-token comparison and says it has yet to
    run a task pass-rate study.
  - Feature availability and setup differ by coding-assistant integration;
    GitHub Copilot support is marked beta
  - The small-business permission covers internal use. External hosting,
    redistribution, and other commercial uses require separate terms.
  - The retained source describes Python 3.9+ and platform-specific hook
    behavior, so installation should be checked for the chosen assistant and OS
