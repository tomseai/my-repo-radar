strengths:
  - Combines token diagnostics, automatic interventions, and session-continuity tooling in one supported-assistant integration
  - Documents several installation paths instead of requiring a single coding-assistant runtime
  - Distinguishes measured, estimated, and opportunity savings in its retained methodology
caveats:
  - The project’s claimed savings are based on user-session measurements and counterfactual estimates, not a controlled comparison
  - Feature availability and setup differ by coding-assistant integration; GitHub Copilot support is marked beta
  - The PolyForm Noncommercial license does not authorize commercial use without a separate permission path
  - The retained source describes Python 3.9+ and platform-specific hook behavior, so installation should be checked for the chosen assistant and OS
