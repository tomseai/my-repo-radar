project:
  name: Token Optimizer
  kind: plugin
  summary: >-
    A plugin suite for supported AI coding assistants that audits context and
    token use, installs hooks for compression and continuity, and records
    session-level token, cost, and context-quality information in a dashboard.
  best_for:
    - Users of supported coding assistants who want to inspect and reduce context waste
    - Developers who want automatic session checkpoints and token-use diagnostics
key_features:
  - Installs hooks that apply output, Bash-output, search-result, and context compression
  - Creates progressive checkpoints and a context digest to support session continuation after compaction
  - Provides a dashboard and quality score for session token, cost, and efficiency signals
  - Includes audit and coaching workflows based on retained session data
  - Documents integrations for Claude Code, Codex, OpenCode, OpenClaw, Hermes, and GitHub Copilot beta
usage:
  interfaces:
    - coding-assistant plugins and hooks
    - terminal commands
    - local dashboard
    - VS Code status-bar extension
  installation:
    - Claude Code or Codex plugin marketplace
    - OpenCode or OpenClaw plugin configuration
    - macOS/Linux shell installer for supported assistants
  setup: moderate
