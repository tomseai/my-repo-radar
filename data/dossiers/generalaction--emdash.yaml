strengths:
  - Keeps concurrent agent work isolated with Git worktrees
  - Consolidates task intake, review, pull requests, and CI status in a desktop workflow
  - Can operate locally or against user-controlled machines over SSH
caveats:
  - It relies on separately installed coding-agent CLIs and their provider accounts or configuration
  - Connected agent providers may receive code, prompts, and context under their own data-handling policies
  - Remote-project use requires SSH/SFTP access and authentication setup
