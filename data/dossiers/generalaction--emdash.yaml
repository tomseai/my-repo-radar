project:
  name: Emdash Classic
  kind: application
  summary: A local-first desktop environment for running AI coding agents in parallel
    in isolated Git worktrees, then reviewing and integrating their changes.
  best_for:
    - Developers managing several coding-agent tasks across local or SSH-connected
      projects
    - Teams that want ticket intake, change review, and pull-request workflows in one
      desktop app
key_features:
  - Run several coding agents concurrently without manually managing terminals
  - Isolate each task in its own Git worktree and branch
  - Send tickets from issue trackers and project-management tools to an agent
  - Review diffs, inspect CI checks, create pull requests, and merge changes
  - Detect supported local agent CLIs and use the installed provider
  - Connect to remote projects through SSH/SFTP
usage:
  interfaces:
    - desktop GUI
    - Git worktrees
    - SSH/SFTP remote projects
  installation:
    - Homebrew cask
    - macOS disk image
    - Windows installer or portable executable
    - Linux AppImage, DEB, or RPM
  setup: moderate
technology:
  languages:
    - TypeScript
  notable_components:
    - Electron
    - React
    - SQLite
    - SSH
