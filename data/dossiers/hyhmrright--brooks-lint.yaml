  latest_release_at: 2026-11-17
strengths:
  - Gives review findings a consistent structure, severity vocabulary, and cited
    rationale
  - Covers architectural and test-quality concerns that syntax-oriented linters
    do not model
  - Provides deterministic parser benchmarks and a separate live model
    evaluation suite
caveats:
  - Review correctness still depends on the selected model, supplied context,
    and agent execution
  - The advertised deterministic benchmark measures report-parser fidelity, not
    whether model findings are correct
  - Health scores and severities encode the project's rubric and should support,
    not replace, human judgment
  - Only Codex is currently maintainer-verified end to end; other integrations
    are available but layout tests do not establish end-to-end compatibility
