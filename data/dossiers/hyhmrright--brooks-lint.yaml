project:
  name: brooks-lint
  kind: plugin
  summary: >-
    A portable agent-skill and Claude Code plugin for reviewing production code,
    architecture, technical debt, and tests against risk dimensions synthesized
    from twelve software-engineering books.
  best_for:
    - Developers who want structured AI-assisted code and architecture reviews
    - Teams auditing technical debt and test quality across several agent
      platforms
key_features:
  - Produces symptom, source, consequence, and remedy chains with book citations
    and severity
  - Covers production-code decay, test-suite decay, architecture, debt, health,
    and sweep modes
  - Generates Mermaid dependency graphs, health scores, SARIF output, and CI
    gates
  - Supports strict, balanced, and legacy-friendly scoring plus project-specific
    suppressions
  - Installs as standard Agent Skills across many coding-agent platforms
usage:
  interfaces:
    - agent skills
    - Claude Code plugin
    - slash commands
    - CI and SARIF output
  installation:
    - Claude Code plugin marketplace
    - platform-aware shell installer
    - project-local Agent Skills installation
  setup: low
technology:
  languages:
    - JavaScript
    - Markdown
  notable_components:
    - Agent Skills
    - SARIF 2.1.0
    - Mermaid graphs
    - evaluation corpus
