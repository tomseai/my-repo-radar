strengths:
  - Combines personal knowledge search, chat, web research, agents, and automation in one self-hostable product
  - Supports both local and hosted models, with clients beyond the browser
  - Documents privacy-oriented self-hosting choices including local embeddings and offline-compatible operation

caveats:
  - The retained release feed's newest entry is the pre-release 2.0.0-beta.28 from 2026-03-26; no authoritative stable project release is retained
  - Self-hosting configures multiple services and requires secure secrets, model-provider choices, and resource planning
  - The example Compose configuration runs in anonymous mode and should be hardened before public exposure
  - AGPL-3.0-or-later has stronger redistribution obligations than permissive licenses, especially for modified network services

