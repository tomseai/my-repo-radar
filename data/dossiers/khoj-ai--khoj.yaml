project:
  name: Khoj
  kind: application
  summary: >-
    A self-hostable personal AI application that combines LLM chat, semantic
    search over personal knowledge, web answers, configurable agents, research
    automation, and clients for the web, desktop, mobile, Obsidian, and Emacs.
  best_for:
    - Individuals or teams wanting a private, self-hosted AI assistant for documents and web research
    - Users who need one personal knowledge interface across local or hosted LLM providers and clients

key_features:
  - Chats with local or hosted LLMs and can ground answers in indexed documents or web information
  - Performs semantic search over PDF, Markdown, org-mode, Word, Notion, and other supported sources
  - Lets users create agents with custom knowledge, personas, chat models, and tools
  - Automates recurring research with newsletters and notifications
  - Offers browser, desktop, phone, WhatsApp, Obsidian, and Emacs access paths
  - Supports private self-hosting with local embeddings and offline-compatible model setups

