strengths:
  - No runtime dependencies and selective loading options
  - CSS-based themes adapt without rerendering
caveats:
  - Uses its own layout and visual style rather than reproducing Mermaid output exactly
  - Applications handling untrusted diagrams should follow the project's security guidance
