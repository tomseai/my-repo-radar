project:
  name: Pele
  kind: library
  summary: A synchronous renderer that turns supported Mermaid diagrams into SVG and exposes color and font styling through CSS variables.
  best_for: [Applications rendering Mermaid diagrams with customizable styling]
key_features:
  - Supports the diagram types built into Mermaid 12.1.0
  - Renders SVG synchronously or mounts responsive diagrams in the browser
  - Uses CSS variables for colors and fonts
  - Supports individual diagram registration and lazy loading
