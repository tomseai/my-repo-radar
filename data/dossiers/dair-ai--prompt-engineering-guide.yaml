project:
  name: Prompt Engineering Guide
  kind: documentation
  summary: >-
    A web-first guide and resource collection for learning prompt engineering
    with language models, including techniques, applications, model references,
    risks, papers, tools, notebooks, and related agent material.
  best_for:
    - Learning and comparing prompt-engineering techniques for LLM work
    - Finding introductory guides, papers, tools, and examples before building an LLM feature

key_features:
  - Guides for prompt basics, model settings, prompt elements, and design tips
  - Technique index covering zero- and few-shot prompting, chain of thought, retrieval, and tool use
  - Application and prompt-hub sections spanning coding, evaluation, extraction, reasoning, and other tasks
  - Links to papers, tools, notebooks, datasets, a lecture, and model-specific reference pages
  - Locally runnable documentation site with translation-contribution guidance

usage:
  interfaces:
    - Documentation website
    - Markdown and MDX repository content
    - Local Next.js documentation site
  installation:
    - Browse the Prompt Engineering Guide website or README
    - For local development, install Node.js 18 or later and pnpm
    - Install the documented dependencies and run pnpm dev
  setup: low

