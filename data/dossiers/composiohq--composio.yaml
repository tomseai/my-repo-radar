project:
  name: composio
  kind: monorepo
  summary: >-
    A TypeScript and Python SDK monorepo for giving AI agents authenticated,
    session-scoped tools, triggers, and sandbox capabilities across external
    apps.
  best_for:
    - Agent builders who need authenticated third-party tools scoped to
      individual users
    - Teams integrating agent frameworks through SDK adapters or a
      session-hosted MCP endpoint
key_features:
  - Creates per-user sessions with meta tools that discover, authenticate, and
    execute app tools at runtime
  - Exposes a hosted MCP endpoint for each session and documents connecting MCP
    clients to it
  - Provides TypeScript and Python SDKs plus adapters for OpenAI, Anthropic,
    Claude Agent SDK, LangChain, Google, and other frameworks
  - Includes a CLI for searching tools, executing them, connecting accounts, and
    scripting TypeScript workflows
usage:
  interfaces:
    - TypeScript SDK
    - Python SDK
    - Command-line interface
    - Hosted MCP endpoint
  installation:
    - npm install @composio/core @composio/openai-agents @openai/agents
    - pip install composio composio-openai-agents openai-agents
    - curl -fsSL https://composio.dev/install | sh
  setup: moderate
technology:
  languages:
    - TypeScript
    - Python
  notable_components:
    - Node.js
    - pnpm
    - Model Context Protocol
    - OpenAI Agents SDK
    - LangChain
license:
  spdx: MIT
  name: MIT License
  notes: >-
    The repository-root LICENSE grants MIT permissions. However, the retained
    python/pyproject.toml classifies the Python SDK as Apache Software License,
    so reuse terms for that package should be confirmed with the maintainers.
status:
  lifecycle: active
  archived: false
  latest_release: null
  latest_release_at: null
strengths:
  - Avoids loading every tool definition into an agent context by using session
    meta tools for discovery and execution
  - Supports direct SDK integration and MCP-based access from the same session
    model
  - Covers both TypeScript and Python with framework-specific provider adapters
caveats:
  - Creating a session requires a COMPOSIO_API_KEY from the Composio dashboard
  - The Python SDK requires Python 3.11 or later
  - The retained release feed lists independently versioned packages, not a
    clear release for the SDK monorepo as a whole, so no project-wide latest
    release is stated
  - Root MIT licensing conflicts with the Apache classifier in cached Python
    package metadata; confirm the applicable terms before distributing that SDK
  - Windows x64 installation is experimental; WSL is recommended for a fully
    supported setup, and Windows ARM64 is unsupported
