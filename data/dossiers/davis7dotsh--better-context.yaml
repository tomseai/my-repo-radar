project:
  name: btca (Better Context)
  kind: monorepo
  summary: >-
    An evolving coding-agent context tool whose current documented local form is
    a skill that clones and searches library and framework source code; the
    repository also contains CLI, server, web, sandbox, and documentation packages.
  best_for:
    - Giving a compatible coding agent repository-derived context for library or framework questions
    - Trying the documented btca skill while tracking an in-progress local-product rewrite

key_features:
  - Installable btca-local skill for compatible coding agents
  - Clones and searches selected repositories in the documented local agent sandbox
  - Supports natural-language prompts and skill invocations with or without a question
  - Includes a publishable btca CLI with macOS, Linux, and Windows binary targets
  - Monorepo packages for a server, web app, sandbox, shared code, and documentation

usage:
  interfaces:
    - Coding-agent skill
    - CLI
    - Web application
    - Server API package
  installation:
    - Run the documented npx skills add command for the btca-local skill
    - Invoke the installed skill through a compatible coding agent
    - Build repository packages with Bun for development or release work
  setup: low

technology:
  languages:
    - TypeScript
    - JavaScript
  notable_components:
    - Bun workspaces
    - Turbo
    - SvelteKit
    - OpenTUI

