strengths:
  - Targets source-derived context rather than relying only on potentially stale documentation
  - Documents a lightweight skill-installation path for its current local experience
  - Includes implementation evidence for CLI, server, web, sandbox, and cross-platform CLI releases

caveats:
  - The README says the local product is being rewritten, so the architecture and workflow described there may change
  - Skill installation and invocation depend on the capabilities of the chosen coding agent
  - Repository and package metadata use both Better Context and btca names, which can complicate discovery
  - v2.0.5 is the relevant btca CLI release; the same feed also publishes separate server-v2.0.5 entries

