project:
  name: Supermemory
  kind: monorepo
  summary: >-
    An AI memory and context platform repository containing a hosted API,
    client integrations and MCP support, and a local server for persistent
    memory, user profiles, hybrid retrieval, connectors, and file processing.
  best_for:
    - AI-product developers adding persistent user context and retrieval to agents or applications
    - Users who want an MCP-connected memory layer or a local deployment with compatible models

key_features:
  - Extracts facts from conversations and maintains user profiles over time
  - Hybrid search combines document retrieval with stored memories
  - Processes text, files, images, videos, and code for searchable context
  - Connectors synchronize data from services such as Google Drive, Gmail, Notion, OneDrive, and GitHub
  - An MCP server exposes memory, recall, and context tools to compatible AI clients
  - Local mode provides the API with local embeddings and optional fully offline Ollama use

