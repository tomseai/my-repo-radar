strengths:
  - Combines memory, user profiles, retrieval, connectors, and file processing
    behind one API
  - Offers both hosted integrations and a local mode with the same API shape
  - Supports MCP clients as well as JavaScript and Python application development

caveats:
  - Hosted API, connector, and MCP configurations can require OAuth or an API key
  - Local mode initializes an embedded engine and credentials on first boot;
    fully offline use needs a local model setup
  - The selected server-v0.0.9 release is scoped to the self-hosted server and
    does not version the whole monorepo
