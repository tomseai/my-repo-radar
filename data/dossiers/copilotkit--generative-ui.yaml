  summary: >-
    A conceptual guide and set of examples that compares controlled,
    declarative, and open-ended generative UI patterns for agentic apps.
  best_for:
    - Developers choosing a generative UI pattern or agent-to-application protocol
    - Learners who want implementation-oriented examples for CopilotKit-based generative UI
