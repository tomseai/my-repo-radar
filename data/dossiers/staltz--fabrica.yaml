strengths:
  - Centralizes and versions reusable agent processes across tools
  - Plans changes before applying them and offers run history
caveats:
  - Most built-in cloud routines require manual handoffs rather than automatic provisioning
  - Hosted agents require a Cursor team with agent hosting enabled
  - Cloud routines support text-only skills; local shell access can read local run history
