project:
  name: Fabrica
  kind: framework
  summary: >-
    A software factory framework for versioning and deploying reusable coding-agent
    skills, rules, and routines across repositories and supported tools.
  best_for:
    - Teams sharing coding-agent workflows across projects and tools
key_features:
  - Composable Git-backed blueprints separate process from product repositories
  - Plan and apply factory configurations to supported agent runtimes
  - Serves current blueprint instructions over MCP
  - Records agent runs for CLI inspection and a local dashboard
  - Supports import locking and previewing blueprint updates
usage:
  interfaces: [CLI, MCP server, web dashboard, macOS menu bar app]
  installation: [install script, macOS app download, Go install]
  setup: moderate
