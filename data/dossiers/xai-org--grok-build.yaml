project:
  name: grok-build
  kind: cli
  summary: >-
    A Rust terminal coding agent distributed as the grok CLI and full-screen
    TUI, with codebase-aware editing, shell execution, web search, long-running
    task management, and interactive, scripted, or ACP editor-integrated modes.
  best_for:
    - Developers who prefer a terminal-first Grok coding-agent workflow
    - Scripted or CI-adjacent agent tasks and editors that support the Agent Client Protocol
key_features:
  - Full-screen, mouse-interactive terminal UI
  - Codebase-aware file editing and shell-command execution
  - Web search and management of long-running tasks
  - Headless mode for scripting and CI use
  - Editor embedding through the Agent Client Protocol
  - MCP servers, skills, plugins, hooks, and sandboxing documented in the bundled user guide
