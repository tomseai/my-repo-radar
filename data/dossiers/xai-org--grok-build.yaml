strengths:
  - Offers the same coding-agent workflow interactively, headlessly, and through
    ACP-compatible editors
  - Keeps codebase operations, terminal execution, and web search in a
    terminal-focused interface
  - Official installers are available for macOS, Linux, and Windows
caveats:
  - The retained GitHub release feed has no entries, so an exact current
    released version cannot be established from this research bundle
  - The public source tree is periodically synced from an internal monorepo and
    does not accept external pull requests
  - Source builds require Rust, DotSlash, and protoc; Windows source builds are
    best-effort and untested in this tree. The pinned Cargo manifest also
    references a Git revision for its async-openai dependency.
