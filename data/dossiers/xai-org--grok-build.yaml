strengths:
  - Offers the same coding-agent workflow interactively, headlessly, and through ACP-compatible editors
  - Keeps codebase operations, terminal execution, and web search in a terminal-focused interface
  - Official installers are available for macOS, Linux, and Windows
caveats:
