project:
  name: Bolt.new
  kind: application
  summary: >-
    An AI-powered browser development agent that prompts, runs, edits, and
    deploys full-stack JavaScript applications in an in-browser WebContainers
    environment without requiring a local development setup.
  best_for:
    - Developers, product managers, and designers prototyping full-stack JavaScript applications in a browser
    - Teams building an AI-powered development experience on top of the open-source Bolt codebase
key_features:
  - Gives an AI model control of the project filesystem, Node.js server, package manager, terminal, and browser console
  - Uses WebContainers to install npm packages and run Node.js-based development stacks in the browser
  - Supports prompting, editing, running, sharing, and deploying full-stack applications from the web interface
  - Includes prompt-enhancement guidance and stack-specific prompting recommendations
usage:
  interfaces:
    - browser-based web application
    - AI chat-driven development workspace
  installation:
    - use the hosted Bolt.new browser application with no local setup
    - clone the open-source codebase and follow CONTRIBUTING.md to build a custom agent
  setup: low
technology:
  languages:
    - TypeScript
    - JavaScript
  notable_components:
    - StackBlitz WebContainers
    - React
    - Remix
    - Cloudflare Pages
    - pnpm
