project:
  name: voltagent
  kind: framework
  summary: >-
    A TypeScript agent framework for building agents, multi-step workflows,
    tools, memory, and provider integrations, accompanied by the VoltOps
    console for observing, operating, and deploying agent workloads.
  best_for:
    - TypeScript teams that want code-first agent and workflow primitives with provider flexibility
    - Teams that want to pair an agent runtime with optional tracing, evaluation, and operations tooling
key_features:
  - Defines typed agents with roles, tools, memory, model providers, and server integration through @voltagent/core
  - Builds declarative multi-step workflows, including supervisor-managed teams of specialized sub-agents
  - Connects Zod-typed tools and Model Context Protocol servers with lifecycle hooks and cancellation
  - Supports durable memory, retrieval and RAG, resumable streaming, voice providers, guardrails, and evaluation suites
  - Scaffolds projects with create-voltagent-app and offers VoltOps features for traces, logs, dashboards, prompts, deployment, and monitoring
usage:
  interfaces:
    - TypeScript library
    - project-creation CLI
    - local HTTP server
    - web operations console
  installation:
    - npm create voltagent-app
    - npm packages
  setup: moderate
