project:
  name: github1s
  kind: application
  summary: >-
    A browser-based, VS Code-style interface for browsing GitHub repositories by
    replacing github.com with github1s.com in a repository URL.
  best_for:
    - Quickly reading a public GitHub repository in a VS Code-style interface
    - Browsing private repositories with a user-supplied GitHub OAuth token
key_features:
  - Opens GitHub repositories through a URL substitution workflow
  - Uses a VS Code web build and a FileSystemProvider backed by GitHub APIs
  - Supports GitHub, GitLab, and npmjs URL variants
  - Provides code search and uses Sourcegraph API for public repositories when
    available
  - Offers built-in AI chat with a configurable model endpoint and optional MCP tools
usage:
  interfaces:
    - web application
    - local development server
  installation:
    - use the hosted website
    - build from source with npm
  setup: low
technology:
  languages:
    - TypeScript
    - JavaScript
  notable_components:
    - VS Code web
    - GitHub REST API
    - Sourcegraph API
    - Webpack
license:
  spdx: MIT
  name: MIT License
  notes: >-
    The retained LICENSE file and GitHub metadata identify MIT, but the root
    package.json declares ISC; the bundle does not resolve this conflict.
status:
  lifecycle: active
  archived: false
  latest_release: v0.35.5
  latest_release_at: 2026-11-17
strengths:
  - Opens a repository directly in the browser without a local clone
  - Builds on familiar VS Code-style navigation and extension capabilities
  - Documents browser storage and authentication paths for repository tokens
caveats:
  - The retained LICENSE file and GitHub metadata say MIT, while root
    package.json says ISC
  - Reading repositories depends on upstream API availability and rate limits
  - Private repositories require appropriate GitHub or GitLab access; tokens
    are stored in browser extension state
  - AI chat sends selected repository context to the configured model provider;
    configured MCP tools can perform external actions
  - Local development and full VS Code builds require npm, while the full build
    has VS Code prerequisites
