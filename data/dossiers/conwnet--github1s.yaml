project:
  name: github1s
  kind: application
  summary: >-
    A browser-based, VS Code-style interface for browsing GitHub repositories
    by replacing github.com with github1s.com in a repository URL.
  best_for:
    - Quickly reading a public GitHub repository in a VS Code-style interface
    - Browsing private repositories with a user-supplied GitHub OAuth token
key_features:
  - Opens GitHub repositories through a URL substitution workflow
  - Uses a VS Code web build and a FileSystemProvider backed by GitHub APIs
  - Supports GitHub, GitLab, and npmjs URL variants
  - Provides code search and uses Sourcegraph API for public repositories when available
  - Offers a Gitpod handoff for editing, containers, and pull-request workflows
usage:
  interfaces:
    - web application
    - local development server
  installation:
    - use the hosted website
    - build from source with npm
  setup: low
