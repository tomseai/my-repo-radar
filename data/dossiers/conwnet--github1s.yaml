    - GitHub REST API
    - Sourcegraph API
    - Webpack
license:
  spdx: MIT
  name: MIT License
  notes: >-
    The retained LICENSE file and GitHub metadata identify MIT, but the root
    package.json declares ISC; the bundle does not resolve this conflict.
status:
  lifecycle: active
  archived: false
  latest_release: 0.32.0
  latest_release_at: 2026-02-06
strengths:
  - Opens a repository directly in the browser without a local clone
  - Builds on familiar VS Code-style navigation and extension capabilities
  - Documents browser-local storage of private-repository OAuth tokens
caveats:
  - The retained LICENSE file and GitHub metadata say MIT, while root package.json says ISC
  - Reading repositories depends on upstream API availability and rate limits
  - Private repository access requires a GitHub OAuth token; the project advises removing it on shared devices
  - Local development and full VS Code builds require npm, while the full build has VS Code prerequisites
