project:
  name: CLIProxyAPI
  kind: service
  summary: >-
    A Go proxy service that presents OpenAI-, Gemini-, Claude-, Codex-, and
    Grok-compatible APIs for supported CLI-backed model accounts, enabling compatible
    clients and SDKs to call those providers through one configurable local service.
  best_for:
    - Developers who need one compatible API endpoint for supported CLI-account providers
    - Self-hosters who want to rotate multiple provider accounts and connect compatible clients or SDKs
key_features:
  - Serves OpenAI, Gemini, Claude, Codex, and Grok compatible API interfaces for supported CLI models
  - Supports OAuth login flows for OpenAI Codex, Claude Code, and Grok Build, plus Gemini and API-key paths
  - Handles streaming, non-streaming, and supported WebSocket responses, function calling, tools, and image input
  - Balances multiple supported provider accounts with round-robin routing
  - Allows OpenAI-compatible upstream providers, such as OpenRouter, through configuration
  - Supplies a reusable Go SDK for embedding the proxy and documents a management API
usage:
  interfaces:
    - compatible HTTP API service
    - WebSocket responses where supported
    - CLI authentication flows
    - management API
    - Go SDK
  installation:
    - Docker Compose deployment
    - container image
    - source build with Go
  setup: moderate
technology:
  languages:
    - Go
  notable_components:
