status:
  lifecycle: experimental
  archived: false
  latest_release: v1.43.0
  latest_release_at: 2026-11-20
strengths:
  - Supports switching the same control UI among local, remote, and cloud agent
    backends
  - Gives users both an unsandboxed local path and a Docker-sandboxed
    installation path
  - Supports scheduled and event-driven engineering automations alongside
    interactive conversations
caveats:
  - The unsandboxed local and source installation paths give the agent server
    full access to the host filesystem
  - Docker use requires a host projects directory that the agent can access
  - Cloud-prefixed feed entries are component releases; v1.43.0 is selected
    because it matches the retained root and frontend package versions
