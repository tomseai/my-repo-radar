project:
  name: OpenHands
  kind: application
  summary: >-
    A self-hosted developer control center for starting coding-agent
    conversations and automations across local, remote, and cloud agent
    backends.
  best_for:
    - Engineering teams coordinating coding agents across local machines,
      containers, or virtual machines
    - Developers creating scheduled or event-driven automations that use
      compatible coding agents
key_features:
  - Runs OpenHands, Claude Code, Codex, Gemini, and other ACP-compatible agents
    through selectable backends
  - Lets one frontend switch among local, remote, and cloud agent backends
  - Provides automations that can run on schedules or in response to webhook
    events
  - Integrates automation workflows with services including Slack, GitHub,
    Linear, and Notion
  - Includes a local web UI and documented direct, Docker-sandboxed, and source
    installation paths
usage:
  interfaces:
    - Web user interface
    - Command-line interface
    - Automation webhooks and schedules
  installation:
    - Install @openhands/agent-canvas globally with npm
    - Run the documented ghcr.io/openhands/agent-canvas Docker image
    - Clone the source repository and run npm ci followed by npm run dev
  setup: moderate
technology:
  languages:
    - Python
    - TypeScript
  notable_components:
    - React
    - Node.js 24
    - Docker
    - FastAPI
    - Agent Client Protocol (ACP)
license:
  spdx: MIT
