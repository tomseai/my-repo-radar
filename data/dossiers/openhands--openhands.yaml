project:
  name: OpenHands
  kind: application
  summary: >-
    A self-hosted developer control center for starting coding-agent conversations
    and automations across local, remote, and cloud agent backends.
  best_for:
    - Engineering teams coordinating coding agents across local machines, containers, or virtual machines
    - Developers creating scheduled or event-driven automations that use compatible coding agents
key_features:
  - Runs OpenHands, Claude Code, Codex, Gemini, and other ACP-compatible agents through selectable backends
  - Lets one frontend switch among local, remote, and cloud agent backends
  - Provides automations that can run on schedules or in response to webhook events
  - Integrates automation workflows with services including Slack, GitHub, Linear, and Notion
  - Includes a local web UI and documented direct, Docker-sandboxed, and source installation paths
usage:
  interfaces:
    - Web user interface
    - Command-line interface
    - Automation webhooks and schedules
  installation:
    - Install @openhands/agent-canvas globally with npm
    - Run the documented ghcr.io/openhands/agent-canvas Docker image
    - Clone the source repository and run npm install followed by npm run dev
  setup: moderate
technology:
  languages:
    - Python
    - TypeScript
  notable_components:
    - React
    - Node.js 22
    - Docker
    - FastAPI
    - Agent Client Protocol (ACP)
license:
  spdx: null
  name: Mixed licensing
  notes: >-
    The retained root license states that content outside enterprise/ is MIT, while
    enterprise/ is governed by enterprise/LICENSE; those enterprise terms are not retained in the bundle.
status:
  lifecycle: experimental
  archived: false
  latest_release: 1.11.0
  latest_release_at: 2026-07-09
strengths:
  - Supports switching the same control UI among local, remote, and cloud agent backends
  - Gives users both an unsandboxed local path and a Docker-sandboxed installation path
  - Supports scheduled and event-driven engineering automations alongside interactive conversations
caveats:
  - The unsandboxed local and source installation paths give the agent server full access to the host filesystem
  - Docker use requires a host projects directory that the agent can access
  - The repository states that Agent Canvas and the OpenHands Agent/Agent Server source code are moving to separate repositories
  - Cloud-prefixed feed entries are component releases; 1.11.0 is selected because it matches the retained root and frontend package versions
  - Enterprise-directory licensing is not established from the retained bundle
