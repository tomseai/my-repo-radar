  - Isolated autonomous implementation runs for project work
  - Linear-board monitoring and task dispatch in the documented demonstration
  - Proof of work including CI status, review feedback, complexity analysis, and videos
  - Safe pull-request landing after acceptance in the documented workflow
  - A published specification plus an experimental Elixir reference implementation

