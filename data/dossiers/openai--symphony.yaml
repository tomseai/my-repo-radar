  summary: >-
    An engineering-preview orchestration system and experimental Elixir reference
    implementation for turning project work into isolated, autonomous coding-agent
    runs.
  best_for:
    - Teams experimenting with higher-level management of agent-executed project work
    - Trusted environments that can evaluate an early orchestration implementation

