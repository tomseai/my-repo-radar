project:
  name: Symphony
  kind: infrastructure
  summary: >-
    An engineering-preview orchestration system and experimental Elixir
    reference implementation for turning project work into isolated, autonomous
    coding-agent runs.
  best_for:
    - Teams experimenting with higher-level management of agent-executed project
      work
    - Trusted environments that can evaluate an early orchestration
      implementation

key_features:
  - Isolated autonomous implementation runs for project work
  - Linear-board monitoring and task dispatch in the documented demonstration
  - Proof of work including CI status, review feedback, complexity analysis, and
    videos
  - Safe pull-request landing after acceptance in the documented workflow
  - A published specification plus an experimental Elixir reference
    implementation

