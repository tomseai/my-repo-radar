project:
  name: Win11React
  kind: application
  summary: >-
    An archived React web application that recreates a Windows 11-like desktop
    experience in the browser, with desktop controls, windowed sample apps,
    themes, and an optional packaged desktop build; it is not a Microsoft
    operating system or cloud PC.
  best_for:
    - Inspecting a desktop-style web UI implemented with React and Redux
    - Exploring interaction patterns such as movable, resizable, and snapped windows

key_features:
  - Start menu, search, widgets, desktop actions, side navigation, and calendar views
  - Dragging, resizing, and snap layouts for application windows
  - Built-in examples including a browser, terminal, calculator, file explorer, and settings
  - Startup and lock screens, themes, backgrounds, and multilingual support
  - Browser deployment plus Docker, compiled Windows executable, and WinGet installation options

usage:
  interfaces:
    - browser-based desktop UI
    - packaged desktop application
  installation:
    - live web experience
    - Docker image
    - compiled release executable
    - WinGet package
  setup: low

