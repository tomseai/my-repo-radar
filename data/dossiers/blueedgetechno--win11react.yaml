  latest_release_at: 2022-06-09

strengths:
  - Demonstrates a broad set of desktop-like interactions in one web application
  - Offers immediately usable browser, container, and Windows distribution paths
  - Uses familiar React, Redux, and CSS/SCSS tooling rather than a proprietary UI system

caveats:
  - The GitHub repository is archived, so fixes and maintenance should not be expected
  - It recreates an interface and selected sample applications, not a Windows operating system or cloud PC
  - The README records a Firefox backdrop-blur limitation
  - The newest retained release is from 2022, despite a newer archived source snapshot

