project:
  name: ytDownloader
  kind: application
  summary: >-
    An Electron desktop application for downloading video or audio from hundreds
    of sites through yt-dlp, with playlist support, subtitles, range selection,
    and a built-in video compressor.
  best_for:
    - Downloading supported online video or audio through a desktop GUI
    - Managing playlist downloads and basic post-download media options
key_features:
  - Downloads video and audio from hundreds of yt-dlp-supported sites
  - Supports playlist downloads, subtitles, and range selection
  - Includes a hardware-accelerated video compressor
  - Provides themes, download history, and an integrated YouTube search feature
  - Publishes installers for Windows, Linux, and macOS
usage:
  interfaces:
    - Desktop GUI
  installation:
    - GitHub release installers
    - Microsoft Store, Chocolatey, Scoop, or WinGet on Windows
    - Flatpak, AppImage, or Snap on Linux
