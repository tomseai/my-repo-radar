strengths:
  - Combines downloads, playlists, subtitles, range selection, and compression in one GUI
  - Offers several native distribution channels across Windows, Linux, and macOS
  - Ships from a cross-platform release workflow tied to the package version
caveats:
  - Supported-site coverage depends on the bundled yt-dlp integration and upstream site changes
  - The macOS build is unsigned and the README requires both quarantine removal and Homebrew yt-dlp
  - Building from source requires Node.js, npm, and platform-appropriate FFmpeg binaries
  - GPL-3.0 copyleft may not suit proprietary redistribution or embedding plans
