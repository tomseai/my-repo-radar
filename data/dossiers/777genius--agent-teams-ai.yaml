project:
  name: Agent Teams AI
  kind: application
  summary: >-
    An Electron desktop application for creating and supervising autonomous
    multi-agent teams that coordinate coding and broader project tasks across
    supported local runtimes and provider-backed coding agents.
  best_for:
    - Developers who want a visual workspace for parallel coding-agent teams
    - Teams that need task, review, runtime-log, and token-usage visibility
key_features:
  - Create role-based teams whose agents can delegate, message, review, and complete tasks
  - Track work on a kanban board with per-task logs, messages, and status history
  - Review detected code changes by accepting, rejecting, or commenting on individual hunks
  - Starts with a no-auth model, detects local Claude Code, Codex, and OpenCode runtimes, or connects additional providers
  - Isolate selected teammates in Git worktrees and provide an integrated PTY terminal
  - Monitor token usage, estimated cost, and configurable budget alerts across teams
usage:
  interfaces:
    - desktop GUI
    - integrated terminal workspace
    - MCP server
    - standalone HTTP dashboard
  installation:
    - macOS, Windows, or Linux release download
    - source checkout with pnpm
    - Docker Compose standalone server
  setup: moderate
technology:
  languages:
    - TypeScript
  notable_components:
