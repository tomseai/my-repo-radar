project:
  name: LangChain
  kind: framework
  summary: >-
    A Python framework for building agents and LLM-powered applications with
    composable components and standardized interfaces for chat models,
    embeddings, vector stores, tools, retrievers, and provider integrations;
    the current package depends on LangGraph for agent orchestration.
  best_for:
    - Python developers building LLM applications with interchangeable providers and components
    - Agent applications that need LangGraph-backed orchestration with LangChain integrations

key_features:
  - Standard interfaces for models, embeddings, vector stores, tools, and retrievers
  - Chat-model initialization through provider-qualified model identifiers
  - Optional integration packages for model providers and community components
  - Modular composition intended for rapid prototyping and lower-level customization
  - Direct dependency on LangGraph for controllable agent workflows
  - Separate core, text-splitter, partner-integration, and classic packages in one repository

