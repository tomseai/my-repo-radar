project:
  name: opik
  kind: service
  summary: >-
    An open-source platform for tracing, evaluating, testing, monitoring, and
    optimizing LLM applications and AI agents across development and production.
  best_for:
    - ML and engineering teams operating LLM applications or agentic workflows
    - Self-hosted teams that need trace-level observability and evaluation
key_features:
  - Trace LLM calls, conversations, agent steps, and tool calls in tree form
  - Build datasets and experiments with LLM-as-a-judge metrics
  - Annotate traces and spans with feedback scores through the SDK or web UI
  - Monitor production traces, feedback scores, token usage, and online
    evaluations
  - Optimize prompts and agents with the Agent Optimizer SDK
  - Test LLM pipelines in CI/CD through a PyTest integration
  - Connect coding agents to traces and evaluations through an MCP server
