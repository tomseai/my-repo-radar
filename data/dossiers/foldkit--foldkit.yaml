project:
  name: Foldkit
  kind: framework
  summary: >-
    A TypeScript frontend framework built on Effect and Elm-style architecture,
    with explicit models, updates, effects, routing, UI components, and
    deterministic testing.
  best_for:
    - Teams prioritizing explicit state transitions and testable frontend
      behavior
    - Effect users who want an Elm-like architecture with TypeScript tooling
key_features:
  - Centralizes state in a model and pure update function without hooks or
    hidden mutation
  - Represents commands, subscriptions, routing, and managed resources as
    explicit effects
  - Includes accessible UI components, virtual DOM rendering, and React embedding
  - Provides time-travel devtools, MCP inspection, scenes, tests, and hot-module
    replacement
usage:
  interfaces:
    - TypeScript framework
    - development tools
    - MCP devtools
