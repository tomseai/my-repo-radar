project:
  name: OpenManus
  kind: framework
  summary: >-
    A Python framework and command-line runtime for configuring LLM-backed
    general agents with browser automation, MCP tools, and multi-agent
    flows.
  best_for:
    - Developers experimenting with configurable general-purpose AI agents
    - Agent workflows that need optional browser, MCP, or data-analysis tools

key_features:
  - Terminal entry point for running an OpenManus agent
  - Configurable global and vision-model API settings
  - Browser Use CLI is started as a default MCP server for browser automation
  - MCP tool server launched through run_mcp.py
  - Optional multi-agent flow with a DataAnalysis Agent for analysis and
    visualization tasks
  - Conda, uv, and Docker installation paths

usage:
  interfaces:
    - CLI
    - terminal
    - MCP server
  installation:
    - conda
    - uv
    - Docker
    - Python package
  setup: high

