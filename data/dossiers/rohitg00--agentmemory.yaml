project:
  name: agentmemory
  kind: service
  summary: >-
    A persistent memory service for coding agents that captures session activity,
    stores and consolidates it through a local engine, and returns selected context
    through hooks, MCP, and a local REST API for future sessions and compatible clients.
  best_for:
    - Coding-agent users who want persistent, searchable context across sessions and tools
    - Teams that need shared and private agent memory with traceable source observations
key_features:
  - Captures supported agent lifecycle and tool events, then derives session summaries and structured memory
  - Searches memory through BM25, optional vector embeddings, and knowledge-graph traversal fused with reciprocal-rank fusion
  - Provides four memory tiers, decay, contradiction handling, provenance, and Git-versioned memory snapshots
  - Exposes MCP tools, resources, prompts, skills, a local REST API, and a real-time viewer
  - Supports agent wiring for Claude Code, Codex CLI, Copilot CLI, Cursor, Gemini CLI, OpenCode, and other MCP or HTTP clients
  - Includes team sharing, action leases, signals, routines, and peer-to-peer memory synchronization
