strengths:
  - Combines automatic capture, retrieval, consolidation, and integrations instead of only supplying a memory API
  - Lets compatible agent clients share one memory service while retaining project, agent, team, and user scoping
  - Makes several memory operations inspectable through provenance, audit, export, health, and viewer interfaces
caveats:
  - The primary package requires Node.js 20 or later and an iii engine or Docker; the bundled Compose stack pins iii version 0.11.2 because newer engine worker behavior is not yet supported
  - Native Windows setup is documented as manual, and agentmemory connect is currently unsupported there
  - The MCP shim exposes its full 53-tool surface only when it can reach the running service; otherwise it falls back to a smaller local tool set
  - Automatic capture can retain prompts and tool activity, so teams should review its privacy filtering, retention, and configured sharing behavior before enabling it
