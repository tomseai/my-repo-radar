strengths:
  - Combines automatic capture, retrieval, consolidation, and integrations
    instead of only supplying a memory API
  - Lets compatible agent clients share one memory service while retaining
    project, agent, team, and user scoping
  - Makes several memory operations inspectable through provenance, audit,
    export, health, and viewer interfaces
caveats:
  - The primary package requires Node.js 20 or later. The Docker Compose
    build defaults to iii engine 0.25.1.
  - Native Windows supports automatic engine setup and agentmemory connect;
    one hook integration may need manual configuration if short paths are unavailable
  - The MCP shim exposes its full 54-tool surface only when it can reach the
    running service; otherwise it falls back to a smaller local tool set
  - Automatic capture can retain prompts and tool activity, so teams should
    review its privacy filtering, retention, and configured sharing behavior
    before enabling it
