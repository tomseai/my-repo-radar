strengths:
  - Combines an agent-oriented runtime and applications with an established
    Postgres synchronization layer
  - Uses an HTTP protocol that can integrate with CDNs and multiple client
    frameworks
  - Supports selective replication rather than requiring clients to consume an
    entire database
  - Provides multiple examples plus explicit security-reporting and
    supported-version guidance
caveats:
  - The retained GitHub metadata describes an agent platform, while the root
    README still primarily describes a Postgres sync engine; detailed agent
    package documentation was not retained
  - Electric is a read-path engine that syncs data out of Postgres and should
    not be assumed to provide general bidirectional write synchronization
  - Self-hosting requires PostgreSQL logical replication and a separately
    running Electric service
  - The optional Phoenix LiveDashboard is unauthenticated and must be
    network-restricted in production
  - Releases are component-scoped; @core/sync-service@1.8.1 is the latest
    retained stable sync-service release. GitHub's Latest points to the
    separate @electric-sql/y-electric@0.1.54 package.
