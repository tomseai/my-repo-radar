project:
  name: Electric
  kind: monorepo
  summary: >-
    A monorepo for an agent platform built on Electric's Postgres read-path sync
    engine, combining agent runtime and application packages with partial
    replication, HTTP data delivery, and client integrations.
  best_for:
    - Teams building stateful agent applications around live Postgres data
    - Applications that need selective real-time replication from Postgres to
      clients
key_features:
  - Agent runtime, server, desktop, mobile, and MCP-oriented packages in the
    commit-pinned monorepo
  - Read-path synchronization from Postgres with partial replication through
    Shapes
  - Low-level HTTP API designed to work with CDNs for scalable data delivery
  - TypeScript client libraries and a React useShape integration
  - Optional Phoenix LiveDashboard for runtime monitoring
usage:
  interfaces:
    - TypeScript agent runtime API
    - HTTP sync API
    - TypeScript client API
    - React hooks
    - desktop and mobile agent applications
  installation:
    - Docker Compose or Docker image for the Electric sync service
    - pnpm workspace packages for clients, integrations, and agent components
    - source development with asdf, Erlang, Elixir, Node.js, and pnpm
  setup: moderate
technology:
  languages:
    - TypeScript
    - Elixir
  notable_components:
    - Electric Postgres sync service
    - Shapes partial-replication model
    - "@electric-ax/agents-runtime"
    - MCP bridge package
    - React client integration
    - PostgreSQL logical replication
    - Docker Compose
