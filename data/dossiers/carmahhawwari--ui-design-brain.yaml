project:
  name: UI Design Brain
  kind: plugin
  summary: >-
    A Cursor skill and Markdown knowledge pack for AI-assisted UI development,
    supplying component-specific best practices, layout patterns, aliases,
    accessibility guidance, design directions, and anti-patterns for more than
    60 interface components.
  best_for:
    - Cursor users who want reusable UI design guidance applied while generating interfaces
    - Teams sharing component and layout conventions through a project-local Cursor skill

key_features:
  - Guidance for more than 60 common interface components
  - Component best practices, common layouts, aliases, and anti-patterns
  - Accessibility guidance including focus, ARIA, and keyboard-navigation considerations
  - Five named design directions, from modern SaaS to data-dashboard styling
  - Personal and project-local installation paths for Cursor skills

usage:
  interfaces:
    - Cursor skill
    - Markdown reference files
  installation:
    - clone into a personal Cursor skills directory
    - clone into a project .cursor/skills directory
    - copy SKILL.md and components.md manually
  setup: low

technology:
  languages: []
  notable_components:
    - Cursor skills directory
    - Markdown knowledge base

license:
  spdx: MIT
