  notes: Permissive license; retained license text includes no material reuse restriction beyond preserving the notice.

status:
  lifecycle: unknown
  archived: false
  latest_release: null
  latest_release_at: null

strengths:
  - Provides concrete component-level guidance instead of only broad style prompts
  - Can be installed per user or committed with a project for shared conventions
  - Explicitly includes accessibility and anti-pattern guidance alongside visual direction

caveats:
  - It is tailored to Cursor's skills mechanism rather than being a framework-agnostic UI runtime
  - The retained release feed has no entries, so no project release can be established
  - The retained bundle lists SKILL.md and components.md but does not include their contents for independent review
  - Generated output still depends on the coding agent and the application context supplied by the user

