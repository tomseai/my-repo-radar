project:
  name: GPT4All
  kind: application
  summary: >-
    A desktop application and Python client for downloading and running local
    large language models on personal computers without hosted API calls.
  best_for:
    - Private local LLM chat on supported desktop operating systems
    - Python applications that need to load and generate with local models

key_features:
  - Desktop installers for Windows, Windows ARM, macOS, and Ubuntu
  - Python package for loading a model, starting a chat session, and generating text
  - Local model execution without API calls or a GPU requirement
  - LocalDocs workflow for chatting with locally held data
  - Docker-based OpenAI-compatible local inference API described in the release history

usage:
  interfaces:
    - desktop app
    - Python API
    - local HTTP API
  installation:
    - official platform installer
    - Flathub package
    - pip install gpt4all
  setup: low

