project:
  name: Zustand
  kind: library
  summary: >-
    A small, hook-based state-management library for React that creates stores
    without requiring context providers and also exposes a vanilla store API.
  best_for:
    - React applications that need concise, provider-free application state
    - JavaScript applications that need a standalone observable store
key_features:
  - Creates stores as hooks that expose state and actions to React components
  - Re-renders consuming components when their selected state changes
  - Supports vanilla stores outside React through createStore and useStore
  - Includes middleware for persistence, Immer integration, subscriptions, and Redux DevTools
usage:
  interfaces:
    - React hooks
    - Vanilla JavaScript store API
  installation:
    - npm install zustand
  setup: low
technology:
