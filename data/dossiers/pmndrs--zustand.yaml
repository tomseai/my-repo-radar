  archived: false
  latest_release: v5.0.14
  latest_release_at: "2026-05-28"
strengths:
  - Keeps the common React store pattern concise without mandatory context providers
  - Supports use outside React through a separate vanilla store entry point
  - Documents persistence, selector subscriptions, Immer, and DevTools middleware
caveats:
  - State updates must be immutable; the library only shallowly merges state at the top level
  - Replacing state with the set function can also remove store actions
  - The README cautions against adding state through the store API in React Server Components because of unexpected bugs and privacy issues
