project:
  name: Gas Town
  kind: cli
  summary: >-
    A multi-agent workspace manager that uses git worktree-backed state and
    Beads to coordinate persistent coding-agent tasks, handoffs, monitoring,
    and merge workflows.
  best_for:
    - Teams running several coding agents across one or more repositories
    - Long-running, multi-issue implementation work that needs durable coordination and recovery

key_features:
  - A Mayor coordinator, rigs, crew workspaces, and persistent worker identities
  - Convoys that bundle Beads tasks for agent assignment, tracking, and stall handling
  - Git worktree-backed hooks that preserve work state across agent restarts
  - Witness, Deacon, and Dog watchdog roles for health checks, recovery, and escalation
  - A per-rig Refinery merge queue with verification gates and Bors-style bisection
  - Runtime presets for Claude Code, Codex, GitHub Copilot, Gemini, Cursor, and other coding agents

