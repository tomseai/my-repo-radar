strengths:
  - Gives multi-agent work durable task state, identities, handoffs, and recovery mechanisms
  - Supports structured orchestration, direct manual operation, and several coding-agent runtimes
  - Adds operational controls for dispatch capacity, merge verification, escalation, and telemetry

caveats:
  - Native full-service workflows require a substantial toolchain, including Git, Go, Beads, Dolt, tmux, and platform-specific dependencies
  - Native Windows is documented as minimal CLI-only; tmux-backed workflows need WSL or another Linux environment
  - The dashboard is a trusted local-network surface and should not be exposed without suitable access controls
  - It coordinates coding agents and task state; it does not provide an underlying agent model or coding runtime

