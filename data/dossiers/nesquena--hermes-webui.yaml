project:
  name: Hermes WebUI
  kind: application
  summary: >-
    A self-hosted browser interface for Hermes Agent that provides chat,
    session, workspace, profile, task, memory, and settings workflows.
  best_for:
    - Operating an existing Hermes Agent installation from a browser
    - Accessing a persistent agent workspace from desktop or mobile devices

key_features:
  - Browser chat with configured Hermes model providers and session management
  - Workspace browser, file preview, and transcript import or export
  - Agent profiles, persistent memory, skills, tasks, and scheduled-work controls
  - Optional password, passkey, OIDC, and reverse-proxy deployment configurations
  - Docker, Nix, and bootstrap-based self-hosted installation paths

usage:
  interfaces:
    - web UI
    - browser PWA
    - local HTTP server
  installation:
    - Python bootstrap script
    - Docker Compose
    - Nix flake or NixOS module
  setup: moderate

technology:
  languages:
    - Python
    - JavaScript
  notable_components:
    - Hermes Agent
    - vanilla JavaScript frontend
    - SQLite session bridge
    - Docker

