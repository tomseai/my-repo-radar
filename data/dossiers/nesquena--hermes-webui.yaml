status:
  lifecycle: active
  archived: false
  latest_release: v0.52.727
  latest_release_at: 2026-11-22

strengths:
  - Extends a Hermes installation without requiring a frontend build pipeline
  - Brings CLI sessions and workspace files into a visual, mobile-responsive
    interface
  - Provides several documented self-hosting and authentication options

caveats:
  - It depends on a working Hermes Agent installation and its configured
    providers or models
  - Password authentication is disabled by default for localhost; network
    exposure requires suitable access controls
  - The feed has newer exp-v0.52.734 experimental releases; v0.52.727 is the
    newest non-experimental release retained in the feed

