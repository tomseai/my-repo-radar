key_features:
  - Reconstructs source content from the cli.js.map sourcesContent field
  - Retains 4,756 reconstructed files, including 1,884 TypeScript or TSX files
  - Maps the main CLI entry point, tools, commands, services, utilities, and React context directories
  - Includes reconstructed coordinator, plugin, skill, voice, remote-session, and Vim-related directories
  - Records package metadata for the @anthropic-ai/claude-code 2.1.88 CLI package

