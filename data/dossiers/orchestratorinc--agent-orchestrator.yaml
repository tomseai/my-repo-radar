status:
  lifecycle: active
  archived: false
  latest_release: v0.15.3
  latest_release_at: 2026-11-16
strengths:
  - Keeps parallel agent work isolated while exposing live implementation and
    review context
  - Connects high-level project planning to independently inspectable workers
caveats:
  - Users must install and authorize their chosen external coding-agent
    harnesses
  - The release feed mixes stable and nightly tags; v0.15.3 is the newest
    stable release
  - Agent autonomy still requires repository, credential, and execution
    permissions to be configured safely
  - Worker, chat, and reviewer capabilities vary by agent adapter
  - Optional hosted workspaces store the code and worktree in the cloud. Usage
    analytics have a documented opt-out
