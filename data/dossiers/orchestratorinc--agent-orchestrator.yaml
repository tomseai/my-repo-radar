project:
  name: Orchestrator.inc
  kind: application
  summary: A local desktop workspace for planning, running, and supervising
    multiple coding agents in isolated worktrees with live task, terminal,
    diff, browser, PR, CI, and review state.
  best_for:
    - Developers coordinating parallel coding-agent work across one repository
    - Teams that want project-level planning and worker-level implementation
      visibility
key_features:
  - Gives each worker a task, agent, branch, worktree, terminal, and feedback
    loop
  - Adds a persistent project orchestrator for planning and delegating work
  - Displays worker, pull-request, CI, review, and merge status on a live
    Kanban
  - Supports structured chat, native agent TUIs, isolated browser previews,
    and many agent adapters
  - Returns CI failures, review comments, and merge conflicts to the worker
    responsible for the branch
  - Offers optional hosted workspaces for running agents in the cloud
usage:
  interfaces:
    - desktop application
    - embedded terminal
    - structured chat
    - local browser preview
  installation:
    - official desktop download
    - Homebrew cask on macOS
    - build from source
  setup: moderate
technology:
  languages:
    - Go
    - TypeScript
  notable_components:
