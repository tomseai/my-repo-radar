  languages:
    - TypeScript
    - Python
  notable_components:
    - Next.js
    - FastAPI
    - Docker Compose
    - MongoDB
    - Tree-sitter
    - Arize Phoenix
license:
  spdx: null
  name: Component-specific AGPL-3.0 and Apache-2.0/MIT declarations
  notes: >-
    The README assigns AGPL-3.0 to the frontend and backend applications; it
    assigns Apache-2.0 to the GitVizz core library, whose pyproject also declares MIT.
status:
