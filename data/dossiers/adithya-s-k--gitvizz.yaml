project:
  name: GitVizz
  kind: application
  summary: >-
    A web application for exploring GitHub repositories through dependency
    graphs, code navigation, LLM-assisted repository chat, and generated documentation.
  best_for:
    - Developers onboarding to, reviewing, or investigating an unfamiliar GitHub codebase
    - Teams that want visual code relationships and LLM context-building alongside a repository browser
key_features:
  - Interactive dependency graphs with search, highlighting, and code-relationship navigation
  - Context-aware repository chat backed by configurable LLM providers
  - LLM context builder and automatic documentation generation for repository analysis
  - Syntax-highlighted code viewer and repository structure views
  - Standalone Python library for AST-based dependency-graph generation
usage:
  interfaces:
    - web UI
    - Docker Compose deployment
    - Python library
  installation:
    - Docker Compose
    - Manual Python and pnpm setup
    - pip install from the Git repository subdirectory
  setup: high
