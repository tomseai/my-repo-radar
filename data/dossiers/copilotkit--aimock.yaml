project:
  name: aimock
  kind: library
  summary: >-
    A zero-dependency TypeScript mock server and library for exercising AI
    application integrations without calling their live dependencies.
  best_for:
    - Testing applications that call LLM, agent-protocol, tool, or vector-service APIs
    - Creating deterministic fixtures for local development and CI
key_features:
  - Runs LLM, MCP, A2A, AG-UI, vector, search, rerank, and moderation mocks on one port
  - Provides fixture-based record and replay, including approximate replay timing controls
  - Supports a programmatic API, the full-featured aimock CLI, and the legacy llmock compatibility CLI
  - Provides provider- and endpoint-specific mock coverage including streaming and selected WebSocket APIs
  - Publishes a pytest plugin for Python test suites
usage:
  interfaces:
    - TypeScript library API
    - command-line interface
    - Docker container
    - GitHub Action
    - pytest plugin
  installation:
    - npm package @copilotkit/aimock
    - npx execution
    - GHCR Docker image
    - PyPI package aimock-pytest
  setup: moderate
technology:
  languages:
