strengths:
  - Consolidates several AI-facing mock types in one package and server
  - Offers both fixture replay and optional recording from real upstream APIs
  - Supplies local, container, CI-action, and Python-pytest entry points
caveats:
  - Fixture schemas and supported provider surfaces need to match the integrations under test
  - Record mode proxies requests to real APIs, so users remain responsible for credentials, cost, and fixture contents
  - The llmock CLI is retained for compatibility but has fewer features than the aimock CLI
  - Python support is delivered as a separate aimock-pytest package
