project:
  name: LibreChat
  kind: application
  summary: >-
    A self-hosted, multi-user AI chat platform that unifies hosted, custom, and
    local model endpoints with configurable agents, MCP tools, file workflows,
    web search, and Docker-based deployment.
  best_for:
    - Teams operating a configurable shared AI chat service on their own
      infrastructure
    - Users who need one interface for multiple model providers, agents, tools,
      and conversation controls
key_features:
  - Connects to major hosted providers, custom OpenAI-compatible endpoints, and
    local or remote model providers
  - Supports custom agents with skills, subagents, MCP servers, tools, file
    search, and code execution
  - Exposes an Agent Management API for deployment-bound OIDC clients
  - Supports on-demand conversation compaction and fullscreen artifact previews
  - Adds web search with search providers, content scrapers, and reranking
    support
  - Provides file and multimodal chat, code artifacts, image generation, and
    conversation search
  - Includes OAuth2, LDAP, and email login options plus administration for
    users, groups, roles, and permissions
  - Documents Docker Compose stacks and local or cloud deployment options
usage:
  interfaces:
    - web application
    - Docker Compose deployment
    - administrative web panel
  installation:
    - Docker Compose stack
    - source checkout with npm workspaces
  setup: moderate
