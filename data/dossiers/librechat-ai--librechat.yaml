  latest_release: v0.8.9
  latest_release_at: "2026-11-17"
strengths:
  - Brings provider selection, agents, MCP tools, search, and file workflows
    into one self-hosted UI
  - Provides multi-user authentication, role and group controls, and a
    browser-based administration panel
  - Supports simple Docker Compose deployment alongside source-based development
    and deployment paths
caveats:
  - Running a shared deployment requires infrastructure configuration and
    credentials for selected AI, search, or authentication providers
  - Startup-loaded Agent Plugins and attached code workspaces are documented as experimental.
  - Several capabilities depend on external model, tool, search, or
    code-interpreter services and their separate terms or costs
  - The release feed interleaves Helm-chart tags; v0.8.9 is the primary
    LibreChat application release, not chart-2.0.7
  - The root LICENSE is MIT while package.json declares ISC, so the retained
    bundle does not fully resolve licensing labels for every package
