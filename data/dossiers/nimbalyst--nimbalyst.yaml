project:
  name: Nimbalyst
  kind: application
  summary: >-
    An open-source visual desktop workspace for working with coding agents,
    files, sessions, tasks, and Git worktrees, with a companion mobile app.
  best_for:
    - Developers who want to supervise several coding-agent sessions visually
    - Teams that need shared task, document, and session context around agent work
key_features:
  - Provides WYSIWYG editors and red/green approval flows for agent-authored file changes
  - Supports Markdown, mockups, Mermaid, Excalidraw, CSV, data models, and Monaco code editing
  - Organizes parallel sessions with file links, search and resume, and a Kanban board
  - Includes Git-state management, AI commits, an embedded terminal, and Git worktrees
  - Supplies an extension system plus a mobile dashboard for monitoring and replying to sessions
usage:
  interfaces:
    - desktop GUI
    - mobile companion app
    - embedded terminal
  installation:
    - macOS, Windows, or Linux release download
    - source build with npm workspaces and Electron
  setup: moderate
