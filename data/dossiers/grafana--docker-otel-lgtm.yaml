project:
  name: docker-otel-lgtm
  kind: infrastructure
  summary: A single Docker image that runs an OpenTelemetry backend for local
    metrics, traces, logs, and profiles by bundling the OpenTelemetry
    Collector, Prometheus, Tempo, Loki, Pyroscope, and Grafana.
  best_for:
    - Developers who need a local OpenTelemetry stack for demos, tests, or
      experimentation
    - Trying Grafana observability components without configuring each backend
      separately
key_features:
  - Bundles the Collector, Prometheus, Tempo, Loki, Pyroscope, and Grafana in
    one image
  - Accepts OpenTelemetry data at the default OTLP HTTP and gRPC endpoints
  - Offers Grafana dashboards and a web UI for metrics, traces, logs, and
    profiles
  - Supports volume-backed data, extra backend arguments, custom
    configuration, plugins, and dashboards
  - Includes Kubernetes deployment instructions and examples in five
    application languages
  - Can enable OpenTelemetry eBPF Instrumentation for zero-code HTTP and gRPC
    telemetry on supported Linux hosts
  - Supports Podman and Apple Container in addition to Docker
usage:
  interfaces:
    - Docker image
    - Grafana web UI
    - OTLP HTTP and gRPC endpoints
    - Kubernetes manifest
    - Model Context Protocol integration
  installation:
    - Docker image from Docker Hub
    - local Docker build
    - Kubernetes manifest
    - Podman or Apple Container via the run script
  setup: moderate
technology:
  languages:
    - Shell
    - Go
  notable_components:
    - OpenTelemetry Collector
    - Prometheus
    - Tempo
    - Loki
    - Pyroscope
    - Grafana
