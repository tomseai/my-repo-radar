strengths:
  - Starts a useful multi-signal OpenTelemetry backend with a single container
    image
  - Makes it easy to inspect telemetry in Grafana while retaining familiar
    backend components
  - Supports customization and examples without requiring a separate
    production stack installation
caveats:
  - The project explicitly targets development, demonstrations, and testing
    rather than production deployment
  - The default Grafana credentials are admin/admin and must not be left
    unchanged outside a disposable local environment
  - Enabling eBPF instrumentation requires Linux kernel 5.8+ with BTF and
    gives the container host PID access plus privileged Docker permissions
  - Apple Container needs more memory than its default allocation
