project:
  name: GitHub Copilot CLI for Beginners
  kind: course
  summary: >-
    A hands-on beginner course for GitHub Copilot CLI that uses a Python book
    collection application to teach terminal-based AI assistance, code review,
    test generation, debugging, custom agents, skills, and MCP servers.
  best_for:
    - Developers and students who are new to AI-assisted terminal workflows
    - Teams standardizing GitHub Copilot CLI development and review practices
key_features:
  - Eight progressive chapters from installation through complete feature
    workflows
  - Runnable terminal examples and assignments in every chapter
  - A single Python book collection application used throughout the learning path
  - Lessons for code review, debugging, and test generation
  - Chapters for specialized agents, automatically loaded skills, and MCP servers
  - GitHub Codespaces launch option and a web-based Learning Hub version
