project:
  name: llm-openai-via-codex
  kind: plugin
  summary: >-
    A Python plugin for Simon Willison's LLM command-line tool that exposes
    OpenAI models through an existing authenticated OpenAI Codex CLI
    subscription instead of requiring a separately configured model API key.
  best_for:
    - LLM CLI users with an authenticated OpenAI Codex CLI subscription
    - Prompting OpenAI models through LLM's existing command-line workflows

key_features:
  - Registers an openai_via_codex provider entry point for the LLM tool
  - Lists available Codex-backed models with the LLM models command
  - Runs model prompts through names such as openai-codex/gpt-5.5
  - Can be installed as an LLM plugin or run from a local checkout with uv

usage:
  interfaces:
    - CLI
    - Python package plugin
  installation:
    - llm install llm-openai-via-codex
    - local checkout with uv
  setup: low

technology:
  languages:
    - Python
  notable_components:
    - Simon Willison's LLM CLI
    - OpenAI Codex CLI
    - OpenAI Python package

