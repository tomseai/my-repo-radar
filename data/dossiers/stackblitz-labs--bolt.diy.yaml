project:
  name: bolt.diy
  kind: application
  summary: An open-source, self-hostable version of Bolt.new for AI-assisted web
    development, with selectable cloud and local model providers plus browser,
    Docker, and Electron desktop deployment paths.
  best_for:
    - Developers who want a self-hosted AI web-development environment with
      provider choice
    - Teams that need to connect local models or OpenAI-compatible endpoints
      to an agent workspace
key_features:
  - Supports more than 22 documented cloud and local model providers through
    the Vercel AI SDK
  - Provides web, Docker, and Electron desktop deployment options
  - Includes settings for cloud keys, Ollama, LM Studio, and OpenAI-compatible
    base URLs
  - Builds and runs through pnpm scripts with production and development
    Docker configurations
  - Includes codebase search, snapshot restoration, and visual diff inspection
usage:
  interfaces:
    - browser-based web UI
    - Electron desktop application
    - Docker-hosted web service
  installation:
    - install dependencies with pnpm install and run pnpm run dev
    - use Docker Compose or the documented Docker build scripts
    - download or build the Electron application for macOS, Windows, or Linux
  setup: moderate
technology:
  languages:
    - TypeScript
    - JavaScript
  notable_components:
    - React
    - Remix
    - Vercel AI SDK
    - StackBlitz WebContainers
    - Electron
    - Docker
    - Cloudflare Wrangler
license:
  spdx: MIT
  name: MIT License
  notes: The source code is MIT-licensed. The WebContainers API has separate
    commercial licensing terms for enterprise deployment.
status:
  lifecycle: active
  archived: false
  latest_release: v1.0.3
  latest_release_at: 2026-11-15
strengths:
  - Provides broad provider choice, including local Ollama and LM Studio
    paths, instead of binding the workspace to one model vendor
  - Documents browser, container, and cross-platform desktop deployment
    choices in the primary README
  - Keeps source code under MIT terms while supplying project scripts for
    development, testing, linting, and packaging
caveats:
  - Each cloud provider requires its own credentials, availability, pricing,
    and configuration; model quality varies by provider
  - Enterprise use of the WebContainers API is subject to its separate
    commercial terms
  - The source setup requires Node.js 22.12 or newer and pnpm 9.15.9 or newer.
    Docker Compose reads two environment files that need to stay in sync
