project:
  name: NanoClaw
  kind: application
  summary: Self-hosted, messaging-based AI assistant that routes each agent session through an isolated Docker container.
  best_for:
    - Individual users building a customizable personal assistant across selected messaging channels.
    - Developers who want per-agent filesystem mounts and container isolation instead of a shared host process.
key_features:
  - Routes messages through a Node host, per-session SQLite inbound and outbound databases, and per-agent containers.
  - Supports skill-installed messaging channels, including Telegram, Discord, WhatsApp, Slack, Teams, and email.
  - Runs recurring scheduled tasks and can use script gates to avoid unnecessary agent wakeups.
  - Provides per-agent workspaces, memory, container configuration, and explicitly selected mounts.
  - Uses OneCLI Agent Vault so credentials are injected for outbound requests instead of being held by agent containers.
  - Offers Claude Code natively plus skill-installed Codex, OpenCode, and Ollama provider options.
usage:
  interfaces:
    - Messaging-channel assistant.
    - Local CLI and interactive Bash setup script.
  installation:
    - Clone the repository and run bash nanoclaw.sh for guided installation and first-channel pairing.
    - Run migrate-v2.sh from a separate v2 checkout when migrating from NanoClaw v1.
  setup: high
