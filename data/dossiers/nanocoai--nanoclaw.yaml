strengths:
  - Makes the host-to-container message and database flow explicit, with
    separate one-writer SQLite files per session.
  - Uses container isolation and explicit mounts as the principal boundary for
    agent execution.
  - Keeps optional channels and alternate providers out of trunk until users
    install the relevant skills into their fork.
caveats:
  - Requires Docker, pnpm 10+, and a supported Node.js version (22.23.4+,
    24.22.1+, or 26.12.1+ within the documented major lines).
  - Windows support is through WSL2 rather than a native Windows runtime.
  - Container isolation limits visibility to configured mounts but does not
    remove the need to review code and the privileges granted to an agent.
  - Hosted perks such as a prebuilt Claude agent image require an account;
    setup also supports a local image build.
