strengths:
  - Makes the host-to-container message and database flow explicit, with separate one-writer SQLite files per session.
  - Uses container isolation and explicit mounts as the principal boundary for agent execution.
  - Keeps optional channels and alternate providers out of trunk until users install the relevant skills into their fork.
caveats:
  - Requires Docker, Node.js 20+, pnpm 10+, and Claude Code for customization, error recovery, and channel-installation skills.
  - Windows support is through WSL2 rather than a native Windows runtime.
  - Container isolation limits visibility to configured mounts but does not remove the need to review code and the privileges granted to an agent.
  - The current package version in the pinned source is 2.1.53, whereas the latest retained GitHub Release is v2.1.17; the status reports the latter because it is the repository release feed.
