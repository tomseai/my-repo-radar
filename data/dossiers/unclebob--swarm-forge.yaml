project:
  name: SwarmForge
  kind: framework
  summary: >-
    A local, tmux-based multi-agent orchestration framework that gives agents
    dedicated Git worktrees, role prompts, and file-based handoffs.
  best_for:
    - Teams applying a defined multi-agent coding workflow to a local Git project
    - Projects that need separate implementation, review, and QA agent roles

key_features:
  - Configuration-driven role topology with one tmux session per role
  - Git worktree creation and assignment for roles that need isolated changes
  - Per-role prompts and layered, project-local engineering constitution files
  - Per-role selection of Codex, Claude, Copilot, or Grok backends
  - Validated file-based handoffs delivered by a local daemon
  - Two-, four-, and six-role runnable workflow branches

usage:
  interfaces:
    - shell launcher
    - tmux sessions
    - terminal windows
  installation:
    - download a runnable branch archive
  setup: high

