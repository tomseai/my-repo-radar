strengths:
  - Keeps agent collaboration local while isolating role changes in Git worktrees
  - Makes workflows and role responsibilities explicit in project-local files
  - Provides structured handoff validation instead of direct tmux messaging

caveats:
  - The main branch is documentary; users must select a runnable workflow branch
  - Requires zsh, Git, tmux, Babashka, and at least one configured agent backend
  - No published releases are present in the retained releases feed
  - Reuse rights are unknown because the retained repository has no license file

