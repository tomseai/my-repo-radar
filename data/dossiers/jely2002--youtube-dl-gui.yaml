project:
  name: Open Video Downloader
  kind: application
  summary: >-
    A cross-platform desktop GUI, also known as youtube-dl-gui, that uses
    yt-dlp to download video, audio, subtitles, and metadata from supported
    sites, offering format controls, playlists, queues, output templates,
    progress feedback, and desktop installers for Windows, macOS, and Linux.
  best_for:
    - People who prefer a desktop interface to yt-dlp's command line
    - Downloading selected media, playlists, captions, or metadata from supported sites

key_features:
  - Video downloads or audio-only extraction through yt-dlp
  - Captions and metadata download when available from the selected source
  - Resolution, frame-rate, and MP4 or MKV output controls
  - Playlist downloads, custom filenames, and output-location templates
  - Queue balancing, progress feedback, notifications, and keyboard shortcuts
  - App and yt-dlp automatic-update support for the normal release builds

usage:
  interfaces:
    - desktop GUI
  installation:
    - GitHub Release installers and archives
    - Homebrew cask on macOS
    - WinGet on Windows
    - Microsoft Store
    - build from source
  setup: low

technology:
  languages:
    - Rust
    - TypeScript
  notable_components:
    - Tauri
    - Vue 3
    - yt-dlp

license:
  spdx: AGPL-3.0-or-later
  name: GNU Affero General Public License v3.0 or later
  notes: Strong copyleft license; modified network-interactive versions must offer their corresponding source to users. The manifests use `AGPL-3.0-or-later`, while the README abbreviates it as AGPL-3.0.

status:
  lifecycle: active
  archived: false
  latest_release: v3.2.1
  latest_release_at: 2026-07-05

strengths:
  - Makes common yt-dlp media and playlist workflows available without a command line
  - Provides native installers for Windows, macOS, and several Linux package formats
  - The current Tauri, Rust, and Vue architecture includes update, notification, shortcut, and queue features

caveats:
  - Site support, available formats, and download results depend on yt-dlp and the chosen source site
  - Users remain responsible for respecting copyright, access rules, and other applicable terms when downloading media
  - The Microsoft Store build has slower update delivery and does not support automatic yt-dlp updates
  - Building from source requires both Node.js and Rust

