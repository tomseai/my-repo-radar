strengths:
  - Local processing avoids requiring a cloud parser or proprietary LLM feature
  - A single tool spans command-line, library, and browser use cases
  - OCR can be used immediately or delegated to a compatible server

caveats:
  - Markdown reconstruction is heuristic and may not render complex layouts perfectly
  - Office-document and image conversion needs LibreOffice or ImageMagick respectively
  - The release feed publishes separate WASM, Python, Node.js, Docker, and Crates & CLI releases; the selected release is the CLI-bearing component

