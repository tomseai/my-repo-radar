project:
  name: LiteParse
  kind: library
  summary: A local PDF and document parsing library and CLI that performs spatial text
    extraction, optional OCR, screenshots, and Markdown, JSON, or text output.
  best_for:
    - Developers building local document-ingestion or extraction pipelines
    - Applications needing Rust, Python, Node.js, or browser parsing interfaces
key_features:
  - Spatial text extraction with bounding boxes through PDFium
  - Built-in Tesseract OCR plus a documented HTTP OCR-server interface
  - Markdown, JSON, text, and page-screenshot outputs
  - Complexity checks to identify pages that may need OCR or heavier processing
  - Rust, Node.js/TypeScript, Python, and WASM bindings with a shared CLI
  - Python and Node.js worker pools for parallel parsing and per-document timeouts
