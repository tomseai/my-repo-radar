project:
  name: Hono
  kind: framework
  summary: >-
    A small TypeScript web framework built on Web Standards for defining HTTP
    applications and middleware that can run across edge, serverless, and
    JavaScript server runtimes including Cloudflare Workers, Deno, Bun, AWS
    Lambda, and Node.js.
  best_for:
    - TypeScript teams targeting more than one JavaScript or edge runtime
    - Small HTTP APIs, web applications, and middleware-driven services

key_features:
  - Route definitions and HTTP response helpers through a compact TypeScript API
  - Built-in, custom, and third-party middleware support
  - Runtime adapters for edge platforms, serverless functions, and Node.js
  - Web Standards-based design with zero runtime dependencies
  - Multiple routers, including the RegExpRouter used by the default framework
  - A small `hono/tiny` preset for size-sensitive deployments

usage:
  interfaces:
    - TypeScript library API
    - HTTP request handler
  installation:
    - npm package
    - npm create hono@latest project generator
  setup: low

