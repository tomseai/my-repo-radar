strengths:
  - One framework API spans several important edge and JavaScript runtimes
  - Small dependency-free core is suited to constrained deployment targets
  - TypeScript support, middleware, and routing are available in the core package

caveats:
  - Hosting, deployment configuration, and runtime bindings remain the application's responsibility
  - Runtime-specific platform APIs can reduce portability beyond the shared Web Standards core
  - The compact README delegates most integration and migration detail to the separate documentation site

