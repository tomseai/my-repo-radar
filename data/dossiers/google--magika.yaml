project:
  name: Magika
  kind: cli
  summary: >-
    A deep-learning file-content detector available as a Rust command-line
    tool and Python, Rust, JavaScript/TypeScript, and work-in-progress Go
    bindings, designed to classify files even when names or extensions mislead.
  best_for:
    - Routing untrusted files to suitable security or content-policy scanners
    - Adding content-type detection to Python, Rust, JavaScript, or CLI workflows

key_features:
  - Classifies more than 200 binary and text content types using a compact model
  - Scans individual files, standard input, batches, or directories recursively
  - Emits human-readable, MIME-type, label, JSON, JSONL, score, or custom output
  - Provides per-content-type thresholds and high-confidence, medium-confidence, and best-guess modes
  - Exposes a Python API and bindings beyond the Rust CLI
  - Uses a limited subset of file content for near-constant inference time by file size

usage:
  interfaces:
    - CLI
    - Python API
    - Rust library
    - JavaScript and TypeScript package
  installation:
    - pip or pipx
    - Homebrew
    - cargo package
    - npm package
  setup: low

