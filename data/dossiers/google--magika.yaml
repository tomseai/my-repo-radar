strengths:
  - Detects file content rather than trusting a filename or extension
  - Offers practical CLI output formats alongside language-level integrations
  - Lets callers trade coverage for confidence through explicit prediction modes

caveats:
  - Releases are versioned independently by component; the feed also lists Python v1.0.3, so cli/v1.1.0 is scoped to the primary CLI
  - The JavaScript and TypeScript package is described as experimental and the Go binding as work in progress
  - The repository disclaims official Google-project status and support or fitness warranties

