project:
  name: IronClaw
  kind: application
  summary: >-
    A Rust-based personal AI-assistant runtime that offers command-line,
    web, and messaging-channel operation with configurable model providers.
  best_for:
    - Individuals who want to run a configurable, security-focused personal agent
    - Operators who need local or hosted agent services with persistent storage
key_features:
  - Supports a REPL, HTTP webhooks, a browser gateway, and WASM-based messaging channels
  - Configures built-in, OpenAI-compatible, and local model-provider routes
  - Connects Model Context Protocol servers and loadable WASM tools or channels
  - Provides persistent workspace memory, hybrid search, scheduled routines, and job coordination
  - Applies capability permissions, endpoint allowlists, secret injection, and resource limits to untrusted WASM tools
usage:
  interfaces:
    - command-line REPL
    - browser web gateway
    - HTTP webhooks and messaging channels
  installation:
    - Windows installer or PowerShell installer
    - release-specific shell installer on macOS, Linux, or Windows with WSL
    - Cargo source build
  setup: high
technology:
  languages:
    - Rust
  notable_components:
    - libSQL-backed local persistence
    - WebAssembly tool sandbox
    - Docker sandbox
    - Model Context Protocol
