strengths:
  - Combines several interaction channels with configurable model-provider routing
  - Documents layered controls for sandboxed tools, credentials, and external content
  - Offers versioned binary installers, guided onboarding, and a source-build path
caveats:
  - The cached bundle lacks the actual LICENSE-MIT and LICENSE-APACHE texts, so reuse terms require upstream verification
  - The current source tree targets the newer ironclaw CLI. The legacy v1 monolith has been removed.
  - The CLI Cargo manifest reports 1.2.0. The retained release page identifies ironclaw-v1.4.1 as the newer stable product release.
  - Source builds require Rust 1.96 or newer and Node.js 22 or newer with Corepack and pnpm
