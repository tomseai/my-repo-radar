strengths:
  - Combines several interaction channels with configurable model-provider routing
  - Documents layered controls for sandboxed tools, credentials, and external content
  - Offers binary installers, Homebrew, and source-build paths
caveats:
  - The cached bundle lacks the actual LICENSE-MIT and LICENSE-APACHE texts, so reuse terms require upstream verification
  - The README documents the separate Reborn runtime alongside the older ironclaw binary; confirm which runtime applies to a planned deployment
  - The newer feed entries are a main-branch snapshot and a skill-learning component release; v0.29.1 is the latest retained release for the root ironclaw package
  - Full legacy setup can require PostgreSQL, provider credentials, and channel-specific configuration
