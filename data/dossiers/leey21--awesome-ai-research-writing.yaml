strengths:
  - Brings many common academic-writing tasks into one copy-ready prompt collection
  - Distinguishes LaTeX and Word output constraints rather than applying one format
    to every workflow
  - Extends the prompt collection with practical instructions for using external
    writing skills
caveats:
  - Most documentation and prompts are written in Chinese, which may limit direct use
    for non-Chinese readers
  - The skill section primarily documents installing skills from other repositories
    rather than shipping those skills here
  - The optional OpenSkills workflow requires Node.js 20.6 or newer and Git according
  - The README’s model recommendations reflect its authors’ editorial judgment and may change as model versions and access change
    to the README
  - No license file is present in the retained tree, so adoption should not assume
    permission to reuse the material
  - The retained release feed has no entries, so no project release can be established
