project:
  name: Awesome AI Research Writing
  kind: curated-list
  summary: A Chinese-language collection of copy-ready prompts and linked agent-skill
    workflows for AI-assisted academic research writing.
  best_for:
    - Researchers who want reusable prompts for drafting, translating, or reviewing
      papers
    - Cursor or Claude Code users who want guidance for installing writing-related
      skills
key_features:
  - Provides Chinese-to-English and English-to-Chinese academic-paper prompts for
    both LaTeX and Word workflows
  - Includes prompts for polishing, logical checks, shortening or expanding text,
    experiment analysis, and reviewer-style paper review
  - Covers paper-figure, table-title, and figure-caption preparation alongside
    writing prompts
  - Explains an OpenSkills-based workflow for locating, installing, and invoking
    related agent skills
usage:
  interfaces:
    - Markdown prompt collection
    - AI chat interface
    - Cursor or Claude Code skill workflow
  installation:
    - Copy a prompt from the README into a model chat
    - Install external skills with OpenSkills when using the optional skill workflow
  setup: low
