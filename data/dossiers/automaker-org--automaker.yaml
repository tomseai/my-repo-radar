project:
  name: Automaker
  kind: application
  summary: >-
    A desktop or web development studio that uses a Kanban workflow to plan,
    run, review, and approve coding-agent work in isolated Git worktrees.
  best_for:
    - Developers coordinating feature-sized coding-agent tasks visually
    - Teams that want plan approval and worktree isolation around agent execution

key_features:
  - Kanban stages for backlog, execution, approval, and verification
  - Agent execution with live tool use and progress streaming
  - Isolated Git worktrees for individual features
  - Configurable planning levels and plan approval
  - Multi-agent execution for spec-mode tasks
  - Diff, test, pull-request, and GitHub workflow support

usage:
  interfaces:
    - desktop GUI
    - web UI
    - TUI launcher
  installation:
    - npm development install
    - Electron builds
    - Docker Compose
  setup: moderate

