strengths:
  - Couples persistent interaction storage with asynchronous reasoning and multiple
    retrieval modes
  - Supports a managed service and a documented local Docker deployment from the same
    core project
  - Offers SDK and MCP paths for both product integration and coding-agent memory
    workflows
caveats:
  - Background reasoning is asynchronous, so newly added messages may not immediately
    appear in insight or chat results
  - Self-hosting requires Docker or a Python environment, PostgreSQL with pgvector,
    configuration, and provider API keys for documented reasoning features
  - The server, SDKs, and MCP server are independently versioned. The server
    changelog and feed include a v3.6.2 tag without a published GitHub release.
  - AGPL-3.0 network-copyleft obligations may be incompatible with some deployment or
    distribution plans
