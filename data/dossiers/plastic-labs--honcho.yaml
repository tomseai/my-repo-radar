project:
  name: honcho
  kind: service
  summary: >-
    A FastAPI-based memory service for stateful agents that stores interactions,
    processes them asynchronously into peer and session insights, and exposes
    context, search, representation, and chat capabilities through SDKs and APIs.
  best_for:
    - Adding persistent, queryable memory and prompt-ready context to an agent or LLM application
    - Teams that need a managed service or self-hosted memory server with Python and TypeScript SDKs
key_features:
  - Stores workspaces, peers, sessions, messages, and internal collections for multi-participant interactions
  - Runs background reasoning to create conclusions, representations, summaries, and peer cards
  - Provides context retrieval, hybrid search, low-latency representations, and a natural-language chat endpoint
  - Supports managed deployment, Docker self-hosting, Python and TypeScript SDKs, and MCP-client integration
  - Allows configurable LLM providers for different reasoning operations

usage:
  interfaces:
    - Python SDK
    - TypeScript SDK
    - HTTP API
    - MCP server
    - Docker Compose service
  installation:
    - pip install honcho-ai
    - npm install @honcho-ai/sdk
    - clone the repository and run Docker Compose for a self-hosted server
  setup: moderate

technology:
  languages:
    - Python
    - TypeScript
  notable_components:
