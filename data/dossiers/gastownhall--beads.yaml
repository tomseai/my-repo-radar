strengths:
  - Replaces ephemeral plans with queryable, dependency-aware work state for people and agents
  - Offers both simple embedded storage and server mode for concurrent writers
  - Supports common coding-agent integrations without making Git mandatory

caveats:
  - Embedded Dolt mode is single-writer; concurrent-agent deployments need server mode and its operational setup
  - Multi-machine work requires deliberate Dolt push and pull discipline to avoid synchronization issues
  - The MCP server is an alternative for environments without shell access, not a replacement for the CLI in typical local workflows

