project:
  name: Beads
  kind: cli
  summary: >-
    A distributed, dependency-aware issue tracker and persistent memory system
    for coding agents, backed by the version-controlled SQL database Dolt.
  best_for:
    - Coding-agent workflows that need durable, claimable tasks instead of Markdown plans
    - Teams coordinating dependent work across branches, worktrees, or machines

key_features:
  - A dependency graph that exposes unblocked work through bd ready
  - Atomic task claiming, JSON output, and agent-oriented workflow guidance
  - Content-derived issue IDs designed to avoid collisions across concurrent work
  - Persistent project memories injected through bd prime
  - Dolt-backed version history, branching, cell-level merges, and push/pull synchronization
  - Optional Claude Code plugin and MCP server alongside the core CLI

