project:
  name: Awesome LangChain
  kind: curated-list
  summary: >-
    A curated reference directory for the LangChain ecosystem, covering the core
    framework, language ports, tools, agents, templates, platforms, open-source
    projects, and learning material.
  best_for:
    - Developers looking for LangChain-related projects or integrations
    - Learners seeking examples, notebooks, and videos for the ecosystem

key_features:
  - Links to LangChain framework resources and ports to other languages
  - Tool listings, including low-code services, agents, and templates
  - Open-source project sections for knowledge management and chatbots
  - Learning resources with notebooks and video playlists
  - Complementary links to other LLM frameworks and adjacent lists

