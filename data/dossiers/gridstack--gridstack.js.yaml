project:
  name: gridstack.js
  kind: library
  summary: >-
    A TypeScript library for building responsive, draggable, resizable dashboard
    grids and managing their widget layouts.
  best_for:
    - Adding configurable multi-column dashboard layouts to a web application
    - Applications that need to save and restore user-arranged widget positions
key_features:
  - Responsive multi-column grids with drag-and-drop and resize interactions
  - Native mouse and touch support without runtime dependencies in the core
    library
  - APIs for creating widgets, loading serialized layouts, and saving layouts
  - Included Angular, React, and Vue wrappers alongside the core package
  - Extensible layout engine and drag-in setup APIs
