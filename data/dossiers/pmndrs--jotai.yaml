project:
  name: Jotai
  kind: library
  summary: >-
    An atom-based state-management library for React that composes primitive
    and derived atoms into application state, with React hooks and store APIs.
  best_for:
    - React applications that benefit from independently composable state units
    - Teams that want derived state expressed directly from other atoms
key_features:
  - Defines primitive atoms for state and read-only or writable derived atoms
  - Exposes useAtom and related React hooks for reading and writing atom state
  - Supports asynchronous atoms that integrate with React Suspense behavior
  - Provides Provider and store APIs for explicit state-store scoping
usage:
  interfaces:
    - React hooks
    - JavaScript and TypeScript APIs
  installation:
    - npm install jotai
  setup: low
