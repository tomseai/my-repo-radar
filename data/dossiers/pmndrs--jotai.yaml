status:
  lifecycle: active
  archived: false
  latest_release: v3.0.2
  latest_release_at: "2026-11-09"
strengths:
  - Models state as small composable units rather than requiring one global store
  - Documents both React hook usage and explicit provider or store APIs
  - Provides examples and focused core documentation for atom composition
caveats:
  - Its core concepts are atom composition and derived state, so teams need
    conventions for organizing a larger state graph
  - The documented asynchronous-atom Suspense behavior is described as needing
    further experimentation
  - The package declares React as a peer dependency, making React the central
    supported UI integration
