project:
  name: Stately Agent
  kind: framework
  summary: >-
    A TypeScript framework for representing LLM-agent control flow as XState
    machines whose typed states, guards, and events constrain the actions a model may propose.
  best_for:
    - Teams that need inspectable, resumable agent workflows with explicit legal transitions
    - Developers testing agent control flow independently from live model calls
key_features:
  - Gives the state machine authority over control flow while models select only allowed events
  - Separates portable machine definitions from model, execution, hosting, and persistence adapters
  - Supports snapshots, verified event logs, human approval, retries, parallel work, and child agents
  - Includes scripted executors, evaluation tooling, observability, budgets, and reusable patterns
usage:
  interfaces:
    - TypeScript library
    - XState machine definitions
  installation:
    - pnpm add @statelyai/agent@alpha xstate@alpha zod ai
    - source checkout
  setup: moderate
technology:
  languages:
    - TypeScript
  notable_components:
    - XState
    - Vercel AI SDK adapters
    - OpenTelemetry
license:
  spdx: MIT
  name: MIT License
  notes: Permissive license requiring preservation of the copyright and license notice.
status:
  lifecycle: experimental
  archived: false
  latest_release: null
  latest_release_at: null
strengths:
  - Makes invalid model-selected transitions rejectable by deterministic application logic
  - Allows machine workflows to be replayed and tested without API credentials
  - Keeps model and hosting providers replaceable behind executor interfaces
caveats:
  - Stately Agent 2 is in alpha. The source package is 2.0.0-alpha.42, and v1.1.6 is a stable release of the previous major version.
  - Current installation requires Node.js 22.18+, XState v6 alpha, and aligned AI SDK package versions
  - Applications still own model selection, request execution, state storage, tools, and security boundaries
