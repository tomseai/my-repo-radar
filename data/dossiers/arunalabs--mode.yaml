project:
  name: Mode
  kind: plugin
  summary: >-
    A Visual Studio Code extension that provides chat, autonomous coding,
    contextual file and image input, suggestion application, and experimental
    autocomplete while connecting directly to configured hosted, local, or
    VS Code language-model providers.
  best_for:
    - VS Code users who want a configurable coding-assistant extension
    - Developers bringing their own provider API keys or running supported local models
key_features:
  - Opens a contextual coding chat that can include the current file, selected code, and open editors
  - Supports autonomous coding and applies suggested code changes through Auto Merge
  - Configures hosted providers and local models such as Ollama and LM Studio
  - Integrates with the VS Code language-model API for eligible GitHub Copilot users
  - Provides experimental autocomplete alongside chat and coding workflows
usage:
  interfaces:
    - Visual Studio Code extension
    - chat webview
    - command palette
    - extension settings
  installation:
    - Visual Studio Marketplace extension
    - source build as a VS Code extension
  setup: moderate
