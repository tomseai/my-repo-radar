project:
  name: Gemini CLI
  kind: cli
  summary: >-
    An open-source terminal AI agent that connects Gemini models to codebases,
    file operations, shell commands, web fetching, Google Search grounding, and
    Model Context Protocol tools for interactive or scripted developer work.
  best_for:
    - Developers who want a Gemini-powered coding agent in a terminal workflow
    - Teams automating code, GitHub, or operational tasks through scripts and MCP tools

key_features:
  - Queries, edits, and helps debug codebases from a terminal session
  - Uses built-in file, shell, web-fetching, and Google Search grounding tools
  - Extends its tool surface through Model Context Protocol servers
  - Supports non-interactive prompts with JSON or streaming JSON output for scripts
  - Saves and resumes complex conversations with checkpointing
  - Provides project-specific context through GEMINI.md files

usage:
  interfaces:
    - CLI
    - non-interactive scripting mode
    - GitHub Action
  installation:
    - npx
    - npm package
    - Homebrew
    - MacPorts
    - Docker or Podman sandbox
  setup: low

technology:
  languages:
    - TypeScript
  notable_components:
