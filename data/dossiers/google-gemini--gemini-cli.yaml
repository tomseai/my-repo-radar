strengths:
  - Combines a terminal-first coding agent with a broad built-in tool set
  - Supports both interactive sessions and structured output for automation
  - MCP support lets teams add tools without forking the CLI

caveats:
  - The project targets Code Assist Standard or Enterprise and Code Assist for
    GitHub; free individual access and Google AI plans moved to Antigravity CLI
  - Model access requires an internet connection and supported authentication;
    the README also describes legacy paid API and Vertex keys
  - The project says this harness is not tuned for Gemini 4 or later
  - Tool execution can alter files or run commands, so approval and sandbox
    settings need review for each workspace
  - The release feed also contains newer preview and nightly builds; v0.70.0 is
    the newest stable release retained in the feed

