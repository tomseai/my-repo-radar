  latest_release_at: 2026-11-12
strengths:
  - Runs locally with provider choice and ownership of the runtime configuration
  - Combines channels, tool use, scheduled procedures, and a control-plane UI in one
    project
  - Documents explicit approvals and layered protections for agent actions
caveats:
  - Setup requires a model provider, credentials where applicable, and an agent risk
    profile
  - Broad channel and tool access increases the need to review autonomy, sandbox, and
    command-policy settings
  - Optional functionality and source builds use feature flags, so the installed
    surface can differ by setup
