status:
  lifecycle: active
  archived: false
  latest_release: v0.8.3
  latest_release_at: 2026-07-16

strengths:
  - Runs locally with provider choice and ownership of the runtime configuration
  - Combines channels, tool use, scheduled procedures, and a control-plane UI in one project
  - Documents explicit approvals and layered protections for agent actions

caveats:
  - It requires configuring a model provider and credentials before the agent can be useful
  - Broad channel and tool access increases the need to review autonomy, sandbox, and command-policy settings
  - Optional functionality and source builds use feature flags, so the installed surface can differ by setup

