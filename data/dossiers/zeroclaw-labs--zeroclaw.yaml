project:
  name: ZeroClaw
  kind: application
  summary: A self-hosted Rust agent runtime for operating a personal AI assistant
    through chat channels, a CLI, a gateway, and an optional web dashboard.
  best_for:
    - Running a configurable personal agent on your own machine and workspace
    - Connecting one agent to multiple messaging channels, tools, and model providers
key_features:
  - Pluggable LLM providers, including Anthropic, OpenAI, Ollama, and compatible
    endpoints
  - More than 30 configurable channel adapters, including CLI, email, webhooks, and
    chat platforms
  - Shell, browser, HTTP, hardware, and custom MCP-server tool integrations
  - HTTP and WebSocket gateway plus a dashboard for chat, memory, configuration, cron
    jobs, and tools
  - Event-triggered SOP workflows with approval gates and resumable runs
  - Supervised autonomy defaults with workspace controls, command policy, sandboxes,
    and tool receipts
usage:
  interfaces:
    - CLI
    - web dashboard
    - HTTP and WebSocket gateway
    - Agent Client Protocol server
  installation:
    - guided Unix installer or prebuilt Windows PowerShell setup
    - source build
    - Docker
  setup: moderate
technology:
  languages:
    - Rust
    - TypeScript
  notable_components:
    - Tauri
    - SQLite
    - Docker
