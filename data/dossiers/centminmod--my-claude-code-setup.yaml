project:
  name: My Claude Code Project's Starter Settings
  kind: starter-template
  summary: >-
    A Claude Code starter-configuration repository that combines CLAUDE.md
    memory templates, hooks, subagents, slash commands, MCP guidance, and
    Git-worktree recipes for customizable AI-assisted project workflows.
  best_for:
    - Adapting a documented Claude Code configuration instead of starting from
      an empty project setup
    - Running isolated parallel Claude Code or Codex sessions with Git worktrees

key_features:
  - Three CLAUDE.md templates with dual-memory and progressive-disclosure
    patterns
  - Migration guidance for existing CLAUDE.md configurations
  - Example hooks, slash commands, specialized subagents, and status-line
    configuration
  - MCP server and plugin-marketplace installation guidance
  - Bash, PowerShell, and batch Git-worktree launchers and setup notes

usage:
  interfaces:
    - Claude Code configuration files
    - Slash commands
    - Shell launchers
  installation:
    - Copy the repository's template files into the target project directory
    - Customize CLAUDE.md and the selected settings before running Claude Code
    - Run Claude Code's /init command to populate the documented memory-bank
      files
  setup: moderate

technology:
  languages:
    - Python
    - Shell
    - PowerShell
  notable_components:
    - Claude Code
    - Model Context Protocol
    - Git worktrees

