strengths:
  - Produces diagrams tied to real repository paths rather than folder-only views
  - Applies validation and sanitization around model output and rendered Mermaid
  - Can generate diagrams for private repositories without putting the token in public links
caveats:
  - Local use requires R2, Upstash, and credentials for one supported AI provider
  - Private-repository generation needs a fine-grained GitHub token with repository access
  - The Docker and Railway path is documented as disaster recovery, not the normal hosted runtime
  - The cached GitHub release feed has no entries, so no project release can be established
