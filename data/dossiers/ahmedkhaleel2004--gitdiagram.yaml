project:
  name: GitDiagram
  kind: application
  summary: >-
    A web application that turns public or authorized private GitHub
    repositories into validated, interactive system-level architecture diagrams
    and Mermaid exports.
  best_for:
    - Exploring an unfamiliar GitHub repository through a linked architecture
      view
    - Sharing a generated system diagram before reading a codebase in depth
key_features:
  - Builds a system-level graph from a repository tree and README
  - Links rendered components to their corresponding GitHub files or directories
  - Streams an architecture explanation and graph-generation progress
  - Validates model output, graph connectivity, paths, and Mermaid links before
    rendering
  - Exports Mermaid source or a rendered PNG
  - Supports authorized private-repository generation and offers a remote MCP
    server for public diagrams
usage:
  interfaces:
    - Web application
    - same-origin HTTP API
    - remote MCP server
  installation:
    - Hosted application
    - Bun local development build
    - Docker recovery deployment
  setup: high
technology:
  languages:
    - TypeScript
  notable_components:
    - Next.js
    - React
    - Mermaid
    - Cloudflare R2
    - Upstash Redis
license:
  spdx: MIT
