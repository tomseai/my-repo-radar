  notes: Permissive license that requires preserving the copyright and license notice.
status:
  lifecycle: active
  archived: false
  latest_release: null
  latest_release_at: null
strengths:
  - Produces diagrams tied to real repository paths rather than folder-only views
  - Applies validation and sanitization around model output and rendered Mermaid
  - Can generate diagrams for private repositories without putting the token in
    public links
caveats:
  - Creating narrated explainer videos is in early access
  - Local use requires R2, Upstash, and credentials for one supported AI provider
  - Private-repository generation requires GitHub authorization
  - The Docker and Railway path is documented as disaster recovery, not the
    normal hosted runtime
  - The cached GitHub release feed has no entries, so no project release can be
    established
