project:
  name: AI Directories
  kind: curated-list
  summary: >-
    A Markdown directory of third-party AI-product directories, intended to help
    AI product teams find places to discover tools or submit a listing.
  best_for:
    - Finding potential directories through which to publish or discover an AI
      product
    - Browsing an alphabetically organized reference list rather than a hosted
      submission service
key_features:
  - Alphabetical sections link to third-party AI-tool and AI-agent directories
  - Many entries include a short description and, where offered by the
    destination, a submission link
  - A featured-directory section and links to the maintainers' separate
    submission service
  - A contribution guide asks contributors to add missing directories in
    alphabetical order through pull requests
usage:
  interfaces:
    - Markdown directory
    - GitHub repository
  installation:
    - Browse README.md on GitHub
    - Follow the outbound directory and submission links
  setup: low
