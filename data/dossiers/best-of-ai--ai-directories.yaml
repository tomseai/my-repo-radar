  latest_release_at: null
strengths:
  - Keeps a narrowly focused index of AI-directory destinations in a single,
    easily browsed document
  - Provides direct links and concise labels that make initial discovery and
    submission research quick
  - Documents a lightweight process for community additions
caveats:
  - The repository is a link collection, not an AI directory or submission
    platform itself
  - Linked services are independently operated; their pricing, editorial
    policies, availability, and listing quality are not verified here
  - The README promotes a separate paid done-for-you submission service and
    includes sponsor links
  - The cached releases feed has no entries, so no latest versioned release can
    be established
