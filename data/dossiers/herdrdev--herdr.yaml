project:
  name: herdr
  kind: cli
  summary: A Rust terminal workspace and runtime for coding agents that preserves real
    processes, displays agent state, and exposes CLI and socket controls for
    coordination.
  best_for:
    - Developers supervising multiple coding-agent sessions in terminal workspaces
    - Users who need persistent agent terminals that can be reattached locally or
      over SSH
key_features:
  - Keeps terminals and agents running in a background server across client
    disconnects
  - Marks recognized agents as working, blocked, or idle
  - Supports workspaces, tabs, splits, keyboard and mouse control, and plugins
  - Lets agents create panes, prompt each other, and wait through CLI and socket APIs
  - Combines local terminals and saved SSH machines in one agent list with
    independent reconnects
usage:
  interfaces:
    - terminal user interface
    - command-line interface
    - socket API
  installation:
    - shell or PowerShell installer
    - Homebrew, mise, or release binary
