strengths:
  - Preserves actual terminal processes instead of wrapping agent implementations
  - Supports both human supervision and agent-to-agent terminal coordination
caveats:
  - Disconnects preserve live terminals, whereas a server or machine restart restores
    layout and can resume supported sessions
  - The retained release feed contains preview builds; v0.9.5 is the newest stable
    release
