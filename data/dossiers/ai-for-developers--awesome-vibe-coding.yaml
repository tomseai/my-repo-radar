  name: Awesome Vibe Coding
  kind: curated-list
  summary: >-
    A hand-picked directory of tools and references for AI-assisted software
    development through prompting, iteration, and exploration, spanning
    builders, IDEs, agents, plugins, command-line tools, and reading.
  best_for:
    - Comparing categories of AI-assisted development tools before choosing one
    - Finding articles, task-management tools, and documentation for prompt-driven development workflows
key_features:
  - Separate sections for web builders, IDEs, mobile tools, extensions, local apps, and command-line tools
  - Listings for agentic task management, monitoring and cost tracking, project documentation, and articles
  - Direct official-site or repository links with concise descriptions for each resource
  - Contribution rules that require relevance to AI-assisted coding, focused pull requests, and factual one-sentence entries
  - Optional awesome-lint checks for list formatting
