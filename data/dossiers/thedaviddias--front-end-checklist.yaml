    notice in copies or substantial portions.

status:
  lifecycle: active
  archived: false
  latest_release: v2.0
  latest_release_at: 2026-05-30

strengths:
  - Makes a broad set of front-end quality concerns discoverable through one
    rule corpus
  - Offers equivalent human-facing and agent-facing paths instead of requiring a
    particular editor or framework

caveats:
  - The rules provide review guidance, not an automatic guarantee that an
    implementation is compliant or correct
  - Running the workspace locally requires pnpm and the documented Node.js
    version range

