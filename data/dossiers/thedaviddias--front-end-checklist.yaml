project:
  name: Front-End Checklist
  kind: monorepo
  summary: >-
    A front-end quality system containing 386 prioritized rules across eleven
    categories, delivered as a browsable website, a README checklist, reusable
    skills, and hosted or local MCP tooling for review and audit workflows.
  best_for:
    - Teams reviewing web applications for accessibility, performance, security,
      and SEO concerns
    - MCP-capable agents that need a structured front-end rule corpus and
      remediation guidance

key_features:
  - 386 English rules organized into eleven active front-end quality categories
  - Priority labels for critical, high, medium, and low-impact findings
  - Hosted MCP server with tools to review code, audit public URLs, search
    rules, and retrieve workflows
  - Local stdio MCP server for editor and agent integrations
  - Rule pages with explanations, remediation guidance, verification steps, and
    AI prompts
  - Reusable global and focused skills for supported agent tools

usage:
  interfaces:
    - web site
    - Markdown checklist
    - hosted MCP server
    - local stdio MCP server
  installation:
    - hosted website or MCP endpoint
    - skills installer
    - pnpm workspace for local development
  setup: low

technology:
  languages:
    - TypeScript
    - MDX
  notable_components:
    - Model Context Protocol
    - Turbo
    - pnpm workspaces

