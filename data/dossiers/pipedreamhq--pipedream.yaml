project:
  name: pipedream
  kind: service
  summary: >-
    A hosted developer integration platform for building event-driven workflows
    with pre-built app components and custom Node.js, Python, Go, or Bash code;
    this repository contains the components, documentation, roadmap, and related source.
  best_for:
    - Automating a workflow in response to HTTP, schedule, or connected-application events
    - Combining reusable API-integration steps with custom code for application-specific logic

key_features:
  - Event-triggered workflows composed from pre-built actions or custom code steps
  - Event sources that emit data from connected third-party services and can trigger workflows
  - Reusable actions for API integrations, including community-publishable custom actions
  - Asynchronous destinations for Amazon S3, Snowflake, HTTP, email, and SSE
  - REST API and private real-time SSE access for consuming source events

usage:
  interfaces:
    - Hosted web platform
    - Workflow and component code
    - REST API
    - Server-sent events stream
  installation:
    - Create and run workflows on the hosted Pipedream platform
    - Clone the repository to inspect or contribute integration components
  setup: moderate

technology:
  languages:
    - JavaScript
    - TypeScript
    - Python
    - Go
    - Bash
  notable_components:
    - Node.js
    - pnpm monorepo
    - Integration components

