project:
  name: Archon
  kind: application
  summary: >-
    A workflow engine for defining and executing repeatable AI coding processes
    as YAML, with deterministic steps around agent work.
  best_for:
    - Teams that want reviewable, repository-local workflows for AI coding tasks
    - Developers who need planning, validation, review, and pull-request steps to be repeatable
key_features:
  - Defines planning, implementation, validation, review, and pull-request processes as YAML workflows with validation gates and artifacts
  - Isolates each workflow run in its own Git worktree, allowing parallel fixes without conflicts
  - Includes a web dashboard for chats, workflow execution, history, monitoring, and a drag-and-drop workflow builder
  - Ships 19 default workflows that can be copied, overridden in a repository, and committed with the project
usage:
  interfaces:
    - Command-line interface
    - Web dashboard
    - Slack integration
    - Telegram integration
    - GitHub integration
  installation:
    - Guided source setup with Bun
    - curl -fsSL https://archon.diy/install | bash
    - brew install coleam00/archon/archon
  setup: high
technology:
  languages:
    - TypeScript
  notable_components:
