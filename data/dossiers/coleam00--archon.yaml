strengths:
  - Keeps process structure in portable YAML while reserving model judgment
    for individual workflow steps
  - Makes workflows project-local and versionable, with repository files
    overriding bundled defaults
  - Provides both a direct CLI path and a dashboard for launching and
    observing work
caveats:
  - Agent runtimes have to be installed and authenticated separately. Source
    and deployment prerequisites depend on the selected distribution
  - The project documents anonymous telemetry by default, including aggregated
    workflow, provider, and usage details, with an opt-out configuration
  - Release tags currently identify the CLI distribution. The bundled
    workflows do not bind event or schedule triggers by default
