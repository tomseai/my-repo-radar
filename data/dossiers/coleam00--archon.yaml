project:
  name: Archon
  kind: application
  summary: A self-hosted workflow engine for running YAML-defined processes with
    AI agents, scripts, and approval gates. Its bundled software-development
    pack coordinates work from issue intake to merged pull request.
  best_for:
    - Teams that want reviewable, repository-local workflows for AI coding
      tasks
    - Developers who need planning, validation, review, and pull-request steps
      to be repeatable
key_features:
  - Defines planning, implementation, validation, review, and pull-request
    processes as YAML workflows with validation gates and artifacts
  - Isolates each workflow run in its own Git worktree, allowing parallel
    fixes without conflicts
  - Provides a web interface to run and monitor workflows and handle approval
    requests
  - Queues runs and pauses for approval, keeping transcripts, events, and cost
    records in SQLite or PostgreSQL
usage:
  interfaces:
    - Command-line interface
    - Web dashboard
    - Slack integration
    - Telegram integration
    - GitHub integration
  installation:
    - Guided source setup with Bun
    - curl -fsSL https://archon.diy/install | bash
    - brew install coleam00/archon/archon
  setup: high
technology:
  languages:
