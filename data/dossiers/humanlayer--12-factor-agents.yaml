project:
  name: 12-Factor Agents
  kind: documentation
  summary: >-
    A public principles guide for building production-oriented LLM applications
    from modular software and focused agent techniques, with twelve factors
    covering prompts, context, tools, state, control flow, and deployment.
  best_for:
    - Product and engineering teams designing customer-facing LLM features
    - Developers seeking framework-independent guidance before choosing an agent architecture

key_features:
  - Twelve linked factors spanning natural-language tool calls through stateless reducers
  - Guidance for owning prompts and the context window
  - Recommendations for structured tool outputs and human contact through tools
  - Design patterns for execution state, pause and resume APIs, and control flow
  - A small-focused-agent principle and trigger-anywhere guidance
  - Supporting workshops and a create-12-factor-agent template package

usage:
  interfaces:
    - Markdown guide
    - linked reference material
    - workshop examples
    - starter template
  installation:
    - read the repository guide
    - clone source for workshops and template material
  setup: low

