strengths:
  - Brings agent sessions and worktree isolation into one desktop workflow
    rather than leaving coordination to terminal tabs.
  - Supports three named coding-agent backends while retaining visual Git and
    code-inspection tools.
  - Ships installers for the three major desktop platforms and a Homebrew option
    for macOS.
caveats:
  - Git 2.20 or later is required for worktree support.
  - The optional embedded Ghostty terminal requires a separately built native
    library; Hive otherwise builds and runs without that feature.
  - Some retained FAQ content describes an earlier macOS-only state, while the
    pinned README documents macOS, Windows, and Linux installers; the overview
    follows the newer README.
