project:
  name: Hive
  kind: application
  summary: Desktop orchestration for parallel Claude Code, OpenCode, and Codex
    coding sessions in isolated Git worktrees.
  best_for:
    - Developers coordinating several AI coding tasks across branches or
      repositories.
    - Git-worktree users who prefer visual Git, files, diffs, and agent-session
      management.
key_features:
  - Starts supported coding-agent sessions in a worktree and streams their
    responses and tool calls.
  - Creates, organizes, archives, and switches among isolated Git worktrees from
    the desktop UI.
  - Provides visual Git operations, inline diffs, file history, and a
    Monaco-based file explorer.
  - Links worktrees so sessions can reference related code and developers can
    compare implementations.
  - Organizes projects and worktrees into Spaces, with a command palette and
    keyboard shortcuts.
usage:
  interfaces:
    - Desktop application for macOS, Windows, and Linux.
    - Graphical Git, file, diff, worktree, and AI-session interface.
  installation:
    - Homebrew cask on macOS.
    - "GitHub Release installer or package: DMG for macOS, EXE for Windows,
      AppImage or DEB for Linux."
  setup: low
technology:
  languages:
    - TypeScript
  notable_components:
    - Electron desktop shell
    - Node.js and Effect local backend
    - SQLite storage
    - Monaco editor
    - WebSocket and HTTP/RPC local event plumbing
