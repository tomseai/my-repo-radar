project:
  name: T3 Code
  kind: application
  summary: A desktop, web, and mobile interface for running coding agents on the
    user’s computer and following the same threads across clients.
  best_for:
    - Developers who already use a supported coding-agent CLI and want one GUI
    - Trying several supported coding-agent providers without changing
      interfaces
key_features:
  - Runs Claude Code, Codex, Cursor, OpenCode, and other installed providers,
    including agents supporting ACP
  - Browser launch without a global install through npx t3@latest
  - Desktop distribution through GitHub Releases, winget, Homebrew Cask, and
    the Arch AUR
  - Separate web and Electron desktop applications in the TypeScript monorepo
  - Synchronizes threads across desktop, web, iOS, and Android clients
usage:
  interfaces:
    - web GUI
    - desktop application
    - CLI launcher
    - iOS and Android companion apps
  installation:
    - npx t3@latest
    - Desktop release download
    - winget, Homebrew Cask, or Arch AUR package
    - Source checkout with Vite+ and pnpm
  setup: moderate
technology:
  languages:
    - TypeScript
  notable_components:
    - React
    - Electron
    - Vite+
    - Effect
