project:
  name: T3 Code
  kind: application
  summary: >-
    An early web and desktop graphical interface for launching and working with
    Codex, Claude, Cursor, and OpenCode coding-agent providers from one product.
  best_for:
    - Developers who already use a supported coding-agent CLI and want one GUI
    - Trying several supported coding-agent providers without changing interfaces
key_features:
  - A minimal web GUI for Codex, Claude, Cursor, and OpenCode
  - Browser launch without a global install through npx t3@latest
  - Desktop distribution through GitHub Releases, winget, Homebrew Cask, and the Arch AUR
  - Separate web and Electron desktop applications in the TypeScript monorepo
usage:
  interfaces:
    - web GUI
    - desktop application
    - CLI launcher
  installation:
    - npx t3@latest
    - Desktop release download
    - winget, Homebrew Cask, or Arch AUR package
    - Source checkout with Vite+ and pnpm
  setup: moderate
