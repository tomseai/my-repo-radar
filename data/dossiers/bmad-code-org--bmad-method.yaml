project:
  name: BMad Method
  kind: framework
  summary: >-
    An AI-assisted software-development framework that installs specialized
    agent skills and guided workflows for taking a project from analysis and
    planning through architecture, implementation, and deployment.
  best_for:
    - Teams wanting a structured, scale-adaptive workflow for AI-assisted development
    - Developers using a compatible AI-powered IDE for planning and implementation work

key_features:
  - Four-phase workflow spanning analysis, planning, solutioning, and implementation
  - Planning tracks for quick fixes, product work, and enterprise-oriented projects
  - Specialized agent skills plus bmad-help for context-aware workflow guidance
  - Party Mode for multi-persona collaboration in one AI session
  - Modular installer with official domain-specific extensions

usage:
  interfaces:
    - CLI
    - AI IDE skills
  installation:
    - npm package via npx
    - source checkout
  setup: moderate

