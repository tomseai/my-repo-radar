strengths:
  - Connects planning artifacts and implementation steps in one explicit process
  - Offers guided entry points instead of requiring users to memorize every workflow
  - Supports both interactive and headless installation paths
caveats:
  - Stable v6.12 requires Node.js 20.12+, Python 3.10+, and a compatible AI coding
    tool
  - Workflow quality still depends on human review of generated outputs and tool
    permissions
  - The default branch is the v7 preview alpha; its module installation, skills, and
    documentation are changing while v6.12 receives bug fixes
