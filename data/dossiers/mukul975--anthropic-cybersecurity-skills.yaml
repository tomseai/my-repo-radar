project:
  name: Anthropic Cybersecurity Skills
  kind: library
  summary: >-
    An independent, agentskills.io-format library of cybersecurity workflows
    for AI agents, spanning defensive, investigative, governance, and
    authorized offensive-security work.
  best_for:
    - Security teams adding structured workflows to compatible AI agents
    - Authorized security testing, investigation, defense, and education
key_features:
  - Provides 817 structured skills across 29 security domains
  - Maps skills to MITRE ATT&CK, NIST CSF, MITRE ATLAS, D3FEND, NIST AI RMF, and MITRE F3
  - Uses YAML discovery metadata, step-by-step Markdown workflows, references, helpers, and templates
  - Supplies a documented npx installation path alongside repository cloning
  - Validates SKILL.md frontmatter and duplicate skill names in its CI workflow
usage:
  interfaces:
    - agent skill library
    - Markdown workflows
    - helper scripts
  installation:
    - npx skills add mukul975/Anthropic-Cybersecurity-Skills
    - Git clone
  setup: low
technology:
  languages:
    - Python
    - Markdown
  notable_components:
    - Agent Skills format
    - MITRE ATT&CK Navigator layer
    - GitHub Actions validation
