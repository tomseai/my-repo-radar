project:
  name: Whisper
  kind: model
  summary: >-
    A general-purpose Transformer speech-recognition model with Python and CLI
    tooling for multilingual transcription, translation into English, and
    language identification.
  best_for:
    - Applications or scripts that need local multilingual speech transcription
    - Audio-processing workflows that need either a command line or Python API

key_features:
  - Multilingual speech recognition, translation, and spoken-language
    identification
  - Six model sizes with documented speed, memory, and language-coverage
    tradeoffs
  - A Python API for loading models, transcribing audio, decoding, and language
    detection
  - A CLI for transcription, language selection, and translation tasks
  - A multitask token format that combines several speech-processing tasks in
    one model

usage:
  interfaces:
    - CLI
    - Python API
  installation:
    - PyPI package
    - Git-based pip install
  setup: moderate

