  languages:
    - Python
  notable_components:
    - PyTorch
    - tiktoken
    - FFmpeg

license:
  spdx: MIT
  name: MIT License
  notes: The README states that both Whisper code and model weights are released
    under MIT.

status:
  lifecycle: unknown
  archived: false
  latest_release: v20250625
  latest_release_at: 2025-06-26

strengths:
  - One model supports recognition, translation, and language identification
  - Supports both quick CLI use and lower-level Python integration
  - Documents model-size, memory, and speed tradeoffs for deployment choices

caveats:
  - The turbo model is not trained for translation; use a multilingual model for
    translation tasks
  - Inference speed and accuracy vary with language, speech, and available
    hardware
  - FFmpeg is required, and some platforms may also need Rust to build tiktoken
  - The retained sources do not declare an upstream lifecycle, despite the
    versioned release feed

