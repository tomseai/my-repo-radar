strengths:
  - Keeps agentic coding work in a terminal while using GitHub context
  - Exposes extension points through built-in GitHub MCP and custom MCP servers
  - Offers multiple install paths across Linux, macOS, and Windows
caveats:
  - An active Copilot subscription is required, and organization or enterprise policy can disable CLI access
  - The bundled software license is not an open-source license and forbids modification
  - Language servers are not bundled and must be installed and configured separately
  - Access to connected services can require separate entitlements and is subject to the relevant provider terms
