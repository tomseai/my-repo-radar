project:
  name: GitHub Copilot CLI
  kind: cli
  summary: >-
    A terminal-native GitHub Copilot coding agent that uses natural-language
    conversations to build, edit, debug, refactor, and understand local code
    with GitHub repository, issue, and pull-request context.
  best_for:
    - Developers who want a synchronous Copilot agent in the terminal
    - GitHub workflows that benefit from repository, issue, and pull-request context
key_features:
  - Builds, edits, debugs, and refactors code through natural-language prompts
  - Authenticated access to GitHub repositories, issues, and pull requests
  - Previews every action for explicit approval before execution
  - GitHub MCP server included by default and support for custom MCP servers
  - Optional Language Server Protocol support for definitions, hover information, and diagnostics
  - Experimental Autopilot mode that encourages continued work until task completion
usage:
  interfaces:
    - interactive terminal CLI
    - command-line installation script
  installation:
    - official install script
    - Homebrew
    - WinGet
    - npm package
  setup: moderate
