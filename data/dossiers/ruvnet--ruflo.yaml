project:
  name: Ruflo
  kind: framework
  summary: >-
    An agent meta-harness for Claude Code and Codex that layers specialized
    agents, swarm coordination, persistent memory, MCP tools, hooks, and
    optional federation around coding-agent workflows.
  best_for:
    - Teams extending Claude Code or Codex with coordinated multi-agent workflows
    - Developers who need an MCP-accessible orchestration and memory layer
key_features:
  - Specialized agents for coding, testing, security, and
    documentation
  - Swarm coordination with hierarchical, mesh, and adaptive topologies
  - Persistent HNSW-indexed AgentDB vector memory and self-learning components
  - CLI, MCP server, hooks, daemon, and Claude Code plugin installation paths
  - Multiple model providers including Claude, GPT, Gemini, Cohere, and Ollama
  - Optional cross-installation agent federation with identity and PII controls
usage:
  interfaces:
    - CLI
    - MCP server
    - Claude Code plugins
    - web UI (beta)
  installation:
    - npx initializer
    - npm global package
    - Claude Code plugin marketplace
    - Docker for selected web components
  setup: moderate
technology:
  languages:
    - TypeScript
    - Rust
  notable_components:
    - Model Context Protocol
    - AgentDB
    - HNSW vector search
    - Docker
license:
