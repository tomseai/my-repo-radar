status:
  lifecycle: active
  archived: false
  latest_release: v3.80.0
  latest_release_at: 2026-11-21
strengths:
  - Broad integration surface, from lightweight Claude Code plugins to a full
    CLI and MCP installation
  - Combines agent roles, coordination, memory, and model routing in one project
  - Supports both local workflows and self-hostable web components
caveats:
  - Plugin capabilities vary; ruflo-core registers an MCP server, while most
    plugins do not supply the full CLI hooks and daemon
  - The included web UI is explicitly labeled beta
  - The repository packages several products and plugins, so capabilities and
    setup vary by installation path
  - Federation and multi-provider features introduce credentials and operational
    configuration beyond a basic CLI install
