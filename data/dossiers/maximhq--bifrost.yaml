project:
  name: Bifrost
  kind: service
  summary: >-
    A high-performance AI gateway that exposes a single OpenAI-compatible API
    across many model providers, with routing, fallback, load balancing,
    caching, governance, and observability features.
  best_for:
    - Backend teams centralizing access to multiple AI providers behind a
      compatible API
    - Production AI services that need routing reliability, usage governance,
      and request observability
key_features:
  - Unifies more than 23 providers through an OpenAI-compatible HTTP API
  - Provides automatic fallback and load balancing across providers, models, and
    API keys
  - Adds semantic caching, multimodal and streaming support, plus a plugin
    architecture
  - Supports MCP tool use, configurable governance, rate limiting, budgets, and
    access control
  - Includes a web UI, API-driven or file-based configuration, and Prometheus
    metrics, tracing, and logging
usage:
  interfaces:
    - OpenAI-compatible HTTP API
    - web UI
    - Go SDK
    - command-line launcher
  installation:
    - npx @maximhq/bifrost
    - Docker image
    - Go module
  setup: moderate
technology:
  languages:
    - Go
    - TypeScript
  notable_components:
