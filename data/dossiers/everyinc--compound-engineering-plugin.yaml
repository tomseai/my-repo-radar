project:
  name: Compound Engineering
  kind: plugin
  summary: A cross-harness plugin of coding-agent skills that structures engineering
    work around requirements, implementation planning, execution, review, and
    reusable solution notes.
  best_for:
    - Teams that want repeatable, agent-assisted feature and bug-fix workflows
    - Coding-agent users who want repository learnings to inform later work
key_features:
  - A workflow that moves from brainstorming and planning through implementation,
    review, and recording lessons
  - Interactive requirements and implementation-plan skills
  - Worktree-based implementation and task tracking
  - Report-only multi-agent code review with explicit local application
  - Git commit, pull-request, CI-follow-up, and browser-test skills
  - Solution-note capture and refresh for reusable engineering knowledge
usage:
  interfaces:
    - coding-agent plugin
    - slash commands
  installation:
