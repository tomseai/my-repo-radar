strengths:
  - Covers the full change lifecycle rather than only implementation prompts
  - Supports native plugin or skill installation across several coding-agent hosts
  - Treats documented lessons as inputs to future planning work

caveats:
  - It adds a prescriptive workflow and is likely excessive for trivial changes
  - Available skills and permission behavior vary by host coding agent
  - Some autonomous workflows can create commits, pull requests, and CI follow-up work
  - Existing marketplace installs may require a marketplace refresh before updating

