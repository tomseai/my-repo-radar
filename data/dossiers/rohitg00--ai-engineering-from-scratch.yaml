project:
  name: AI Engineering from Scratch
  kind: course
  summary: >-
    A self-paced, from-scratch AI-engineering curriculum spanning mathematics,
    machine learning, LLMs, agents, production systems, safety, and capstones.
  best_for:
    - Developers seeking a structured, implementation-first route into AI
      engineering
    - Engineers who want focused LLM, agent, MCP, or production-system learning
      tracks
key_features:
  - 542 lessons across 20 phases from tool setup and mathematical foundations to
    production systems
  - Goal-oriented learning paths for AI foundations, LLM systems, and
    agent-assisted engineering
  - Runnable labs and staged projects with reference solutions and evaluation
    checks
  - Coverage of vision, speech, transformers, retrieval, reinforcement learning,
    agents, and tool protocols
  - Hosted lesson site, localized lessons, and an optional agent tutor delivered
    through skills
usage:
  interfaces:
    - Markdown lessons
    - hosted course website
    - agent skills
    - local project and lab scripts
  installation:
    - Read the hosted lessons
    - Clone the repository and run individual project or lesson code
    - Install the optional skills package for agent-assisted tutoring
  setup: moderate
technology:
  languages:
    - Python
    - TypeScript
    - Rust
    - Julia
    - Go
  notable_components:
    - PyTorch and Hugging Face Transformers
    - Jupyter and scientific Python packages
    - Model Context Protocol (MCP)
    - SKILL.md and AGENTS.md-compatible agent workflows
