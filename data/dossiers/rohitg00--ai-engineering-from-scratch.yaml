project:
  name: AI Engineering from Scratch
  kind: course
  summary: >-
    A self-paced, from-scratch AI-engineering curriculum spanning mathematics,
    machine learning, LLMs, agents, production systems, safety, and capstones.
  best_for:
    - Developers seeking a structured, implementation-first route into AI engineering
    - Engineers who want focused LLM, agent, MCP, or production-system learning tracks
key_features:
  - 503 lessons across 20 phases, progressing from setup and mathematics to capstone projects
  - "A repeatable lesson structure: concept, raw implementation, production-library use, and a reusable output"
  - Coverage of vision, NLP, speech, transformers, generative AI, reinforcement learning, LLM engineering, and safety
  - Dedicated phases for tools and protocols, agent engineering, autonomous systems, multi-agent systems, and production
  - Seventeen end-to-end capstone projects plus additional deep-build tracks, including coding agents, RAG, MCP, and evaluation
  - Reusable prompts, skills, agents, and MCP-server outputs, with installers and a repository workbench scaffold
usage:
  interfaces:
    - GitHub Markdown lessons
    - Hosted course website
    - Agent skills and slash commands
    - Python command-line scripts
  installation:
    - Read the hosted lessons without installation
    - Clone the repository and run an individual lesson's code
    - Install all or selected skills with npx skills add
    - Use the included Python skill installer for offline or custom layouts
  setup: moderate
technology:
  languages:
    - Python
    - TypeScript
    - Rust
    - Julia
  notable_components:
    - PyTorch and Hugging Face Transformers
    - Jupyter and scientific Python packages
    - Model Context Protocol (MCP)
    - SKILL.md and AGENTS.md-compatible agent workflows
