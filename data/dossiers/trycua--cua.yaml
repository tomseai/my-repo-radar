project:
  name: Cua
  kind: monorepo
  summary: >-
    A computer-use monorepo for building and evaluating agents through
    cross-platform desktop drivers, OS sandboxes, virtual-machine tooling,
    and benchmarks or reinforcement-learning environments.
  best_for:
    - Building agents that operate desktop, mobile, container, or VM interfaces
    - Evaluating or training computer-use agents in reproducible environments
key_features:
  - Drives native desktop applications in the background on macOS, Windows, and Linux
  - Provides one sandbox API for Linux, macOS, Windows, Android, and local or cloud runtimes
  - Supplies Cua-Bench environments and trajectory export for evaluation and training
  - Includes Lume virtualization for macOS and Linux VMs on Apple Silicon
  - Exposes driver access through a CLI and MCP server for agent clients
  - Supports shell, screenshot, mouse, keyboard, and mobile-gesture actions
usage:
  interfaces:
    - Python API
    - CLI
    - MCP server
    - Docker and VM runtimes
  installation:
    - Python package via pip
    - platform-specific driver installer
    - build from source with uv
  setup: moderate
technology:
  languages:
    - Python
    - Rust
    - Go
    - TypeScript
  notable_components:
    - Model Context Protocol
    - Docker
    - QEMU
    - Apple Virtualization.Framework
license:
