project:
  name: Cua
  kind: monorepo
  summary: A computer-use monorepo for building and evaluating agents through Cua
    Spaces for shared desktops, cross-platform desktop drivers, virtual
    machines, and benchmarks for computer-use agents.
  best_for:
    - Building agents that operate desktop, mobile, container, or VM interfaces
    - Evaluating or training computer-use agents in reproducible environments
key_features:
  - Provides Cua Spaces for shared desktop environments across owned computers
  - Drives native desktop applications in the background on macOS, Windows, and
    Linux
  - Provides one sandbox API for Linux, macOS, Windows, Android, and local or
    cloud runtimes
  - Supplies Cua-Bench environments and trajectory export for evaluation and
    training
  - Includes Lume virtualization for macOS and Linux VMs on Apple Silicon
  - Exposes driver access through a CLI and MCP server for agent clients
  - Supports shell, screenshot, mouse, keyboard, and mobile-gesture actions
usage:
  interfaces:
    - Python API
    - CLI
    - MCP server
    - Docker and VM runtimes
  installation:
    - Python package via pip
    - platform-specific driver installer
    - build from source with uv
  setup: moderate
technology:
  languages:
    - Python
    - Rust
    - Go
    - TypeScript
  notable_components:
    - Model Context Protocol
    - Docker
    - QEMU
    - Apple Virtualization.Framework
license:
  spdx: null
  name: Mixed MIT and FSL-1.1-MIT
  notes: Cua Spaces and Cua Driver Bench use FSL-1.1-MIT, which restricts
    competing hosted services and converts to MIT after two years. Other
    repository components are MIT unless otherwise noted; third-party licenses
    also apply.
status:
  lifecycle: active
  archived: false
  latest_release: cua-spaces-v0.41.3
  latest_release_at: 2026-11-22
strengths:
  - Covers drivers, environments, virtualization, and benchmarks in one
    repository
  - Supports multiple operating systems through a consistent sandbox API
  - Offers both agent-building and evaluation or training workflows
caveats:
  - Host capabilities and installation paths differ substantially by operating
    system and runtime
  - The monorepo publishes independent component releases; the listed release is
    for Cua Spaces, the product currently foregrounded in the README
  - Optional dependencies and bundled third-party components carry licenses
    beyond the repository MIT license
