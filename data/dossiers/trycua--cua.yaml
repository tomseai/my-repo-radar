strengths:
  - Covers drivers, environments, virtualization, and benchmarks in one repository
  - Supports multiple operating systems through a consistent sandbox API
  - Offers both agent-building and evaluation or training workflows
caveats:
  - Host capabilities and installation paths differ substantially by operating system and runtime
  - "The repository is a monorepo: its retained feed has component releases, not an identifiable stable Cua-wide release; newest observed is cua-driver-rs v0.9.0 on 2026-07-19"
  - Optional dependencies and bundled third-party components carry licenses beyond the repository MIT license
