project:
  name: hashbrown
  kind: framework
  summary: >-
    A TypeScript framework of core, React, Angular, and provider packages for
    adding streaming LLM features, structured results, tool calls, generated
    UI, and code execution to web applications.
  best_for:
    - React or Angular teams building interactive, LLM-powered web interfaces
    - Applications that need consistent provider wrappers between a Node backend and UI state
key_features:
  - Core state primitives with framework bindings for React and Angular
  - Provider packages for OpenAI, Azure OpenAI, Anthropic, Bedrock, Ollama, and Google
  - HTTP streaming between Node backend wrappers and UI hooks or resources
  - Uses Skillet schemas to validate structured completions and props for registered UI components
  - Tool calling plus code generation and execution support
  - Includes examples for using the same rendering and tool patterns in Angular and React
usage:
  interfaces:
    - React components
    - Angular components
    - Node backend SDK wrappers
  installation:
    - npm packages
    - build from source
  setup: moderate
