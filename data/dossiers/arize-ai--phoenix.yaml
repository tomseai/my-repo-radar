project:
  name: Phoenix
  kind: application
  summary: An AI observability and evaluation platform for tracing LLM
    applications, testing prompts, managing experiment datasets, and
    troubleshooting model behavior.
  best_for:
    - Teams operating LLM applications that need trace inspection and evaluation
      workflows
    - Developers who want local, containerized, or cloud deployment choices
key_features:
  - Captures LLM application runtime traces through OpenTelemetry-based
    instrumentation
  - Supports response and retrieval evaluations, versioned datasets, and
    experiments
  - Provides a playground and prompt management for comparing models and prompt
    changes
  - Includes Python and TypeScript client, evaluation, and OpenTelemetry
    subpackages
  - Exposes a remote MCP endpoint for querying traces, datasets, and experiments
usage:
  interfaces:
    - web UI
    - Python CLI
    - Python packages
    - TypeScript packages
    - REST API
    - MCP server
  installation:
    - pip, conda, or uvx
    - Docker or Docker Compose
    - Kubernetes or Helm deployment
  setup: moderate
technology:
  languages:
    - Python
    - TypeScript
  notable_components:
    - OpenTelemetry and OpenInference instrumentation
    - Docker
    - Kubernetes and Helm deployment support
