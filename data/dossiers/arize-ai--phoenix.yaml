project:
  name: Phoenix
  kind: application
  summary: >-
    An AI observability and evaluation platform for tracing, experimenting with,
    and troubleshooting LLM applications.
  best_for:
    - Teams operating LLM applications that need trace inspection and evaluation workflows
    - Developers who want local, containerized, or cloud deployment choices
key_features:
  - Captures LLM application runtime traces through OpenTelemetry-based instrumentation
  - Supports response and retrieval evaluations, versioned datasets, and experiments
  - Provides a playground and prompt management for comparing models and prompt changes
  - Includes Python and TypeScript client, evaluation, and OpenTelemetry subpackages
usage:
  interfaces:
    - web UI
    - Python CLI
    - Python packages
    - TypeScript packages
    - REST API
  installation:
    - pip or conda package installation
    - Docker or Docker Compose deployment
    - Kubernetes or Helm deployment
    - hosted Phoenix instance
  setup: moderate
technology:
  languages:
    - Python
    - TypeScript
  notable_components:
    - OpenTelemetry and OpenInference instrumentation
    - Docker
    - Kubernetes and Helm deployment support
license:
  spdx: Elastic-2.0
  name: Elastic License 2.0
  notes: >-
    ELv2 permits use, copying, distribution, and derivative works subject to its
    terms, but prohibits offering substantial functionality as a hosted or managed service.
status:
  lifecycle: active
  archived: false
  latest_release: arize-phoenix v19.2.0
