project:
  name: Spec Kit
  kind: cli
  summary: >-
    A Python CLI and template toolkit that initializes a repeatable
    spec-driven-development workflow for AI coding agents, taking projects from
    governing principles and specifications through planning, tasks,
    implementation, and review.
  best_for:
    - Teams that want agent-assisted development to start with explicit
      requirements and plans
    - Projects that need reusable workflow templates across supported
      coding-agent integrations

key_features:
  - Specify CLI initializes project-local templates, workflows, and coding-agent
    integrations
  - Core agent commands cover constitution, specification, clarification,
    planning, tasks, analysis, implementation, and convergence
  - Integration management can list, install, switch, upgrade, and report
    managed integration state
  - Presets and extensions customize templates or add workflow capabilities
  - Support for numerous CLI and IDE coding-agent integrations, with
    agent-specific command forms
  - Local wheels can bundle core assets for offline or air-gapped initialization

usage:
  interfaces:
    - CLI
    - coding-agent commands or skills
    - project-local templates
  installation:
    - uv tool
    - pipx or pip package
    - source install or locally built wheel
  setup: moderate

technology:
  languages:
    - Python
  notable_components:
    - Typer
    - YAML templates

