  latest_release_at: 2026-11-19

strengths:
  - Makes requirements, planning, task breakdown, and implementation explicit
    stages for coding agents
  - Adapts one workflow to multiple agent integrations instead of coupling a
    project to one assistant
  - Supports organizational customization through local overrides, presets,
    extensions, and offline assets

caveats:
  - It scaffolds process and agent instructions; an installed, compatible AI
    coding agent still performs the work
  - Generated templates and agent commands require review and may need
    project-specific adaptation
  - Agent integration availability and command syntax vary by installed
    integration and version

