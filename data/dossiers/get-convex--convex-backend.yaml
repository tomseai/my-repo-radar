license:
  spdx: FSL-1.1-Apache-2.0
  name: Functional Source License 1.1 with Apache License 2.0 future license
  notes: Competing commercial uses are excluded; each version converts to Apache-2.0 after two years.

status:
  lifecycle: active
  archived: false
  latest_release: null
  latest_release_at: null

strengths:
  - Combines database, server functions, and client libraries in one reactive platform
  - Offers supported Docker and binary paths for self-hosting
  - A Rust workspace supports a substantial backend implementation

caveats:
  - The Functional Source License restricts competing commercial offerings before conversion
  - The retained release feed contains only timestamped, commit-hash precompiled builds, not an identifiable stable project release
  - Building from source requires replacing the repository's default instance secret and admin key
  - Windows has received less production testing than Linux and macOS
  - Self-hosted builds send a minimal anonymous beacon unless disabled with the backend flag

