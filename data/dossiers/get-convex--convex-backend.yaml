project:
  name: Convex
  kind: service
  summary: >-
    A reactive database and application backend that combines strongly
    consistent TypeScript server functions with client libraries for dynamic,
    live-updating applications.
  best_for:
    - Teams building a reactive web application with TypeScript server logic
    - Operators who need an available self-hosted Convex backend

key_features:
  - Strongly consistent database operations written as TypeScript server functions
  - Client libraries for dynamic live-updating applications
  - Self-hosted dashboard and CLI alongside the backend
  - Docker and prebuilt-binary self-hosting paths
  - Rust backend with public and internal TypeScript packages

usage:
  interfaces:
    - backend service
    - dashboard
    - CLI
  installation:
    - Docker image
    - prebuilt binary
    - build from source
  setup: moderate

