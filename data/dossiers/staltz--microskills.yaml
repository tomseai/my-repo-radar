project:
  name: microskills
  kind: curated-list
  summary: >-
    A compact collection of reusable SKILL.md prompts for everyday agent work,
    including concise prose inspection, session debriefing, and locating code.
  best_for:
    - Developers who want small, composable prompts instead of large workflow
      skills
    - Agent users who want portable skills compatible with skills.sh conventions
key_features:
  - Packages each prompt as a focused, independently installable agent skill
  - Includes skills for prose inspection, session debriefs, code discovery,
    and turning agent sessions into comics
  - Uses the portable SKILL.md format supported by multiple coding agents
usage:
  interfaces:
    - agent skill files
  installation:
    - npx skills add staltz/microskills
    - copy individual SKILL.md directories
