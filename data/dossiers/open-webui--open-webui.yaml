    - Docker

license:
  spdx: null
  name: Open WebUI License and prior original licenses
  notes: >-
    The root license permits redistribution but prohibits changing, removing,
    obscuring, or replacing Open WebUI branding, except for deployments of at
    most 50 end users in 30 days or with written permission or an enterprise
    license.

status:
  lifecycle: active
  archived: false
  latest_release: v0.13.4
  latest_release_at: 2026-11-17

strengths:
  - Broad deployment and model-connection options cover local and API-backed use
  - Combines chat, RAG, plugins, access control, and operational storage choices
  - The retained release feed and project files document a recently released
    Python/Svelte application

caveats:
  - The root license imposes a material branding-preservation requirement and is
    not identified by a standard SPDX expression
  - The README states that earlier portions remain under their original
    licenses, but LICENSE_HISTORY was not retained in this bundle
  - Production use requires reviewing deployment, model-provider, storage, and
    access-control configuration

