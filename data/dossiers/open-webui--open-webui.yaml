project:
  name: Open WebUI
  kind: application
  summary: >-
    A self-hosted, offline-capable AI platform and web interface for local
    Ollama models and OpenAI-compatible APIs, with RAG, plugins and tools,
    role-based access control, persistent storage, and multiple deployment
    paths.
  best_for:
    - Individuals or teams hosting a configurable chat interface for local or
      API-based models
    - Administrators who need RAG, access controls, and extensibility in one
      self-hosted application

key_features:
  - Connects Ollama and OpenAI-compatible model APIs
  - Provides RAG with document extraction, vector stores, hybrid search, and
    reranking
  - Extends chats with filters, actions, pipes, tools, skills, MCP, MCPO, and
    OpenAPI servers
  - Supports administrator-defined roles, groups, permissions, and user access
  - Offers persistent memory, shared channels, notes, automations, and
    multi-model conversations
  - Supports SQLite or PostgreSQL plus local, S3, Google Cloud Storage, or Azure
    Blob Storage

usage:
  interfaces:
    - web application
    - progressive web app
    - HTTP service
  installation:
    - Python pip package
    - uv
    - Docker or Docker Compose
    - Kubernetes with kubectl, Kustomize, or Helm
  setup: moderate

