project:
  name: Cline
  kind: monorepo
  summary: >-
    An open-source coding-agent suite offering an IDE extension, terminal CLI,
    Node.js SDK, and supported integrations for supervised or automated development workflows.
  best_for:
    - Developers who want to use the same coding-agent engine from an IDE or terminal
    - Teams building custom agent integrations, multi-agent workflows, or scheduled automations with the SDK
key_features:
  - Offers a terminal CLI with interactive, headless, JSON-output, and CI/CD-oriented operation
  - Provides IDE workflows for coordinated code changes, terminal commands, checkpoints, and reviewable diffs
  - Supports plan and act modes, with approvals by default and optional auto-approval
  - Integrates multiple hosted, gateway, and local model providers
  - Extends agents with SDK plugins, custom tools, lifecycle hooks, and MCP servers
  - Coordinates persistent multi-agent teams and can schedule recurring agent jobs
usage:
  interfaces:
    - VS Code extension
    - terminal CLI
    - Node.js SDK
    - supported messaging-platform connectors
  installation:
    - npm i -g cline for the CLI
    - Visual Studio Marketplace extension installation
    - npm install @cline/sdk for programmatic use
  setup: moderate
technology:
  languages:
    - TypeScript
  notable_components:
    - Bun
    - Node.js
    - Model Context Protocol
    - Agent Client Protocol
