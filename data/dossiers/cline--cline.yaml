    contributor patent grant with termination provisions.
status:
  lifecycle: active
  archived: false
  latest_release: CLI v3.0.75
  latest_release_at: 2026-11-21
strengths:
  - Supports IDE, CLI, and SDK entry points instead of restricting coding-agent
    use to one interface
  - Documents provider flexibility, custom tools, MCP integration, multi-agent
    teams, and recurring schedules
  - Keeps human approval available for file edits and terminal commands while
    offering automation modes
caveats:
  - The CLI, desktop app, IDE extension, SDK packages, and nightly builds have
    independent release tracks. CLI v3.0.75 matches the retained CLI manifest;
    v4.1.27 is the separately tagged VS Code release.
  - The JetBrains client is described as not open-sourced in this repository,
    despite being part of the broader product offering
  - Model-provider credentials, permissions, costs, and connector access
    controls need separate configuration and review
  - Automated or headless operation can execute development actions without the
    interactive approval flow
