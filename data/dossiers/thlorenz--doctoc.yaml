project:
  name: DocToc
  kind: cli
  summary: >-
    A Node.js command-line tool that inserts or updates tables of contents in
    Markdown files, recursively processes directories, and offers configurable
    anchors, heading ranges, layout, dry-run, and update-only behavior.
  best_for:
    - Maintaining generated navigation in Markdown documentation repositories
    - CI, pre-commit, or lint-staged workflows that should detect stale tables of contents

key_features:
  - Generates and updates marked table-of-contents sections in Markdown files
  - Recursively processes .md, .markdown, and .mdx files while ignoring .git and node_modules
  - Supports GitHub, GitLab, and Bitbucket-compatible anchor modes
  - Provides dry-run exit status checks for CI and update-only behavior for existing TOCs
  - Configures heading depth, minimum document length, list style, titles, and placement
  - Supports dedicated comments to skip files or exclude headings

