project:
  name: Code Hike
  kind: library
  summary: >-
    A TypeScript library that combines Markdown and React for technical content
    sites, with published code, MDX, block, and syntax-highlighting utilities.
  best_for:
    - React teams building technical documentation, tutorials, or code-focused sites
    - Authors who want interactive code content from Markdown and MDX
key_features:
  - Provides a published codehike package with code, MDX, blocks, and utility entry points
  - Bridges Markdown and React for rich technical web content
  - Includes code-oriented package exports and a syntax-highlighting dependency
  - Offers a Next.js starter that can be opened online or created with create-next-app
usage:
  interfaces:
    - React library
    - npm package
    - Next.js starter
  installation:
    - npx create-next-app -e https://github.com/code-hike/v1-starter
    - npm package
  setup: moderate
