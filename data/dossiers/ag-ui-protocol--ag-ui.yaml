project:
  name: AG-UI
  kind: protocol
  summary: >-
    An open event-based protocol and reference implementation for connecting
    AI-agent backends to interactive user-facing applications.
  best_for:
    - Teams adding real-time agent interactions to frontend applications
    - Builders of interoperable agent clients, server adapters, and middleware
key_features:
  - Standard agent event types and compatible inputs for agent-human interaction
  - Streaming chat, bidirectional state synchronization, and context enrichment
  - Generative UI, structured messages, frontend tools, and human-in-the-loop flows
  - Transport-agnostic middleware for SSE, WebSockets, webhooks, and similar transports
  - Reference HTTP implementation, default connector, SDKs, integrations, and an app generator
usage:
  interfaces:
    - HTTP reference implementation
    - TypeScript SDK
    - Python SDK
    - create-ag-ui-app project generator
  installation:
    - npm packages
    - Python package
    - npx create-ag-ui-app
  setup: moderate
