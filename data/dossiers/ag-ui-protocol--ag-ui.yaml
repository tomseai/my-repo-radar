  notes: Permissive license; the software is provided without warranty.
status:
  lifecycle: active
  archived: false
  latest_release: release/2026-11-21
  latest_release_at: "2026-11-21"
strengths:
  - Defines a focused boundary between agent backends and user-facing
    applications
  - Supports real-time interactions beyond text streaming, including state and
    frontend tools
  - Provides reference components and integrations across several agent
    ecosystems
caveats:
  - Requires an agent backend and user application; it is not a complete
    end-user UI
  - Integration support and capabilities vary by agent framework
  - Releases are component-specific, so package versions do not form one
    monolithic release
