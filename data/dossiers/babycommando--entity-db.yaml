project:
  name: EntityDB
  kind: library
  summary: >-
    A JavaScript browser library for persisting vector embeddings in IndexedDB
    and searching them locally, with optional text embedding through
    Transformers.js and experimental binary-vector query paths.
  best_for:
    - Browser applications that need local vector storage without a server component
    - Prototypes or client-side search features that can use Transformers.js embeddings

key_features:
  - Persists vector data in the browser through IndexedDB
  - Generates text embeddings with Transformers.js or accepts precomputed vectors
  - Queries dense vectors with cosine similarity
  - Supports updates and deletion of stored vectors
  - Provides experimental binary-vector queries using JavaScript and WebAssembly SIMD

usage:
  interfaces:
    - JavaScript API
    - browser IndexedDB storage
  installation:
    - npm package (@babycommando/entity-db)
    - yarn package install
    - pnpm package install
    - Bun package install
  setup: low

