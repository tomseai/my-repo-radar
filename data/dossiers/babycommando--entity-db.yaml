strengths:
  - Keeps vector persistence and similarity search in the browser
  - Supports both automatic embeddings and manual vector insertion
  - Documents dense and binary query options with code examples

caveats:
  - The retained GitHub release feed contains no release entries
  - Binary-vector functionality is explicitly marked experimental and trades detail for smaller, faster comparisons
  - Next.js use may require the documented Webpack aliases for browser compatibility
  - Source support is limited to a README and manifest, and no license text is retained

