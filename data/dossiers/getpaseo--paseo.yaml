project:
  name: Paseo
  kind: application
  summary: >-
    A self-hosted, cross-device control surface for running, monitoring, and
    coordinating coding agents on a machine that you operate.
  best_for:
    - Developers coordinating several coding-agent tasks from desktop, mobile,
      or terminal
    - Running supported agent CLIs on a workstation or remote machine under
      local control
key_features:
  - One interface for Claude Code, Codex, Copilot, OpenCode, Pi, Antigravity,
    and Muse Code
  - Parallel agent execution with live terminal attachment and follow-up prompts
  - Desktop, mobile, web, and CLI clients connected to a local daemon
  - Voice task control and device pairing through a QR code
  - Docker deployment with a self-hosted web UI
  - An MCP server and reusable orchestration skills

usage:
  interfaces:
    - desktop app
    - mobile app
    - web UI
    - CLI
    - local daemon
  installation:
    - official desktop download
    - npm global CLI package
    - Docker image
    - build from source
  setup: moderate

technology:
  languages:
    - TypeScript
    - Ruby
  notable_components:
