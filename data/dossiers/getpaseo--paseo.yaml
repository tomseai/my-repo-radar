strengths:
  - Provides a consistent surface across multiple established coding-agent CLIs
  - Keeps agent execution in the operator's development environment
  - Supports both local desktop use and headless Docker or remote-machine
    workflows

caveats:
  - At least one supported agent CLI and its credentials must be installed
    separately
  - Connected clients can control agents running with the daemon user's authority
  - Direct network exposure requires access restrictions; the documentation
    recommends a password
  - Legacy relay clients lack replay protection; protected mode can be required
    once all clients have upgraded
  - Plugins run with access to the daemon machine and connected clients

