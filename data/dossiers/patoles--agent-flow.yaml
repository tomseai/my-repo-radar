status:
  lifecycle: active
  archived: false
  latest_release: v0.9.1
  latest_release_at: 2026-07-06

strengths:
  - Makes otherwise opaque coding-agent execution inspectable in real time
  - Supports both Claude Code and Codex across browser, extension, and source workflows
  - Can replay arbitrary JSONL event logs as well as watch live sessions

caveats:
  - Requires Node.js 20 or later and pnpm for the source workflow
  - Claude Code hooks are configured for live streaming in the source and extension workflows
  - The published npx binary enables opt-out anonymous aggregate telemetry by default

