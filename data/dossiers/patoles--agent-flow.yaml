project:
  name: Agent Flow
  kind: application
  summary: >-
    A real-time visualizer for Claude Code and Codex execution that displays
    detected sessions, branching, tool calls, timelines, transcripts, and
    file-attention data in a browser or VS Code webview.
  best_for:
    - Debugging and understanding active Claude Code or Codex sessions
    - Comparing concurrent agent sessions and tool-call sequences

key_features:
  - Interactive live graph of agent execution, tool calls, branches, and return
    flows
  - Concurrent Claude Code and Codex session discovery with runtime filtering
  - Codex rollout tailing with tool calls, reasoning, and token-count display
  - Multi-session tabs, timeline, transcript, and file-attention heatmap
  - JSONL event-log replay or live tailing

usage:
  interfaces:
    - web UI
    - VS Code extension
    - CLI
  installation:
    - npx agent-flow-app
    - VS Code Marketplace extension
    - build from source with pnpm
  setup: moderate

technology:
  languages:
    - TypeScript
  notable_components:
    - Next.js
    - React
    - VS Code Extension API
    - Server-Sent Events

