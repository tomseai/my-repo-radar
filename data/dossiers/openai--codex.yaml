project:
  name: Codex CLI
  kind: cli
  summary: >-
    An OpenAI coding agent that runs locally, with a terminal CLI as its
    primary interface and documented paths to IDE integrations and a desktop
    app command.
  best_for:
    - Developers who want to run an OpenAI coding agent from a terminal
    - Teams using supported IDE integrations or the Codex desktop app

key_features:
  - Local terminal-based coding-agent workflow
  - Documented IDE integrations for VS Code, Cursor, and Windsurf
  - Desktop-app entry point through the codex app command
  - ChatGPT sign-in or API-key authentication options
  - Platform-specific standalone binaries in GitHub releases

