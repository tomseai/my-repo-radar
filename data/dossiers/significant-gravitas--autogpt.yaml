project:
  name: AutoGPT
  kind: monorepo
  summary: An AI-agent platform for briefing specialist agents in conversation,
    delegating work through a coordinator, and building recurring workflows. It
    offers paid hosting and Docker-based self-hosting.
  best_for:
    - Teams delegating recurring work to configurable specialist agents
    - Builders defining repeatable tasks with connected applications and a
      visual workflow editor
key_features:
  - Otto routes a brief to specialist agents and brings their work back
  - Specialists can be customized with instructions, skills, context, and
    connected apps
  - Routines enable recurring work; account access and spending controls can be
    configured
  - Visual workflow builder supports connected blocks and branch logic
  - Marketplace workflows can be adapted, and an API and MCP server expose
    workflow operations
usage:
  interfaces:
    - Web workspace and visual workflow builder
    - API and MCP server
    - AutoGPT Classic standalone agent
  installation:
    - Hosted platform signup
    - Single-container Docker image
    - Self-host installer or Docker Compose
  setup: moderate
technology:
  languages:
    - Python
    - TypeScript
  notable_components:
    - Docker Compose
    - PostgreSQL/Supabase service stack
    - React frontend
    - AutoGPT Classic
