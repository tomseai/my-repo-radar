strengths:
  - Provides managed and self-hosted operating models without changing the core platform
  - Covers agent creation, execution, monitoring, and reusable marketplace starting points
  - Supports concrete workflow control through its visual block builder
caveats:
  - Self-hosting requires Docker, configuration, model API keys, and ongoing operations
  - The managed platform is paid and charges for agent usage
  - License obligations differ by repository path; platform code is not generally permissive
  - The newest retained release is the non-stable autogpt-platform-beta-v0.6.68 entry from 2026-07-19, so stable release fields remain null
  - AutoGPT Classic is a separate legacy surface within the monorepo and should be evaluated separately
