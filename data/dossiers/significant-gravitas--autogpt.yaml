project:
  name: AutoGPT
  kind: monorepo
  summary: >-
    An AI-agent platform and monorepo for describing, visually assembling,
    deploying, and running workflow agents on demand, on schedules, or from
    triggers, with both a managed web platform and a self-hosted deployment.
  best_for:
    - Teams assembling workflow agents visually or from natural-language job descriptions
    - Organizations choosing between a managed agent platform and self-hosting on their infrastructure
key_features:
  - Visual Build canvas for connecting, branching, and inspecting agent-workflow blocks
  - AutoPilot surface that turns a plain-English job description into an agent
  - Agent dashboard for runs, costs, statuses, and actions requiring attention
  - Marketplace for starting from and customizing community agents
  - On-demand, scheduled, and trigger-based agent execution
  - Hosted platform plus a Docker-based self-hosted path from the same repository
usage:
  interfaces:
    - managed web platform
    - visual workflow builder
    - self-hosted web application
    - AutoGPT Classic standalone agent
  installation:
    - managed-platform signup
    - official self-host setup script
    - source checkout with Docker Compose
  setup: moderate
technology:
  languages:
    - Python
    - TypeScript
  notable_components:
