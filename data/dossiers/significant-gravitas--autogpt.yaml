strengths:
  - Combines conversational delegation with explicit visual workflow steps
  - Provides both hosted and self-managed deployments
  - Supports specialist customization and reusable workflow templates
caveats:
  - Self-hosting requires Docker, configuration, model API keys, and ongoing
    operations
  - The managed platform is paid and charges for agent usage
  - License obligations differ by repository path; platform code is not
    generally permissive
  - The latest published primary-project entry in the retained evidence is
    autogpt-platform-beta-v0.12.0 (2026-11-19). The stable release fields are
    unset.
  - AutoGPT Classic is a separate legacy surface within the monorepo and should
    be evaluated separately
