project:
  name: Oxc
  kind: monorepo
  summary: A Rust workspace for high-performance JavaScript and TypeScript
    tooling. It provides parser, transformer, minifier, resolver,
    semantic-analysis, and linting components, alongside the Oxlint linter and
    Oxfmt formatter command-line applications.
  best_for:
    - Developers who want fast linting or formatting for JavaScript and
      TypeScript codebases
    - Tool authors building on Rust components for parsing, transforming,
      minifying, or resolving modules
key_features:
  - Ships Oxlint and Oxfmt command-line tools, installable with npx
  - Exposes parser, transformer, minifier, and resolver capabilities for
    JavaScript and TypeScript
  - Organizes reusable Rust crates with Node-API bindings and a language-server
    component
  - Uses an arena allocator and zero-copy-oriented architecture across the
    compilation pipeline
usage:
  interfaces:
    - Oxlint CLI
    - Oxfmt CLI
    - Rust crates
    - Node-API bindings
  installation:
    - npx oxlint@latest
    - npx oxfmt@latest
    - Cargo workspace dependency or source build
  setup: low
