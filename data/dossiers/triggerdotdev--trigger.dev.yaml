project:
  name: Trigger.dev
  kind: service
  summary: An open-source durable execution platform for TypeScript AI agents and
    workflows, available as a managed cloud service or a self-hosted deployment.
  best_for:
    - Teams building long-running TypeScript jobs, agents, and background workflows
    - Applications that need retries, queues, waits, streaming, schedules, and
      operational visibility
key_features:
  - Runs long-lived tasks with durability, retries, queues, concurrency, and
    idempotency
  - Supports human-in-the-loop waits, schedules, realtime updates, and streaming
  - Provides logs, tracing, observability, environments, and deployment tooling
  - Offers managed hosting plus Docker and Kubernetes self-hosting paths
  - Runs durable AI chat conversations, versions prompt templates, and traces Vercel
    AI SDK model usage and costs
