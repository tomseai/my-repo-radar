strengths:
  - Packages durable execution and agent operations behind a TypeScript-native API
  - Supports both hosted convenience and self-managed infrastructure
caveats:
  - Self-hosting introduces database, worker, scaling, and operational
    responsibilities
  - The release feed mixes application, Docker, Helm, documentation, and test tags;
    v4.8.8 is the newest primary product release
  - Hosted webhook routing is in public beta
