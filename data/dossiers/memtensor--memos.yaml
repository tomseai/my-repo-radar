strengths:
  - Combines a modular memory framework with a deployable API and agent-specific plugin paths
  - Supports isolation and controlled composition of memory through MemCube containers
  - Offers both self-hosted graph/vector infrastructure and an on-device plugin option

caveats:
  - The self-hosted service requires Neo4j, Qdrant, Docker Compose, and environment configuration including API keys
  - The primary package has a broad dependency surface and optional extras for additional memory types and providers
  - Parametric memory is documented as coming soon, not a currently available capability
  - Local plugin functionality is specific to supported OpenClaw or Hermes runtimes and still requires Node.js

