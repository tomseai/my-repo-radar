  interfaces:
    - Python package
    - CLI
    - REST API
    - Docker Compose service
    - OpenClaw, Hermes, and DeepSeek Harness plugins
  installation:
    - Poetry or Python package installation
    - clone and Docker Compose self-hosting
    - Agent-specific plugin installation
  setup: high

