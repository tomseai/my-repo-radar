project:
  name: MemOS
  kind: framework
  summary: >-
    A Python memory framework and service for LLM applications and agents that
    provides unified memory management, configurable memory containers and
    backends, REST deployment, and local or cloud agent-plugin entry points.
  best_for:
    - Building an AI application or agent that needs structured, editable long-term memory
    - Teams that need a self-hosted REST memory service with graph and vector storage

key_features:
  - Unified API to add, retrieve, edit, delete, transfer, and roll back memories
  - MemCube containers for isolating and composing user, agent, project, or session memory
  - Plaintext vector and graph-oriented memory types alongside modular connectors and parsers
  - Asynchronous memory operations through the MemScheduler component
  - Docker-deployed REST service backed by Neo4j and Qdrant
  - Cloud and local OpenClaw/Hermes plugins, including local SQLite hybrid retrieval and skill evolution

