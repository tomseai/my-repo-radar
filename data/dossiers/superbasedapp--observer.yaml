strengths:
  - Reconciles multiple local agent formats through one normalized cost and
    activity view
  - Keeps standard capture, storage, dashboard, CLI, and MCP paths local by
    default
caveats:
  - Provider-grade token accuracy requires routing supported traffic through the
    local proxy
  - Browser chat adapters need a separately installed browser-capture extension
  - Team sharing, exports, and guardrails are optional paths requiring
    deliberate configuration
