project:
  name: SuperBased Observer
  kind: application
  summary: >-
    A local-first observability and cost-attribution tool for AI coding
    activity, with a CLI, dashboard, provider proxy, MCP server, terminals, and
    optional team rollups.
  best_for:
    - Developers reconciling token use and cost across many AI coding tools
    - Teams that want local capture before selectively enabling shared
      observability
key_features:
  - Normalizes local session data from dozens of coding-agent tools
  - Captures provider-returned token counts and pricing through an optional proxy
  - Offers local usage reports, dashboard, terminals, CLI, MCP, traces, and
    guardrails
  - Shows estimated next-message costs and usage-limit gauges for proxied sessions
  - Stores data locally by default with opt-in team and OpenTelemetry paths
