project:
  name: Cognee
  kind: framework
  summary: >-
    An open-source AI-memory platform that ingests data into a self-hosted
    knowledge graph and combines graph and vector retrieval for persistent
    agent context.
  best_for:
    - Adding long-term memory and retrieval to AI agents
    - Self-hosting an agent knowledge layer with a Python API, CLI, or MCP service
key_features:
  - Ingests data and builds an evolving knowledge graph with vector embeddings
  - Provides remember, recall, forget, and improve operations for persistent and session memory
  - Routes retrieval across graph, vector, and session-memory search strategies
  - Offers a local UI, API service, CLI, and MCP server deployment modes
  - Supports embedded local development and Postgres, graph, vector, and cache backends
  - Includes Claude Code and OpenClaw integration paths
usage:
  interfaces:
    - Python API
    - CLI
    - web UI
    - HTTP API
    - MCP server
  installation:
    - Python package via pip, uv, or Poetry
    - Docker image or Docker Compose
    - build from source
  setup: moderate
technology:
  languages:
    - Python
    - TypeScript
  notable_components:
    - FastAPI
    - Model Context Protocol
    - Docker Compose
    - Postgres and pgvector
