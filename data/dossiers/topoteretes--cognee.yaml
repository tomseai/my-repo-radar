strengths:
  - Combines persistent graph and vector retrieval rather than a single
    retrieval mechanism
  - Exposes the memory layer through several local and service interfaces
  - Supports both embedded development and scalable self-hosted deployments
caveats:
  - The release feed also includes independently versioned MCP and connector packages
  - Local CPU models can run without an API key; other providers require
    their own configuration
  - Docker-based UI and MCP workflows require a working OCI runtime
  - Backend selection and access-control configuration add operational choices
    for production deployments
