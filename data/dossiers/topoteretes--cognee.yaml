strengths:
  - Combines persistent graph and vector retrieval rather than a single retrieval mechanism
  - Exposes the memory layer through several local and service interfaces
  - Supports both embedded development and scalable self-hosted deployments
caveats:
  - LLM-backed processing requires configuring an API key or another supported provider
  - Docker-based UI and MCP workflows require a working OCI runtime
  - Backend selection and access-control configuration add operational choices for production deployments
