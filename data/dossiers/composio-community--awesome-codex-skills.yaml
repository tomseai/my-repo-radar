project:
  name: Awesome Codex Skills
  kind: curated-list
  summary: >-
    A curated collection of in-repository and external Codex skill references,
    with installation guidance for adding selected skills to a local Codex
    setup.
  best_for:
    - Discovering reusable Codex skills across development, collaboration,
      writing, data, and utility tasks
    - Installing a selected in-repository skill through the documented installer
      or a manual folder copy
key_features:
  - Categorized references for development, productivity, communication, data,
    and utility skills
  - Quickstart instructions for a GitHub-based installer that copies a selected
    skill into CODEX_HOME
  - Manual-install instructions and a description of the required SKILL.md
    metadata layout
  - Links to both bundled skill folders and independently maintained external
    skill repositories
  - References to optional Composio CLI connection skills for workflows
    involving external apps
usage:
  interfaces:
    - Markdown directory
    - GitHub repository
    - Local Codex skills directory
  installation:
    - Run the documented Python skill-installer command for a selected path
    - Copy a selected skill folder into CODEX_HOME/skills and restart Codex
    - Follow external repository-specific installation directions where listed
  setup: low
