project:
  name: opensync
  kind: application
  summary: >-
    A hosted or self-hosted dashboard and API for collecting AI coding-session
    data from supported sync plugins, then searching, analysing, exporting,
    and reusing that activity for evaluation and context workflows.
  best_for:
    - Teams that want a shared dashboard for coding-agent sessions, tool activity, and token spend
    - Developers who want to search or export past sessions for evaluations and context retrieval
key_features:
  - Syncs sessions in real time through separate plugins for OpenCode, Claude Code, Codex CLI, Cursor, Pi, and Factory Droid
  - Provides full-text, semantic, and hybrid session search alongside an API for sessions, search, context, and export
  - Offers dashboard views for usage, sessions, evaluations, and analytics including model, project, and cost breakdowns
  - Marks sessions for evaluation and exports DeepEval JSON, OpenAI Evals JSONL, or plain text
  - Supports self-hosting with Convex, WorkOS authentication, React, and OpenAI embeddings
usage:
  interfaces:
    - hosted web dashboard
    - self-hosted web application
    - HTTP API
    - coding-agent sync plugins
  installation:
    - hosted account and sync plugin
    - clone repository and npm install
  setup: high
