strengths:
  - Makes message processing and extension points visible instead of framework-private
  - Keeps human and agent interactions within the same runtime model
  - Allows channel adapters without changing the core turn pipeline

caveats:
  - Requires Python 3.12 or newer and a configured LLM provider or OpenAI Codex login
  - Extending behavior requires writing and packaging pluggy-compatible Python plugins
  - Telegram and other external channels require separate channel configuration and credentials

