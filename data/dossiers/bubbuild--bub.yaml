project:
  name: Bub
  kind: framework
  summary: >-
    A small hook-first Python runtime for agents and people in shared
    conversational environments, using an inspectable turn pipeline, append-only
    context records, and adapters for command-line, Telegram, and custom channels.
  best_for:
    - Developers building extensible agents that share conversations with people
    - Teams that want explicit, replayable context rather than hidden session state

key_features:
  - Replaceable pluggy hooks for every inbound-message turn stage
  - Append-only tape context that can be inspected, replayed, and handed off
  - One runtime model for CLI, Telegram, and custom channel adapters
  - Built-in tools, skills, model execution, and plugin dependency management
  - CLI modes for chat, one-shot tasks, and channel-listener operation

usage:
  interfaces:
    - CLI
    - Telegram channel
    - Docker container
  installation:
    - pip package
    - source checkout with uv
    - Docker Compose
  setup: moderate

