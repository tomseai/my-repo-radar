status:
  lifecycle: active
  archived: false
  latest_release: 0.6.1
  latest_release_at: 2026-11-04

strengths:
  - Makes message processing and extension points visible instead of
    framework-private
  - Keeps human and agent interactions within the same runtime model
  - Allows channel adapters without changing the core turn pipeline

caveats:
  - Requires Python 3.12 or newer and model configuration
  - The CLI and application dependencies require the app extra or app installer
  - Extending behavior requires writing and packaging pluggy-compatible Python
    plugins
  - Telegram and other external channels require separate channel configuration
    and credentials

