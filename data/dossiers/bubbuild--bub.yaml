project:
  name: Bub
  kind: framework
  summary: >-
    A Python agent kernel and customizable application with model and tool
    configuration, conversation storage, plugins, and channel integrations.
  best_for:
    - Developers building extensible agents that share conversations with people
    - Teams that want explicit, replayable context rather than hidden session
      state

key_features:
  - Python agent kernel with configurable model, tools, instructions, and storage
  - Optional application layer with pluggy hooks and channel integrations
  - Append-only tape context that can be inspected, replayed, and handed off
  - Application supports CLI, Telegram, and channel adapters
  - Built-in tools, skills, model execution, and plugin dependency management
  - CLI modes for chat, one-shot tasks, and channel-listener operation

usage:
  interfaces:
    - Python API
    - CLI
    - Telegram channel
    - Docker container
  installation:
    - Python package with optional app extra
    - official installation script
    - source checkout with uv
    - Docker Compose
  setup: moderate

technology:
  languages:
    - Python
  notable_components:
    - pluggy
    - Agent Skills
    - Pydantic
    - republic

