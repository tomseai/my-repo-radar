project:
  name: Bindu
  kind: framework
  summary: >-
    A framework and multi-language SDK set for exposing AI agents through A2A
    messaging with DID identity, mTLS and OAuth2 authorization, x402 payments,
    deployment, and operational components.
  best_for:
    - Teams building authenticated and monetized agent-to-agent services
    - Developers who need Python, TypeScript, or Kotlin access to a shared gRPC core
key_features:
  - A2A JSON-RPC endpoints for sending messages, retrieving tasks, and streaming task updates
  - DID signing, mTLS transport, and OAuth2 authorization through Hydra
  - x402 USDC payment middleware with configured EVM networks
  - Python, TypeScript, and Kotlin SDKs sharing a gRPC core
  - Postgres task and message storage plus Redis-backed retries, timeouts, and recurring tasks
  - Gateway orchestration, OpenTelemetry tracing, Sentry errors, and a health endpoint
usage:
  interfaces:
    - Python package and CLI
    - TypeScript SDK
    - Kotlin SDK
    - A2A JSON-RPC API
    - gRPC API
  installation:
    - uv add bindu
    - Clone the repository and run uv sync --dev
    - Install a language-specific SDK
  setup: high
