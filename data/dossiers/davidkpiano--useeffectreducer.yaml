project:
  name: useEffectReducer
  kind: library
  summary: A React hook that lets reducers describe effects alongside state transitions and executes the queued effects after React commits the state.
  best_for: [React developers coordinating asynchronous effects with reducer events]
key_features:
  - Queue effects to run after React commits state
  - Stop or replace effects using effect entities and abort signals
  - Dispatch events from asynchronous effects and run cleanup on stop
  - TypeScript types for state, events, and effect implementations
