strengths:
  - Closes the loop between local observability and an agent's next action
  - Ships as one local server that manages its embedded dashboard and database
    dependency
  - Supports both automatic context injection and on-demand MCP queries
caveats:
  - The release feed contains only prereleases; the newest observed is
    v0.3.0-beta5
  - The service has no authentication and is documented as a local-only tool
  - First start downloads and manages a GreptimeDB binary in the user's data
    directory
  - Hook and MCP installation modifies agent configuration outside the target
    project
