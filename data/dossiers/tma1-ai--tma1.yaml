project:
  name: TMA1
  kind: service
  summary: >-
    A local-first observability service for LLM agents that records their
    activity, presents it in a dashboard, and returns operational context
    through hooks and MCP.
  best_for:
    - Developers running Claude Code or Codex who want local agent-loop
      visibility
    - Teams or individuals who want failures and session context fed back to
      coding agents
key_features:
  - Records local LLM calls, OpenTelemetry signals, hooks, and JSONL agent
    transcripts
  - Serves a dashboard with cost, latency, tool activity, replay, anomalies, and
    SQL access
  - Injects compact context through hooks and can block unresolved high-severity
    issues
  - Exposes ten MCP tools for session state, anomalies, builds, project state,
    and peers
  - Captures build or dev-command output and detects recurring failure conditions
  - Supports Claude Code, Codex, Copilot CLI, and generic GenAI
    OpenTelemetry sources
usage:
  interfaces:
    - CLI
    - local web dashboard
    - MCP server
    - HTTP API
    - agent hooks
  installation:
    - macOS or Linux install script
    - Windows PowerShell install script
    - build from source
  setup: moderate
technology:
  languages:
    - Go
    - JavaScript
  notable_components:
