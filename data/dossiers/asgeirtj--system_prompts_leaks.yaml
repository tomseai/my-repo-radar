    A repository-organized reference collection of extracted and published
    system prompts, injected reminders, skills, and commands for AI chatbots
    and developer tools.
  best_for:
    - Comparing documented or captured instructions across AI products
    - Studying historical prompt variants, agent roles, and tool guidance
key_features:
  - Provider-organized prompt files for Anthropic, OpenAI, Google, xAI, Microsoft, and other products
  - Separate entries for chat products, coding tools, API-injected prompts, and browser or voice assistants
  - Claude Code prompt materials for agents, bundled skills, slash commands, reminders, and MCP servers
  - Historical model and prompt variants alongside newer entries
  - Links distinguishing selected Anthropic official published prompts from other captures
