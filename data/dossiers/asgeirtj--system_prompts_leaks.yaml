strengths:
  - Consolidates many provider and product instruction sets in a browsable Markdown collection
  - Retains multiple versions and related runtime material, not only base chat prompts
  - Marks selected Anthropic entries as official published prompts
caveats:
  - Many entries are extracted captures, so they can be incomplete, version-specific, or no longer current
  - The collection license does not by itself establish reuse rights for third-party prompt content
  - Prompt wording should be independently verified before relying on it for behavior, policy, or compatibility conclusions
  - The retained GitHub releases feed has no entries, so no project release can be established
