  kind: framework
  summary: >-
    The core engine of an open-source family for creating native mobile and web
    user interfaces from one codebase using web-oriented CSS and React knowledge.
  best_for:
    - Web developers building Android, iOS, and web user interfaces
    - Teams that need a native mobile runtime with web-oriented authoring

key_features:
  - Native rendering for Android, iOS, and the web
  - Custom renderer for consistent mobile and desktop output
  - CSS- and React-oriented development model
  - Multithreaded engine for launch and UI responsiveness
  - Lynx Explorer app for testing ReactLynx-based screens

