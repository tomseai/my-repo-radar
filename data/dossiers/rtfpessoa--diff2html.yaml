project:
  name: diff2html
  kind: library
  summary: >-
    A TypeScript library that parses Git or unified diffs and renders them as
    formatted HTML, with a browser UI wrapper and Node.js distribution.
  best_for:
    - Adding rendered file diffs to web interfaces
    - Converting Git or unified-diff output into embeddable HTML
key_features:
  - Parses Git and unified-diff input
  - Renders line-by-line and side-by-side comparisons
  - Provides parser and HTML-generation APIs
  - Includes browser UI bundles with optional syntax highlighting
  - Offers npm, CDN, Node.js-library, and separate CLI distributions
