strengths:
  - Supports both direct HTML generation and a DOM-oriented UI wrapper
  - Covers common Git-diff presentation modes with syntax highlighting
  - Documents several consumption paths for browser and Node.js use
caveats:
  - Input support excludes combined and word-diff formats
  - Full syntax highlighting increases the browser bundle; the base UI can use a supplied implementation instead
