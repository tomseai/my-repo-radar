project:
  name: Repomix
  kind: cli
  summary: >-
    A command-line tool that packages a local or remote repository into a
    single AI-friendly context file for use with LLMs and other tools.
  best_for:
    - Preparing a selected codebase for LLM analysis, review, or generation
    - Keeping repository context within an AI tool's token or file-size limits

key_features:
  - Packages local directories or remote repositories into XML, Markdown, JSON, or plain-text output
  - Counts tokens per file and across the repository, with token budgets and a token-count tree
  - Respects Git, ignore, and Repomix ignore rules while allowing explicit include and exclude patterns
  - Uses Tree-sitter-based compression to retain structural code context with fewer tokens
  - Scans output for sensitive data with Secretlint
  - Provides Docker, web, browser-extension, and MCP-server paths in addition to the CLI

usage:
  interfaces:
    - CLI
    - web application
    - MCP server
  installation:
    - npx
    - npm global package
    - Homebrew
    - Docker image
  setup: low

