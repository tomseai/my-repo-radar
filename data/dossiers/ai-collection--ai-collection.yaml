project:
  name: AI Collection
  kind: curated-list
  summary: >-
    A large, hand-picked Markdown directory of generative-AI applications,
    organized into categories ranging from agents, coding, and chatbots to
    creative, business, research, and productivity tools.
  best_for:
    - Discovering AI products by application category
    - Browsing a broad reference list before evaluating individual tools
key_features:
  - Categorized index covering agents, agentic coding, coding assistants, chatbots, automation, and many non-development uses
  - Recently added section alongside a category index and individual application entries
  - Links to an associated AI Collection website for application details and pricing information
  - Translated README variants in Spanish, French, Hindi, Russian, and Simplified Chinese
  - External submission flow that synchronizes approved applications into the repository's full list
usage:
  interfaces:
    - Markdown directory
    - GitHub repository
    - AI Collection website
  installation:
    - Browse README.md on GitHub
    - Follow links to the listed applications or the AI Collection website
  setup: low
technology:
  languages:
    - Markdown
    - HTML
  notable_components:
    - Categorized application index
    - AI Collection website submission and synchronization flow
    - GitHub Actions Lychee link validation
license:
  spdx: MIT
  name: MIT License
