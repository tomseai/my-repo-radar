project:
  name: CloakBrowser
  kind: library
  summary: >-
    Python and JavaScript wrappers that launch a custom Chromium binary through
    Playwright or Puppeteer-compatible APIs, with fingerprint-oriented browser
    modifications and optional humanized input behavior.
  best_for:
    - Developers adapting existing Playwright or Puppeteer automation
    - Browser-automation workflows that need custom Chromium builds and proxy-aware settings
key_features:
  - Provides Python and JavaScript launch APIs compatible with Playwright, plus a Puppeteer entry point
  - Downloads and caches a platform-specific custom Chromium binary on first launch
  - Supports proxy, timezone, locale, persistent-profile, and extension-path options
  - Includes humanized mouse, keyboard, and scroll interaction wrappers
  - Supplies a CLI for binary installation, diagnostics, updates, and cache management
usage:
  interfaces:
    - Python library and CLI
    - JavaScript or Node.js library and CLI
    - Docker image
    - community-maintained .NET client
  installation:
    - pip install cloakbrowser
    - npm install cloakbrowser with playwright-core or puppeteer-core
    - official Docker image
  setup: moderate
technology:
  languages:
    - Python
    - TypeScript
    - C++
  notable_components:
    - Chromium
    - Playwright
    - Puppeteer
    - Docker
license:
  spdx: MIT
  name: MIT License for repository wrappers
  notes: >-
    The included LICENSE grants MIT terms for the repository software and the
    README identifies the Python and JavaScript wrappers as MIT. The downloaded
    Chromium binary has a separate delayed-free-release model; current Pro
    builds require a subscription/license key, so binary reuse terms must be
    reviewed separately.
status:
  lifecycle: active
  archived: false
  latest_release: v0.4.12
  latest_release_at: 2026-07-18
strengths:
  - Keeps familiar Playwright and Puppeteer-style interfaces while selecting its custom binary
  - Supports local, Docker, and Linux, Windows, and macOS binary workflows
  - Verifies official binary downloads against signed published checksums according to the README
caveats:
  - The current Chromium builds and fingerprint claims are vendor assertions; their effectiveness varies by target and can change
  - The newest binary is a separately licensed Pro offering, while the free binary intentionally trails it
  - The source bundle does not retain the separate binary-license text, so its detailed redistribution terms remain unverified here
  - Proxy and GeoIP features can make external requests and require users to supply suitable proxy infrastructure
