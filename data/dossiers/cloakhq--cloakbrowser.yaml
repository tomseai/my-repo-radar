project:
  name: CloakBrowser
  kind: library
  summary: >-
    Python and JavaScript wrappers that launch a custom Chromium binary through
    Playwright or Puppeteer-compatible APIs, with fingerprint-oriented browser
    modifications and optional humanized input behavior.
  best_for:
    - Developers adapting existing Playwright or Puppeteer automation
    - Browser-automation workflows that need custom Chromium builds and
      proxy-aware settings
key_features:
  - Provides Python and JavaScript launch APIs compatible with Playwright, plus
    a Puppeteer entry point
  - Downloads and caches a platform-specific custom Chromium binary on first
    launch
  - Supports proxy, timezone, locale, persistent-profile, and extension-path
    options
  - Includes humanized mouse, keyboard, and scroll interaction wrappers
  - Supplies a CLI for binary installation, diagnostics, updates, and cache
    management
usage:
  interfaces:
    - Python library and CLI
    - JavaScript or Node.js library and CLI
    - Docker image
    - community-maintained .NET client
  installation:
    - pip install cloakbrowser
    - npm install cloakbrowser with playwright-core or puppeteer-core
    - official Docker image
  setup: moderate
technology:
  languages:
    - Python
    - TypeScript
    - C++
  notable_components:
    - Chromium
    - Playwright
    - Puppeteer
    - Docker
license:
  spdx: MIT
  name: MIT License for repository wrappers
  notes: >-
    The included LICENSE grants MIT terms for the repository software and the
    README identifies the Python and JavaScript wrappers as MIT. The downloaded
    Chromium binary is separately licensed; a free key permits one concurrent
    session and Pro plans offer higher concurrency. Binary reuse terms must be
    reviewed separately.
status:
  lifecycle: active
  archived: false
  latest_release: null
  latest_release_at: null
strengths:
  - Keeps familiar Playwright and Puppeteer-style interfaces while selecting its
    custom binary
  - Supports local, Docker, and Linux, Windows, and macOS binary workflows
  - Verifies official binary downloads against signed published checksums
    according to the README
caveats:
  - The current Chromium builds and fingerprint claims are vendor assertions;
    their effectiveness varies by target and can change
  - Every launch requires a license key; the free key requires an email address
    and allows one concurrent session, while Pro offers higher concurrency
  - The README identifies wrapper version v0.7.3, but a published primary
    wrapper release and its publication date could not be verified
  - The source bundle does not retain the separate binary-license text, so its
    detailed redistribution terms remain unverified here
  - Proxy and GeoIP features can make external requests and require users to
    supply suitable proxy infrastructure
