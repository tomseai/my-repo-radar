project:
  name: codebase-memory-mcp
  kind: service
  summary: A local MCP code-intelligence server and CLI that indexes repositories into
    persistent SQLite knowledge graphs for structural codebase queries.
  best_for:
    - Giving MCP-compatible coding agents structural repository context
    - Exploring architecture, call paths, search results, and change impact
key_features:
  - Builds a persistent SQLite graph from tree-sitter-based source analysis
  - Exposes MCP tools for architecture, graph search, call paths, impact, and
    dead-code queries
  - Provides full-text, structural, semantic, and code-search capabilities
  - Supports automatic indexing and an optional CBM Lens browser interface in open
    beta
  - Distributes a CLI and prebuilt binaries for macOS, Linux, and Windows
  - Connects documentation and supported infrastructure and CI configuration to code
    relationships
usage:
  interfaces:
    - MCP stdio server
    - command line
    - optional browser graph UI
  installation:
    - platform installer script
    - prebuilt release binary
    - npm, PyPI, Homebrew, or other documented package channels
    - source build
  setup: moderate
technology:
  languages:
    - C
    - TypeScript
  notable_components:
    - SQLite
    - tree-sitter
    - CBM Lens
    - MCP JSON-RPC
