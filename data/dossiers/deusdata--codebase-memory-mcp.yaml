  latest_release_at: 2026-10-16
strengths:
  - Keeps source analysis and SQLite indexes on the local machine
  - Combines MCP access with a CLI and an optional visual graph interface
  - Covers code search, call relationships, architecture, and change-impact workflows
caveats:
  - The installer modifies detected agent or editor configuration files, so its
    scripts and planned configuration changes merit review before execution
  - Indexes and runtime configuration are stored locally and may require cache,
    memory, and worker-limit tuning for large repositories
  - CBM Lens is in open beta. Its optional browser AI downloads a model after opt-in
    and performs inference locally.
