strengths:
  - Keeps source analysis and SQLite indexes on the local machine
  - Combines MCP access with a CLI and an optional visual graph interface
  - Covers code search, call relationships, architecture, and change-impact workflows
caveats:
  - The installer modifies detected agent or editor configuration files, so its scripts and planned configuration changes merit review before execution
  - Indexes and runtime configuration are stored locally and may require cache, memory, and worker-limit tuning for large repositories
  - The cached npm and PyPI wrapper manifests state version 0.8.1, while the primary release feed identifies v0.9.0 as the latest release
