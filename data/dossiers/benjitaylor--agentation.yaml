project:
  name: Agentation
  kind: library
  summary: >-
    A React visual-feedback library that lets users annotate page elements and
    copy structured selectors, positions, and context for AI coding agents.
  best_for:
    - React teams giving precise visual feedback to an AI coding agent
    - Turning UI review notes into references that can be located in source code
key_features:
  - Click-to-annotate elements with automatic selector identification
  - Text, multi-element, and arbitrary-area annotations
  - Animation pausing to capture a specific interface state
  - Markdown output containing selectors, positions, and context
  - Dark and light toolbar themes
  - Separate MCP server package for Agentation visual-feedback workflows
usage:
  interfaces:
    - React component
    - MCP server
    - CLI
  installation:
    - npm development dependency
    - build from source with pnpm
