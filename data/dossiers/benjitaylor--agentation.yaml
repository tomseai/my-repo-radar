strengths:
  - Gives coding agents concrete selectors and page context instead of ambiguous prose
  - Supports element, text, multi-element, and area-level feedback
  - Keeps the shipped React component free of runtime dependencies
caveats:
  - The library is React-only and requires React 18 or later
  - The README states that mobile browsers are not supported
  - The PolyForm Shield license prohibits competing uses and is not a permissive
    open-source license
  - The widget and MCP package are independently versioned. Widget v3.1.2 appears as
    a Git tag, while v3.1.0 is the latest published GitHub release.
