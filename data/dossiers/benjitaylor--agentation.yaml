project:
  name: Agentation
  kind: library
  summary: A React visual-feedback library that lets users annotate page elements and
    copy structured selectors, positions, and context for AI coding agents.
  best_for:
    - React teams giving precise visual feedback to an AI coding agent
    - Turning UI review notes into references that can be located in source code
key_features:
  - Click-to-annotate elements with automatic selector identification
  - Text, multi-element, and area annotations, including open shadow roots and
    same-origin iframes
  - Pauses supported CSS animations, Web Animations, and videos to capture interface
    states
  - Markdown output containing selectors, positions, and context
  - Dark and light toolbar themes
  - Supports direct annotation sync through the separately versioned MCP package and
    a local HTTP endpoint
usage:
  interfaces:
    - React component
    - MCP server
    - CLI
  installation:
    - npm development dependency
    - build from source with pnpm
    - separate agentation-mcp package for live sync
  setup: low
technology:
  languages:
    - TypeScript
  notable_components:
    - React
    - Model Context Protocol
    - SQLite
