strengths:
  - Makes coding sessions accessible across desktop and mobile
  - Supports collaboration and multiple model runtimes through the desktop stack
  - Publishes native clients and self-hosting components

caveats:
  - The desktop app and their agent runtime are maintained in separate companion
    repositories
  - The legacy CLI wraps Claude Code or Codex. Multi-model and multiplayer
    workflows use the desktop and harness stack
  - The documentation describes end-to-end encryption for session data
  - The documented Node backend uses Postgres, Redis, and S3-compatible storage.
    The Rust backend has a different deployment profile
  - The release feed mixes native app builds and CLI releases. cli-1.2.5 is the
    latest verified stable CLI release, and the feed also contains 1.2.6 beta
    builds

