project:
  name: Happy Engineering
  kind: monorepo
  summary: >-
    A multi-model coding workspace with desktop and agent runtime companion
    repositories, native mobile session access, and a CLI wrapper for existing
    Claude Code and Codex users.
  best_for:
    - Developers who want to continue coding-agent sessions across desktop and
      mobile
    - Teams using the new desktop and harness stack to collaborate in shared
      sessions

key_features:
  - Coordinates Claude, Codex, Grok, and additional models or harnesses through
    the desktop stack
  - Supports multiplayer sessions that participants can observe and steer
    together
  - Continues sessions on native iOS and Android apps with documented end-to-end
    encrypted sync
  - Retains a CLI path for existing Claude Code and Codex sessions
  - Includes backend and push-service components for self-hosting and mobile
    notifications

usage:
  interfaces:
    - desktop app
    - native mobile apps
    - CLI
    - sync server
  installation:
    - official desktop installer
    - iOS and Android app stores
    - npm for the legacy CLI
    - self-hosted server deployment
  setup: moderate

technology:
  languages:
    - TypeScript
    - Rust
    - Swift
    - Kotlin
  notable_components:
    - Swift and UIKit
    - Kotlin and Jetpack Compose
    - PostgreSQL
    - Cloudflare Workers

