project:
  name: Happy
  kind: monorepo
  summary: >-
    A mobile and web companion for Claude Code and Codex sessions that wraps
    the local agent CLI, enables remote session control and device handoff,
    sends notifications, and advertises end-to-end encrypted synchronization.
  best_for:
    - Developers who need to check or control active Claude Code or Codex work away from a computer
    - Teams or individuals who want a remote-control layer without replacing their existing coding agent

key_features:
  - iOS, Android, and web clients for Claude Code and Codex sessions
  - A CLI wrapper that starts Claude Code or Codex through Happy
  - Remote agent-control commands for creating, sending to, and monitoring sessions
  - Device handoff between a computer and phone
  - Push notifications for permissions and errors
  - End-to-end encrypted synchronization as described by the project

