strengths:
  - Adds remote mobile and web access while retaining the local coding-agent workflow
  - Covers both Claude Code and Codex through a single wrapper and companion clients
  - Separates client, CLI, remote-agent, and encrypted-sync server components

caveats:
  - It depends on a local Claude Code or Codex session rather than supplying a coding agent itself
  - The advertised encryption property is retained as a project claim; the bundle does not contain a cryptographic design review
  - Self-hosting the backend requires Postgres, Redis, object storage, and secret configuration
  - The newest retained release is explicitly CLI-scoped, so it does not establish a version for the whole monorepo

