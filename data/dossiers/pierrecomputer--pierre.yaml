project:
  name: Pierre
  kind: monorepo
  summary: >-
    A TypeScript monorepo for public packages that render code diffs and file
    trees, with React, server-rendered, worker, and web-component entry points.
  best_for:
    - Building polished code-review, change-inspection, or repository-navigation interfaces
    - Teams that need reusable diff and tree renderers rather than a complete Git client
key_features:
  - Public @pierre/diffs package with default, React, SSR, and worker entry points
  - Public @pierre/trees package with React, SSR, and web-component entry points
  - Separate theming, theme, and path-store packages shared by the UI packages
  - Diff rendering package uses Shiki and the diff library for highlighted code changes
  - Demo, documentation, and Diffshub applications exercise the workspace packages
usage:
  interfaces:
    - TypeScript package imports
    - React components
    - web components
    - server-side rendering
  installation:
    - Source checkout with pnpm
    - Public npm packages for the Diffs and Trees components
  setup: moderate
technology:
  languages:
    - TypeScript
  notable_components:
    - React
    - Preact
    - Shiki
    - pnpm
license:
  spdx: Apache-2.0
  name: Apache License 2.0
  notes: >-
    The root LICENSE.md and published Diffs and Trees package manifests
    identify Apache-2.0.
status:
  lifecycle: active
  archived: false
  latest_release: diffs-v1.6.4
  latest_release_at: "2026-11-03"
strengths:
  - Offers focused, reusable primitives for two difficult developer-interface problems
  - Supports client, server-rendered, worker, and web-component integration patterns
  - Separates visual theming and path state from the main diff and tree components
caveats:
  - This is a component monorepo, not a complete code-review or repository-browser application
  - Diffs and Trees have distinct public entry points and independent version numbers
  - The recorded stable release applies to Diffs. The cached Trees package declares 1.0.0.
  - The feed also contains newer Diffs prereleases in the 1.7.0 beta series
