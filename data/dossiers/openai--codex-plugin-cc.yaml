project:
  name: Codex plugin for Claude Code
  kind: plugin
  summary: >-
    A Claude Code plugin that runs Codex reviews, delegates implementation or
    investigation tasks, transfers sessions to Codex, and manages its
    background jobs from Claude Code slash commands.
  best_for:
    - Claude Code users who want Codex review and delegation commands
    - Developers who want to monitor or resume Codex work from a Claude Code session

key_features:
  - Read-only Codex review of uncommitted changes or a branch
  - Steerable adversarial review for design and risk questions
  - Task delegation through a Codex subagent
  - Session transfer from Claude Code into a persistent Codex thread
  - Status, result, and cancellation commands for background jobs

usage:
  interfaces:
    - Claude Code slash commands
    - Claude Code subagent
    - background-job controls
  installation:
    - Claude Code plugin marketplace
    - npm installation of the Codex CLI when needed
  setup: moderate

technology:
  languages:
    - JavaScript
  notable_components:
    - Node.js 18.18 or later
    - Codex app-server type generation
    - Claude Code plugin marketplace

