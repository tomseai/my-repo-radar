strengths:
  - Keeps context selection and prompt construction inside the editor workflow
  - Supports both copy-and-paste web chats and direct configured-provider API calls
  - Documents local operation, direct provider requests, and no telemetry as project principles

caveats:
  - The retained release feed has no entries, so a latest release cannot be established
  - Reuse rights are unknown because no license terms are retained with the research bundle
  - Selected file and web-document content is included in prompts sent to the chosen chatbot or provider
  - Applying generated changes can use model-assisted full-file rewrites after failed or partial edits

