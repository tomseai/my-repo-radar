project:
  name: Code Web Chat
  kind: plugin
  summary: >-
    A VS Code extension and companion browser extension for preparing selected
    files as structured context, sending coding prompts to web chats or configured
    model APIs, and applying generated edits back into the local workspace.
  best_for:
    - VS Code users who want file-aware prompts for hosted chats or their own model APIs
    - Developers who want to move selected code context between the editor and web chat tools

key_features:
  - Context selection for workspace files and selected web documents
  - Prompt types for file edits, questions, cursor completions, and relevant-file discovery
  - Browser extension that fills prompts into supported web-chat interfaces
  - API tools for completions, context editing, intelligent updates, and commit messages
  - Saved workspaces, checkpoints, and configurable model-provider settings

usage:
  interfaces:
    - VS Code extension
    - browser extension
    - editor webview
    - model-provider APIs
  installation:
    - Visual Studio Code Marketplace
    - Open VSX Registry
    - build and install VSIX from source
  setup: moderate

