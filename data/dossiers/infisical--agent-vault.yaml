project:
  name: Agent Vault
  kind: service
  summary: >-
    A self-hostable HTTP credential proxy and vault that lets AI agents call
    external APIs through a MITM proxy, injecting stored credentials without
    exposing the real values to the agent process.
  best_for:
    - Operators giving coding or custom agents controlled access to
      authenticated APIs
    - Remote or ephemeral agent environments that need brokered, scoped
      credentials
key_features:
  - Substitutes dummy or absent authentication values with stored credentials at
    the proxy boundary
  - Applies service and endpoint access rules, including an optional strict deny
    policy
  - Logs authenticated requests for agent monitoring and diagnosis
  - Supports named agents, vault roles, token rotation, and temporary
    vault-scoped sessions
  - Provides a CLI, web management UI, HTTP API, Docker image, and TypeScript SDK
  - Uses SQLite by default and supports PostgreSQL for shared multi-instance
    deployments

