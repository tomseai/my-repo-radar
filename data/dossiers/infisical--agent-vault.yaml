strengths:
  - Avoids handing real API credentials directly to the agent runtime
  - Works transparently with agents and tools that honor proxy environment
    variables
  - Offers both quick local wrapping and token-based remote-agent deployment
    patterns

caveats:
  - The maintainers no longer recommend the standalone project for new setups;
    they direct users to Agent Vault in Infisical
  - Its security model requires deployment on a separate host from agents and
    keeping the credential-injecting proxy private
  - The convenient vault run wrapper is explicitly not a sandbox; a child
    process can bypass its proxy settings
  - MITM proxy operation requires managing the Agent Vault CA trust chain in
    agent environments
  - Enterprise code, if present under ee/, is not licensed under the
    repository's MIT terms

