project:
  name: awesome
  kind: curated-list
  summary: >-
    A curated, categorized index of Awesome lists that links to resource
    collections across software, platforms, learning, work, and other topics.
  best_for:
    - Finding a starting point for a topic-specific resource collection
    - Discovering Awesome lists to browse, follow, or contribute to
key_features:
  - A large Markdown index organized into broad sections and nested topic links
  - Links to independently maintained Awesome lists rather than attempting to catalog each resource itself
  - Guidance for adding a list, creating a new list, and contributing through GitHub pull requests
  - Pull requests that change the index run an awesome-lint workflow
usage:
  interfaces:
    - Markdown index
    - GitHub repository
    - Web redirect at awesome.re
  installation:
    - Browse readme.md on GitHub
    - Visit awesome.re
  setup: low
