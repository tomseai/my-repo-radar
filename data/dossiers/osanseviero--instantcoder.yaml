strengths:
  - Small retained source set makes the prompt-to-app stack easy to inspect
  - The README identifies the model API, sandbox, and frontend framework directly
  - A hosted demo is linked alongside local development instructions

caveats:
  - Local running requires a Google AI Studio API key
  - The README's clone command names osanseviero/GemCoder rather than this InstantCoder repository
  - The retained release feed has no entries, and the available evidence does not establish lifecycle status
  - The MIT copyright names Hassan El Mghari while the README says the project is based on llamacoder; provenance is not resolved by this bundle

