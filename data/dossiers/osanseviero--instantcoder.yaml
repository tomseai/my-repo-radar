project:
  name: InstantCoder
  kind: application
  summary: >-
    A small Next.js prompt-to-app project that sends a user prompt to the
    Gemini API and presents generated code in a Sandpack sandbox; the retained
    README says it is fully based on the llamacoder project and links a hosted demo.
  best_for:
    - Trying a compact Gemini-based prompt-to-app workflow
    - Developers inspecting a small Next.js and Sandpack code-generation example

key_features:
  - Generates small applications from one prompt through the Gemini API
  - Uses Sandpack as the generated-code sandbox
  - Uses the Next.js App Router with Tailwind CSS
  - Includes local development, build, start, and lint npm scripts
  - Links to a hosted Hugging Face Spaces demo

usage:
  interfaces:
    - web application
    - hosted demo
  installation:
    - clone repository
    - npm install and npm run dev
  setup: moderate

technology:
  languages:
    - TypeScript
  notable_components:
    - Next.js
    - React
    - Tailwind CSS
    - Sandpack
    - Google Gemini API

