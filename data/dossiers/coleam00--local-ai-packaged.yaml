project:
  name: local-ai-packaged
  kind: starter-template
  summary: >-
    A Docker Compose starter template for assembling a self-hosted local-AI and
    low-code environment around Ollama, n8n, Open WebUI, Supabase, and related
    data, search, graph, proxy, and observability services.
  best_for:
    - Developers prototyping self-hosted AI workflows with local models
    - Teams willing to operate a multi-service stack and configure its secrets
key_features:
  - Combines Ollama, n8n, Open WebUI, Supabase, Qdrant, Neo4j, Flowise, SearXNG, Caddy, and Langfuse in one Compose configuration
  - Includes pre-built n8n RAG-agent workflows and instructions for connecting them to Open WebUI
  - Offers CPU, NVIDIA GPU, and AMD GPU Compose profiles for the Ollama service
  - Supports a public deployment mode that closes all ports except HTTP and HTTPS
usage:
  interfaces:
    - Docker Compose services
    - n8n web interface
    - Open WebUI web interface
  installation:
    - Clone the repository's stable branch
    - Configure a .env file and start services with the Python helper script
    - Docker Desktop or Docker Engine with an appropriate CPU or GPU profile
  setup: high
technology:
  languages:
    - Python
    - YAML
  notable_components:
    - Docker Compose
    - Ollama
    - n8n
    - Supabase
    - Open WebUI
    - Langfuse
