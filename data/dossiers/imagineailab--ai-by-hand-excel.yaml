strengths:
  - Uses editable spreadsheets to make abstract calculations concrete and inspectable
  - Progresses from matrix fundamentals to a broad collection of neural-network architectures
  - Provides source workbooks under a clear permissive MIT license
caveats:
  - The repository is exercise material, not a production machine-learning library or training framework
  - Workbook behavior depends on a compatible spreadsheet application and is not documented for every Excel alternative
  - Some named topics are only listed as coming soon, so they should not be assumed to have a workbook
  - The cached GitHub releases feed contains no release entries, and the retained files do not characterize project lifecycle
