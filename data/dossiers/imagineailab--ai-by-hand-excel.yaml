project:
  name: "AI by Hand: Exercises in Excel"
  kind: course
  summary: >-
    A collection of Excel workbooks for manually working through machine-learning
    and neural-network concepts, from dot products and softmax to transformers,
    Mamba, and AlphaFold.
  best_for:
    - Learners who want to inspect model mechanics in spreadsheet exercises
    - Teaching or self-study that benefits from small, editable worked examples
key_features:
  - Includes basic exercises for softmax, LeakyReLU, and temperature
  - Provides advanced workbooks for MLPs, backpropagation, RNNs, LSTMs, ResNet, attention, transformers, autoencoders, Mamba, and AlphaFold
  - Supplies a blank DeepSeek lecture workbook for multi-head latent attention and mixture-of-experts material
  - Adds foundational workbook exercises for dot products, matrix multiplication, and linear layers
