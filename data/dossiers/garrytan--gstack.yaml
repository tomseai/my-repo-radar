project:
  name: gstack
  kind: plugin
  summary: >-
    An MIT-licensed collection of skills and command-line tools that adds
    structured planning, review, QA, browser, security, and release workflows
    to supported AI coding agents.
  best_for:
    - Developers who want opinionated software-delivery workflows in an AI coding agent
    - Technical leads who want repeatable review, QA, security, and release steps

key_features:
  - Specialist slash-command workflows for product, engineering, design, review, QA, security, and release work
  - An automated planning pipeline that chains product, design, engineering, and developer-experience review
  - Real Chromium browser control with screenshots and authenticated-session cookie import
  - QA workflows that can reproduce defects, make fixes, generate regression tests, and re-verify
  - A security-review workflow based on OWASP Top 10 and STRIDE threat modeling
  - Host detection and skill installation for Claude Code, Codex CLI, OpenCode, Cursor, and other coding agents

usage:
  interfaces:
    - agent slash commands
    - command-line tools
    - browser sidebar
  installation:
    - clone the repository and run its setup script
    - install through a supported coding-agent host
  setup: moderate

technology:
  languages:
    - TypeScript
    - Markdown
  notable_components:
