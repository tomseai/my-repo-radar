project:
  name: bRAG-langchain
  kind: course
  summary: >-
    A hands-on notebook course for learning retrieval-augmented generation
    (RAG), progressing from a basic customizable chatbot to routing, advanced
    indexing and retrieval, reranking, and scalable RAG techniques.
  best_for:
    - Developers learning how RAG pipelines fit together through runnable
      notebooks
    - Practitioners adapting examples for a LangChain-based RAG prototype
key_features:
  - Introduces document loading, embedding generation, vector stores, and a
    baseline retrieval-and-generation pipeline
  - Includes a full basic RAG notebook with starter code for a customizable
    chatbot
  - Demonstrates multi-query retrieval, query routing, structured metadata
    filters, and vector-store integration
  - Covers multi-vector indexing, RAPTOR and ColBERT examples, plus
    retrieval-and-reranking approaches
usage:
  interfaces:
    - Jupyter notebooks
  installation:
    - Clone the repository and create a Python 3.11 virtual environment
    - Install the pinned project dependency list with pip
    - Configure required provider and vector-store environment variables in .env
  setup: moderate
technology:
  languages:
    - Python
    - Jupyter Notebook
  notable_components:
    - LangChain
    - ChromaDB
    - Pinecone
    - OpenAI embeddings
    - Cohere reranking
