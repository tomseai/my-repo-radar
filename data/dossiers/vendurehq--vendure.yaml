project:
  name: vendure
  kind: monorepo
  summary: A plugin-first headless commerce platform for B2B and other storefronts,
    built around a TypeScript GraphQL backend and React admin dashboard.
  best_for:
    - Teams building configurable D2C, B2B, marketplace, or omnichannel commerce
      services.
    - Projects needing catalogs, orders, customers, promotions, tax, shipping,
      payments, and stock on one backend.
key_features:
  - Serves commerce functionality through an extensible GraphQL API.
  - Provides stable plugin contracts, service overrides, and custom-entity extension
    points.
  - Includes the @vendure/core framework, CLI, official plugins, admin dashboard, and
    e2e harness.
  - Ships a React and TanStack-based administrative dashboard.
usage:
  interfaces:
    - GraphQL API
    - React and TanStack admin dashboard
    - vendure CLI
    - plugin extension API
  installation:
    - npx @vendure/create my-shop
    - New projects require Node.js 20.19+ or 22.12+ and PostgreSQL, MySQL, MariaDB,
      or SQLite.
  setup: high
technology:
  languages:
    - TypeScript
  notable_components:
    - Node.js
    - NestJS
    - GraphQL
    - React
    - TanStack dashboard
    - SQL database support
license:
  spdx: GPL-3.0-or-later
  name: GNU General Public License v3.0 or later
  notes: The default open-source license is GPLv3; the repository also describes a
    separately contracted Vendure Commercial License and a GPL section 7 exception
    for independently licensed Vendure plugins.
status:
  lifecycle: active
  archived: false
  latest_release: v3.8.2
  latest_release_at: 2026-11-12
strengths:
  - Covers core commerce domain functions and multi-channel use cases in one backend.
  - Extension points permit business-specific behavior without patching the core.
  - Provides a first-party scaffold command, dashboard, CLI, plugins, and testing
    harness.
caveats:
  - The source project is a monorepo; its README recommends scaffolding with
    @vendure/create instead of cloning it for application development.
  - The README recommends Node.js 22.12+ and a supported SQL database.
  - GPLv3 is the default open-source license, while commercial usage alternatives
    require a separate agreement.
  - The paid plans add B2B capabilities such as company accounts, quotes, contract
    pricing, and approvals.
