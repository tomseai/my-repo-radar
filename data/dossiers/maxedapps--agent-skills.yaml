project:
  name: Maxed Apps Agent Skills
  kind: curated-list
  summary: >-
    A collection of nine focused agent skills for planning and implementing
    changes, reviewing code and tests, using Git worktrees, and producing
    slides, images, or technical wikis.
  best_for:
    - Coding-agent users assembling focused development and documentation
      workflows
    - Teams that want architecture decisions, implementation plans, and
      verification recorded together
key_features:
  - Plans changes with an architecture decision record and a companion
    implementation plan
  - Reviews changes for defects and unnecessary complexity and maintains
    behavior-focused tests
  - Implements plans with independent review and can delegate work into an
    isolated Git worktree
  - Includes separate skills for creating agent skills, knowledge bases, slides,
    and images
usage:
  interfaces:
    - agent skill files
  installation:
    - npx skills add maxedapps/agent-skills --list
    - install individual skills or all available skills
  setup: low
