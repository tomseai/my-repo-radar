strengths:
  - Maintains small, independently installable skill packages
  - Connects decisions, planning, implementation, and verification through
    reusable workflows
caveats:
  - Some skills require separate tools or service credentials, including
    agent-browser for UI verification and fal.ai for image generation
  - Agent harnesses vary in skill discovery and invocation support
  - The retained GitHub feed contains no versioned releases
