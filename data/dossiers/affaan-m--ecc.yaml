strengths:
  - Keeps durable workflow assets in one source while adapting loading and enforcement to each harness.
  - Selective installation records ECC-managed operations, enabling inspection and safer repair or removal.
  - Documents official distribution channels and explicit guidance for secrets and MCP configuration.
caveats:
  - "Harness coverage is not feature-identical: Codex is instruction-backed for hooks, while Gemini is a compatibility surface rather than full hook parity."
  - The ecc2 session and control-plane surface is alpha, with release packaging and cross-harness session behavior still maturing.
  - Review generated harness and MCP configuration before use; template secrets must be supplied through environment variables or a secrets manager.
  - The 2026-07-19 GitHub snapshot reports 231,183 stars and 35,276 forks for a repository created in January 2026; this unusually rapid popularity growth is not explained by the retained sources and should not be treated as quality evidence.
