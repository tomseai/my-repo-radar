project:
  name: ECC
  kind: framework
  summary: A reusable workflow layer of skills, rules, hooks, MCP configuration,
    and installers for AI-agent development harnesses.
  best_for:
    - Teams standardizing agent-assisted software-development workflows across
      more than one supported harness.
key_features:
  - Shares portable SKILL.md assets, rules, instructions, and MCP conventions
    across harness adapters.
  - Provides target-aware installation profiles, previews, durable install
    state, and doctor, repair, and uninstall commands.
  - Includes hooks, security scanning, research, evaluation, and orchestration
    workflow assets where the target harness supports them.
  - Provides native plugin paths for Claude Code, Codex, and Qoder, with
    harness-specific adapters for OpenCode, Cursor, GitHub Copilot, and others.
usage:
  interfaces:
    - command line
    - harness plugins and configuration files
    - GitHub App
  installation:
    - Run install.sh or install.ps1 from a source checkout.
    - Use ecc-universal with Node.js 18 or newer for guided Claude Code, Codex,
      and Kimi Code setup.
    - Select a target and profile or modules through the manifest-driven
      installer.
  setup: moderate
technology:
  languages:
    - JavaScript
    - Python
    - Rust
  notable_components:
    - Node-based selective installer
    - harness adapters
    - hook scripts
    - MCP configuration
    - SQLite-backed install state
