strengths:
  - Keeps durable workflow assets in one source while adapting loading and
    enforcement to each harness.
  - Selective installation records ECC-managed operations, enabling inspection
    and safer repair or removal.
  - Documents official distribution channels and explicit guidance for secrets
    and MCP configuration.
caveats:
  - Codex native hooks require an explicit trust decision. GitHub Copilot
    has limited adapter coverage, and several other harnesses remain experimental.
  - The separately versioned ecc2 control plane remains alpha. Some optional
    workflows require Bash, Python, or provider-specific tools.
  - Review generated harness and MCP configuration before use; template secrets
    must be supplied through environment variables or a secrets manager.
  - The 2026-07-19 GitHub snapshot reports 231,183 stars and 35,276 forks for a
    repository created in January 2026; this unusually rapid popularity growth
    is not explained by the retained sources and should not be treated as
    quality evidence.
