project:
  name: Chatbox Community Edition
  kind: application
  summary: >-
    A GPL-3.0 desktop-first AI chat client for Windows, macOS, and Linux that
    also provides web and mobile clients for conversations with hosted and
    locally served language-model providers.
  best_for:
    - Individuals who want an installable, local-data AI chat client across desktop and mobile devices
    - Users connecting their own accounts or endpoints for several hosted or local model providers
key_features:
  - Connects to OpenAI, Azure OpenAI, Claude, Gemini, Ollama, and ChatGLM providers
  - Stores chat data locally and supports streaming replies, a prompt library, and message quoting
  - Renders Markdown, LaTeX, and syntax-highlighted code in conversations
  - Ships desktop packages plus web, iOS, and Android clients
  - Offers an optional team-sharing component for collaboration and shared OpenAI API resources
usage:
  interfaces:
    - desktop GUI
    - web application
    - native mobile applications
  installation:
    - download a platform installer from GitHub Releases
    - install the iOS or Android client
    - build from a source checkout with pnpm
  setup: low
