strengths:
  - Combines database, server functions, and client libraries in one reactive
    platform
  - Offers supported Docker and binary paths for self-hosting
  - A Rust workspace supports a substantial backend implementation
caveats:
  - The Functional Source License restricts competing commercial offerings
    before conversion
  - The retained release feed contains timestamped, commit-hash precompiled
    builds, most recently precompiled-2026-11-21-cf39368. It does not
    establish a stable project release
  - Building from source requires replacing the repository's default instance
    secret and admin key
  - Windows has received less production testing than Linux and macOS
  - Self-hosted builds send a minimal anonymous beacon unless disabled with
    the backend flag
