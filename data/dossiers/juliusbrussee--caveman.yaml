project:
  name: caveman
  kind: plugin
  summary: >-
    An agent tooling collection combining terse response skills with optional
    proxy-based tool-output compression, memory-file compression, hooks, and
    utilities for supported coding agents.
  best_for:
    - Users of supported AI coding agents who prefer concise technical replies
    - Output-heavy agent sessions where shorter responses are worth measuring
key_features:
  - Response-style skills offer several levels of concision
  - Commands for concise commit messages, code-review comments, and session
    statistics
  - Optional compression of named agent-memory files while preserving code,
    URLs, and paths
  - Agent-specific installation paths for Claude Code, Codex, Gemini CLI, and
    other clients
  - Compresses tool output and offers an optional MCP-description proxy
  - Offers automatic model routing, reusable scripts, and compressed browsing
  - Local Claude Code hooks and a token-savings statusline integration
