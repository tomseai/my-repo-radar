project:
  name: caveman
  kind: plugin
  summary: >-
    An installable skill and plugin collection that tells supported AI coding
    agents to produce terse, technical "caveman" responses, with session modes,
    optional memory-file compression, Claude Code hooks, and an MCP-description
    compression proxy.
  best_for:
    - Users of supported AI coding agents who prefer concise technical replies
    - Output-heavy agent sessions where shorter responses are worth measuring

key_features:
  - Six response modes, including lite, full, ultra, and wenyan
  - Commands for concise commit messages, code-review comments, and session statistics
  - Optional compression of named agent-memory files while preserving code, URLs, and paths
  - Agent-specific installation paths for Claude Code, Codex, Gemini CLI, and other clients
  - Optional caveman-shrink MCP proxy for upstream tool descriptions
  - Local Claude Code hooks and a token-savings statusline integration

