strengths:
  - Covers the core edit-build-debug workflow in a single extensible editor
  - Includes language support foundations through built-in extensions
  - Provides a documented containerized environment for source development

caveats:
  - This repository is Code - OSS, not the separately licensed Microsoft Visual
    Studio Code distribution
  - A full source build in the documented container or Codespaces setup needs at
    least four CPU cores and 6 GB of RAM, with 8 GB recommended
  - Rich language support can depend on individual built-in or installed
    extensions

