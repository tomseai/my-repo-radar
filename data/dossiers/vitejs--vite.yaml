project:
  name: vite
  kind: cli
  summary: A frontend development server and production build tool that provides fast iteration and optimized static assets for modern web projects.
  best_for:
    - Web projects that need fast hot module replacement during development and optimized static assets for production.
    - Tooling integrations that use Vite's typed JavaScript and plugin APIs.
key_features:
  - Provides a development server that enhances native ES modules.
  - Supports fast Hot Module Replacement during development.
  - Builds optimized static production assets with Rolldown.
  - Exposes typed Plugin API and JavaScript API extension points.
  - Includes the vite package, create-vite scaffolder, and @vitejs/plugin-legacy package.
usage:
  interfaces:
    - vite CLI
    - JavaScript API
    - Plugin API
    - create-vite CLI
  installation:
    - vite package from npm as a project development dependency
    - create-vite package from npm for project scaffolding
  setup: low
