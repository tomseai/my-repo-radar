strengths:
  - Combines a development server and production build workflow in one tool.
  - Offers API-level extensibility with typed plugin and JavaScript interfaces.
  - Includes a first-party starter scaffolder and legacy-browser plugin package.
caveats:
  - The cached vite package requires Node.js ^20.19.0 or >=22.12.0.
  - The repository is a monorepo, so package versions can differ; the latest recorded release here is specifically the vite package release.
  - Production builds output static assets; application hosting and backend services remain outside this tool's scope.
