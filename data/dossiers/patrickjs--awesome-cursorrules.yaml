project:
  name: Awesome Cursor Rules
  kind: curated-list
  summary: >-
    A curated collection of Markdown-based Cursor Project Rules (`.mdc`)
    that provide project, framework, file-type, and workflow guidance for
    Cursor's AI-assisted code editor.
  best_for:
    - Cursor users adapting reusable guidance to a specific codebase or framework
    - Teams sharing AI-editor conventions, coding standards, and project context

key_features:
  - Rule catalog organized by frontend, backend, mobile, styling, testing, security, and documentation
  - Modern `.mdc` Project Rules format with description, glob, and always-apply frontmatter
  - Copy-to-project workflow for `.cursor/rules/`
  - Rules spanning multiple languages, frameworks, and development workflows
  - Repository scripts for list, rule, README, security, and repository-hygiene checks

usage:
  interfaces:
    - Markdown rule files
    - GitHub repository
  installation:
    - copy selected .mdc files into .cursor/rules/
    - clone or download repository
  setup: low

