project:
  name: NextChat
  kind: application
  summary: >-
    An MIT-licensed AI chat application available as a deployable web/PWA client
    and Tauri desktop application, with local browser storage, hosted and
    self-hosted model endpoints, and optional MCP support.
  best_for:
    - Individuals self-hosting a compact AI chat client with their own
      model-provider credentials
    - Users who want local browser chat storage, prompt templates, and a
      cross-platform desktop option
key_features:
  - Supports OpenAI-compatible, Azure, Anthropic, Google, DeepSeek, and other
    configured model endpoints
  - Stores data locally in the browser and offers a responsive PWA with
    streaming responses
  - Provides prompt templates, conversation-history compression, Markdown,
    LaTeX, Mermaid, and code highlighting
  - Builds a desktop application with Tauri and documents iOS availability
  - Can enable Model Context Protocol support through the ENABLE_MCP build
    environment variable
usage:
  interfaces:
    - web application and PWA
    - Tauri desktop application
    - iOS application
  installation:
    - one-click Vercel deployment
    - Docker container deployment
    - source checkout with Yarn and Node.js
  setup: moderate
technology:
  languages:
    - TypeScript
    - Rust
  notable_components:
