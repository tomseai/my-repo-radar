strengths:
  - Offers several deployment paths while keeping chat data in the browser by default
  - Supports self-hosted and hosted model endpoints in a compact client
  - Includes prompt templates, long-conversation compression, and rich technical-content rendering
caveats:
  - Hosted-provider deployments require an API key and optional endpoint-specific configuration
  - MCP is opt-in at build time through ENABLE_MCP rather than enabled in every deployment
  - The README's desktop download link targets the historic Yidadaa/ChatGPT-Next-Web releases, so desktop release provenance is not solely established by this repository
