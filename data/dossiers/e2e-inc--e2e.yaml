project:
  name: e2e
  kind: framework
  summary: >-
    An end-to-end testing framework for web and mobile apps combining natural-language
    agent actions with conventional locators and assertions.
  best_for:
    - Teams automating application journeys across browsers and mobile devices
key_features:
  - Agent-driven actions and assertions alongside deterministic test assertions
  - Replays verified agent actions without model calls until the app changes
  - Browser engines via Playwright and mobile simulators and emulators
  - MCP server for coding agents to inspect apps and run suites
  - Optional hosted browser and device integrations and HTML reporting
usage:
  interfaces: [TypeScript SDK, CLI, MCP server]
  installation: [npm package, npx initialization]
  setup: moderate
