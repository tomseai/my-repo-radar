strengths:
  - Combines exploratory agent actions with repeatable checks in one test
  - Supports web and mobile with optional external device providers
caveats:
  - Pre-1.0 APIs and configuration may change between minor releases
  - Agent steps require a subscription, API key, or local model; ordinary tests do not
  - CLI telemetry is enabled by default and can be disabled
  - The retained release feed contains independently versioned component releases; it does not establish a primary e2e package release
