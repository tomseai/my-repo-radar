project:
  name: Squeaky Clean
  kind: cli
  summary: >-
    An agentic code-generation and architecture-recovery CLI that turns a
    declarative ProblemSpec into Clean-Architecture applications by
    orchestrating parallel, pattern-specialized agents through the compact
    Squib architecture DSL.
  best_for:
    - Generating backend applications from explicit requirements while enforcing Clean Architecture boundaries
    - Experimenting with cost-tiered parallel coding-agent pipelines and reproducible evaluations
    - Recovering and refactoring brownfield Python, JavaScript, TypeScript, or Java projects
key_features:
  - Generates buildable application projects from a declarative JSON ProblemSpec
  - Uses a validated Squib architecture DSL between model tiers
  - Runs pattern-specialized implementation agents in parallel across 34 GoF and DDD/Clean patterns
  - Enforces dependency rules and cross-service contract compatibility
  - Generates and validates Python, Java, JavaScript, and TypeScript project structures
  - Recovers architecture from existing projects and supports reviewed refactoring before regeneration
  - Includes replicated benchmarks, micro-evals, regression gates, and cached replay
