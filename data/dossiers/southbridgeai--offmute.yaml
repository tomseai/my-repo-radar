project:
  name: offmute
  kind: cli
  summary: >-
    A TypeScript CLI and package that uses Google Gemini models to analyze
    meeting audio or video, produce speaker-labeled transcripts, and
    optionally generate structured reports with meeting context and action items.
  best_for:
    - Processing recorded meetings into transcripts and reports
    - Teams that can supply a Google Gemini API key and local ffmpeg

key_features:
  - Transcribes audio or video while attempting speaker diarization
  - Extracts video screenshots for visual meeting analysis
  - Generates Markdown transcripts and optional structured meeting reports
  - Chunks long recordings and provides incremental output progress
  - Supports Pro, Flash, and Flash Lite Gemini model selections
  - Exposes transcription, description, and report functions as a package

usage:
  interfaces:
    - CLI
    - TypeScript package
  installation:
    - npx offmute
    - npm install offmute
  setup: moderate

