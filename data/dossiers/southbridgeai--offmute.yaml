strengths:
  - Covers transcription, diarization, visual analysis, and report generation
  - Offers both one-command use and programmatic TypeScript functions
  - Provides model choices to trade off quality, speed, and cost

caveats:
  - Requires Node.js, ffmpeg, and a Google Gemini API key
  - Speaker identification and generated analysis are model-assisted outputs
  - The retained GitHub release feed has no release entries
  - The bundle does not establish a current maintenance or support policy

