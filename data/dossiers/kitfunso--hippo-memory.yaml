strengths:
  - Offers one local memory layer across several agent clients and projects
  - Makes recall explainable and persists both long-term and active-task context
  - Supports a no-embedding BM25 fallback while allowing optional hybrid retrieval

caveats:
  - Requires Node.js 22.5 or later for the primary npm package
  - Hippo init can create project stores, patch agent instruction files, alter a detected Codex launcher, and install a daily runner unless disabled
  - Embedding-backed retrieval is optional; without its optional packages it falls back to BM25
  - Published evaluation claims need careful reading because the repository retracts a prior sequential-learning magnitude claim and reports no detected goal-stack effect on its tested workloads
  - The bundled Python SDK is a separate alpha-classified package that wraps the HTTP API

