project:
  name: Hippo
  kind: service
  summary: >-
    A local-first, SQLite-backed memory system for AI agents that stores project
    and global memories, retrieves context through a CLI, MCP, HTTP, and
    integrations, and applies decay, retrieval strengthening, and sleep
    consolidation to its memory layers.
  best_for:
    - Teams or individuals wanting persistent context across CLI agent tools and
      projects
    - Agent workflows that need inspectable local memory, recall, and session
      handoffs
key_features:
  - Buffer, episodic, and semantic memory layers with consolidation and decay
  - CLI commands for initialization, recall, capture, import, snapshots, and
    handoffs
  - Stdio MCP server plus HTTP API and an OpenClaw plugin
  - Optional hybrid retrieval that combines BM25 with local or configured
    embeddings
  - Markdown mirrors alongside the SQLite store for inspection and Git tracking
  - Cross-tool imports from ChatGPT exports, Claude files, Cursor rules,
    Markdown, and text
