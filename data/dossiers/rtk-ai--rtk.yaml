project:
  name: RTK
  kind: cli
  summary: A Rust command-line tool that compresses coding-agent command output
    and tracks estimated token savings. Optional pipelines can extend
    filtering or route selected work through other models.
  best_for:
    - Coding-agent users who want more compact shell-command context without
      changing their normal developer commands
    - Teams that want local token-savings analytics and configurable
      command-output filtering
key_features:
  - Filters, groups, truncates, and deduplicates output from more than 100
    supported developer commands
  - Provides compact wrappers for files, Git and GitHub CLI, tests, builds,
    linters, containers, cloud, and data commands
  - Installs hooks, plugins, or rules for supported coding assistants to
    rewrite eligible shell commands automatically
  - Stores token-savings history and exposes gain, session, and discovery
    analytics commands
  - Saves full command output on configured failures so an agent can inspect
    it without rerunning the command
  - Supports optional pipelines for agent-specific tool filtering, model
    routing, and API traffic processing
