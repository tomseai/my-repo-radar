project:
  name: RTK
  kind: cli
  summary: >-
    A Rust command-line proxy for coding-agent workflows that runs supported developer
    commands, filters their output before it reaches the LLM context, tracks resulting
    token savings, and can install agent-specific hooks or instruction-based integrations.
  best_for:
    - Coding-agent users who want more compact shell-command context without changing their normal developer commands
    - Teams that want local token-savings analytics and configurable command-output filtering
key_features:
  - Filters, groups, truncates, and deduplicates output from more than 100 supported developer commands
  - Provides compact wrappers for files, Git and GitHub CLI, tests, builds, linters, containers, cloud, and data commands
  - Installs hooks, plugins, or rules for supported coding assistants to rewrite eligible shell commands automatically
  - Stores token-savings history and exposes gain, session, and discovery analytics commands
  - Saves full command output on configured failures so an agent can inspect it without rerunning the command
  - Offers per-user and per-project configuration for filters, excluded commands, tracking, output, and telemetry
