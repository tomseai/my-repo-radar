project:
  name: Agent Engineer
  kind: course
  summary: >-
    A practical, beginner-oriented course that teaches AI-agent fundamentals,
    then introduces building and shipping agents with Google Cloud AI, Vertex
    AI, and the Agent Development Kit (ADK).
  best_for:
    - Software engineers learning core AI-agent concepts before choosing tools
    - Developers seeking a structured introduction to Google Cloud agent development
key_features:
  - Nineteen lessons arranged across fundamentals, building and shipping, and deep dives
  - Platform-agnostic introductions to tools, memory, planning, multi-agent systems, RAG, evaluation, and safety
  - Google Cloud, Vertex AI, and ADK lessons, including a first-agent walkthrough
  - Coverage of MCP, A2A, AGENTS.md, reusable agent skills, and orchestrators
  - Links to maintained official documentation and codelabs instead of copied API references
usage:
  interfaces:
    - GitHub Markdown lessons
  installation:
    - No installation; read the lessons in the repository
    - Follow linked official documentation and codelabs for hands-on practice
  setup: low
technology:
  languages:
    - Markdown
  notable_components:
    - Google Cloud AI
    - Vertex AI
    - Agent Development Kit (ADK)
    - Model Context Protocol (MCP)
    - Agent2Agent (A2A)
