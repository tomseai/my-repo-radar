project:
  name: flue
  kind: framework
  summary: A TypeScript agent-harness framework for building agents with
    persistent sessions, typed tools, reusable skills, and local, virtual, or
    remote sandbox execution.
  best_for:
    - TypeScript teams building model-driven agents that need controlled tools
      and execution environments
    - Deploying agents across Node.js, serverless, CI, or hosted runtimes
key_features:
  - Agents that keep session context across conversations and events
  - Local, virtual, and remote container sandbox options
  - Typed tools, reusable skills, and MCP-server connectivity
  - Durable recovery for accepted agent work
  - Specialized subagents and event channels including Slack, Teams, Discord,
    and GitHub
  - OpenTelemetry, Braintrust, and Sentry observability integrations
usage:
  interfaces:
    - CLI
    - TypeScript API
    - HTTP agent endpoints
  installation:
    - "@flue/cli package for local agent runs"
    - pnpm workspace for development from source
  setup: moderate
technology:
  languages:
    - TypeScript
  notable_components:
    - Model Context Protocol
    - OpenTelemetry
    - PostgreSQL persistence adapter
license:
  spdx: Apache-2.0
  name: Apache License 2.0
  notes: null
status:
  lifecycle: experimental
  archived: false
  latest_release: "@flue/cli@2.2.2"
  latest_release_at: 2026-09-28
strengths:
  - Combines agent context, tools, skills, sandboxes, and durable execution in
    one TypeScript-oriented framework
  - Supports local development and several deployment targets without coupling
    the harness to one model provider
  - Provides built-in integrations for MCP, telemetry, and event-driven channels
caveats:
  - The monorepo publishes component versions. The listed release is the
    verified Flue CLI publication. The newer v2.3.1 repository tag has no GitHub
    release.
  - A production deployment still requires choosing and configuring a model
    provider, sandbox, persistence, and hosting environment
  - The project accepts issues and feature discussions but generally does not
    accept external pull requests
