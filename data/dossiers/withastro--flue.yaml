project:
  name: flue
  kind: framework
  summary: >-
    A TypeScript agent-harness framework for building autonomous agents and
    guided workflows with sessions, tools, skills, filesystem access, and
    local, virtual, or remote sandbox execution.
  best_for:
    - TypeScript teams building model-driven agents that need controlled tools and execution environments
    - Deploying agent workflows across Node.js, serverless, CI, or hosted runtimes
key_features:
  - Stateful agents and structured workflows
  - Local, virtual, and remote container sandbox options
  - Typed tools, reusable skills, and MCP-server connectivity
  - Durable recovery for accepted agent work
  - Specialized subagents and event channels including Slack, Teams, Discord, and GitHub
  - OpenTelemetry, Braintrust, and Sentry observability integrations
usage:
  interfaces:
    - CLI
    - TypeScript API
    - HTTP agent endpoints
  installation:
    - source workspace with pnpm
    - Node.js deployment
  setup: moderate
technology:
  languages:
    - TypeScript
  notable_components:
    - Model Context Protocol
    - OpenTelemetry
    - PostgreSQL persistence adapter
