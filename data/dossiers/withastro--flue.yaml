  spdx: Apache-2.0
  name: Apache License 2.0
  notes: null
status:
  lifecycle: experimental
  archived: false
  latest_release: v1.0.0-beta.9
  latest_release_at: 2026-06-30
strengths:
  - Combines agent context, tools, skills, sandboxes, and durable execution in one TypeScript-oriented framework
  - Supports local development and several deployment targets without coupling the harness to one model provider
  - Provides built-in integrations for MCP, telemetry, and event-driven channels
caveats:
  - The latest retained release is a beta, so API and operational behavior may still change
  - A production deployment still requires choosing and configuring a model provider, sandbox, persistence, and hosting environment
  - The project accepts issues and feature discussions but generally does not accept external pull requests
