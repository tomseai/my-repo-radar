project:
  name: cccc
  kind: cli
  summary: >-
    A Rust CLI and library for measuring cognitive and cyclomatic complexity
    across mixed-language source trees.
  best_for:
    - Developers reviewing complexity hotspots or enforcing thresholds in CI
key_features:
  - Calculates cognitive and cyclomatic complexity for many programming languages
  - Routes source files by extension to language-specific parsers
  - Outputs JSON, tables, or simple per-function lines
  - Filters and reports threshold violations
  - Exposes a reusable language-agnostic scoring engine and parser adapters
