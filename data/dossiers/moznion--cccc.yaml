strengths:
  - A single CLI can analyze a mixed-language tree with consistent output
  - The scoring engine can be embedded independently of the CLI
caveats:
  - Language-specific parsing and scoring limitations are documented in the README
  - Building some adapters requires a C compiler; the Ruby adapter also requires libclang
