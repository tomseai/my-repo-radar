project:
  name: reveal.js
  kind: framework
  summary: An HTML presentation framework for authoring and presenting
    browser-based slide decks with a JavaScript API and optional plugins.
  best_for:
    - Publishing a customized web presentation from HTML, Markdown, or React
      components
    - Developers who need a self-hostable slide-deck framework rather than a
      hosted editor
key_features:
  - Horizontal and nested vertical slides with configurable themes and
    transitions
  - Plugins for Markdown, syntax highlighting, math, speaker notes, search,
    and zoom
  - PDF export, speaker view, Auto-Animate, and a documented JavaScript API
  - Published JavaScript, ES module, CommonJS, CSS, and TypeScript type entry
    points
  - Official React wrapper introduced with the 6.0 release
usage:
  interfaces:
    - HTML presentation markup
    - Browser JavaScript API
    - React component wrapper
  installation:
    - npm package
    - Source checkout for local development
    - Packaged browser JavaScript and CSS files
