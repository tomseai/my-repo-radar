strengths:
  - Combines authoring features, presenter tools, export, and an extensible
    API in one framework
  - Supports standard web delivery and package-based integration with included
    type declarations
  - Includes core plugins for common technical-presentation needs such as
    Markdown, code, and math
caveats:
  - "It is a developer-oriented framework: users still author, host, and style
    the presentation content themselves"
  - The graphical Slides.com editor mentioned by the project is a separate
    hosted product
  - Version 6 changed plugin, module, and CSS package paths; existing
    integrations need the documented upgrade review
  - The retained package metadata requires Node.js 22.12 or later for
    repository development
