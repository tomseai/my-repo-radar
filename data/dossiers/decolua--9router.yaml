project:
  name: 9Router
  kind: service
  summary: A self-hosted AI gateway and dashboard that presents one
    OpenAI-compatible endpoint to coding tools while routing requests across
    configured model providers, accounts, and fallback combinations.
  best_for:
    - Running local or self-hosted model routing for compatible coding tools
    - Combining provider subscriptions, API keys, and fallback models behind one
      endpoint
key_features:
  - OpenAI-compatible API plus translation among OpenAI, Claude, Gemini, Cursor,
    Kiro, Vertex, and other formats
  - Configurable model combinations with account- and provider-level fallback
  - OAuth and API-key provider connections with token refresh and quota tracking
  - RTK compression for tool-result content before upstream format translation
  - Dashboard for provider configuration, request logs, usage analytics, and
    costs
  - Local SQLite-backed storage with Docker and VPS deployment guidance
usage:
  interfaces:
    - Web dashboard
    - CLI
    - OpenAI-compatible HTTP API
  installation:
    - npm global package
    - Docker image
    - Build from source with Node.js
  setup: moderate
technology:
  languages:
    - JavaScript
  notable_components:
    - Next.js
    - React
    - SQLite
    - Server-Sent Events
