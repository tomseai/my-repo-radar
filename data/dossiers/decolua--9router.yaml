strengths:
  - Adapts one compatible endpoint to several upstream provider formats
  - Includes both routing resilience and operational visibility in a local
    dashboard
  - Offers low-friction npm and Docker starts alongside self-hosted deployment
    instructions
caveats:
  - Connecting providers requires credentials, provider-specific quotas, and
    configuration choices
  - Tool-result compression and output-shaping features can change content sent
    to or returned from models
  - The documented initial dashboard password and default secrets must be
    changed for real or internet-exposed deployments
  - Cloud sync is optional but introduces an external sync endpoint beyond a
    purely local installation
  - The candidate CLI manifest and newest repository tag are v0.5.119. The
    release field records the verified GitHub publication v0.5.35.
