project:
  name: MarkItDown
  kind: library
  summary: >-
    A Python document-to-Markdown converter for text-analysis and LLM workflows,
    with a command-line tool, a Python API, optional format integrations, plugins,
    and a separately packaged MCP server.
  best_for:
    - Preparing heterogeneous files as Markdown input for LLM or text-analysis pipelines
    - Python applications that need programmatic document conversion with controlled input handling

key_features:
  - Converts PDF, Office documents, images, audio, HTML, text formats, ZIP archives, EPUBs, and YouTube URLs
  - Preserves document structure such as headings, lists, tables, and links in Markdown output
  - Provides a command-line program and a Python MarkItDown conversion API
  - Supports selectively installed format dependencies instead of requiring every converter
  - Supports opt-in third-party plugins, including the bundled OCR plugin
  - Includes optional Azure Document Intelligence and Azure Content Understanding conversion paths
  - Packages an MCP server that exposes the converter through Model Context Protocol

usage:
  interfaces:
    - command-line interface
    - Python API
    - MCP server
    - Docker container
  installation:
    - pip package with optional extras
    - editable source installation
    - Docker build
  setup: low

