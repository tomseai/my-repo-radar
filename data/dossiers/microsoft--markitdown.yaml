strengths:
  - Broad conversion coverage is available behind one Python package and CLI
  - Optional dependencies let consumers limit installed format-specific tooling
  - Supports local conversion alongside opt-in cloud and MCP integrations

caveats:
  - Output is intended for text-analysis tools and is not positioned as
    high-fidelity human-facing document conversion
  - Conversion performs I/O with the current process privileges, so untrusted
    inputs require validation and narrowly scoped APIs
  - Python 3.10 through 3.14 is required; image captioning and speech
    transcription use web-hosted services, and some features incur charges

