project:
  name: LiteLLM
  kind: service
  summary: >-
    A Python SDK and deployable AI gateway that presents a unified API for many
    LLM providers and adds centralized production controls.
  best_for:
    - Applications that need a provider-neutral LLM client interface
    - Teams centralizing model access, virtual keys, spend controls, and routing
key_features:
  - Presents a unified OpenAI-compatible interface for more than 100 model
    providers
  - Offers a Python SDK and a separately deployable proxy with routing and load
    balancing
  - Provides virtual keys, spend tracking, guardrails, observability, and an
    admin dashboard
  - Supports multiple model endpoints including chat, responses, embeddings,
    images, audio, and reranking
  - Includes SDK interfaces for model routing and integrations with agent and
    tool protocols
usage:
  interfaces:
    - Python SDK
    - OpenAI-compatible HTTP API
    - proxy CLI
    - admin dashboard
  installation:
    - Python package installation with uv
    - proxy installation with the proxy extra
    - Docker deployment
    - hosted proxy offering
  setup: moderate
technology:
  languages:
    - Python
    - Rust
    - TypeScript
  notable_components:
    - FastAPI-based proxy dependencies
    - Docker Compose
    - Rust core package
license:
  spdx: null
  name: MIT for most repository content, with separate terms for litellm/enterprise/
  notes: >-
    The root LICENSE applies MIT terms outside litellm/enterprise/ and points to
    litellm/enterprise/LICENSE for that directory. The separate enterprise
    license text is outside the retained file sample.
status:
  lifecycle: active
  archived: false
  latest_release: v1.110.2
  latest_release_at: "2026-11-20"
strengths:
  - Supports both direct application integration and a centralized gateway
    deployment
  - Standardizes provider access while retaining OpenAI-compatible client usage
  - Combines access controls, spending controls, guardrails, routing, and
    logging in the gateway
caveats:
  - Enterprise components are governed by separate terms under
    litellm/enterprise/
  - The default branch identifies source version 1.112.0, and the feed has
    development, release-candidate, and LTS streams alongside the selected
    published v1.110.2 stable release
  - Gateway operation requires credentials and any persistence or control-plane
    services used by the deployment
  - Endpoint coverage and behavior vary by provider and model
