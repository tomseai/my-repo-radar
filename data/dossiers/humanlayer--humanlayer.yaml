project:
  name: HumanLayer
  kind: monorepo
  summary: >-
    A HumanLayer repository whose root README says it is now a public issues
    tracker and that nearly all code is deprecated, while retaining legacy
    CodeLayer, SDK, and human-approval workflow material.
  best_for:
    - Tracking issues or examining the retained legacy HumanLayer implementation
    - Understanding the older CodeLayer and human-in-the-loop agent workflow

key_features:
  - Root README positions the repository as HumanLayer's public issues tracker
  - Retained CodeLayer documentation describes a macOS desktop coding-agent interface
  - Retained TypeScript documentation demonstrates approval-gated OpenAI tool calls
  - Legacy documentation describes a HumanLayer CLI and configurable contact channels

