project:
  name: HumanLayer
  kind: monorepo
  summary: A workspace for teams to run coding agents on their own machines and
    coordinate tasks, sessions, plans, and reviews across a web app, desktop
    app, and host daemon.
  best_for:
    - Teams coordinating local coding agents across machines
    - Developers who want to inspect or adapt a full agent coordination stack
key_features:
  - Runs Claude Code, Codex, OpenCode, and Pi sessions through a host daemon
  - Synchronizes tasks, sessions, plans, and reviews across the web and
    desktop apps
  - Includes plugins to mirror sessions from Claude Code, OpenCode, and Pi
  - Provides a local per-worktree development stack and a cloud administration
    interface
usage:
  interfaces:
    - Web app
    - macOS desktop app
    - host daemon
    - CLI
    - coding-agent plugins
  installation:
    - Source checkout using Bun and Docker
    - Pulumi self-hosting reference
  setup: high
