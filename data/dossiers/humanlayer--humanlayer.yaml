strengths:
  - Keeps agent sessions on team-controlled hosts while syncing supervision
    across clients
  - Includes a complete local development stack and documents the hosted
    architecture
caveats:
  - The self-hosting infrastructure is a reference deployment that requires
    adaptation
  - The Docker Compose starter uses simple default passwords that must be
    changed for deployment
  - The retained feed lists legacy CodeLayer releases, headed by legacy-final,
    without an authoritative stable release for the current product
