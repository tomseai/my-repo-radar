strengths:
  - Provides both code-level and command-line entry points for mobile-agent workflows
  - Supports visual and accessibility-based device understanding rather than relying on one signal
  - Includes configurable multi-provider models and execution tracing

caveats:
  - Android local control requires ADB, developer options, USB debugging, and the Portal accessibility app
  - iOS follows a separate Portal setup path; the retained quickstart documents Android prerequisites in detail
  - Running real tasks requires configuring an LLM provider and its credentials, with associated provider terms or costs
  - Python 3.14 is unsupported; the documented supported range is Python 3.11 through 3.13

