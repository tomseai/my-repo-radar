project:
  name: Mobilerun
  kind: framework
  summary: >-
    A Python framework for LLM agents that control Android and iOS devices with
    mobile-native UI tools through a CLI, terminal UI, Docker, or Python API.
  best_for:
    - Automating and testing workflows on locally connected mobile devices
    - Building mobile agents that need UI-tree, screenshot, gesture, and
      app-control tools

key_features:
  - Controls device UI through taps, swipes, text input, app launching, and
    device-state tools
  - Combines accessibility trees and screenshots, with vision and
    screenshot-only modes
  - Offers direct execution and manager-executor reasoning modes for multi-step
    tasks
  - Supports OpenAI, Anthropic, Gemini, Ollama, DeepSeek, OpenRouter, and
    compatible models
  - Extends workflows with custom tools, app cards, credentials, and structured
    Pydantic output
  - Records trajectories and integrates tracing with Arize Phoenix or Langfuse

usage:
  interfaces:
    - CLI
    - terminal UI
    - Python API
    - Docker container
  installation:
    - uv tool installation
    - uv Python package installation
    - Docker image build
  setup: high

