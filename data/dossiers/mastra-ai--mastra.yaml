project:
  name: Mastra
  kind: framework
  summary: >-
    A TypeScript framework for building AI-powered applications and agents, with
    model routing, agents, graph-based workflows, context and memory, MCP
    servers, evaluations, and observability.
  best_for:
    - TypeScript teams building AI applications and agent workflows from
      prototype to production
    - Applications that need agent tooling, durable human approval, context
      management, and evaluation primitives
key_features:
  - Connects models from more than 40 providers through one standard interface
  - Builds tool-using agents that can iterate until a final answer or stopping
    condition
  - Orchestrates graph-based workflows with sequential, branch, and parallel
    control flow
  - Suspends and resumes agent or workflow execution for human approval using
    stored state
  - Provides conversation history, retrieval, observational memory, MCP-server
    authoring, evaluations, and observability
usage:
  interfaces:
    - TypeScript API
    - CLI project generator
    - standalone server
    - React, Next.js, and Node.js integrations
    - Mastra Studio web UI
  installation:
    - npm create mastra@latest
    - npm packages
  setup: moderate
technology:
  languages:
    - TypeScript
  notable_components:
