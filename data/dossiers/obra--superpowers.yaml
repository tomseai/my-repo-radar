project:
  name: Superpowers
  kind: plugin
  summary: >-
    A coding-agent plugin and methodology built from composable skills and bootstrap
    instructions. It guides a workflow from requirements discovery and design through
    plans, test-driven implementation, review, worktree use, and branch completion.
  best_for:
    - Teams adopting a prescriptive, skill-triggered workflow for supported coding agents
    - Developers who want reusable guidance for planning, testing, debugging, and review

key_features:
  - Provides skills for brainstorming, planning, test-driven development, debugging, review, and Git worktrees
  - Defines a staged workflow from approved design through implementation and branch completion
  - Supports installations for Claude Code, Codex, Cursor, OpenCode, Pi, and several other agent harnesses
  - Documents a subagent-driven development flow with specification and code-quality review stages

usage:
  interfaces:
    - coding-agent plugins
    - CLI and terminal agent harnesses
    - agent skill discovery
  installation:
    - official or third-party plugin marketplace
    - harness-specific plugin command
    - Pi package from the Git repository
  setup: moderate

