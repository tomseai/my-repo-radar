  spdx: Apache-2.0
  name: Apache License 2.0
  notes: The root Apache-2.0 license includes notice requirements and an express
    patent grant.
status:
  lifecycle: maintenance
  archived: false
  latest_release: ai-elements@1.9.1
  latest_release_at: 2026-10-14
strengths:
  - Delivers AI-specific interface primitives instead of requiring each
    project to build them from scratch
  - Uses source-installed components, allowing teams to adapt markup and
    styling directly
  - Supports either its own CLI or the existing shadcn/ui installation workflow
caveats:
  - It is designed around Next.js, shadcn/ui, Tailwind CSS variables, and the
    Vercel AI SDK rather than as a framework-agnostic package
  - The README lists Node.js 18 or later, while the root package manifest
    requires Node.js 20.12 or later; verify the applicable requirement
  - The release tag identifies the CLI package, while the repository also
    contains a component registry and private workspace packages
  - The project announces end-of-November 2026 deprecation and a move to
    shadcn/ui. Availability of the replacement is not established in the
    retained sources
