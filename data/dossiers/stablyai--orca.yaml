project:
  name: Orca
  kind: application
  summary: >-
    An Electron-based agent development environment for running terminal coding
    agents side by side in isolated Git worktrees, with desktop review and
    editing tools, a scriptable CLI, and a paired mobile companion application.
  best_for:
    - Developers coordinating parallel terminal-based coding agents
    - Reviewing agent-produced changes across separate Git worktrees

key_features:
  - Runs terminal-based coding agents in tracked, isolated Git worktrees
  - Supports parallel prompts, result comparison, and merge-oriented workflows
  - Provides split panes for agents, terminals, browsers, and diffs
  - Includes GitHub and Linear task, pull-request, and review workflows
  - Lets users annotate generated diffs and send feedback to an agent
  - Offers a mobile companion for monitoring agents and sending follow-ups

usage:
  interfaces:
    - desktop application
    - CLI
    - mobile companion application
  installation:
    - official desktop download
    - Homebrew or AUR package
    - iOS App Store, Google Play, or Android APK mobile companion
    - build from source
  setup: moderate

