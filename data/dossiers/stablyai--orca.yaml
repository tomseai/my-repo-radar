strengths:
  - Combines agent orchestration, worktree isolation, terminal work, and review
  - Supports any coding agent that runs in a terminal, according to the README
  - Offers desktop, command-line, remote-worktree, and mobile workflows

caveats:
  - It coordinates external terminal agents; subscriptions and authentication remain separate
  - The latest feed entry is v1.4.147-rc.0; v1.4.146 is the latest non-RC Orca release
  - The release feed also includes an issue-assets entry unrelated to product versioning
  - Building from source requires Node.js 24 and the pnpm toolchain specified by the project

