project:
  name: Gen-AI Patterns
  kind: documentation
  summary: >-
    A practitioner-oriented Markdown collection of reusable generative-AI
    system patterns, explaining when to use a pattern, how to apply it, and
    relevant tradeoffs or failure cases.
  best_for:
    - Teams designing retrieval, context, evaluation, extraction, or orchestration parts of a GenAI system
    - Contributors who want a lightweight structure for documenting practical GenAI patterns
key_features:
  - Organizes patterns for chunk storage, chunking, context, evaluation, extraction, orchestration, retrieval, and query optimization
  - Includes concrete patterns such as graph indexes, sliding windows, grounding, routing, reranking, and hybrid retrieval
  - "Gives a problem-first usage workflow: choose a pattern, adapt it, and document successes and failures"
  - Defines contribution expectations for clear problem statements, actionable solutions, examples, tradeoffs, and failure modes
