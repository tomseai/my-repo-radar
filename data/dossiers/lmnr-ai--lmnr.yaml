project:
  name: Laminar
  kind: application
  summary: An open-source observability platform for AI agents that combines
    OpenTelemetry-native tracing, evaluations, alerting signals, datasets,
    dashboards, and real-time trace investigation.
  best_for:
    - Teams instrumenting, evaluating, and debugging AI-agent applications
    - Organizations that need a managed option or a self-hosted observability stack
key_features:
  - Auto-instruments supported AI SDKs and frameworks through OpenTelemetry-native
    tracing
  - Defines plain-language signals to detect agent behavior and notify Slack
  - Runs extensible evaluations locally or in CI/CD and compares results in the UI
  - Provides trace, metric, and event dashboards with custom SQL queries
  - Supports annotation and dataset creation plus a real-time trace-viewing engine
