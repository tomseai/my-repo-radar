project:
  name: Artificial Intelligence for Beginners
  kind: course
  summary: >-
    A beginner-friendly, 12-week curriculum of AI lessons, executable notebooks,
    quizzes, and selected practical labs.
  best_for:
    - Learners seeking a structured introduction to AI concepts and neural networks
    - Educators adapting an open curriculum with hands-on notebook material
key_features:
  - 24 lessons covering symbolic AI, neural networks, computer vision, NLP, other AI techniques, and responsible AI
  - Framework-specific executable notebooks for TensorFlow and PyTorch, plus selected labs
  - Short beginner examples for pattern recognition, neural networks, image classification, and sentiment analysis
  - Lesson-linked quizzes that can be run locally or accessed online
  - Translations in more than 50 languages, with a sparse-checkout option to omit them
usage:
  interfaces:
    - Markdown lesson materials
    - Jupyter notebooks
    - Vue web quiz application
  installation:
    - Read the curriculum on GitHub
    - Clone the repository
    - Run notebooks locally, in VS Code or Codespaces, or through Binder
  setup: moderate
