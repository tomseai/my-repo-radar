project:
  name: Yjs
  kind: library
  summary: >-
    A high-performance CRDT framework with shared data types for building
    collaborative and local-first applications across arbitrary network
    providers.
  best_for:
    - Developers implementing conflict-free collaborative state and editing
    - Applications that need offline changes, peer-to-peer sync, and eventual
      convergence
key_features:
  - Provides shared Map, Array, Text, and XML-like data types with automatic
    merging
  - Works independently of the network transport and supports peer-to-peer
    designs
  - Supports offline editing, snapshots, undo and redo, and shared cursors
  - Integrates with rich-text editors and a broad provider ecosystem
