strengths:
  - Separates conflict-free data structures from transport and persistence
    choices
  - Has integrations for many editors, databases, and network providers
caveats:
  - Applications must choose and operate a suitable synchronization and
    persistence provider
  - Version 14 remains in release-candidate builds; v13.6.33 is the newest
    retained stable release
