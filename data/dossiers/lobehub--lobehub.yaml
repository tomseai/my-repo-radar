project:
  name: LobeHub
  kind: application
  summary: >-
    A workspace for building, scheduling, and collaborating with AI agent teams,
    with shared projects, skills, editable memory, and self-hosting options.
  best_for:
    - People coordinating recurring work across several AI agents
    - Teams that want a shared workspace for agent-assisted projects

key_features:
  - Agent Builder for creating and configuring agent teammates
  - Agent Groups for parallel, task-oriented collaboration
  - Shared pages, projects, workspaces, and scheduled runs
  - MCP-compatible plugins and a skills library
  - Structured, editable personal memory
  - Web, desktop, and command-line components

usage:
  interfaces:
    - web UI
    - desktop app
    - CLI
  installation:
    - self-host with Docker
    - deploy with supported cloud platforms
    - build from source
  setup: moderate

