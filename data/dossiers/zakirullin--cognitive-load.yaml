strengths:
  - Focuses on a memorable decision criterion rather than a single prescribed
    architecture
  - Concrete code and system-design examples make the principles quick to apply
    in reviews
  - Covers both local code structure and broader service and dependency
    boundaries

caveats:
  - The guide is explicitly opinionated and should be balanced against a
    project's domain and operational constraints
  - It is a reading resource, not a tool that measures or enforces cognitive load
  - Some examples and linked supporting material reflect the author's
    interpretation rather than a formal standard

