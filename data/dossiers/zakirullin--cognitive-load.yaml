project:
  name: Cognitive load is what matters
  kind: documentation
  summary: >-
    A living software-design guide that argues for reducing extraneous cognitive
    load through concrete examples of code structure, abstraction, dependencies,
    services, and interfaces.
  best_for:
    - Developers and teams reviewing design choices for maintainability
    - Readers looking for practical examples of simpler, easier-to-change code

key_features:
  - Distinguishes intrinsic task difficulty from reducible extraneous cognitive
    load
  - Uses examples of complex conditionals, nesting, and inheritance to discuss
    simpler control flow and composition
  - Explains deep versus shallow modules and the cost of excessive indirection
  - Examines microservices, framework coupling, layered architecture, and
    premature abstraction
  - Recommends self-describing interfaces and carefully scoped dependencies
  - Links to supporting reading and provides translated versions of the guide, including French

