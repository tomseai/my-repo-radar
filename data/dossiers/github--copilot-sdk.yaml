strengths:
  - Covers six mainstream application languages with a shared Copilot agent-runtime model
  - Lets hosts control tool approval and intercept session behavior instead of treating the agent as opaque
  - Supports bundled, locally managed, or externally hosted CLI runtime deployment patterns

caveats:
  - Standard use requires a GitHub Copilot subscription; BYOK instead requires supported provider API keys
  - CLI packaging differs by language, and Go, Java, and Rust need additional CLI configuration by default
  - Exposing the headless CLI beyond loopback requires separate network controls and authentication

