project:
  name: GitHub Copilot SDK
  kind: library
  summary: >-
    Multi-language SDKs for embedding the Copilot CLI agent runtime in an
    application, with programmable sessions, streaming responses, custom
    tools, file-editing workflows, permission handling, and lifecycle hooks.
  best_for:
    - Applications that need Copilot-powered agent workflows without implementing the runtime
    - Teams building agent-enabled products in TypeScript, Python, Go, .NET, Java, or Rust

key_features:
  - SDKs for TypeScript/Node.js, Python, Go, .NET, Java, and Rust
  - Programmatic agent sessions for prompts, planning, tool invocation, and file edits
  - Custom agents, skills, and tools plus application-controlled permission handlers
  - Session hooks for pre- and post-tool processing and session lifecycle behavior
  - Bundled CLI runtime for Node.js, Python, and .NET, with manual CLI setup for other SDKs
  - Optional OpenTelemetry tracing and external headless CLI connection modes

