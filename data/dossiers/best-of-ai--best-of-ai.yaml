strengths:
  - Combines broad category navigation, professional-role groupings, and linked review pages
  - Documents concrete paths for submissions, corrections, and category changes
  - Uses automation to regenerate its published Markdown index and deploy the companion static site
caveats:
  - Curatorial statements and leaderboard positions are maintainer judgments, not independently verified quality measures
