project:
  name: Best of AI
  kind: curated-list
  summary: >-
    A community-maintained directory and companion website that organizes AI
    tools by category, professional role, and a maintainer-defined leaderboard.
  best_for:
    - Browsing categorized AI-tool listings and linked tool reviews
    - Suggesting a new listing or correcting a directory entry through an issue or pull request
key_features:
  - A generated Markdown index of AI tools grouped into numerous categories
  - A leaderboard and category listings that link to individual review pages on the companion website
  - Role-oriented tool collections for professionals such as developers, designers, and marketers
  - Contribution instructions for tool records, categories, corrections, and issue-based submissions
  - GitHub workflows for GitHub Pages deployment, README regeneration, and issue-submission review
usage:
  interfaces:
    - Markdown directory
    - Website
    - GitHub repository
  installation:
    - Browse README.md or bestofai.io
    - Open an issue or submit a pull request to propose a listing
    - Optionally run the Hugo site locally with Python 3 for README generation
