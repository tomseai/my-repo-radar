strengths:
  - Shares one action model across human-facing and agent-facing application surfaces
  - Combines agent-runtime facilities with scaffolding and reusable application toolkits
  - Documents a direct local starter workflow rather than requiring manual framework assembly
caveats:
  - This is a framework and template collection, so teams still own the application's model, authentication, data, and deployment choices
  - The repository is a monorepo with independently versioned packages; the selected release is the primary @agent-native/core package, not the first feed entry
  - The retained root package requires Node.js 22.22 or newer and pnpm, while project setup needs additional application-specific configuration
  - Conflicting retained license declarations and the absence of a retained LICENSE file make repository-wide reuse terms uncertain
