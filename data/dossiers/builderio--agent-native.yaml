project:
  name: Agent-Native
  kind: framework
  summary: A TypeScript framework for building agent-centric applications whose actions
    can be exposed through UI, agent, HTTP, MCP, A2A, and CLI surfaces.
  best_for:
    - Teams building a customizable agent application rather than a standalone coding
      agent
    - Projects that want one action definition shared by application and agent
      interfaces
key_features:
  - Defines reusable actions with a schema and run function for multiple application
    surfaces
  - Includes an agent runtime with chat, tools, skills, memory, jobs, observability,
    and handoffs
  - Supports Drizzle-compatible SQL databases and Nitro-compatible hosting
  - Provides reusable toolkit building blocks for collaboration, sharing, settings,
    teams, and observability
  - Includes templates and a create command for starting a local application
usage:
  interfaces:
    - web application UI
    - HTTP API
    - Model Context Protocol server
    - Agent-to-Agent protocol
    - command-line interface
  installation:
    - npx @agent-native/core@latest create my-app
    - pnpm install and pnpm dev in the generated application
  setup: moderate
technology:
  languages:
    - TypeScript
  notable_components:
    - "@agent-native/core"
    - Drizzle-supported SQL databases
    - Nitro-compatible hosts
    - pnpm workspaces
license:
  spdx: MIT
