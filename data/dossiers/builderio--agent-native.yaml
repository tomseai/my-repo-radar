status:
  lifecycle: active
  archived: false
  latest_release: null
  latest_release_at: null
strengths:
  - Shares one action model across human-facing and agent-facing application surfaces
  - Combines agent-runtime facilities with scaffolding and reusable application
    toolkits
  - Documents a direct local starter workflow rather than requiring manual framework
    assembly
caveats:
  - This is a framework and template collection, so teams still own the application's
    model, authentication, data, and deployment choices
  - The retained release feed contains desktop and Clips nightlies, including
    Agent-Native Nightly v0.1.150-nightly.458; the core package manifest reports
    0.231.0, but this does not establish a published stable framework release
  - The retained root package requires Node.js 22.22 or newer and pnpm, while project
    setup needs additional application-specific configuration
