project:
  name: trendFinder
  kind: application
  summary: >-
    A scheduled TypeScript application that collects selected X posts and web
    pages, uses an AI provider to identify trends, and sends Slack or Discord notifications.
  best_for:
    - Teams monitoring selected social accounts and websites for emerging topics
    - Marketing workflows that need notifications about detected launches or trends

key_features:
  - Scheduled collection of selected X posts through the X API
  - Website release and news extraction through Firecrawl
  - Together AI-based analysis of trends, releases, sentiment, and relevance
  - Slack or Discord webhook notifications with trend context and sources
  - Node.js development workflow and Docker Compose deployment option

usage:
  interfaces:
    - scheduled service
  installation:
    - npm
    - Docker
    - Docker Compose
  setup: high

