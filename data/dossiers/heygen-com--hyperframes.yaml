project:
  name: Hyperframes
  kind: framework
  summary: >-
    A deterministic HTML and CSS video framework with a local CLI, preview and
    rendering workflow, SDK, hosted execution options, and reusable skills for
    AI agents.
  best_for:
    - Developers generating videos from familiar web technologies
    - Agents automating repeatable product, explainer, caption, and
      motion-graphics videos
key_features:
  - Renders HTML, CSS, media, and seekable animations to MP4 deterministically
  - Provides init, preview, and render commands plus SDK and studio workflows
  - Bundles reusable agent skills for common video-production tasks
  - Supports local rendering and optional cloud or Lambda execution
usage:
  interfaces:
    - command-line interface
    - JavaScript SDK
    - web studio
    - agent skills
  installation:
    - npx hyperframes init
    - npm package
  setup: moderate
