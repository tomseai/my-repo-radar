strengths:
  - Uses standard web primitives while keeping frame output deterministic
  - Gives both humans and agents reusable local and hosted rendering paths
caveats:
  - Local workflows require Node.js 22 or newer and FFmpeg
  - Cloud rendering and some hosted workflows introduce separate service
    dependencies and costs
