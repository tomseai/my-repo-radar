project:
  name: DocETL
  kind: framework
  summary: >-
    A Python framework for declarative LLM-powered processing of structured and
    unstructured datasets, offering map-reduce-style operators, Python and YAML
    pipelines, automatic cost-quality optimization, parsing extras, and a visual playground.
  best_for:
    - Data teams extracting, classifying, resolving, or summarizing large document collections
    - Developers who need repeatable LLM pipelines with explicit cost and quality optimization
key_features:
  - Provides map, reduce, filter, resolve, split, gather, cluster, and other data operators
  - Defines pipelines through a Python API or low-code YAML configuration
  - Parallelizes work and reports model-call costs while producing tabular results
  - MOAR searches pipeline rewrites and models for an accuracy-cost frontier
  - Includes model cascades, plan rewrites, document parsers, a TUI, and DocWrangler UI
usage:
  interfaces:
    - Python library
    - CLI
    - TUI
    - web UI
  installation:
    - Python package via pip
    - source checkout via uv
    - Docker Compose for the UI stack
  setup: moderate
technology:
  languages:
    - Python
    - TypeScript
  notable_components:
    - LiteLLM
    - pandas
    - FastAPI
    - Textual
    - DocWrangler
