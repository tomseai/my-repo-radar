strengths:
  - Treats LLM document work as inspectable data pipelines rather than ad hoc calls
  - Offers both developer-oriented and visual workflows over the same operator model
  - Makes accuracy, cost, sampling, and optimization explicit operational concerns
caveats:
  - Most useful pipelines require provider credentials and incur model API costs
  - MOAR searches run pipelines repeatedly on samples and can take tens of minutes
  - Parsing, retrieval, server, and UI capabilities add substantial optional dependencies and deployment choices
