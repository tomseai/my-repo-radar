project:
  name: create-t3-app
  kind: cli
  summary: >-
    An interactive CLI that scaffolds modular, type-safe full-stack Next.js
    applications from a selectable T3 Stack configuration.
  best_for:
    - Starting a TypeScript-based Next.js application with common full-stack components
    - Teams that want a maintained baseline rather than assembling the stack manually
key_features:
  - Published Node.js CLI package with a create-t3-app executable
  - Base template built on Next.js, React, TypeScript, Zod, and environment validation
  - Optional tRPC, Tailwind CSS, Prisma, Drizzle ORM, and database client integrations
  - Optional Better Auth or NextAuth integration
  - Monorepo includes CLI, documentation site, CI checks, and Changesets release automation
