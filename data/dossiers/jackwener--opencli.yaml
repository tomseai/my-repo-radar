strengths:
  - Unifies browser, desktop, website-adapter, plugin, and local-CLI workflows
  - Uses an existing browser login rather than asking agents to handle site credentials directly
  - Provides structured output and explicit adapter-development tools for repeatable automation

caveats:
  - Browser-backed commands require Chrome, the Browser Bridge, and a logged-in target-site session
  - The README says npm installation needs Node.js 20 or later, while the installation guide says Node.js 21 or Bun 1 or later
  - Browser-backed adapters can break when target websites change their UI, APIs, or authentication behavior
  - Remote CDP use requires exposing or tunneling a debugging endpoint and should be secured accordingly
  - Website actions run with the permissions of the connected browser profile

