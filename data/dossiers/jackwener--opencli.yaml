project:
  name: OpenCLI
  kind: cli
  summary: A Node.js CLI that turns supported websites, logged-in Chrome sessions,
    Electron apps, and registered local binaries into deterministic commands,
    with browser-control primitives and skills for AI agents.
  best_for:
    - Developers and agents automating websites through an existing
      authenticated Chrome profile
    - Authors building reusable site adapters or consolidating local tools
      behind one CLI
key_features:
  - Provides built-in site adapters and defaults to structured JSON success and
    error responses
  - Drives logged-in Chrome through a Browser Bridge extension and local daemon
  - Exposes browser navigation, interaction, extraction, network inspection, and
    screenshot commands
  - Supports direct Chrome DevTools Protocol connections and Electron app
    adapters
  - Loads built-in, local, plugin, and external-CLI commands into a unified
    registry
  - Ships agent skills for browser use, usage, and adapter authoring and repair
usage:
  interfaces:
    - CLI
    - Chrome extension
    - local browser daemon
    - Chrome DevTools Protocol
    - AI agent skills
  installation:
    - OpenCLIApp for macOS or Windows
    - npm global package
    - build from source
    - Chrome Web Store or manually loaded extension
  setup: moderate
technology:
  languages:
    - JavaScript
    - TypeScript
  notable_components:
