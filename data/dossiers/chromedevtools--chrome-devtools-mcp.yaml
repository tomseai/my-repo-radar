strengths:
  - Uses Chrome DevTools capabilities directly instead of a page-only
    automation API
  - Provides both a broad tool set and a constrained slim mode
  - Documents integration with numerous MCP clients and direct CLI use
caveats:
  - MCP clients can inspect, modify, and receive browser content, so sensitive
    sessions should not be exposed to untrusted clients
  - Usage statistics and npm update checks are enabled by default but have
    documented opt-outs
  - Official support is limited to Google Chrome and Chrome for Testing; other
    Chromium browsers are not guaranteed
  - Performance tooling can send trace URLs to the CrUX API unless disabled
