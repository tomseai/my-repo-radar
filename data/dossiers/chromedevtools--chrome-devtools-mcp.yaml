project:
  name: Chrome DevTools for agents
  kind: service
  summary: >-
    An MCP server and command-line tool that lets coding agents control and
    inspect a live Chrome browser for automation, debugging, and performance
    analysis.
  best_for:
    - Coding-agent workflows that need browser inspection and debugging
    - Developers investigating browser network, console, and performance issues
key_features:
  - Records Chrome traces and extracts performance insights
  - Automates Chrome actions with Puppeteer and waits for action results
  - Inspects network requests, console messages, and screenshots
  - Offers a three-tool slim mode for navigation, script evaluation, and screenshots
  - Can connect to an existing Chrome instance through a debugging URL or WebSocket endpoint
usage:
  interfaces:
    - MCP server over stdio
    - command-line interface
  installation:
    - run with npx as chrome-devtools-mcp
    - build from source with npm
  setup: moderate
technology:
  languages:
    - TypeScript
    - JavaScript
  notable_components:
    - Model Context Protocol SDK
    - Puppeteer
    - Chrome DevTools
    - Lighthouse
