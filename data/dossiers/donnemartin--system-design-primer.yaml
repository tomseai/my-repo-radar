project:
  name: The System Design Primer
  kind: documentation
  summary: >-
    An open learning reference for scalable-system design and interview
    preparation, with a study guide, concept summaries, design exercises,
    linked solutions, diagrams, Python examples, and Anki decks.
  best_for:
    - Building a system-design interview study plan around a chosen timeline
    - Reviewing scalability concepts and comparing solutions to common design prompts
key_features:
  - Study guide that adapts breadth and depth recommendations to short, medium, and long interview timelines
  - Four-step interview approach covering requirements, high-level design, core components, and scaling trade-offs
  - Topic reference covering availability, consistency, DNS, CDNs, load balancing, databases, caching, queues, and communication
  - System-design questions with linked discussions, code, diagrams, and solution directories
  - Object-oriented-design exercises with Python and notebook-based solution artifacts
  - Anki decks for system-design concepts, exercises, and object-oriented-design exercises
usage:
  interfaces:
    - GitHub Markdown reference
    - Python and Jupyter solution artifacts
    - Anki flashcard decks
  installation:
    - Browse README.md for concepts, study plan, and linked solutions
    - Clone the repository to inspect solution files or import its Anki decks
  setup: low
technology:
  languages:
    - Markdown
    - Python
  notable_components:
    - System-design and object-oriented-design solution directories
    - Anki flashcard decks
    - Study-guide diagram and system-design diagrams
