project:
  name: AdonisJS Core
  kind: framework
  summary: >-
    The TypeScript-first, full-stack MVC framework core for Node.js web
    applications, API servers, and microservices.
  best_for:
    - Teams building server-rendered web applications or API backends with AdonisJS
    - Node.js projects that benefit from a cohesive framework and official package ecosystem
key_features:
  - Full-stack MVC foundation with APIs for web applications and microservices
  - HTTP server, body parsing, configuration, environment, event, logging, and health modules
  - Command toolkit exposed through the adonis-kit CLI
  - Hashing and encryption modules with multiple supported algorithms
  - ESM package with TypeScript declarations and public npm provenance
  - Automated linting and tests on current LTS and latest Node.js in CI
