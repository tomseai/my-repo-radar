project:
  name: HAPI
  kind: application
  summary: >-
    A local-first application that wraps supported coding-agent CLIs, persists
    their sessions through a hub, and lets users monitor, message, and approve
    work remotely from native mobile apps, a web PWA, or Telegram Mini App without restarting a
    session.
  best_for:
    - Developers who need to continue or supervise local coding-agent sessions
      from another device
    - Teams or individuals willing to run a local or self-hosted hub for remote
      session access
key_features:
  - Wraps Claude Code, Codex, Cursor Agent, Grok Build, OpenCode, and other
    supported agent sessions
  - Preserves a session while control switches between terminal and remote
    clients
  - Web PWA supports sessions, chat, permission decisions, file browsing, diffs,
    and remote spawning
  - Hub stores session data in SQLite and coordinates CLI, REST, Socket.IO, and
    SSE communication
  - Optional runner can start sessions remotely on a connected machine
  - Relay mode uses WireGuard plus TLS for end-to-end encrypted remote access
usage:
  interfaces:
    - CLI
    - terminal agent sessions
    - web application
    - progressive web app
    - Telegram Mini App
    - native iOS and Android apps
  installation:
    - npm global package
    - Homebrew formula
    - npx
    - prebuilt binary
    - build from source with Bun
  setup: moderate
