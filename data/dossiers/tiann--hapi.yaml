strengths:
  - Keeps the supported agent running locally while making messages and permission decisions available remotely
  - Combines local-only, encrypted relay, and self-hosted tunnel deployment paths

caveats:
  - A supported coding-agent CLI must already be installed on the machine that runs HAPI
  - Remote control requires a running hub and either the relay or a correctly configured reachable deployment
  - AGPLv3 obligations can affect redistribution and network-service deployment decisions

