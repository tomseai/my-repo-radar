project:
  name: BAML
  kind: other
  summary: A statically typed programming language and toolchain for defining
    reliable agent and LLM programs, with runtime-preserved types, analyzed
    errors, filesystem modules, standalone execution, and generated clients for
    multiple host languages.
  best_for:
    - Teams that want typed, versionable LLM and agent definitions outside
      application code
    - Polyglot projects that need one agent schema callable from Python,
      TypeScript, Go, or other hosts
key_features:
  - Uses a TypeScript-like syntax with Rust-style static typing and no
    unrestricted any type
  - Preserves types at runtime and statically analyzes typed errors
  - Organizes modules and namespaces through the filesystem
  - Runs programs standalone or generates bindings for multiple host languages
  - Includes a CLI, language server, IDE integration, compiler, and runtime
  - Includes a standard library and built-in tests and evaluations for agent
    programs
