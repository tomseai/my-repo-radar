project:
  name: Pretext
  kind: library
  summary: >-
    A JavaScript and TypeScript library for calculating multiline text layout
    without DOM measurement or reflow, using cached canvas-based measurement
    and Unicode-aware line breaking for height prediction and manual rendering
    in DOM, Canvas, SVG, or future server-side targets.
  best_for:
    - Predicting text heights for virtualized or dynamically sized web interfaces
    - Building custom multiline layouts or renderers that need line-level geometry

key_features:
  - DOM-free paragraph height and line-count calculation through prepare and layout APIs
  - Line-level ranges, statistics, and materialization for manual text rendering
  - Support for normal and pre-wrap whitespace, keep-all word breaking, and letter spacing
  - Rich-inline helper for mentions, chips, code spans, and boundary whitespace handling
  - Canvas, SVG, WebGL, and prospective server-side rendering use cases
  - Published ESM package with TypeScript declarations and a separate rich-inline export

