strengths:
  - Avoids layout-triggering DOM measurements on its primary height-calculation path
  - Supports both high-level height prediction and low-level line geometry for custom renderers
  - Documents limitations and compatibility details for multilingual and rich-inline text

caveats:
  - Runtime support requires Canvas 2D text measurement and Intl.Segmenter
  - It is not a full font-rendering or general CSS inline-formatting engine
  - The README identifies system-ui as unsafe for layout accuracy on macOS and advises a named font
  - Current releases use 0.0.x versioning, so consumers should review changelog entries when upgrading

