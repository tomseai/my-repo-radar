strengths:
  - Keeps session parsing and the web dashboard on the user's machine; the
    dashboard binds to localhost
  - Offers several interfaces over the same local data, including MCP for
    agent-assisted spend analysis
  - Includes actionable cost controls, model comparison, export, and diagnostic
    commands

caveats:
  - Requires Node.js 22.15+ and local session data from at least one supported
    tool
  - Parsed fields and cost accuracy depend on each upstream tool's changing
    local data formats; some providers require estimation
  - Pull-request attribution depends on the session data available to the tool
  - Desktop and menu-bar releases are versioned separately; v0.9.28 is the
    latest primary CLI package release in the retained feed

