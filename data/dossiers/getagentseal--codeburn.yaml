project:
  name: CodeBurn
  kind: cli
  summary: >-
    A local-first CLI and set of dashboards that reads AI coding-tool session
    data from disk to report token use and estimated cost by task, model, tool,
    and project.
  best_for:
    - Developers comparing AI coding-agent spend across local tools and models
    - Teams seeking local reports and budget-analysis tools without a request proxy
key_features:
  - Reads local session data for 36 supported AI tools and agents
  - Provides an interactive terminal dashboard, reports, JSON output, and a localhost web dashboard
  - Breaks down usage by task, model, tool, project, date range, and token category
  - Identifies waste patterns and offers reversible Claude Code configuration changes
  - Compares models and correlates sessions with nearby Git commits using a timestamp-window heuristic
  - Exposes local usage and savings analysis through a stdio MCP server
usage:
  interfaces:
    - CLI
    - terminal UI
    - local web dashboard
    - macOS menu-bar app
    - MCP server
  installation:
    - npx codeburn
    - npm global package
    - Homebrew on macOS
    - Desktop release download
  setup: low
technology:
  languages:
    - TypeScript
    - Swift
  notable_components:
