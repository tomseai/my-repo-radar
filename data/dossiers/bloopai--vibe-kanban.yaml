strengths:
  - Combines task planning, isolated agent execution, review, preview, and pull requests
  - Supports a broad set of coding-agent command-line tools through one workspace model

caveats:
  - The README explicitly says the project is sunsetting
  - Coding agents must be installed and authenticated separately
  - Building from source requires Rust, Node.js, and pnpm; deployed access needs suitable origin controls

