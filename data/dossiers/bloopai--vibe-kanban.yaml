project:
  name: Vibe Kanban
  kind: application
  summary: >-
    A sunsetting Kanban workspace for planning coding-agent work, running agents
    in isolated workspaces, reviewing changes, and creating pull requests.
  best_for:
    - Evaluating an integrated planning and review workflow for coding agents
    - Users prepared to self-host or fork a project that is being sunset

key_features:
  - Kanban issues for planning, prioritizing, and assigning work
  - Agent workspaces with a branch, terminal, and development server
  - Diff review with inline feedback sent back to an agent
  - Built-in application previews with developer tools and device emulation
  - Integrations for more than ten coding agents
  - Pull-request creation, AI-generated descriptions, and merge workflow

usage:
  interfaces:
    - web UI
    - desktop app
    - CLI
    - MCP server
  installation:
    - npx
    - pnpm source build
    - Docker self-hosting
  setup: moderate

