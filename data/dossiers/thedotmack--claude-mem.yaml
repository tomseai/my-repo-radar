strengths:
  - Carries compressed, searchable context between otherwise separate sessions
  - Supports automatic hook-based capture as well as agent-initiated retrieval
  - Provides local storage, local viewing, and configurable context injection
caveats:
  - Full plugin setup requires a supported coding agent plus Node.js, Bun, and uv
  - The npm global package alone does not register hooks or start the worker
  - Optional cloud sync sends memories to cmem.ai when configured
  - The evidence describes several integrations, but support details can vary by host
