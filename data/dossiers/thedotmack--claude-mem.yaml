project:
  name: Claude-Mem
  kind: plugin
  summary: A persistent-memory plugin for coding agents that captures session
    activity, creates AI summaries, and retrieves relevant project context in
    later sessions.
  best_for:
    - Coding-agent users who want searchable continuity across sessions with a
      supported host
    - Supported coding-agent users who need local project-memory retrieval
key_features:
  - Captures lifecycle-hook observations and session summaries
  - Stores sessions, observations, and summaries in a local SQLite database
  - Provides progressive-disclosure memory search through MCP tools and a skill
  - Runs a local worker HTTP API with a real-time web viewer
  - Uses hybrid keyword and vector search through SQLite FTS5 and Chroma
  - Lets users exclude marked sensitive content from storage with private tags
usage:
  interfaces:
    - coding-agent plugin hooks
    - MCP server
    - CLI
    - local HTTP service
    - web viewer
  installation:
    - npx installer
    - Claude Code plugin marketplace
    - OpenClaw installer
  setup: moderate
technology:
  languages:
    - TypeScript
    - JavaScript
  notable_components:
    - Bun
    - SQLite
    - Chroma
    - Model Context Protocol
