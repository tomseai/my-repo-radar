strengths:
  - Carries compressed, searchable context between otherwise separate sessions
  - Supports automatic hook-based capture as well as agent-initiated retrieval
  - Provides local storage, local viewing, and configurable context injection
caveats:
  - Full setup requires a supported coding agent plus Node.js 20.19 or later
    on the 20.x line, or Node.js 22.12 or later, and the installer manages
    other runtime dependencies
  - The npm global package alone does not register hooks or start the worker
  - Optional cloud sync sends memories to cmem.ai when configured
  - Cloud sign-in can be skipped. Anonymous usage analytics are on by default,
    with a documented opt-out
  - Tool screenshots are kept locally by default, with separate controls for
    storage, cloud sync, and model image inference
