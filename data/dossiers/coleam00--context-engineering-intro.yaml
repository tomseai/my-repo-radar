project:
  name: Context Engineering Template
  kind: starter-template
  summary: >-
    A Claude Code-centered starter template for supplying AI coding assistants
    with project rules, examples, feature requests, and Product Requirements
    Prompts (PRPs) that guide planned and validated implementation.
  best_for:
    - Teams establishing reusable project context for AI-assisted feature work
    - Claude Code users who want a repeatable feature-request-to-implementation workflow
key_features:
  - A CLAUDE.md template for project-wide conventions, testing expectations, and documentation standards
  - INITIAL.md and example files for structured feature requests, examples, documentation, and constraints
  - PRP templates and a multi-agent PRP example for implementation blueprints
  - Custom Claude Code commands to generate a PRP and execute one with planning and validation
  - Guidance for using code examples, external documentation, tests, and validation gates as agent context
  - Additional use-case directories for workflows, agent teams, Pydantic AI, template generation, and an MCP server
usage:
  interfaces:
    - Markdown template files
    - Claude Code slash commands
    - Repository use-case examples
  installation:
    - Clone the template and customize its context files
    - Copy selected template files into an existing project
  setup: moderate
technology:
  languages:
    - Markdown
    - Python
    - TypeScript
  notable_components:
    - Claude Code configuration and custom commands
    - Product Requirements Prompt templates
    - Optional MCP-server use case
