project:
  name: aspire
  kind: framework
  summary: >-
    A multi-language, code-first toolchain for defining, running, observing,
    and deploying distributed applications and their connected resources.
  best_for:
    - Teams developing distributed applications with services and dependent resources
    - Workflows that need local orchestration and OpenTelemetry-based observability

key_features:
  - Code-defined services, frontends, containers, databases, caches, and connections
  - CLI that runs the defined application locally
  - OpenTelemetry-based observability
  - Deployment from the same application definition
  - AppHost SDK, dashboard, service-discovery infrastructure, templates, and integrations
  - Included Visual Studio Code extension

usage:
  interfaces:
    - CLI
    - dashboard
    - Visual Studio Code extension
  installation:
    - official Windows PowerShell installer
    - official Linux and macOS shell installer
  setup: moderate

technology:
  languages:
    - C#
    - TypeScript
  notable_components:
    - Aspire CLI
    - AppHost SDK
    - OpenTelemetry
    - Visual Studio Code extension

