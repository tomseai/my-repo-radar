project:
  name: AI Ready
  kind: plugin
  summary: >-
    An Agent Skill that inspects a repository's code, workflows,
    documentation, and review patterns, then reports on AI readiness and
    proposes or creates repository-specific configuration for coding agents.
  best_for:
    - Maintainers preparing a repository for repeatable AI-agent contributions
    - Teams that want agent instructions derived from their existing project
      conventions

key_features:
  - Analyzes repository structure, manifests, tests, documentation, and existing
    AI configuration
  - Mines recent pull-request review comments for repeated team conventions
  - Generates or audits AGENTS.md and GitHub Copilot instructions without
    overwriting files
  - Can prepare CI, issue and pull-request templates, contributing guidance, and
    an MCP configuration
  - Produces an AI-readiness report based on eleven tracked repository assets
  - Supports monorepos with scoped instruction files and a maintenance matrix

usage:
  interfaces:
    - GitHub Copilot, Claude Code, Codex, Cursor, and compatible agent clients
    - GitHub pull requests and issues
  installation:
    - Install using the skills CLI
  setup: low

technology:
  languages: []
  notable_components:
    - Agent Skills
    - GitHub API
    - Model Context Protocol configuration

