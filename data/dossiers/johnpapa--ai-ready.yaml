status:
  lifecycle: active
  archived: false
  latest_release: v1.3.0
  latest_release_at: 2026-09-05

strengths:
  - Uses the target repository's code and contribution history rather than
    generic instruction templates
  - Safe re-runs audit drift and propose changes instead of overwriting existing
    files
  - Covers both agent context and conventional contributor-facing project
    metadata

caveats:
  - It is an Agent Skill and requires a compatible host agent
  - GitHub-native discovery and PR-review mining depend on suitable GitHub
    access and available history
  - Generated recommendations still need maintainer review before they become
    repository policy

