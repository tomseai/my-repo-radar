project:
  name: AI Ready
  kind: plugin
  summary: >-
    A GitHub Copilot CLI skill that inspects a repository's code, workflows,
    documentation, and review patterns, then reports on AI readiness and
    proposes or creates repository-specific configuration for coding agents.
  best_for:
    - Maintainers preparing a repository for repeatable AI-agent contributions
    - Teams that want agent instructions derived from their existing project conventions

key_features:
  - Analyzes repository structure, manifests, tests, documentation, and existing AI configuration
  - Mines recent pull-request review comments for repeated team conventions
  - Generates or audits AGENTS.md and GitHub Copilot instructions without overwriting files
  - Can prepare CI, issue and pull-request templates, contributing guidance, and an MCP configuration
  - Produces an AI-readiness report based on twelve tracked repository assets
  - Supports monorepos with scoped instruction files and a maintenance matrix

