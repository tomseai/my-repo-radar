project:
  name: Vitale
  kind: plugin
  summary: >-
    An archived VS Code notebook extension and companion Node.js package for
    TypeScript projects, providing dependency-aware cells, Node-based execution,
    rich outputs, and Vite-powered React component rendering.
  best_for:
    - Developers exploring TypeScript code and project modules in VS Code notebooks
    - Existing users who need to inspect or maintain a matching historical Vitale setup

key_features:
  - VS Code notebook support for .vnb files
  - Automatic re-execution of dependent cells and imported project files
  - Node.js server-side execution with asynchronous iterable and promise output handling
  - Separate output panes and MIME-aware rendering, including JSON and HTML/SVG
  - React component rendering with Vite compilation and hot reload
  - Companion Node.js package with VS Code API helpers and a server CLI entry point

usage:
  interfaces:
    - VS Code notebook extension
    - Node.js project package
  installation:
    - VSIX release file
    - npm-compatible package manager
    - build from source
  setup: moderate

technology:
  languages:
    - TypeScript
  notable_components:
    - Visual Studio Code extension API
    - Vite
    - React

