status:
  lifecycle: active
  archived: false
  latest_release: null
  latest_release_at: null
strengths:
  - Treats patterns as referenced, reusable practices rather than
    product-specific promotional links
  - Covers the full agent-development lifecycle, from context management through
    operations and collaboration
  - Offers both a readable repository catalogue and discovery-oriented web tools
caveats:
  - It is a reference catalogue, not an agent framework or a ready-to-run
    implementation
  - Pattern maturity and suitability vary; readers need to inspect the linked
    public references and stated trade-offs
  - The retained release feed contains only archive/pre-redesign-2026-03-11, not
    a conventional project release, so no latest project release is established
  - Local development uses the repository's Bun-based scripts; the README does
    not describe a packaged end-user installation
