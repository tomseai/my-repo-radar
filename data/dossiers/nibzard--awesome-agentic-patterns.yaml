project:
  name: Awesome Agentic Patterns
  kind: curated-list
  summary: >-
    A curated, traceable catalogue of reusable patterns for designing and
    operating autonomous or semi-autonomous AI agents, paired with a searchable
    documentation website.
  best_for:
    - Developers selecting proven patterns for an agent system or workflow
    - Teams seeking references before designing agent memory, orchestration,
      evaluation, or safety controls
key_features:
  - Organizes referenced patterns across context and memory, feedback loops,
    learning, orchestration, reliability, security, tool use, and collaboration
  - Requires contributed patterns to be repeatable, agent-centric, and backed by
    a public reference
  - Provides website filtering and search by category, status, complexity, and
    other pattern attributes
  - Includes side-by-side pattern comparison, a decision explorer, and a graph
    of pattern relationships
  - Publishes pattern packs and developer guides alongside the catalogue
usage:
  interfaces:
    - hosted documentation website
    - GitHub Markdown catalogue
  installation:
    - no installation required to browse the hosted catalogue
    - clone the repository and use Bun for local website development or builds
  setup: low
technology:
  languages:
    - TypeScript
    - Markdown
  notable_components:
    - Astro
    - D3
    - Pagefind
    - Bun workspace scripts
