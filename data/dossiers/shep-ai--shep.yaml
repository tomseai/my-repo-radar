strengths:
  - Keeps concurrent agent work out of the developer's active working directory
  - Treats CI and draft pull requests as review checkpoints before a human merges changes
  - Is not locked to one coding agent or model provider

caveats:
  - Running a feature requires Node.js 22+, Git, GitHub CLI, and an authenticated supported agent CLI
  - By default, Shep passes non-interactive permission-bypass flags to configured agent CLIs
  - Worktree isolation and draft PRs do not replace security scanning or CI coverage
  - Agent prompts and code are sent to the separately configured agent provider under that provider's terms

