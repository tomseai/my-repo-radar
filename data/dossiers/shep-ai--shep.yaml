project:
  name: Shep
  kind: application
  summary: >-
    A local-first orchestrator that runs parallel coding agents in isolated Git
    worktrees and drives feature branches through implementation, optional
    specification gates, commits, CI retry fixes, and draft pull requests.
  best_for:
    - Developers coordinating several AI coding-agent tasks against one repository
    - Teams that want agent output isolated in reviewable draft pull-request workflows

key_features:
  - Isolated Git worktree and branch for every feature
  - Built-in support for Claude Code, Kimi Code, Codex CLI, Copilot CLI, Cursor CLI, Gemini CLI, and Cline, plus a generic terminal-agent executor
  - Default prompt-to-implementation-to-draft-PR workflow with configurable CI retry fixes
  - Optional requirements, research, and plan approval gates as versioned YAML artifacts
  - Local CLI, terminal UI, and real-time web control center
  - Local SQLite data storage with agent provider selection per feature or repository

usage:
  interfaces:
    - CLI
    - terminal UI
    - local web dashboard
  installation:
    - npx package execution
    - npm global package
    - self-hosted local development
  setup: moderate

