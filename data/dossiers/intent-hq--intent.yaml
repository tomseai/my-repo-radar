  summary: A local-first workspace where specialist coding agents plan work in specifications and delegate tasks to agents running in parallel on local or cloud machines.
  best_for: [Teams coordinating coding agents across a shared repository]
key_features:
  - Specialist agents plan, delegate, and review work
  - Supports Claude Code, Codex, Cursor, OpenCode, and local models
  - Isolated workspace checkouts and branches
  - Desktop, web, and mobile clients connect to a Rust daemon
  - Runs agents on local machines, remote hosts, or cloud sandboxes
