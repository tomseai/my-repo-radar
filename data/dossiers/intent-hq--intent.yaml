strengths:
  - Coordinates multiple providers and machines in a shared workflow
  - Local-first state and isolated checkouts support parallel work
caveats:
  - The public repository is a snapshot mirror and external pull requests are deferred
  - The mobile source submodule is private; provider accounts or subscriptions may be needed
  - The retained repository release feed is empty; desktop releases are published separately
  - Update checks share anonymous statistics by default and external agents have their own network behavior
