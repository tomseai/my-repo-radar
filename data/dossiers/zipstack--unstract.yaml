project:
  name: Unstract
  kind: application
  summary: >-
    A self-hostable LLM document-processing platform that turns documents into
    structured JSON through natural-language extraction prompts, APIs, and ETL workflows.
  best_for:
    - Building document-extraction APIs without writing a custom LLM pipeline
    - Automating ingestion of business documents into data warehouses or other systems

key_features:
  - Prompt Studio for defining extraction schemas in natural language
  - REST API deployments that accept documents and return JSON
  - ETL pipelines for loading processed documents into downstream destinations
  - Model Context Protocol server for agent integrations
  - n8n node for workflow automation
  - Support for documents, spreadsheets, presentations, and common image formats

usage:
  interfaces:
    - web UI
    - REST API
    - ETL pipelines
