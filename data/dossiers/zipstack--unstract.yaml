strengths:
  - Covers the path from extraction definition through API and ETL delivery
  - Supports multiple LLM providers, text extractors, storage systems, and
    data destinations
  - Provides a Docker Compose quickstart and an architecture for a self-hosted
    deployment
caveats:
  - Local deployment requires Linux or macOS, Docker Compose, Git, and at
    least 8 GB of RAM
  - Default local credentials must be changed before exposing the platform
  - The AGPL-3.0-only license can impose obligations on modified network
    deployments
  - Managed-cloud and enterprise capabilities are described separately from
    the open-source platform
  - The release feed mixes the core project with independently versioned
    enterprise releases. The selected v0.204.0 is the latest core release
    shown
