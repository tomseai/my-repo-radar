strengths:
  - Combines sandboxing, inference routing, egress policy, and lifecycle management in one reference stack
  - Documents host-held credentials and operator approval for previously unknown network destinations
  - Provides guided paths for three supported agent runtimes
caveats:
  - Maintainers label NemoClaw alpha and offer best-effort community response without guaranteed timelines
  - The retained documentation scopes the stack to OpenShell and its supported agent runtimes
