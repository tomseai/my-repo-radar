  latest_release: null
  latest_release_at: null
strengths:
  - Combines sandboxing, inference routing, egress policy, and lifecycle management
    in one reference stack
  - Documents host-held credentials and operator approval for previously unknown
    network destinations
  - Provides guided paths for three supported agent runtimes
caveats:
  - Maintainers label NemoClaw alpha and offer best-effort community response without
    guaranteed timelines
  - The retained documentation scopes the stack to OpenShell and its supported agent
    runtimes
  - Retrieved external materials are governed by their own terms and users must
    assess their security and suitability
  - The README directs new projects toward Agent Configs and provides migration
    guidance; the existing main-branch experience remains available
  - The feed includes v0.1.0 release candidates, mutable aliases, and a v0.0.145 tag
    brief without a confirmed GitHub release; the retained evidence does not
    establish a current stable release
