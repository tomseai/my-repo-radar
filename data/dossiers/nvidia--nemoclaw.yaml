project:
  name: NVIDIA NemoClaw
  kind: framework
  summary: >-
    An alpha reference stack and CLI for operating selected always-on AI agents
    in NVIDIA OpenShell sandboxes, combining guided onboarding, inference
    routing, declarative network policy, and sandbox lifecycle management.
  best_for:
    - Teams that need a reference deployment pattern for constrained always-on agents
    - Operators running supported agents with OpenShell sandbox and egress controls
key_features:
  - Creates an OpenShell sandbox configured for the selected supported agent
  - Routes model traffic through OpenShell while keeping credentials on the host
  - Applies declarative egress rules and asks the operator to approve unknown hosts
  - Manages versioned blueprints, digest verification, and sandbox setup
  - Supports OpenClaw, Hermes, and LangChain Deep Agents Code
usage:
  interfaces:
    - command-line interface
    - terminal
  installation:
    - Interactive terminal installer after reviewing the documented prerequisites
    - Source checkout with the repository development-setup script for contributors
  setup: moderate
