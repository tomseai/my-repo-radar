  latest_release_at: null
strengths:
  - Separates inexpensive candidate discovery from targeted agent investigation
  - Revalidation and append-only history make findings easier to revisit without
    replacing earlier evidence
  - Supports local operation and optional parallel sandbox execution for large
    repositories
caveats:
  - Deepsec runs coding agents with full shell access, so it should be used only on
    trusted code or in an appropriate sandbox
  - Full scans of large repositories can require substantial model spend; the
    documentation cites costs in the thousands or tens of thousands of dollars
  - Scans need provider credentials such as a direct OpenAI or Anthropic API key or
    Vercel AI Gateway; Vercel-hosted worker sandboxes require a Vercel account
  - The retained evidence establishes no GitHub project release
