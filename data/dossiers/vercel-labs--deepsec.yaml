strengths:
  - Separates inexpensive candidate discovery from targeted agent investigation
  - Revalidation and append-only history make findings easier to revisit without replacing earlier evidence
  - Supports local operation and optional parallel sandbox execution for large repositories
caveats:
  - Deepsec runs coding agents with full shell access, so it should be used only on trusted code or in an appropriate sandbox
  - Full scans of large repositories can require substantial model spend; the documentation cites costs in the thousands or tens of thousands of dollars
  - Real scans require AI-provider credentials, with Vercel AI Gateway documented as the standard path; distributed execution also needs a Vercel account
  - The captured GitHub release feed contains no release entries, so no latest GitHub release can be established
