project:
  name: Deepsec
  kind: cli
  summary: An agent-powered vulnerability-scanning CLI that combines matcher-based
    candidate discovery with AI investigation, finding revalidation, and report
    export for application codebases.
  best_for:
    - Security teams reviewing established or large codebases for
      application-specific vulnerabilities
    - Teams that can budget model usage and want repeatable pull-request or CI
      security review
key_features:
  - Fast regex matcher scans to find candidate code locations before AI investigation
  - AI-powered process and revalidate stages with Codex, Claude, or Pi backends
  - Resumable, append-only runs that preserve findings and analysis history
  - Diff-only processing for pull-request review and CI gating
  - Markdown-directory or JSON finding exports, with optional distributed Vercel
    Sandbox execution
usage:
  interfaces:
    - CLI
    - configuration file
  installation:
    - npx deepsec init
    - pnpm package installation in the generated .deepsec workspace
  setup: high
technology:
  languages:
    - TypeScript
  notable_components:
    - Vercel AI Gateway
    - Vercel Sandbox
    - OpenAI Codex SDK
    - Claude Agent SDK
