  spdx: Apache-2.0
  name: Apache License 2.0
  notes: Permissive license with notice, attribution, and patent-license terms.
status:
  lifecycle: active
  archived: false
  latest_release: 2026.7.2
  latest_release_at: "2026-07-09"
strengths:
  - Lets a browser page combine Python with established HTML, CSS, and JavaScript workflows
  - Supports both Pyodide and MicroPython execution paths in the documented page format
  - Provides hosted release assets and package-level browser entry points
caveats:
  - The platform targets browser execution, so it is not a substitute for a conventional server-side Python runtime
  - A project must choose and configure the appropriate Pyodide or MicroPython script type for its code
  - Browser delivery depends on loading PyScript core assets and the selected Python runtime resources
