project:
  name: PyScript
  kind: framework
  summary: >-
    An open-source browser platform for building Python applications with
    Pyodide or MicroPython, WebAssembly, and modern web technologies.
  best_for:
    - Browser applications that need Python embedded directly in an HTML page
    - Prototypes and web experiences that can use Pyodide or MicroPython runtimes
key_features:
  - Runs Python in browser pages through Pyodide or MicroPython script types
  - Publishes browser-ready core JavaScript and CSS release assets
  - Uses WebAssembly and standard web technologies for browser execution
  - Exposes core package entry points for JavaScript, CSS, storage, and service workers
usage:
  interfaces:
    - HTML script tags
    - Browser JavaScript modules
    - Python script elements
  installation:
    - Hosted core.js and core.css assets from a PyScript release
    - "@pyscript/core package entry points"
  setup: low
technology:
  languages:
    - Python
    - JavaScript
    - HTML
  notable_components:
    - Pyodide
    - MicroPython
    - WebAssembly
