project:
  name: claude-tap
  kind: cli
  summary: >-
    A local proxy and trace viewer for inspecting coding-agent API traffic,
    including agent context, tool calls, streaming responses, token use, and
    request differences.
  best_for:
    - Developers debugging the prompts, tools, and context sent by coding agents
    - Reviewing or exporting local traces from supported agent CLIs and the Codex App
key_features:
  - Reverse and forward proxy modes for supported coding-agent clients
  - Local capture of prompts, messages, tool schemas, tool calls, and token usage
  - Self-contained HTML trace viewer with search, filtering, and structured request diffs
  - Live browser viewer that receives trace updates through server-sent events
  - Portable compact-trace export and later HTML rendering
  - Support for Claude Code, Codex CLI and App, Gemini CLI, OpenCode, Pi, and other listed clients
usage:
  interfaces:
    - CLI
    - local browser viewer
  installation:
    - uv tool
    - Python package
  setup: low
