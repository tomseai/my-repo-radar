status:
  lifecycle: experimental
  archived: false
  latest_release: v0.1.13
  latest_release_at: 2026-11-09
strengths:
  - The Rust workspace exposes a concrete, buildable CLI implementation
  - Documentation covers local, Windows, and container-oriented workflows
  - The repository clearly states its experimental, agent-managed purpose
caveats:
  - The maintainers say this is a museum-like agent-managed exhibit, not the serious
    production project
  - It is build-from-source only; the README warns that cargo install claw-code
    installs an unrelated deprecated stub
  - Using the agent requires an API key and provider or model access
