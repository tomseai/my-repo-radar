project:
  name: Claw Code
  kind: cli
  summary: A build-from-source Rust implementation of the claw CLI agent harness,
    explicitly maintained as an agent-managed public exhibit rather than a serious
    production project.
  best_for:
    - Inspecting an agent-managed Rust CLI harness and its implementation
    - Experimenting with prompt, interactive-session, provider, plugin, and RAG
      workflows
key_features:
  - Builds a claw command-line binary for one-shot prompts and interactive sessions
  - Provides doctor and status commands for configuration and health checks
  - Supports Anthropic and OpenAI-compatible provider configuration
  - Includes plugin, MCP, runtime, tool, telemetry, and compatibility-harness crates
  - Includes an optional SQLite-backed RAG service with OpenAI-compatible embeddings
  - Documents Docker and Podman workflows plus a Compose setup for the RAG service
usage:
  interfaces:
    - CLI
    - interactive terminal session
    - local RAG HTTP service
  installation:
    - build from source with Cargo
    - repository installer script
    - Docker or Podman development container
  setup: moderate
technology:
  languages:
    - Rust
    - Python
  notable_components:
    - Cargo workspace
    - Tokio
    - SQLite
    - Qdrant
    - Docker Compose
