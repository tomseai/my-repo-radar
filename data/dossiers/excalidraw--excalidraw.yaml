strengths:
  - Combines a ready-to-use collaborative whiteboard with a reusable React integration path
  - Supports common diagram outputs and an open JSON drawing format
  - Local-first browser behavior and offline support reduce dependence on a continuous connection

caveats:
  - The README assigns collaboration, encryption, offline support, and share links to excalidraw.com; it says drop-in package plugins for those features are planned for the future
  - Embedding the package requires a compatible React and React DOM version
  - The repository is a Yarn monorepo, so running its app from source is more involved than opening the hosted editor

