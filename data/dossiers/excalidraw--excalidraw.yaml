project:
  name: Excalidraw
  kind: application
  summary: >-
    An open-source, hand-drawn-style virtual whiteboard for diagrams and
    wireframes, with a hosted collaborative editor and a React component
    package for embedding the editor in another application.
  best_for:
    - Visual ideation, diagramming, and wireframing in a browser
    - React applications that need an embeddable canvas-based whiteboard

key_features:
  - Infinite canvas with drawing tools, arrow binding, labeled arrows, undo, zoom, and panning
  - Image and shape-library support plus PNG, SVG, clipboard, and .excalidraw JSON export
  - Hosted editor features real-time collaboration and end-to-end encryption
  - Browser-local autosave, offline PWA support, and shareable read-only links in the hosted app
  - Published @excalidraw/excalidraw React package with React 17, 18, and 19 peer support

usage:
  interfaces:
    - hosted browser-based whiteboard
    - React component package
  installation:
    - npm or Yarn package
    - source checkout with Yarn
    - Docker build for the included app
  setup: moderate

technology:
  languages:
    - TypeScript
  notable_components:
    - React
    - Vite
    - Yarn workspaces

