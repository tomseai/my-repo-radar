project:
  name: tmux
  kind: cli
  summary: >-
    A terminal multiplexer that creates, accesses, and controls multiple
    terminals from one screen, while allowing a session to detach, continue in
    the background, and later be reattached.
  best_for:
    - Developers who need persistent, organized terminal sessions
    - Remote or local shell workflows that must survive disconnection
key_features:
  - Creates and controls multiple terminals from a single screen
  - Detaches sessions so they continue running in the background before later reattachment
  - Provides a tmux.1 manual page, example configuration, wiki, FAQ, and shell completion reference
  - Supports verbose client and server logging for debugging
  - Runs on OpenBSD, FreeBSD, NetBSD, Linux, macOS, and Solaris
usage:
  interfaces:
    - terminal CLI
    - terminal user interface
  installation:
    - configure, make, and install from a release tarball
    - clone the repository, run autogen.sh, then configure, make, and install
  setup: moderate
