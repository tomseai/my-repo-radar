strengths:
  - Keeps shell work available across detach and reattach cycles instead of tying it to one terminal window
  - Documents source builds, platform support, debugging, and user-facing references in the pinned README
  - Maintains scheduled regression testing on Ubuntu and macOS with platform dependencies installed in CI
caveats:
  - The cached README documents source installation only, not platform package-manager commands
  - Building requires libevent, ncurses, a C compiler, make, pkg-config, and a yacc implementation
  - Version-control builds additionally require Autoconf and Automake
  - License scope is file-specific outside the README and CHANGES files
