project:
  name: OmniRoute
  kind: service
  summary: >-
    A self-hosted AI gateway, dashboard, and command-line tool that routes
    compatible coding clients across configured providers and model combinations
    through OpenAI-compatible APIs.
  best_for:
    - Centralizing local or remote routing for several coding tools and AI
      providers
    - Applying configurable fallback, quota management, and compression to agent
      traffic
key_features:
  - OpenAI-compatible APIs with provider-format translation and streaming support
  - Automatic and user-defined model combos with multiple routing and fallback
    strategies
  - Provider, account, quota, health, and cost management from a dashboard and
    CLI
  - Compression pipeline for tool results and context, with optional fidelity
    evaluation tooling
  - MCP transports and an A2A endpoint for agents to operate gateway functions
  - Docker, source, pnpm, and platform-specific installation paths
usage:
  interfaces:
    - Web dashboard
    - CLI and terminal chat client
    - OpenAI-compatible HTTP API
    - MCP server
    - A2A endpoint
  installation:
    - npm global package
    - Docker image
    - Source checkout with Node.js
    - pnpm package
  setup: moderate
technology:
  languages:
    - TypeScript
  notable_components:
    - Next.js
    - React
    - SQLite
    - Model Context Protocol
    - Server-Sent Events
