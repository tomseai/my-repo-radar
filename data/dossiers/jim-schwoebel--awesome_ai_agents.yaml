  kind: curated-list
  summary: >-
    A large, community-contributed Markdown hub for finding, learning about,
    and building AI agents through categorized links to applications,
    repositories, courses, benchmarks, datasets, frameworks, models, tools,
    security resources, and workflows.
  best_for:
    - People seeking a broad starting point for AI-agent tools and learning resources
    - Builders who want links spanning agent applications, frameworks, evaluation material, and deployment resources
key_features:
  - Divides the collection into using, learning, and building paths for AI agents
  - Lists agent applications across many task and industry categories
  - Curates repositories, courses, benchmarks, datasets, frameworks, LLM models, and prompt-engineering material
  - Includes sections for deployment, security, testing, tools, and workflows
  - Invites community contributions and describes the collection as receiving daily updates
