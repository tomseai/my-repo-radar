project:
  name: OpenBot
  kind: starter-template
  summary: A self-hostable workspace for AI coworkers that connects built-in or
    external AG-UI agents to governed browser, file, shell, and tool access,
    with desktop and Kubernetes deployment.
  best_for:
    - Teams building self-hosted AI coworkers that operate browsers, files, and
      external tools
    - Developers bringing AG-UI agents into a governed multi-user web workspace
key_features:
  - Supports one computer per person and optional per-Bot containers, depending
    on deployment configuration
  - Evaluates policy and records an audit event before the action gateway
    executes an approved computer action
  - Supports human takeover for login and two-factor authentication
  - Connects custom or framework-based agents through AG-UI
  - Governs MCP and Composio integrations with per-Bot tool grants
  - Provides personal and deployment-level skills, scheduled routines, and
    structured responses
usage:
  interfaces:
    - macOS and Windows desktop app
    - web workspace and administration UI
    - AG-UI endpoints
  installation:
    - macOS or Windows desktop installer
    - Kubernetes Helm chart
    - source with Bun and Docker
  setup: moderate
