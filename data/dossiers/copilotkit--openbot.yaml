  latest_release_at: 2026-11-21
strengths:
  - Framework-neutral AG-UI integration lets independently implemented agents
    share one governed workspace
  - Browser, file, shell, and external-tool actions pass through a fail-closed
    policy and audit layer
  - Offers self-contained desktop setup and separate Kubernetes deployment paths
    for teams
  - Human takeover, encrypted credentials, identity-provider support, and
    readable audit events address supervised-agent workflows
caveats:
  - CopilotKit Intelligence uses separate licensing. Fully local operation still
    needs internet access for initial downloads, sign-in, and local license
    renewal.
  - The documented Kubernetes evaluation uses shared computers and single-user
    administrator access. Team deployments require isolation, sign-in, and TLS.
  - The Helm charts enable CopilotKit management by default for team licenses
    from releases after v1.1.2.
