project:
  name: Awesome LLM Apps
  kind: curated-list
  summary: >-
    An Apache-2.0 collection of 100-plus runnable AI-agent, agent-skill, RAG,
    generative-UI, and LLM application templates that users can clone and adapt.
  best_for:
    - Developers choosing a practical starting point for an AI-agent or RAG prototype
    - Coding-agent users looking for installable skills and example implementations
key_features:
  - Agent skills installable through skills.sh and intended for Claude Code, Codex, Cursor, and compatible agents
  - Starter agents designed as small API-key-driven examples alongside more advanced tool- and memory-oriented agents
  - Multi-agent, voice, always-on, and autonomous-game agent categories
  - MCP examples for browser, GitHub, Notion, travel-planning, and routed multi-server workflows
  - RAG, memory, chat-with-data, token-optimization, fine-tuning, and framework-crash-course sections
  - Generative-UI examples that use interactive cards, dashboards, canvases, and MCP app interfaces
usage:
  interfaces:
    - GitHub Markdown catalog
    - Python and Streamlit examples
    - TypeScript and Next.js examples
    - Coding-agent skills
  installation:
    - Install an individual skill with npx skills add and its repository path
    - Clone the repository, enter a selected template, and install that template's dependencies
    - Run applicable Python examples with pip and Streamlit
    - Run applicable TypeScript templates with their npm scripts
  setup: moderate
technology:
  languages:
    - Python
    - TypeScript
  notable_components:
    - Streamlit
    - Model Context Protocol (MCP)
    - Next.js and React
    - CopilotKit
license:
  spdx: Apache-2.0
  name: Apache License 2.0
  notes: >-
    Permissive license requiring license, notice, attribution, and modified-file
    notice retention when applicable; it includes a patent grant that terminates
    for specified patent litigation.
status:
  lifecycle: active
  archived: false
  latest_release: null
  latest_release_at: null
strengths:
  - Broad organization lets users choose examples by agent pattern, interface, data source, or learning goal
  - Includes both directly usable coding-agent skills and runnable application templates
  - Demonstrates Python and TypeScript approaches, including MCP and generative user interfaces
caveats:
  - Requirements, model providers, credentials, and deployment needs vary by template; there is no single project setup
  - The repository also links to external projects, whose support and licenses must be evaluated independently
  - The README's testing and weekly-update claims are project assertions; the retained bundle does not provide a uniform test result for every template
  - The retained release feed has no entries, so no versioned project release can be established
