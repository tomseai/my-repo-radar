strengths:
  - Combines structural analysis with generated visual and written architecture
    output
  - Supports multiple documented source languages, including Kotlin, and several LLM-provider
    configuration paths
  - Incremental analysis can avoid rebuilding unaffected areas when a prior
    baseline exists
caveats:
  - Analysis requires configuring an LLM provider or a compatible local or proxy
    endpoint. The configured provider can receive code excerpts.
  - Initial setup downloads language-server binaries and may provision a pinned
    Node.js runtime
  - Incremental analysis needs a prior .codeboarding baseline and otherwise
    fails rather than falling back to a full run
  - The source package declares version 0.15.6, while the retained release
    feed's newest project release is v0.14.3
  - Anonymous aggregate telemetry is enabled by default, although documented
    environment-variable opt-outs are available
