project:
  name: CodeBoarding
  kind: cli
  summary: >-
    A codebase-analysis tool that combines static analysis and LLM reasoning to
    produce architecture diagrams, component documentation, and incremental
    updates in a repository's .codeboarding directory.
  best_for:
    - Developers and coding agents building a shared map of a codebase
    - Teams that want architecture diagrams and documentation in local, IDE, or
      CI workflows
key_features:
  - Generates high-level and component-level Mermaid architecture diagrams
  - Writes Markdown documentation and analysis output under .codeboarding
  - Uses static analysis, language servers, and LLM interpretation for
    architectural insights
  - Supports full, incremental, partial-component, and remote-GitHub analysis
    commands
  - Offers a CLI, VS Code extension, web platform, and pull-request integration through a GitHub Action
usage:
  interfaces:
    - command-line interface
    - VS Code extension
    - web platform
    - GitHub Action
  installation:
    - pipx install codeboarding with Python 3.12
    - pip install codeboarding from the documented package index
    - run from source with uv
  setup: moderate
technology:
  languages:
    - Python
  notable_components:
    - Language Server Protocol
    - Tree-sitter
    - LangChain
    - FastAPI
    - Mermaid
