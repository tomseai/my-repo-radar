project:
  name: herdr
  kind: cli
  summary: >-
    A Rust terminal workspace manager and agent multiplexer that keeps real
    terminal processes running, surfaces agent state, persists sessions, and
    exposes a socket API for agents to coordinate panes and workspaces.
  best_for:
    - Developers supervising multiple coding-agent sessions in terminal workspaces
    - Teams that want detached, persistent agent sessions reachable over SSH
key_features:
  - Shows recognized agents as blocked, working, done, idle, or unknown
  - Preserves real terminal panes when a client detaches and later reattaches
  - Supports workspaces, tabs, split panes, mouse interaction, and prefix-key navigation
  - Provides a socket API so agents can create panes, read output, and wait on each other
  - Extends panes and workflows through plugins
usage:
  interfaces:
