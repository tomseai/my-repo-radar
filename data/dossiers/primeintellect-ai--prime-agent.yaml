project:
  name: PRIME Agent
  kind: application
  summary: >-
    A coding and research agent for long-running work that combines recursive
    subagents, a persistent Python environment, durable memory and skills, and
    background autonomy.
  best_for:
    - Developers running long-horizon coding or research tasks from the terminal
    - Users who want an agent to refine reusable prompts, memories, skills, and
      subagent specifications
key_features:
  - Uses recursive language-model calls and a persistent IPython environment
  - Stores durable prompts, memories, skills, and subagent specifications
  - Runs through a background daemon with attach, resume, messaging, goals, and
    schedules
  - Supports multiple model providers and continual harness refinement
usage:
  interfaces:
    - terminal application
    - background daemon
  installation:
    - shell installer for macOS or Linux, or PowerShell installer for Windows
    - source checkout
  setup: moderate
technology:
  languages:
    - TypeScript
    - Python
  notable_components:
    - IPython
    - recursive language-model workflow
