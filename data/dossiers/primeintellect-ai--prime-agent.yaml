strengths:
  - Combines interactive sessions with durable background execution
  - Treats memory, skills, and harness refinement as first-class long-term state
caveats:
  - It is explicitly not a security sandbox and runs generated code with the
    user's permissions
  - A newer beta build exists, but v0.10.5 is the newest retained stable release
