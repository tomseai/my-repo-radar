project:
  name: awesome-ai-system-prompts
  kind: documentation
  summary: >-
    A Markdown guide and repository collection that examines captured system
    prompts from AI products to identify patterns for agent roles, tools,
    planning, context, safety, and interaction style.
  best_for:
    - Studying patterns in public or captured AI-system prompts before designing an agent
    - Comparing prompt structure, tool instructions, and workflow conventions across products

key_features:
  - Eight-principle guide covering role definition, structure, tool use, planning, context, constraints, safety, and tone
  - Case studies of v0, same.new, Manus, ChatGPT, and other AI systems
  - Repository-organized source materials for prompts, tools, and related instruction files
  - Examples of prompt schemas, tags, tool etiquette, and iterative agent loops
  - Synthesis of common practices and architectural differences among the captured systems

