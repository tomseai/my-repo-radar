project:
  name: Agentic AI Systems
  kind: documentation
  summary: >-
    A curated, hands-on knowledge base for learning how to design and build
    production-oriented AI agents and multi-agent systems, with foundations,
    framework tutorials, system-design material, examples, and reference links.
  best_for:
    - Learners mapping the concepts and design choices behind agentic systems
    - Developers comparing example workflows across several agent frameworks

key_features:
  - Foundation material covering generative AI concepts, LLMs, evaluation, and Python
  - Tutorials and example code for OpenAI, LangGraph, LlamaIndex, LangChain, CrewAI, and Chainlit
  - System-design material on architectures, layers, patterns, diagrams, and RAG variants
  - Example use cases including customer support, document processing, research, and weather agents
  - Curated resources plus interview-design frameworks, prompts, and practice templates

