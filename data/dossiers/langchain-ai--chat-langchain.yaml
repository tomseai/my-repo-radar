project:
  name: Chat LangChain
  kind: application
  summary: >-
    A documentation assistant for LangChain, LangGraph, and LangSmith that
    combines managed agent deployment, documentation and support-base search,
    on-topic guardrails, URL validation, and a Next.js public chat interface.
  best_for:
    - Teams building a managed documentation-support assistant
    - Developers studying a LangChain agent with a separate public web UI

key_features:
  - Searches official LangChain documentation through a Mintlify API
  - Searches a Pylon support knowledge base for known issues and solutions
  - Filters off-topic requests with guardrail middleware
  - Validates URLs before including them in responses
  - Uses Managed Deep Agents for deployment, identity, connectors, and ingress
  - Provides a Next.js frontend for the public chat experience

usage:
  interfaces:
    - web chat UI
    - managed agent service
    - local development server
  installation:
    - uv or pip for the Python backend
    - npm for the Next.js frontend
    - Managed Deep Agents deployment
  setup: high

