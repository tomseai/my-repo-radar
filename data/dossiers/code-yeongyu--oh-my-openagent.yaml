strengths:
  - Separates a full OpenCode-oriented harness from a lighter Codex CLI integration rather than presenting their capabilities as identical
  - Combines orchestration, code-navigation, search, rules, skills, and workflow features in the documented editions
  - Publishes an install path for each edition and for installing both together
caveats:
  - The README says a multi-harness refactor is in progress, so component boundaries and supported harnesses are changing
  - Full OpenCode setup includes provider authentication and model selection; the Codex installer can also configure autonomous full-permissions mode
  - Anonymous telemetry is enabled by default, although the README documents configuration and environment-variable opt-outs
  - The package and CLI retain oh-my-opencode names during the oh-my-openagent rename transition
