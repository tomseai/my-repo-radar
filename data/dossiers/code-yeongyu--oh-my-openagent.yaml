project:
  name: oh-my-openagent
  kind: cli
  summary: A coding-agent CLI built on the senpi fork of Pi that combines persistent
    Markdown memory, model routing, and project workflows. The repository also
    contains OpenCode and Codex components.
  best_for:
    - Developers who want a terminal agent with persistent project memory and
      multiple model providers
    - Users migrating settings from the earlier OpenCode or LazyCodex editions
key_features:
  - Runs coding tasks through an interactive CLI powered by senpi
  - Keeps agent memory as Markdown in a Git repository and uses a secondary model to
    retrieve relevant context
  - Offers configurable model providers, sign-in, and reasoning levels
  - Imports provider settings, MCP servers, skills, and model choices from earlier
    editions
usage:
  interfaces:
    - CLI
    - OpenCode and Codex plugin components
  installation:
    - documented OmO installer script
    - source workspace build with Bun
  setup: high
technology:
  languages:
    - TypeScript
  notable_components:
    - Bun
    - Node.js
    - Model Context Protocol
    - Language Server Protocol
    - tmux
