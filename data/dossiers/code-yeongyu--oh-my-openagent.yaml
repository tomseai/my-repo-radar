project:
  name: oh-my-openagent
  kind: plugin
  summary: >-
    An extension suite for OpenCode and Codex CLI that supplies agent workflow,
    tool, rule, and skill components in two differently scoped editions.
  best_for:
    - OpenCode users who want an integrated coding-agent harness with team-mode tooling
    - Codex CLI users who want the documented portable rules, LSP, MCP, and workflow components
key_features:
  - The OpenCode Ultimate edition includes 11 agents, lifecycle hooks, built-in MCPs, slash commands, and opt-in Team Mode
  - The Codex CLI Light edition provides rules, comment checking, Git Bash, LSP, ultrawork, continuation, telemetry, and plugin-scoped MCP components
  - Team Mode lets a lead coordinate up to eight parallel members through dedicated team tools and a tmux view
  - Hashline edits attach content hashes to read lines and reject edits when the file changed since the read
usage:
  interfaces:
    - OpenCode plugin
    - Codex CLI plugin
    - Command-line installer
    - tmux team visualization
  installation:
    - bunx oh-my-openagent install
    - npx lazycodex-ai install
    - bunx oh-my-openagent install --platform=both
  setup: high
technology:
  languages:
    - TypeScript
  notable_components:
    - Bun
    - Node.js
    - Model Context Protocol
    - Language Server Protocol
    - tmux
