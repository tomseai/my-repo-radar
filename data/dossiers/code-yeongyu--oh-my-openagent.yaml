strengths:
  - Combines cross-session Markdown memory and model selection in the same workflow
  - Provides a migration path from earlier editions with existing custom providers
    and skills
caveats:
  - The default documentation now describes the senpi CLI; OpenCode and Codex
    components remain in the monorepo
  - Model use requires provider credentials or a supported subscription
  - The root package retains the oh-my-opencode name
  - The root license restricts commercial distribution and leaves third-party license
    terms in place
