project:
  name: Browser Use
  kind: library
  summary: >-
    A Python library and CLI for LLM-driven agents that operate web browsers,
    including navigating pages, clicking controls, entering form data, and
    extracting information for repeatable web tasks.
  best_for:
    - Developers embedding browser automation in an AI agent or product
    - Agent users who need a local CLI skill for one-off browser tasks

key_features:
  - Agent API that executes a natural-language task with a selected LLM
  - Browser interactions for pages, buttons, text input, forms, and data extraction
  - Custom action tools for extending an agent's capabilities
  - Python library, command-line interface, and Docker image
  - Optional browser-use-core package for a Rust-backed beta agent

