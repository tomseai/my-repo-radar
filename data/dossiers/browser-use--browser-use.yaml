project:
  name: Browser Use
  kind: library
  summary: >-
    A Python library and CLI for language-model-driven browser tasks, built
    around a persistent Python execution context and Chrome DevTools Protocol,
    with local or hosted browser options.
  best_for:
    - Developers embedding browser automation in an AI agent or product
    - Agent users who need a local CLI skill for one-off browser tasks

key_features:
  - Accepts a browser task and runs it through a model-backed agent based on
    Pydantic AI
  - Keeps Python execution state across task steps and operates a browser
    through Chrome DevTools Protocol
  - Offers a local Python API and CLI and can connect either to local Chromium
    or cloud browsers
  - Provides Docker support and a CLI-based Model Context Protocol interface

usage:
  interfaces:
    - Python library
    - CLI
    - MCP server
    - Docker container
  installation:
    - uv package
    - pip package
    - source checkout
    - Docker image build
  setup: moderate

