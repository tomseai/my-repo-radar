    - Chromium
    - Docker

license:
  spdx: MIT
  name: MIT License
  notes: The MIT license applies to the open-source library; hosted services have
    separate terms.

status:
  lifecycle: active
  archived: false
  latest_release: 1.0.8
  latest_release_at: 2026-11-22

strengths:
  - Supports both embedded, repeatable automation and interactive agent use
  - Lets developers choose an LLM provider and add task-specific tools
  - Provides local Python and container-based deployment options

caveats:
  - The package requires Python 3.11 or newer and is designed around a
    configured model and browser
  - The hosted agent API and hosted browser are distinct services, with their
    own terms and costs
  - The 1.0 execution model differs from 0.x and has a separate migration guide
  - Browser automation depends on site stability, account access, and site
    policies

