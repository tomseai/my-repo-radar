project:
  name: BetterDB Monitor
  kind: application
  summary: >-
    A self-hosted monitoring application for Valkey and Redis that presents
    real-time activity, slowlog analysis, audit trails, and database metrics.
  best_for:
    - Operators who need a web interface for a Valkey or Redis instance
    - Teams that want either an interactive CLI setup or a Docker deployment
key_features:
  - Monitors Valkey and Redis with real-time views, slowlog analysis, audit trails, and metrics
  - Provides a NestJS/Fastify backend and React/Vite frontend
  - Ships an npx-installable CLI with an interactive connection and storage setup wizard
  - Supports Docker and Helm deployments, and the CLI supports SQLite, PostgreSQL, and in-memory storage
usage:
  interfaces:
    - web UI
    - CLI
    - backend HTTP API
  installation:
    - npx or global npm package
    - pnpm monorepo development setup
    - Docker image deployment
    - Kubernetes deployment with Helm
  setup: moderate
technology:
  languages:
    - TypeScript
    - Python
  notable_components:
    - NestJS with Fastify
    - React and Vite
    - pnpm workspaces and Turborepo
    - Docker
