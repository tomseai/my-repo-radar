  kind: documentation
  summary: >-
    A beginner-oriented, iterative guide to applying domain-driven design from
    understanding a business and domain through defining contexts and coding.
  best_for:
    - Teams beginning a domain-driven design initiative or migration
    - Facilitators teaching a practical starting process for domain modelling

key_features:
  - "Eight stages: understand, discover, decompose, strategize, connect, organise, define, and code"
  - Suggested collaborative modelling tools and the people to involve at each stage
  - Adaptation guidance for greenfield work, migrations, team changes, and learning
  - Explicit advice to iterate rather than standardise a linear process

