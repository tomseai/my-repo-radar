project:
  name: CloudCLI UI
  kind: application
  summary: >-
    A self-hostable web, desktop, and mobile interface for viewing projects and
    sessions and working with Claude Code, Cursor CLI, Codex, and related
    agents.
  best_for:
    - Developers who want a visual, remote-friendly workspace around supported
      agent CLIs
    - Teams evaluating local self-hosting or the separate managed CloudCLI
      service

key_features:
  - Responsive chat and session-management interface
  - Integrated shell terminal, file explorer, Git explorer, and browser sessions
  - Support for Claude Code, Cursor CLI, Codex, and listed GPT or Claude models
  - Self-hosted npm mode, experimental Docker sandbox mode, and desktop companion
  - Plugin system for custom tabs, backend services, and integrations

usage:
  interfaces:
    - web UI
    - desktop companion app
    - mobile browser UI
    - REST API
  installation:
    - npx
    - global npm package
    - Docker sandbox
    - desktop release
  setup: moderate

technology:
  languages:
    - TypeScript
  notable_components:
    - React
    - Vite
    - Tailwind CSS
    - CodeMirror
    - Electron

