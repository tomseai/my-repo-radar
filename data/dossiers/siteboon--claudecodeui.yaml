strengths:
  - Brings session, terminal, file, Git, and plugin workflows into one interface
  - Supports both self-hosted use and an optional native desktop companion

caveats:
  - Self-hosted operation requires Node.js v22 or later and a machine running the local service
  - The UI is an environment around agent subscriptions; users still supply the applicable AI subscriptions
  - Agent tools are disabled by default and must be enabled deliberately
  - The feed also contains local-server-runtime prereleases; the selected v1.36.3 entry is the CloudCLI UI product release

