project:
  name: Planning with Files
  kind: plugin
  summary: A persistent, file-based planning skill for AI coding agents that keeps
    plans, findings, and progress on disk to survive context loss, compaction, and
    interrupted sessions.
  best_for:
    - Long-running coding-agent tasks that need a durable, inspectable execution plan
    - Agent teams that need file-based task state and an explicit completion check
key_features:
  - Creates task_plan.md, findings.md, and progress.md for phases, research, and
    session logs
  - Re-reads plan state through supported lifecycle hooks and provides session
    recovery after a reset or clear
  - Supports opt-in autonomous and gated modes with a structured JSONL run ledger and
    plan attestation
  - Supplies completion checks and a plan-doctor diagnostic for plan resolution,
    injection, installation, and latency
  - Ships Agent Skills layouts and documented integrations for Claude Code and other
    coding-agent clients
usage:
  interfaces:
    - Agent Skills-compatible coding agents
    - Claude Code plugin commands and lifecycle hooks
    - project-local Markdown planning files
  installation:
    - Claude Code plugin marketplace installation
    - npx skills add Agent Skills installation
    - repository clone or manual skill copy
  setup: moderate
technology:
  languages:
    - Python
    - Shell
    - PowerShell
    - Markdown
  notable_components:
    - SKILL.md Agent Skills format
    - task_plan.md, findings.md, and progress.md templates
    - POSIX shell and PowerShell helper scripts
    - JSONL run ledger
