project:
  name: Paperclip
  kind: application
  summary: A self-hosted Node.js server and React control plane for coordinating
    teams of AI agents around company goals, tasks, budgets, governance, and
    operational visibility.
  best_for:
    - Teams operating many agent runtimes that need one task and supervision
      system
    - Organizations that need cost controls, approvals, auditability, and
      scheduled agent work
key_features:
  - Models companies, goals, projects, agents, roles, reporting lines, and
    task dependencies
  - Provides ticketed work with atomic checkout, session state, structured
    logs, activity, and audit trails
  - Schedules agent heartbeats and routines while enforcing scoped budget
    warnings and hard stops
  - Connects local and external agent adapters, including Claude Code, Codex,
    Cursor, Gemini, OpenCode, Pi, and OpenClaw
  - Includes approval workflows, execution policies, plugins, secret handling,
    and optional OpenTelemetry tracing
  - Provides shared and versioned skills, saved evaluations, and other tooling
    for assessing agent outputs
usage:
  interfaces:
    - React web dashboard
    - Paperclip CLI
    - Node.js server
  installation:
    - npx paperclipai@latest onboard --yes
    - source checkout with pnpm
    - Docker Compose deployment with PostgreSQL
  setup: moderate
technology:
  languages:
    - TypeScript
    - JavaScript
  notable_components:
    - Node.js 20 or newer
    - React 19
    - Express
    - PostgreSQL, including embedded local development storage
    - pnpm workspaces
