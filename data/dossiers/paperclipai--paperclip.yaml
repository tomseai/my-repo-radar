strengths:
  - Unifies agent organization, work coordination, governance, and
    budget-aware operations in a single self-hostable control plane
  - Supports a broad adapter surface while letting operators bring their own
    agents and runtimes
  - Provides a low-friction local onboarding path with embedded PostgreSQL,
    plus an explicit Docker and external-PostgreSQL route
caveats:
  - Experimental agent chat and messaging connectors require instance settings
    to enable
  - Operating it still requires configuring projects, agents, goals, and the
    credentials or costs of the connected runtimes
  - Docker Compose requires an authenticated deployment configuration and
    BETTER_AUTH_SECRET, unlike the trusted local quickstart mode
  - The quickstart requires Node.js 24.11 or newer. Newer Atom entries are
    nightlies and canaries
