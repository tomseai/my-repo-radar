strengths:
  - Unifies agent organization, work coordination, governance, and budget-aware operations in a single self-hostable control plane
  - Supports a broad adapter surface while letting operators bring their own agents and runtimes
  - Provides a low-friction local onboarding path with embedded PostgreSQL, plus an explicit Docker and external-PostgreSQL route
caveats:
  - Paperclip coordinates agents but is not an agent framework, prompt manager, workflow builder, or code-review tool
  - Operating it still requires configuring projects, agents, goals, and the credentials or costs of the connected runtimes
  - Docker Compose requires an authenticated deployment configuration and BETTER_AUTH_SECRET, unlike the trusted local quickstart mode
  - The retained release feed contains canary builds only; its newest observed entry is canary/v2026.718.0-canary.1 on 2026-07-18, so no stable project release is established
