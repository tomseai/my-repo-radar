project:
  name: PaddleOCR
  kind: framework
  summary: >-
    A Python-centered OCR and document-understanding toolkit that converts
    images and PDF documents into structured outputs such as JSON and Markdown.
    It includes scene OCR, document parsing, vision-language models, deployment
    material, SDKs, and an MCP server.
  best_for:
    - Developers extracting text and structure from images or PDF documents for
      downstream applications
    - Teams preparing document data for RAG, LLM, or agent workflows with local
      or hosted inference options

key_features:
  - Provides PP-OCR scene text recognition and PP-StructureV3 document parsing
    pipelines
  - Produces structured document outputs including Markdown, JSON, and
    coordinate-rich results
  - Includes PaddleOCR-VL document vision-language models for tables, formulas,
    charts, and text
  - Ships a Python CLI, optional document-parsing extras, deployment assets,
    SDKs, and an MCP server package

usage:
  interfaces:
    - Python package and paddleocr CLI
    - local inference pipelines
    - MCP server
    - official web API and SDKs
  installation:
    - Python 3.8 or later package installation
    - optional pip extras for document parsing, information extraction, or
      translation
    - Docker and service deployment assets
  setup: moderate

technology:
  languages:
    - Python
    - TypeScript
    - Go
    - Java
    - Kotlin
  notable_components:
    - PaddleX OCR core
    - PaddleOCR-VL
    - PP-StructureV3
    - PaddleOCR.js
    - paddleocr_mcp

license:
  spdx: Apache-2.0
  name: Apache License 2.0
  notes: The cached top-level repository LICENSE is Apache-2.0; separately
    downloaded models and third-party dependencies can carry their own terms.

status:
  lifecycle: active
  archived: false
  latest_release: v3.7.0
  latest_release_at: 2026-06-11

strengths:
  - Covers both scene OCR and structured document parsing in one maintained
    project
  - Offers several integration surfaces, including Python, CLI, SDK, service,
    browser, and MCP paths
  - Supports structured outputs suited to document-processing and AI application
    pipelines

caveats:
  - Model choice, inference backend, and deployment target make the setup more
    involved than a single OCR library
  - Local document parsing can require optional dependencies, models, and
    suitable compute resources
  - Model and dependency licenses should be assessed separately from the
    Apache-2.0 repository license

