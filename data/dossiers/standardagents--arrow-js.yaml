strengths:
  - Keeps the core runtime DOM-first, small, and usable without a build step
  - Lets applications adopt async components, SSR, and hydration as separate layers
  - Supplies scaffold, editor, Vite, testing, and optional sandbox packages in the monorepo
caveats:
  - The core runtime is browser and DOM oriented; server rendering requires the separate SSR package
  - Async components require importing the framework, SSR, or hydration runtime before rendering
  - The QuickJS/WASM sandbox is optional and its deployment-specific isolation properties should be evaluated separately
  - Full local development needs Node.js and pnpm even though core browser use has no build-step requirement
