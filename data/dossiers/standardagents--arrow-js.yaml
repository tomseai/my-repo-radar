project:
  name: ArrowJS
  kind: framework
  summary: >-
    A TypeScript reactive UI framework centered on JavaScript modules, tagged
    templates, and direct DOM updates, with optional asynchronous components,
    server-side rendering, hydration, Vite integration, and a QuickJS/WASM sandbox.
  best_for:
    - Developers who want a small reactive DOM runtime with a minimal core API
    - Projects that need to add async components, SSR, and hydration without changing component models
key_features:
  - Core package for reactive state, tagged-template rendering, and components
  - Separate framework package for asynchronous components and rendering boundaries
  - SSR package for rendering HTML and serializing asynchronous payloads
  - Hydration package that adopts server-rendered HTML in the browser
  - Vite plugin, project scaffolder, editor syntax extension, and agent skill
  - Optional QuickJS/WASM runtime for executing Arrow templates outside the host window realm
