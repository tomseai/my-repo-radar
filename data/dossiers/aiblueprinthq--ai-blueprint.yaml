strengths:
  - Preserves plans, current work, findings, and history across agent context
    resets
  - Makes specification and diff review explicit stops before code and merge
    actions
  - Installs into an existing stack instead of prescribing an application
    framework
caveats:
  - It is a workflow overlay, not an application skeleton; the project must be
    scaffolded first
  - Testing remains opt-in until the target project defines a real test command
  - Effective gates depend on agent compliance and the repository's actual Git
    and CI protections
  - First-time setup requires onboarding or adoption so generated guidance
    matches the codebase
