project:
  name: AI Blueprint
  kind: starter-template
  summary: >-
    A file-backed, spec-driven workflow overlay for building existing software
    projects with coding agents through reviewed specs, small implementation
    steps, explicit verification, durable findings, and controlled completion.
  best_for:
    - Developers who want structured human checkpoints around AI-assisted
      implementation
    - Existing or newly scaffolded repositories that need durable agent context
      outside chat
key_features:
  - Generates project context and feature specifications from user-owned
    planning documents
  - Keeps one active work item and archives completed features, fixes, and
    rollbacks
  - Provides skills for planning, implementation, checks, audits, completion,
    CI, and releases
  - Tracks review findings with durable IDs and blocks completion on unresolved
    P0 or P1 findings
  - Provides adapters for Codex, Claude Code, GitHub Copilot, Google
    Antigravity, and OpenCode with shared file-backed workflow state
usage:
  interfaces:
    - coding-agent skills
    - Markdown workflow files
    - npm initializer
  installation:
    - npx create-ai-blueprint@latest inside an existing Git repository
    - npm create ai-blueprint@latest
  setup: moderate
technology:
  languages:
    - JavaScript
    - Markdown
  notable_components:
