project:
  name: TokenTelemetry
  kind: application
  summary: A local dashboard that reads supported AI-agent session logs to show token
    use, costs, tool calls, reasoning traces, budgets, and project analytics.
  best_for:
    - Developers comparing token use and costs across local coding-agent sessions
    - Teams needing a local, read-only view of supported AI-agent activity
key_features:
  - Unified token, cost, session, and model analytics across supported agents
  - Waterfall traces for prompts, reasoning, tool calls, and responses
  - Per-project activity, heatmaps, agent leaderboards, and worktree rollups
  - Observational token or spend budgets with 80% and 100% alerts
  - Zero-configuration detection of supported agents' default log locations
  - Dedicated Hermes Agent dashboard with source, gateway, and delegation views
usage:
  interfaces:
    - local web dashboard
    - CLI launcher
    - local REST API
  installation:
