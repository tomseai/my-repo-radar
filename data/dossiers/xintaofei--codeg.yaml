strengths:
  - Centralizes sessions from many coding-agent CLIs while preserving desktop, browser, and self-hosted deployment choices
  - Combines delegation, worktrees, Git operations, MCP, skills, and automations in one workspace
  - Provides documented installer, binary, Docker, and source-build paths for server use
caveats:
  - Agent availability, credentials, and session import behavior depend on the separately configured coding-agent tools
  - Desktop source builds require Node.js, pnpm, Rust, and Tauri platform dependencies
  - Server deployments should retain the generated or configured access token and persist the data volume; custom binary layouts must keep the MCP companion discoverable for delegation
