project:
  name: codeg
  kind: application
  summary: >-
    A local-first multi-agent coding workspace that aggregates sessions from
    many coding-agent CLIs and adds collaboration, Git worktrees, MCP and skill
    management, automation, and desktop, browser-server, or Docker deployment.
  best_for:
    - Developers coordinating sessions from several local coding agents in one workspace
    - Teams that need a self-hosted browser workspace or desktop interface for agent-assisted Git work
key_features:
  - Imports and aggregates conversation sessions from twelve supported coding agents
  - Multi-agent delegation through the bundled codeg-mcp companion
  - Parallel development with built-in Git worktree flows
  - Local and project-scoped skill management plus MCP discovery, registry search, and installation
  - Reusable scheduled or on-demand headless automations
  - Desktop app, standalone HTTP/WebSocket server, and Docker deployment modes
usage:
  interfaces:
    - Tauri desktop app
    - browser-based web workspace
    - standalone server
    - Docker container
    - MCP companion
  installation:
    - GitHub release binaries
    - Linux/macOS shell installer
    - Windows PowerShell installer
    - Docker or Docker Compose
    - build from source
  setup: moderate
technology:
  languages:
    - TypeScript
    - Rust
  notable_components:
