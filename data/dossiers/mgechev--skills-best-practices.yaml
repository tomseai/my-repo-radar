project:
  name: Best Practices for Creating Agent Skills
  kind: documentation
  summary: >-
    A concise guide to designing agent skills with discoverable metadata,
    progressive disclosure, deterministic helpers, and LLM-assisted validation.
  best_for:
    - Authors creating or revising agent skills
    - Teams that want to reduce skill-context cost and prevent prompt-routing regressions
key_features:
  - Defines a conventional skill layout around SKILL.md, scripts, references, and assets
  - Gives frontmatter naming and description guidance for reliable skill discovery
  - Recommends keeping SKILL.md under 500 lines and loading referenced material just in time
  - Advises deterministic small scripts for fragile or repetitive operations
  - Provides discovery, logic, edge-case, and architecture-refinement LLM validation prompts
