project:
  name: GSD Core
  kind: framework
  summary: >-
    A multi-runtime context-engineering and spec-driven development framework
    that guides coding agents through discuss, plan, parallel execution,
    verification, and shipping phases while moving heavy work into fresh
    subagent contexts.
  best_for:
    - Developers running multi-phase software projects with coding agents
    - Teams that need durable project state and repeatable planning, execution,
      and verification loops
key_features:
  - Runs a repeatable discuss, plan, execute, verify, and ship loop for each
    milestone phase
  - Uses fresh-context subagents for research, planning, and parallel execution
    waves
  - Preserves cross-session state in structured project, context, and status
    artifacts
  - Supports greenfield projects and onboarding of existing codebases
  - Installs adapters for many coding-agent runtimes through one npm package
usage:
  interfaces:
    - coding-agent commands and skills
    - command-line installer
    - MCP server
    - VS Code extension
  installation:
    - npx @opengsd/gsd-core@latest
    - global or project-local installation through the runtime-aware installer
  setup: moderate
technology:
  languages:
    - JavaScript
    - TypeScript
  notable_components:
    - Claude Agent SDK
    - MCP server
    - runtime adapters
    - VS Code extension
license:
  spdx: MIT
  name: MIT License
  notes: Permissive license requiring preservation of the copyright and license
    notice.
status:
  lifecycle: active
  archived: false
  latest_release: v1.22.0
  latest_release_at: 2026-11-19
strengths:
  - Reduces long-session context accumulation by assigning heavy work to fresh
    subagents
  - Connects planning artifacts, parallel execution, verification, and
    pull-request shipping
  - Offers one shared workflow across a broad set of coding-agent runtimes
caveats:
  - The current package manifest requires Node.js 24+ and npm 10+
  - Cross-runtime installation must use the installer; directly copying agent or
    command files is unsupported
  - Parallel subagent workflows can substantially increase model usage and
    coordination overhead
