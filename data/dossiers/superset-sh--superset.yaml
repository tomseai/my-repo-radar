strengths:
  - Makes parallel agent work visible and isolated through Git worktrees
  - Covers execution, terminal control, code review, previews, and handoff in one workspace model
  - Supports any terminal-based agent and offers programmatic access through CLI, SDK, and MCP

caveats:
  - The retained README advertises an official desktop download for macOS; other desktop-platform support is not established here
  - Product access depends on a usable Git repository, local worktree workflow, and compatible CLI agents
  - The Elastic License 2.0 is source-available but restricts hosted or managed-service use and license-key circumvention
  - The release feed includes a newer desktop canary; the recorded stable desktop release is v1.15.1

