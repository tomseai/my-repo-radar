project:
  name: Superset
  kind: application
  summary: >-
    A desktop code editor and shared workspace system for running terminal-based
    coding agents in parallel, each isolated in its own Git worktree with
    built-in terminal, review, and workspace-management tools.
  best_for:
    - Developers coordinating several CLI coding agents against the same repository
    - Teams that want worktree isolation, local review, and remote workspace access
key_features:
  - Runs parallel agent workspaces with separate branches, terminals, and environments
  - Monitors agents with status indicators and attention notifications
  - Includes persistent split terminals, a diff viewer, and in-app code editing
  - Detects workspace ports and previews development servers in an in-app browser
  - Schedules agent sessions for recurring work such as triage and dependency updates
  - Exposes the shared workspace system through desktop, CLI, TypeScript SDK, and MCP surfaces
usage:
  interfaces:
    - desktop application
    - CLI
    - TypeScript SDK
    - MCP server
  installation:
    - official macOS release download
    - standalone CLI installation
    - build from source with Bun
  setup: moderate

technology:
  languages:
    - TypeScript
  notable_components:
    - Electron
    - React
    - Bun workspaces
    - SQLite-compatible local storage

