strengths:
  - Gives a complete viewer for fast adoption while allowing individual
    components to be composed into a custom UI
  - Handles two common trace formats and documents its normalized input shape
  - Includes semantic theme tokens and responsive desktop and mobile viewer
    layouts
caveats:
  - The README explicitly labels the library alpha and warns that APIs may change
  - UI source is copied into the consuming project, and the README requires
    React 19+, Tailwind CSS 3, and TypeScript
  - The GitHub release feed contains no entries, so no primary-project release
    can be established
