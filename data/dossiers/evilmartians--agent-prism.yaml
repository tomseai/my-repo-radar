project:
  name: AgentPrism
  kind: library
  summary: >-
    An alpha React component library for exploring AI-agent traces as
    hierarchical timelines, using adapters that normalize OpenTelemetry and
    Langfuse data.
  best_for:
    - React teams building custom trace viewers for AI-agent debugging
    - Developers who need to inspect LLM calls, tool executions, and workflow
      spans
key_features:
  - Supplies a full TraceViewer with trace list, span tree, search, detail
    panel, and responsive layouts
  - Provides composable TraceList, TreeView, and DetailsView components for
    custom layouts
  - Normalizes OpenTelemetry and Langfuse data through adapters and shared trace
    types
  - Recognizes OpenTelemetry GenAI, OpenInference, standard OpenTelemetry, and
    custom attributes
usage:
  interfaces:
    - React component library
    - npm data and types packages
    - Storybook
  installation:
    - npx degit evilmartians/agent-prism/packages/ui/src/components
      src/components/agent-prism
    - npm install @evilmartians/agent-prism-data @evilmartians/agent-prism-types
  setup: moderate
technology:
  languages:
    - TypeScript
  notable_components:
    - React
    - Tailwind CSS
    - OpenTelemetry
    - Langfuse
    - Storybook
