status:
  lifecycle: active
  archived: false
  latest_release: v1.90.0
  latest_release_at: 2026-11-20
strengths:
  - Combines chat, UI rendering, shared state, and human-approval primitives in
    one framework
  - Supports multiple major web and mobile front-end targets from a shared agent
    interaction model
  - Includes a generator command, package SDKs, agent-installable skills, and
    source examples
caveats:
  - A working application still requires an LLM provider key and integration
    with the chosen agent backend
  - Slack and Microsoft Teams channels are generally available through the
    cloud-hosted Intelligence service
  - The monorepo feed also contains independently versioned channel packages;
    v1.90.0 is the primary CopilotKit release, not the newest feed entry
