project:
  name: CopilotKit
  kind: framework
  summary: >-
    A multi-platform framework for adding agent-driven chat, generative UI,
    shared state, and approval workflows to application front ends.
  best_for:
    - Product teams building agent-facing web or mobile application interfaces
    - Teams that need one agent interaction model across supported front-end surfaces
key_features:
  - Provides customizable chat UI with streamed messages, tool calls, and agent responses
  - Renders agent-selected or dynamically updated UI components in the client
  - Synchronizes application state that agents and UI components can both update in real time
  - Lets agents pause for user input, confirmation, or edits before continuing
  - Supports React and Next.js, Angular, Vue, React Native, and beta collaboration-channel integrations
usage:
  interfaces:
    - web UI components and hooks
    - React Native UI
    - Slack and Microsoft Teams channels
    - JavaScript and Python SDK packages
  installation:
    - npx copilotkit@latest create starter command
    - npm or pnpm packages
    - source checkout with pnpm workspaces
  setup: moderate
technology:
  languages:
    - TypeScript
    - Python
  notable_components:
    - React and Next.js
    - Angular
    - Vue
    - React Native
    - AG-UI protocol
    - pnpm workspaces
