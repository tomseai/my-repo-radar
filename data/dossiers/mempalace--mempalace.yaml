project:
  name: MemPalace
  kind: application
  summary: >-
    A local-first, Python-based memory tool that mines project files and AI
    conversations into verbatim searchable storage, exposes a CLI and MCP
    server, and organizes scoped memories with pluggable retrieval backends.
  best_for:
    - Retaining and retrieving local coding-agent or conversation context without a required cloud API
    - Developers who want searchable project and transcript memory with scoped storage boundaries

key_features:
  - Verbatim conversation and file storage without summary or paraphrase during core ingestion
  - CLI commands to mine sources, search memories, and load context for a new session
  - MCP server with tools for memory, graph, navigation, drawer, and agent-diary operations
  - Structured wings, rooms, and drawers for scoped retrieval rather than a flat corpus
  - Pluggable storage backends including embedded ChromaDB and optional Milvus, Qdrant, and pgvector
  - Local SQLite-backed temporal entity-relationship graph and integrations for editor hooks

usage:
  interfaces:
    - CLI
    - MCP stdio server
    - Python package
    - Docker container
  installation:
    - uv tool install mempalace
    - pipx install mempalace
    - pip install mempalace in a virtual environment
    - Docker build and run
  setup: moderate

