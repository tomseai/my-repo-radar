strengths:
  - Core local semantic search and storage do not require an API key or external model service
  - Supports both direct terminal use and reusable MCP-client integration
  - Makes retrieval boundaries explicit through its palace, wing, room, and drawer model

caveats:
  - The default embedding model is downloaded on first use and requires roughly 300 MB of disk space
  - Non-default backends and GPU acceleration add installation and operational dependencies
  - Optional full reranking requires a separately configured LLM; the baseline retrieval path remains local
  - Hook-based IDE integrations require separate configuration and depend on each client's lifecycle support

