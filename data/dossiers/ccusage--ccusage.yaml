  languages:
    - Rust
    - TypeScript
  notable_components:
    - native platform binaries
    - Nix development environment
license:
  spdx: MIT
  name: MIT License
  notes: The published ccusage package declares the MIT license.
status:
  lifecycle: active
  archived: false
  latest_release: v20.0.17
  latest_release_at: 2026-07-10
strengths:
  - Covers many coding-agent data sources through one local command
  - Provides both terminal-oriented reports and machine-readable JSON
  - Separates cache-token accounting and supports offline pricing data
caveats:
  - It reports only usage logs from supported coding CLIs that are installed and have local data
  - Cost figures are estimates based on token counts and model pricing
  - Custom data locations require source-specific environment variables or configuration
  - The root LICENSE file points to the application license; the MIT determination comes from the published package metadata
