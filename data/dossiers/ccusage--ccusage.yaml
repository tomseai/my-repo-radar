project:
  name: ccusage
  kind: cli
  summary: >-
    A local CLI that reads supported coding-agent usage logs and reports token
    counts, estimated costs, models, and sessions across multiple agents.
  best_for:
    - Developers comparing local usage across supported coding-agent CLIs
    - Exporting token and estimated-cost reports for personal analysis or
      automation
key_features:
  - Unified reports across detected supported coding-agent data sources
  - Source-specific daily, weekly, monthly, and session reports
  - Token, cache-token, model, and estimated USD-cost reporting
  - Responsive terminal tables and JSON output
  - Local data reading without uploading usage logs
  - Configurable paths, timezones, report defaults, and offline pricing mode
usage:
  interfaces:
    - CLI
    - JSON output
  installation:
    - bunx, npx, or pnpm dlx
    - Nix run
    - global npm-compatible installation
    - build from source
