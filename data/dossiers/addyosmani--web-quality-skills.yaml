strengths:
  - Covers the main Lighthouse quality categories in one installable,
    stack-agnostic skill collection
  - Offers focused skills as well as an orchestrating audit skill, so prompts
    can match the scope of the task
  - Reuses one skills directory across supported agent integrations instead of
    maintaining separate guidance
caveats:
  - Live Lighthouse audits require Chrome DevTools MCP; without browser tools
    the skills cannot perform those measurements
  - The stated performance budgets and score targets are recommendations, so
    projects still need context-specific measurement and prioritization
  - Codex plugin installation requires Codex CLI v0.122 or later; the documented
    symlink-based layout may need a local copy on Windows
  - The cached release feed has no entries, so a latest versioned release cannot
    be established
