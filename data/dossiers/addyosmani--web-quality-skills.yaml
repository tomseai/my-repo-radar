project:
  name: Web Quality Skills
  kind: plugin
  summary: >-
    A stack-agnostic collection of six agent skills for reviewing and improving
    web performance, Core Web Vitals, accessibility, SEO, and best practices.
  best_for:
    - Developers asking coding agents for focused web-quality reviews or
      improvements
    - Teams that want reusable Lighthouse-, Core Web Vitals-, and WCAG-informed
      guidance
key_features:
  - A full web-quality audit skill that coordinates performance, accessibility,
    SEO, and best-practice checks
  - Dedicated performance guidance covering rendering, code splitting, images,
    fonts, caching, and server response
  - Core Web Vitals guidance for LCP, INP, and CLS with documented target
    thresholds
  - Accessibility review guidance based on WCAG 2.2, including screen-reader and
    keyboard-navigation concerns
  - SEO guidance for crawlability, metadata, structured data, mobile
    friendliness, and performance signals
  - Shared skill files packaged for Claude Code, Codex, and Gemini CLI
usage:
  interfaces:
    - Agent skill prompts
    - Codex plugin
    - Claude Code plugin
    - Gemini CLI extension
  installation:
    - Install with npx skills add addyosmani/web-quality-skills or npx add-skill
      addyosmani/web-quality-skills
    - Add the repository as a Codex plugin marketplace
    - Install the repository as a Claude Code plugin or Gemini CLI extension
    - Copy the skills directory manually for compatible agents
