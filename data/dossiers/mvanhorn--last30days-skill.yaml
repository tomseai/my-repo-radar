project:
  name: last30days
  kind: plugin
  summary: >-
    An agent skill and plugin for producing recent, cited research briefs by
    searching and ranking signals from multiple public and connected sources.
  best_for:
    - Developers and researchers investigating people, companies, products, or
      trends
    - Agent hosts that can load an Agent Skills plugin or an MCP bundle
key_features:
  - Searches supported sources in parallel and ranks results by engagement,
    relevance, and freshness
  - Resolves relevant handles, repositories, subreddits, and other
    source-specific terms before retrieval
  - Merges cross-source stories and synthesizes a source-cited research brief
  - Company searches can include patent filings and career pages; listed-company briefs can include market context
  - Supports opt-in SQLite trend tracking, scheduled watchlists and briefings, and a local Atom feed
  - Offers discovery, comparisons, JSON export, HTML briefs, and a local
    saved-brief library
  - Provides Agent Skills installations, native marketplace plugins, and a
    Claude Desktop MCP bundle
usage:
  interfaces:
    - agent skill and slash command
    - CLI
    - MCP server bundle
  installation:
    - Agent Skills CLI or supported native marketplaces
    - Claude Desktop .mcpb release bundle
    - source checkout for developer use
  setup: moderate
technology:
  languages:
    - Python
    - Go
    - JavaScript
  notable_components:
    - Model Context Protocol server
    - Agent Skills format
    - SQLite-backed research library
