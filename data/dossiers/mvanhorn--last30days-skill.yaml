strengths:
  - Combines multiple independent sources into one scored and cited brief
  - Offers several agent-host installation paths instead of only a standalone script
  - Supports structured JSON, rendered HTML, and local reusable research-library workflows
caveats:
  - Source coverage and result quality depend on external services, their current access, and their data
  - Several sources need user-provided API keys, browser sessions, local tools, or paid service access
  - The Claude Desktop MCP bundle requires Python 3.12 or newer and documents Windows support as deferred
  - Installing both the Claude Code marketplace plugin and Agent Skills copy creates duplicate command entries
