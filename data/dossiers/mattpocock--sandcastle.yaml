project:
  name: Sandcastle
  kind: library
  summary: >-
    A TypeScript library and CLI for running coding agents in configurable
    sandboxed Git workflows, then collecting or merging their commits.
  best_for:
    - Automating isolated coding-agent runs from TypeScript, scripts, or CI
    - Building parallel agent or review workflows with explicit Git branch handling
key_features:
  - The run API invokes an agent, applies a configurable branch strategy, and returns commits and iteration results
  - Built-in Docker, Podman, and Vercel sandbox providers plus APIs for custom bind-mount or isolated providers
  - The initializer scaffolds a .sandcastle directory with configuration, Dockerfile, prompt, and environment files
  - Supports prompt arguments, lifecycle hooks, iteration limits, file or stdout logging, and streamed agent events
  - Provides a no-sandbox provider for deliberate host execution when container isolation is not wanted
usage:
  interfaces:
    - TypeScript and JavaScript API
    - sandcastle command-line interface
    - Generated .sandcastle configuration and prompt files
  installation:
    - npm install --save-dev @ai-hero/sandcastle
    - Run npx @ai-hero/sandcastle init
    - Run the generated TypeScript entry point with npx tsx
  setup: moderate
technology:
  languages:
    - TypeScript
  notable_components:
    - Node.js
    - Docker
    - Podman
    - Vercel Sandbox
