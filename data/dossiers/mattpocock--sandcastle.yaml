status:
  lifecycle: active
  archived: false
  latest_release: v0.14.0
  latest_release_at: 2026-11-02
strengths:
  - Separates agent execution from a pluggable sandbox-provider choice
  - Makes branch and commit collection explicit rather than leaving Git workflow
    to each caller
  - Offers both a programmatic API and a quick-start initializer
caveats:
  - A run needs Git, an agent credential or setup token, and a compatible
    sandbox provider
  - Native, container, and cloud providers have different isolation and
    environment requirements
  - Choosing noSandbox intentionally runs the agent on the host and skips
    container isolation
