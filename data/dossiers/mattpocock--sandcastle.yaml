status:
  lifecycle: active
  archived: false
  latest_release: v0.12.0
  latest_release_at: 2026-06-29
strengths:
  - Separates agent execution from a pluggable sandbox-provider choice
  - Makes branch and commit collection explicit rather than leaving Git workflow to each caller
  - Offers both a programmatic API and a quick-start initializer
caveats:
  - A run needs Git, an agent credential or setup token, and a compatible sandbox provider
  - Docker, Podman, and Vercel have different isolation and local-environment requirements
  - Choosing noSandbox intentionally runs the agent on the host and skips container isolation
  - Prompt files can evaluate marked shell expressions inside the sandbox, so their authors need to review those commands
