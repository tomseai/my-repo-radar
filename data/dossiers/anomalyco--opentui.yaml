project:
  name: OpenTUI
  kind: library
  summary: A terminal UI library with a Zig core, C ABI, Rust and TypeScript
    interfaces, and React and Solid rendering layers.
  best_for:
    - Developers building terminal applications in TypeScript or Rust
    - Teams wanting a native core with optional React or Solid rendering layers
key_features:
  - Native Zig core with a C ABI and TypeScript and Rust interfaces
  - Component-based architecture with flexible terminal layout capabilities
  - Core package with imperative APIs and terminal primitives
  - React and SolidJS reconciler packages
  - Three.js WebGPU renderer and example applications in the monorepo
