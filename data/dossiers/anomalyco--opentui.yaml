strengths:
  - The core, bindings, and package roles are clearly described in the README
  - Native core and language-neutral C ABI offer a path beyond TypeScript bindings
  - Framework-specific packages support both imperative and reconciler-based UI work
caveats:
  - Development from source requires Bun 1.4.1 or later and Zig 0.17.1
  - The repository is a monorepo with optional packages whose APIs and runtimes differ
  - The release feed includes snapshot entries; v0.9.7 was selected as the named
    project release matching core version
  - Package and build requirements vary across the TypeScript and Rust interfaces
