project:
  name: Oracle
  kind: cli
  summary: A command-line tool that bundles a prompt and selected files for a
    contextual AI consultation through provider APIs, browser automation, or a manual
    copy-and-paste fallback.
  best_for:
    - Developers seeking a second opinion on code, bugs, or architecture with
      selected file context
    - Coding-agent workflows that need a local MCP consultation tool
key_features:
  - Sends prompts and glob-selected files to one or multiple configured models
  - Supports OpenAI, Azure OpenAI, Anthropic, Gemini, xAI, OpenRouter, and compatible
    API endpoints
  - Offers Chrome-based ChatGPT and Gemini workflows and a credential-free render mode
  - Stores sessions for status inspection, replay, and follow-up consultations
  - Provides a stdio MCP server with consultation, session, and project-source tools
  - Can trace performance and preview resolved requests with dry runs
usage:
  interfaces:
    - CLI
    - terminal UI
    - stdio MCP server
  installation:
    - npm global package
    - npx package execution
    - Homebrew tap
  setup: moderate
technology:
  languages:
    - TypeScript
  notable_components:
    - Node.js 24 or later
    - Model Context Protocol SDK
    - Chrome DevTools Protocol
    - OpenAI, Google GenAI, and Anthropic provider integrations
