  latest_release_at: 2026-07-12

strengths:
  - Combines targeted file context, multi-model consultation, and session continuity
  - Works as both a human CLI and an MCP tool for other coding-agent clients
  - Gives API, browser, and manual-copy paths rather than requiring one provider mode

caveats:
  - Node.js 24 or later is required by the pinned package metadata
  - API use requires the appropriate provider credentials and can incur provider costs
  - Browser automation is documented as experimental and needs a signed-in browser session
  - Browser support is most established on macOS; Linux and Windows can need explicit browser configuration

