project:
  name: longgraph
  kind: plugin
  summary: >-
    A portable Markdown skill and prompt library that compiles durable
    executor-supervisor graphs for long-running agent work, with file-backed
    progress, independent verification, and host-switchable continuation.
  best_for:
    - Multi-hour or multi-milestone agent tasks that outlive one context window
    - Teams needing a durable task queue, independent verification, and explicit
      acceptance gates
key_features:
  - Stores the task queue and progress in a single-writer ledger outside chat
    history
  - Separates execution from clean-context supervision through a one-way
    directive edge
  - Compiles focused delivery, convergence, research, or custom graph runs
  - Supports unrelated long tasks in one loop while completing one verifiable
    item per round
  - Continues across Claude Code, Codex, Cursor, Grok Build, or shell hosts
    using the same files
usage:
  interfaces:
    - agent skills and prompt library
    - Claude Code plugin
    - frozen executor and supervisor prompts
  installation:
    - Claude Code plugin marketplace
    - shell installer for Codex, Cursor, or Grok Build
    - local repository checkout
  setup: moderate
technology:
  languages:
    - Markdown
    - Shell
  notable_components:
    - durable ledger and directives files
    - executor, supervisor, and optional scout roles
    - loop-deliver, loop-converge, and loop-research presets
    - per-host compatibility references
license:
