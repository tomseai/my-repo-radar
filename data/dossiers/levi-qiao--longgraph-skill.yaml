strengths:
  - Keeps progress inspectable and recoverable without relying on one
    conversation context
  - Gives verification to a separate context instead of letting the executor
    grade itself
  - Uses files and prompts rather than binding the workflow to one orchestration
    runtime
caveats:
  - It is a methodology and prompt library, not a runtime, scheduler, or agent
    server
  - Host capabilities and invocation syntax differ; Cursor, Grok Build, and
    shell modes require prompts-only execution
  - The public self-iteration duration measures project wall-clock time, not
    continuous unattended model execution
  - One showcased multi-day pattern is intentionally redacted and cannot be
    independently checked against private Git history
  - The ledger and supervisor overhead is unnecessary for small tasks that fit
    one clean session
