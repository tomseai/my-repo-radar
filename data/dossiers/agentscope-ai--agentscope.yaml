project:
  name: AgentScope
  kind: framework
  summary: A Python framework for building and operating LLM agents with event
    streaming, permission checks, tool execution, isolated workspaces, and
    multi-tenant agent services.
  best_for:
    - Teams building Python LLM agents with tools and human-in-the-loop interactions
    - Teams that need multi-session agent services with workspace isolation
key_features:
  - An event system for frontend streaming and human-in-the-loop interactions
  - Configurable permissions for agent tools and resources
  - Multi-tenant, multi-session agent serving with a FastAPI service example
  - Workspace backends for local, Docker, E2B, OpenSandbox, Daytona, and Kubernetes
    environments
  - MCP support, agent-team tools, task planning, and middleware extension points
  - Provides middleware for model routing and a team pipeline for leader-to-member
    delegation
usage:
  interfaces:
    - Python library
    - FastAPI agent-service example
    - Web UI example
  installation:
    - PyPI package via uv or pip
    - Editable install from source
  setup: moderate
technology:
  languages:
    - Python
    - TypeScript
  notable_components:
    - FastAPI
    - Model Context Protocol (MCP)
    - OpenTelemetry
    - Docker workspace backend
