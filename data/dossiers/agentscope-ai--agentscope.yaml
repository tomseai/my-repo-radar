status:
  lifecycle: active
  archived: false
  latest_release: v2.0.12
  latest_release_at: 2026-11-16
strengths:
  - Covers agent development and service deployment in one Python framework
  - Combines streaming events, permissions, tools, and workspace isolation
  - Provides optional integrations for models, storage, RAG, memory, and observability
caveats:
  - Requires Python 3.11 or newer and an external model provider with suitable
    credentials
  - The agent-service example adds Redis and Node.js requirements for its companion
    web UI
  - Optional capabilities depend on external backends and warrant deployment-specific
    security review
  - Realtime voice over WebRTC and standard operating procedures are documented as
    experimental
