strengths:
  - Covers agent development and service deployment in one Python framework
  - Combines streaming events, permissions, tools, and workspace isolation
  - Provides optional integrations for models, storage, RAG, memory, and observability
caveats:
  - Requires Python 3.11 or newer and an external model provider with suitable credentials
  - The agent-service example adds Redis and Node.js requirements for its companion web UI
  - Optional capabilities depend on external backends and warrant deployment-specific security review
