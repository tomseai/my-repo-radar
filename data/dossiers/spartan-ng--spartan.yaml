project:
  name: spartan
  kind: monorepo
  summary: >-
    An Angular monorepo for accessible headless UI primitives, copy-paste
    shadcn-style components, workspace tooling, and an optional full-stack setup.
  best_for:
    - Angular teams building accessible, customizable component interfaces
    - Nx or Angular workspaces that want generated spartan UI integration
key_features:
  - More than 55 stable spartan/ui components
  - Headless, accessible behavior primitives in @spartan-ng/brain
  - Copy-paste helm styles that remain owned by the application
  - Nx plugin and Angular schematics in @spartan-ng/cli
  - MCP server that exposes spartan documentation and components to AI assistants
usage:
  interfaces:
    - Angular npm packages
    - Nx plugin and Angular schematics
    - MCP server
  installation:
    - "@spartan-ng/brain npm package"
    - "@spartan-ng/cli npm package"
    - generated copy-paste component styles
  setup: moderate
technology:
  languages:
    - TypeScript
  notable_components:
    - Angular CDK
    - Nx
    - Tailwind CSS
    - Model Context Protocol
