status:
  lifecycle: active
  archived: false
  latest_release: v1.1.1
  latest_release_at: 2026-07-17
strengths:
  - Separates accessible component behavior from application-owned styling
  - Provides UI primitives, installation tooling, and documented Angular workflows
  - The current stable release and package versions align at 1.1.1
caveats:
  - Styled helm components are copied into the consuming project rather than published as an npm package
  - The cached brain package declares Angular 21 through 22 and Tailwind CSS 4 peer-dependency ranges
  - The optional spartan/stack has a broader full-stack setup than the UI-primitives use case
