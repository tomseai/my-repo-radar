project:
  name: Agent Skills
  kind: curated-list
  summary: >-
    An MIT-licensed engineering workflow pack with 26 reusable agent skills,
    specialist review personas, shared checklists, and host-specific lifecycle
    commands.
  best_for:
    - Adding reusable, verification-oriented development workflows to compatible
      coding agents
    - Selecting focused skills for specification, planning, implementation,
      testing, review, and shipping
key_features:
  - 26 skills covering specification, planning, implementation, verification,
    review, shipping, and skill selection
  - Lifecycle commands through supported host adapters, including 10 command
    wrappers for Claude Code and Gemini CLI
  - Five specialist personas and seven shared reference checklists
  - Structured workflow files with verification gates and reusable process
    guidance
  - Repository evaluation tooling for checking skill structure, routing, and
    behavior
usage:
  interfaces:
    - Markdown skill files
    - CLI installation
    - Native agent plugins
    - Slash commands
  installation:
    - Skills CLI package
    - Native agent marketplace or plugin installation
    - Git clone or local plugin directory
  setup: low
technology:
  languages:
    - JavaScript
  notable_components:
    - Markdown SKILL.md workflow definitions
    - Claude Code, Codex, and Gemini CLI integration manifests and commands
    - Agent personas and shared reference checklists
    - Skill validation and evaluation scripts
license:
  spdx: MIT
