  latest_release_at: "2026-11-18"
strengths:
  - Covers the development lifecycle with explicit workflows and verification
    gates rather than generic prompts
  - Supports both broad installation through the Skills CLI and documented
    integrations for several coding agents
  - Combines skills with targeted review personas, shared checklists, and
    evaluation tooling
caveats:
  - Workflow selection and enforcement depend on the host agent
  - Installation and command support vary by host. Some Antigravity CLI versions
    do not expose legacy command wrappers
  - Selective installs may omit the shared review material carried by
    whole-repository installs
