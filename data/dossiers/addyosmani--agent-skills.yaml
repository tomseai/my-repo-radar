project:
  name: Agent Skills
  kind: curated-list
  summary: >-
    An MIT-licensed pack of 24 structured engineering-workflow skills, agent
    personas, checklists, and lifecycle commands for AI coding agents.
  best_for:
    - Adding reusable, verification-oriented development workflows to compatible coding agents
    - Selecting focused skills for specification, planning, implementation, testing, review, and shipping
key_features:
  - 24 skills covering definition, planning, implementation, verification, review, and shipping workflows
  - Eight lifecycle slash commands that activate related skills, including spec, plan, build, test, review, and ship
  - Four specialist review personas for code review, testing, security, and web performance
  - Shared checklists and a consistent skill format with triggers, process guidance, red flags, and verification criteria
  - In-repository structural, trigger-routing, and opt-in behavioral skill evaluation framework
usage:
  interfaces:
    - Markdown skill files
    - CLI installation
    - Native agent plugins
    - Slash commands
  installation:
    - Skills CLI package
    - Native agent marketplace or plugin installation
    - Git clone or local plugin directory
  setup: low
technology:
  languages:
    - JavaScript
  notable_components:
    - Markdown SKILL.md workflow definitions
    - Claude Code, Codex, and Gemini CLI integration manifests and commands
    - Agent personas and shared reference checklists
    - Skill validation and evaluation scripts
