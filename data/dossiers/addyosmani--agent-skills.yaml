strengths:
  - Covers the development lifecycle with explicit workflows and verification gates rather than generic prompts
  - Supports both broad installation through the Skills CLI and documented integrations for several coding agents
  - Combines skills with targeted review personas, shared checklists, and evaluation tooling
caveats:
  - Skill selection and enforcement depend on the capabilities and compliance of the host agent
  - Integration features differ by agent; OpenCode has neither a native plugin system nor automatic skill routing
  - Loading all skills at once wastes context; the project recommends loading only skills relevant to the task
  - Per-skill installs can omit repository-root shared references used by some skills
