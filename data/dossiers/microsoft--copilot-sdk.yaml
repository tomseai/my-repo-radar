project:
  name: Microsoft Copilot SDK
  kind: library
  summary: >-
    Multi-language SDKs for embedding the Microsoft Copilot agent runtime behind
    Copilot CLI into an application, with programmable sessions, tool
    invocation, and application-controlled workflows.
  best_for:
    - Applications that need Copilot-powered agent workflows without
      implementing the runtime
    - Teams building agent-enabled products in TypeScript, Python, Go, .NET,
      Java, or Rust

key_features:
  - SDKs for TypeScript/Node.js, Python, Go, .NET, Java, and Rust
  - Programmatic agent sessions for prompts, planning, tool invocation, and file
    edits
  - Custom agents, skills, and tools plus application-controlled permission
    handlers
  - Session hooks for pre- and post-tool processing and session lifecycle
    behavior
  - Native in-process runtime by default, with spawned and standalone server
    connection modes
  - Optional OpenTelemetry tracing and external headless CLI connection modes

usage:
  interfaces:
    - language SDKs
    - programmatic agent runtime
    - standalone runtime server
  installation:
    - npm package
    - Python package
    - language-native package manager
  setup: moderate

