strengths:
  - Covers six mainstream application languages with a shared Copilot
    agent-runtime model
  - Lets hosts control tool approval and intercept session behavior instead of
    treating the agent as opaque
  - Supports in-process, spawned, and standalone runtime deployment patterns

caveats:
  - Standard use requires a GitHub Copilot subscription; BYOK instead requires
    supported provider API keys
  - Runtime packaging differs by language; Go and Java require additional
    setup for platform artifacts
  - The default in-process runtime provides neither crash isolation nor a sandbox
  - Some existing packages and documentation retain the GitHub Copilot SDK
    branding during the transition.

