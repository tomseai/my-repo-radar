status:
  lifecycle: active
  archived: false
  latest_release: rust-v0.0.61
  latest_release_at: 2026-11-11
strengths:
  - Combines harness selection, sandboxes, and computer-use QA in one local
    agent
  - Supports both ACP clients and Codex-SDK-compatible integrations
  - Documents direct installers for macOS, Linux, and Windows
caveats:
  - Provider credentials and model availability must be configured separately
  - The release feed uses rust-prefixed versions; the README identifies this
    Rust implementation as the current project
  - Computer-use QA depends on external agent-browser or trycua tooling
  - Interpreter Workstation is a separate client for desktop, browser, or
    headless use
