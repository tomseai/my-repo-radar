project:
  name: Open Interpreter
  kind: cli
  summary: >-
    A Rust terminal coding agent, forked from OpenAI Codex, that targets
    lower-cost models through selectable native harnesses, sandboxed command
    execution, computer-use QA, ACP clients, and the Codex exec protocol.
  best_for:
    - Developers who want a terminal coding agent with selectable model harnesses
    - ACP-client users who need a local agent process with sandbox controls

key_features:
  - Selectable native, Claude Code, Kimi, Qwen, DeepSeek, SWE-agent, and minimal harnesses
  - Native command sandboxing on macOS, Linux, and Windows
  - QA skill for driving and testing web or native applications
  - Agent Client Protocol mode for compatible editors and clients
  - Codex exec-protocol compatibility with a binary-path override
  - Local configuration and session state under ~/.openinterpreter

usage:
  interfaces:
    - terminal CLI and TUI
    - Agent Client Protocol server
    - Codex SDK-compatible executable
  installation:
    - official macOS/Linux shell installer
    - official Windows PowerShell installer
    - build from source
  setup: moderate

technology:
  languages:
    - Rust
  notable_components:
    - Agent Client Protocol
    - Model Context Protocol
    - OpenAI Codex exec protocol

