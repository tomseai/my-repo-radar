strengths:
  - Hosted use requires no download or installation
  - Keeps recording and conversion in the browser rather than sending recordings to a service
  - Combines capture, camera layout, teleprompting, and export in one web application
caveats:
  - The README states support is currently limited to Chrome and Chromium browsers
  - MP4 export is an optional in-browser conversion; direct download is WEBM
  - This repository is a fork of Contrast's Recorder project with additional features
  - The cached GitHub release feed contains no release entries, so no project release can be established
