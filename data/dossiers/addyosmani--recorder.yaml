project:
  name: Record
  kind: application
  summary: >-
    A browser-hosted screen and camera recorder that captures a tab, window, or
    screen locally and downloads recordings as WEBM or optionally converted MP4.
  best_for:
    - Creating screen-and-camera recordings in Chrome or Chromium
    - Recording scripted browser demonstrations without installing an application
key_features:
  - Screen-only, screen-and-camera, and camera-only recording modes
  - Tab, window, and full-screen capture options
  - Picture-in-picture camera view with circular or square camera shapes
  - Built-in teleprompter with editable text, scroll controls, and adjustable speed
  - Real-time camera and screen preview before recording
  - WEBM download or in-browser MP4 conversion with FFmpeg.wasm
usage:
  interfaces:
    - Web application
  installation:
    - No installation for the hosted web application
    - Yarn dependencies for local development
  setup: low
