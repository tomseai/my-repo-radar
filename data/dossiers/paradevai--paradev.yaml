  latest_release_at: 2026-11-20

strengths:
  - Separates concurrent agent tasks with Git worktrees
  - Combines progress monitoring, terminal access, and Git review in the same
    workspace
  - Supports both local and remote workflows with web and mobile access

caveats:
  - macOS is the primary desktop target; Linux is experimental and Windows is
    not yet available. Remote execution depends on the selected environment.
  - Worktrees separate files but do not sandbox agent processes.
  - The project was previously named Superset; its CLI retains that name.
  - Agents have separate authentication and installation requirements.
  - The desktop, CLI, and canary builds follow separate release streams.

