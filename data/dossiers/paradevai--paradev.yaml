project:
  name: Paradev
  kind: application
  summary: >-
    An open-source workspace for running coding agents in parallel with separate
    Git worktrees, branches, and terminals, and for reviewing changes and
    resuming work across devices.
  best_for:
    - Developers coordinating several CLI coding agents against the same
      repository
    - Teams that want worktree isolation, local review, and remote workspace
      access
key_features:
  - Runs agents concurrently with a dedicated worktree, branch, and terminal per
    task
  - Supports local, cloud, and remote-machine workspaces
  - Exposes workflow controls through a CLI, MCP server, and skills
  - Provides mobile and web access for checking agent progress
  - Includes diff, pull request, and merge handling in the app
usage:
  interfaces:
    - desktop application
    - web application
    - mobile application
    - CLI
    - MCP server
  installation:
    - official macOS download or experimental Linux AppImage
    - self-hosting from source
  setup: moderate

technology:
  languages:
    - TypeScript
  notable_components:
    - Electron
    - React
    - Bun workspaces
    - Git worktrees
    - Model Context Protocol

