project:
  name: Aperant
  kind: application
  summary: >-
    An Electron desktop application for planning, executing, and validating
    parallel AI coding tasks in isolated Git worktrees, with a visual task
    board, agent terminals, review loops, and project-management integrations.
  best_for:
    - Claude Code users running parallel implementation tasks in Git repositories
    - Developers who prefer a visual desktop workflow for autonomous coding sessions

key_features:
  - Autonomous task planning, implementation, and validation workflows
  - Up to twelve parallel agent terminals and Git-worktree isolation
  - Built-in quality assurance and AI-assisted merge-conflict resolution
  - Kanban task board and real-time agent-progress monitoring
  - Codebase insights, ideation, roadmap, and changelog features
  - GitHub, GitLab, and Linear integrations

usage:
  interfaces:
    - desktop GUI
    - agent terminals
    - Kanban board
  installation:
    - official Windows, macOS, or Linux download
    - build from source
  setup: moderate

