strengths:
  - Gives clients structured, deterministic page interaction without requiring a vision model
  - Documents direct configuration paths for a broad range of MCP-capable clients
  - Supports local browsers, remote CDP connections, browser choice, and profile isolation options
caveats:
  - Requires Node.js 18 or newer and an MCP-capable client to run
  - Persistent profiles retain logged-in browser information unless users clear the profile or choose an isolated context
  - The documentation says CLI plus Skills can be more token-efficient for high-throughput coding-agent workflows
  - The server is explicitly not a security boundary; broad host, origin, file-access, or shared-context settings expand its exposure
