project:
  name: playwright-mcp
  kind: service
  summary: >-
    A Model Context Protocol server that lets LLM clients automate web pages
    through Playwright using structured accessibility snapshots instead of
    screenshot-driven or vision-model interaction.
  best_for:
    - MCP-enabled agents that need deterministic browser interaction
    - Exploratory automation or long-running workflows that benefit from persistent browser context
key_features:
  - Uses Playwright accessibility-tree snapshots as structured page input rather than pixel-based interaction
  - Exposes browser automation to LLM clients through a standard MCP server
  - Supports browser selection, device emulation, persistent or isolated profiles, and remote CDP endpoints
  - Can restrict file access to workspace roots by default and offers configurable hosts and origins
usage:
  interfaces:
    - MCP server
    - stdio client configuration
    - optional HTTP/SSE endpoint
  installation:
    - npx package launch as @playwright/mcp
    - npm package installation
    - Docker image build from the included Dockerfile
  setup: low
technology:
  languages:
    - TypeScript
    - JavaScript
  notable_components:
    - Playwright
    - Model Context Protocol SDK
    - Node.js 18 or newer
