project:
  name: playwright-mcp
  kind: service
  summary: >-
    A Model Context Protocol server that lets LLM clients automate web pages
    through Playwright using structured accessibility snapshots instead of
    screenshot-driven or vision-model interaction.
  best_for:
    - MCP-enabled agents that need deterministic browser interaction
    - Exploratory automation or long-running workflows that benefit from
      persistent browser context
key_features:
  - Uses structured Playwright accessibility snapshots for browser interaction
  - Exposes browser automation through MCP to compatible clients
  - Supports device emulation, persistent or isolated profiles, and remote CDP
    connections
  - Provides workspace-root file controls, configurable browser origins, and
    optional redaction of selected URL parameters
usage:
  interfaces:
    - MCP server
    - stdio client configuration
    - optional HTTP/SSE endpoint
  installation:
    - npx package launch as @playwright/mcp
    - npm package installation
    - Docker image build from the included Dockerfile
  setup: low
technology:
  languages:
    - TypeScript
    - JavaScript
  notable_components:
    - Playwright
    - Model Context Protocol SDK
    - Node.js 18 or newer
