project:
  name: Frappe CRM
  kind: application
  summary: >-
    An open-source CRM application for sales teams, built on the Frappe
    Framework, with lead and deal workflows, activity management, customizable
    views, and hosted or self-managed deployment paths.
  best_for:
    - Sales teams that want an adaptable CRM built on the Frappe ecosystem
    - Organizations able to operate Frappe Bench or Docker for a self-hosted CRM

key_features:
  - All-in-one lead and deal pages for activities, comments, notes, and tasks
  - Drag-and-drop Kanban boards for tracking leads and deals through stages
  - Custom lead and deal views with filters, sorting, and selected columns
  - Built-in Twilio and Exotel call integrations, with WhatsApp and ERPNext integration options
  - Production hosting through Frappe Cloud and documented Frappe Bench and Docker development paths

