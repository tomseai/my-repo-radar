status:
  lifecycle: active
  archived: false
  latest_release: v16.3.0
  latest_release_at: 2026-11-20

strengths:
  - Covers central sales workflows in one interface while allowing custom views
    for team-specific processes
  - Offers managed hosting alongside documented self-hosted production, Bench,
    and Docker routes
  - Builds on the Frappe Framework and Frappe UI rather than requiring a
    separate custom application stack

caveats:
  - The root LICENSE is AGPL-3.0, while package.json declares GPL-3.0; confirm
    the intended license scope with the maintainer before adoption
  - Self-hosting requires the Frappe ecosystem and its operational dependencies;
    the included Docker Compose configuration runs MariaDB, Redis, and Frappe
    Bench
  - The README marks the main v1.x branch stable only with Frappe and ERPNext
    v15.x or v16.x; its v2 development path is unstable
  - Telephony and messaging integrations depend on external services or a
    separate WhatsApp app; installing it after CRM requires rebuilding CRM assets

