project:
  name: Claude Cookbooks
  kind: documentation
  summary: A collection of copyable code snippets, notebooks, and guides for building
    with Claude, covering common LLM capabilities, tool integrations, multimodal
    work, evaluation, and selected agent-oriented examples.
  best_for:
    - Developers adapting focused Claude API examples into their own projects
    - Teams learning documented patterns for retrieval, tools, vision, and evaluations
key_features:
  - Recipes for classification, retrieval-augmented generation, and summarization
  - Tool-use examples including a customer-service agent, calculator, and SQL queries
  - Third-party retrieval examples using vector databases, Wikipedia, and web pages
  - Multimodal notebooks for vision, charts, forms, PDFs, and image-generation
    workflows
  - Advanced examples for sub-agents, evaluations, JSON output, moderation, and
    prompt caching
  - Agent cost and latency optimization guides that measure quality alongside
    resource use
usage:
  interfaces:
    - Jupyter notebooks
    - Markdown guides
    - Python example code
  installation:
    - Clone the repository
    - uv or pip development environment
    - Claude API key for API-backed examples
  setup: moderate
technology:
  languages:
    - Python
    - Jupyter Notebook
  notable_components:
    - Anthropic Python SDK
    - Claude Agent SDK
    - Jupyter
