project:
  name: oh-my-pi
  kind: cli
  summary: >-
    A cross-platform terminal coding agent that combines model-provider access,
    code-editing tools, code intelligence, debugging, browser control, and isolated subagents.
  best_for:
    - Developers who want a feature-rich coding agent in a terminal interface
    - Workflows that need LSP or debugger access alongside agent-driven edits and commands
key_features:
  - Provides read, write, search, hash-anchored edit, structural-edit, and shell tools
  - Exposes LSP diagnostics, navigation, rename, code actions, and raw requests to the agent
  - Drives Debug Adapter Protocol sessions for breakpoints, stepping, stacks, variables, and evaluation
  - Fans tasks out to subagents with optional isolated worktrees and typed results
  - Supports persistent Python and JavaScript evaluation cells that can call agent tools
  - Offers browser automation, web search, and a provider catalog for model access
usage:
  interfaces:
    - terminal user interface
    - command-line interface
    - editor integration through Agent Client Protocol
    - browser-based collaboration viewer
  installation:
    - macOS or Linux install script
    - Windows PowerShell install script
    - Homebrew tap formula
    - Bun global package installation
  setup: moderate
technology:
  languages:
    - TypeScript
    - Rust
  notable_components:
    - Bun
    - Language Server Protocol
    - Debug Adapter Protocol
    - Agent Client Protocol
