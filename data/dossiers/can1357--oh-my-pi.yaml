strengths:
  - Brings editing, code intelligence, debugging, execution, and agent coordination into one terminal tool surface
  - Supports multiple install paths across macOS, Linux, and Windows
  - Documents first-class isolated subagents and a broad set of local and external tools
caveats:
  - Provider access, credentials, availability, and usage costs remain the user's responsibility
  - Many advanced features depend on external services or locally available language servers, debuggers, browsers, and toolchains
  - The project is a monorepo; v17.0.5 is the release matching the pi-coding-agent package rather than an auxiliary package version
  - Collaboration links and external tools can expose project context, so their permissions and sharing settings need review
