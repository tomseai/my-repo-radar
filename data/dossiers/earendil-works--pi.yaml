project:
  name: Pi Agent Harness
  kind: monorepo
  summary: >-
    A TypeScript monorepo for a multi-provider LLM API, tool-calling agent
    runtime, terminal UI library, and interactive coding-agent CLI.
  best_for:
    - Developers who want a self-extensible terminal coding agent
    - TypeScript projects that need reusable multi-provider LLM and agent-runtime packages

key_features:
  - Interactive coding-agent CLI with read, bash, edit, write, and session-management tools
  - General-purpose agent runtime with tool calling, state management, transport abstraction, and attachments
  - Unified API for OpenAI, Anthropic, Google, and other LLM providers
  - Terminal UI library with differential rendering
  - RPC entry point for launching the coding agent programmatically
  - Containerization guidance for a micro-VM extension, Docker, and policy-controlled sandbox

usage:
  interfaces:
    - interactive CLI
    - terminal UI
    - TypeScript packages
    - RPC entry point
  installation:
    - npm package for the coding-agent CLI
    - npm workspace source checkout
  setup: moderate

technology:
  languages:
    - TypeScript
  notable_components:
    - Node.js
    - npm workspaces
    - Vitest
    - OpenAI SDK
    - Anthropic SDK
    - Google GenAI SDK

