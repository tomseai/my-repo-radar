strengths:
  - Separates reusable LLM, agent-runtime, TUI, and coding-agent components in one maintained project
  - Supports several major model providers without tying the runtime to one provider
  - Documents concrete containment options for deployments needing stronger isolation

caveats:
  - Pi has no built-in permission system for filesystem, process, network, or credential access
  - Safe deployment boundaries require an external container or sandbox, which adds operational setup
  - The coding-agent package requires Node.js 22.19 or newer
  - The repository is a monorepo; v0.80.10 is the matching coding-agent package and project release, while the root package is private and reports 0.0.3

