status:
  lifecycle: active
  archived: false
  latest_release: v1.6.0
  latest_release_at: 2026-11-20

strengths:
  - Separates reusable LLM, agent-runtime, TUI, and coding-agent components in
    one maintained project
  - Supports several major model providers without tying the runtime to one
    provider
  - Documents concrete containment options for deployments needing stronger
    isolation

caveats:
  - Pi has no built-in permission system for filesystem, process, network, or
    credential access
  - Safe deployment boundaries require an external container or sandbox, which
    adds operational setup
  - The coding-agent package requires Node.js 22.19 or newer
  - v1.6.0 is the matching coding-agent package and project release. The private
    root package has its own version, 0.0.3.

