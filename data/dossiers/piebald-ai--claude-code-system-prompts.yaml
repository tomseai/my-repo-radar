project:
  name: claude-code-system-prompts
  kind: documentation
  summary: >-
    A versioned, Markdown-based reference that extracts and tracks Claude Code
    system prompts, tool descriptions, agent prompts, and their token counts
    from the current Claude Code npm release.
  best_for:
    - Inspecting the documented prompt material and built-in instructions used by Claude Code
    - Comparing prompt changes across Claude Code releases for research or tooling work

key_features:
  - Lists over 500 extracted prompt strings, including system, tool, agent, utility, and skill prompts
  - Records prompt token counts and notes that environment-specific interpolation can change counts in a live session
  - Maintains a changelog spanning Claude Code prompt changes from version 2.0.14 onward
  - Publishes a GitHub release for each tracked Claude Code version

usage:
  interfaces:
    - Markdown documentation
    - GitHub repository browser
    - GitHub release notes
  installation:
    - No installation; browse the repository or clone it for local reference
  setup: low

