project:
  name: Deep Agents
  kind: framework
  summary: >-
    An opinionated, extensible Python agent harness built on LangGraph that
    bundles planning, subagents, filesystem and shell tools, context management,
    persistent memory, human approval, skills, and pluggable model or sandbox
    backends.
  best_for:
    - Teams that want a batteries-included harness for long-running, multi-step
      agents
    - Developers who need subagents, memory, skills, and sandbox controls
      without assembling each primitive
key_features:
  - Delegates work to subagents with isolated context windows
  - Provides pluggable filesystem, shell, sandbox, and remote execution backends
  - Summarizes long conversations and offloads large tool results to files
  - Supports persistent memory, human tool-call approval, reusable skills, and
    MCP tools
  - Uses LangGraph for streaming, persistence, checkpointing, and production
    deployment paths
