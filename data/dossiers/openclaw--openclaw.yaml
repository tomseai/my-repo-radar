strengths:
  - A single gateway centralizes sessions, channels, tools, and events for a personal assistant
  - The onboarding flow covers the core setup path across macOS, Linux, and Windows
  - The documented default DM policy uses pairing and requires explicit opt-in for public inbound DMs
caveats:
  - It is designed as a personal, single-user assistant rather than a general multi-user service
  - Remote exposure requires following the project's security and gateway-exposure guidance
  - Sandboxing non-main sessions must be configured; Docker is the default sandbox backend
  - The retained release feed contains beta and internal release-publish tags but no identifiable stable project release, so stable release fields remain unset
