strengths:
  - A single gateway centralizes sessions, channels, tools, and events for a
    personal assistant
  - The onboarding flow covers the core setup path across macOS, Linux, and
    Windows
  - The documented default DM policy uses pairing and requires explicit opt-in
    for public inbound DMs
caveats:
  - A shared multiplayer configuration is available; deployments require
    appropriate access controls for participating users
  - Remote exposure requires following the project's security and
    gateway-exposure guidance
  - Tools run on the host for the main session unless sandboxing is configured;
    Docker is the default sandbox backend
