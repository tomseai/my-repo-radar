project:
  name: OpenClaw
  kind: application
  summary: >-
    A self-hosted, personal AI assistant with a local-first gateway that connects
    to existing messaging channels and companion apps across desktop and mobile devices.
  best_for:
    - Individuals operating an always-on personal assistant on their own devices
    - Users who want to interact with one assistant through messaging channels, voice, and a live canvas
key_features:
  - Connects a personal assistant to messaging channels including WhatsApp, Telegram, Slack, Discord, and Signal
  - Uses a local-first gateway as the control plane for sessions, channels, tools, and events
  - Provides onboarding that configures the gateway, workspace, channels, and skills
  - Includes Windows, macOS, iOS, and Android companion experiences
  - Supports multi-agent routing that isolates workspaces and sessions by inbound channel, account, or peer
usage:
  interfaces:
    - Command-line interface
    - Messaging channels
    - Web canvas
    - Desktop and mobile companion apps
  installation:
    - Install with npm install -g openclaw@latest
    - Install with pnpm or bun, then run openclaw onboard --install-daemon
    - Use the included Docker configuration
  setup: moderate
technology:
  languages:
    - TypeScript
    - Kotlin
    - Python
  notable_components:
