project:
  name: my pi setup
  kind: starter-template
  summary: >-
    An opinionated TypeScript configuration and extension collection for the Pi
    coding agent, adding search and scraping, background terminals, subagents,
    workflows, interactive questions, file search, and terminal UI
    customization.
  best_for:
    - Pi users seeking concrete examples of extending a personal coding-agent
      environment
    - Exploring a bundled set of search, terminal-management, and subagent
      extensions before selecting pieces to adapt

key_features:
  - Firecrawl-powered tools for web search and scraping
  - Background terminals with a user interface for managing them
  - Subagents and workflows for Pi
  - A multiple-choice ask-user tool for agent-to-user interaction
  - First-class fd file-discovery and ripgrep content-search tools
  - GitHub dark theme and customized bottom-bar information

usage:
  interfaces:
    - Pi terminal UI extensions
    - Agent tools
    - Background-terminal management UI
  installation:
    - Install the root Node.js dependencies with npm
    - Adapt selected extensions and configuration to an existing Pi setup
    - Run the included TypeScript checks and extension tests when modifying the
      setup
  setup: moderate

technology:
  languages:
    - TypeScript
    - JavaScript
  notable_components:
    - "@earendil-works/pi-coding-agent"
    - Firecrawl
    - Effect
    - ripgrep
    - fd

