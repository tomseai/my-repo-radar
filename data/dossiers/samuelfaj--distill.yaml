project:
  name: Distill
  kind: cli
  summary: A terminal coding-agent harness that assigns planning, delegated coding
    work, and context compression to separately configurable language-model
    tiers.
  best_for:
    - Developers who want a terminal agent with separate models for planning and
      delegated work
    - Teams evaluating different coding-agent execution modes with their own
      provider accounts
key_features:
  - Configures a required main model, an optional worker model, and a utility
    model
  - Lets the main model specify and review work delegated to the worker
  - Uses the utility tier for extraction, summarization, and context compression
  - Offers five execution modes and documents Grok, Claude, Codex, and
    OpenAI-compatible model paths
usage:
  interfaces:
    - Terminal user interface
    - CLI
  installation:
    - macOS and Linux release installer
    - Windows PowerShell release installer
  setup: moderate
