project:
  name: Open Generative UI
  kind: starter-template
  summary: >-
    A CopilotKit and LangGraph showcase/template for agent-driven web interfaces,
    including streamed sandboxed HTML/SVG widgets and registered React components.
  best_for:
    - Developers exploring agent-generated interactive interfaces in a Next.js application
    - Teams adapting CopilotKit and LangGraph patterns for stateful generative UI
key_features:
  - Streams free-form HTML and SVG widgets into a sandboxed iframe
  - Registers agent-rendered React components, browser-side tools, tool renderers, and human-in-the-loop UI
  - Runs a Next.js frontend with a Python FastAPI/LangGraph agent service
  - Includes an optional MCP server exposing skills, prompts, and a document-assembly tool
usage:
  interfaces:
    - Next.js web application
    - Python agent service
    - MCP server
  installation:
    - git clone
    - make setup
    - Render Blueprint deployment
  setup: high
