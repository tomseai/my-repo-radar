strengths:
  - Keeps change intent and scenarios in version-controlled, agent-readable
    files
  - Supports iterative planning rather than imposing a rigid waterfall gate
  - Works with existing codebases through focused delta specifications
caveats:
  - OpenSpec adds planning and artifact-maintenance overhead that may not suit
    one-line fixes
  - Its agent commands depend on the configured host tool and generated
    project files
  - The standalone installer does not require Node.js. Package-manager
    installs require Node.js 22.20.0 or later
  - Teams still need to review and maintain specifications as behavior changes
  - The cross-repository Stores feature is in beta
