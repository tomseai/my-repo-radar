project:
  name: OpenSpec
  kind: cli
  summary: >-
    A Node.js CLI and coding-agent workflow for keeping Markdown specifications
    and change artifacts alongside code before and during implementation.
  best_for:
    - Teams using coding agents for changes that need shared, reviewable requirements
    - Existing repositories that need focused specification deltas instead of a rewrite

key_features:
  - Project specs expressed as Markdown requirements and concrete scenarios
  - Per-change proposal, design, task, and delta-spec artifacts
  - Explore, propose, apply, and archive coding-agent command workflow
  - Archive process that folds approved deltas into the current specifications
  - Cross-repository stores for shared specifications and planning
  - Generated skills and commands for configured coding-agent tools

usage:
  interfaces:
    - CLI
    - coding-agent slash commands
    - Markdown project artifacts
  installation:
    - npm package
    - pnpm, yarn, or Bun global package
    - Nix package
  setup: low

technology:
  languages:
    - TypeScript
  notable_components:
