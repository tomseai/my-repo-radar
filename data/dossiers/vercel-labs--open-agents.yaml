project:
  name: Open Agents
  kind: starter-template
  summary: >-
    A Vercel-deployable reference application for background coding agents,
    combining a web interface, durable agent workflows, isolated sandbox VMs,
    and GitHub-based code-change workflows.
  best_for:
    - Teams that want to fork and adapt a cloud-hosted coding-agent application
    - Developers needing durable agent runs that can continue independently of a browser session
key_features:
  - Chat-driven coding agent with file, search, shell, task, skill, and web tools
  - Durable Workflow SDK runs with streaming, cancellation, and reconnectable execution
  - Isolated Vercel Sandboxes with repository cloning, branch work, and snapshot-based resume
  - Optional auto-commit, push, and pull-request creation through a GitHub App
  - Session sharing and optional ElevenLabs voice transcription
usage:
  interfaces:
    - web application
    - Vercel deployment template
  installation:
    - fork and deploy on Vercel
    - local pnpm workspace setup
  setup: high
