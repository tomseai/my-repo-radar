strengths:
  - Multiple integration modes let an existing app or coding agent adopt
    compression incrementally
  - Local proxy and retrieval design keep compressed originals available on
    demand
  - Content-aware routing covers structured data, source code, and prose rather
    than applying one generic transform

caveats:
  - Optional features have substantial dependency and platform considerations,
    including a Rust build fallback and selected native assets
  - The npm SDK sends messages to a separately installed Python proxy; the
    headroom CLI is supplied by the Python package, which requires Python 3.11 or later
  - The status and release are based on the locally cached release feed;
    archival state is not asserted from commit-pinned source files

