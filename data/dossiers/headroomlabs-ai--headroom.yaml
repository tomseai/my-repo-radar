project:
  name: Headroom
  kind: framework
  summary: >-
    A local-first context-compression system for LLM applications and coding
    agents, offering Python and TypeScript libraries, a local proxy, agent
    wrappers, MCP tools, and reversible retrieval of compressed originals.
  best_for:
    - Coding-agent users who need to reduce tool-output and context size
    - Application teams that want compression without rewriting their LLM
      integration

key_features:
  - Routes JSON, code, prose, images, and other inputs to content-aware
    compressors
  - Exposes Python and TypeScript library integration paths
  - Runs as a local OpenAI-compatible proxy for no-code client changes
  - Wraps several coding-agent CLIs and configures a local MCP server
  - Stores originals for on-demand retrieval through reversible CCR compression
  - Provides shared cross-agent memory and a session-learning workflow

usage:
  interfaces:
    - Python library
    - TypeScript library
    - CLI
    - local proxy
    - MCP server
  installation:
    - uv tool install headroom-ai[all]
    - pip install headroom-ai[all]
    - npm install headroom-ai
  setup: moderate

technology:
  languages:
    - Python
    - TypeScript
    - Rust
  notable_components:
