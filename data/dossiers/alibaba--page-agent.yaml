strengths:
  - Fits into an existing web page without requiring a headless browser or a server-side automation rewrite
  - Supports both a lightweight in-page integration and optional multi-page or MCP extension paths
  - Separates published agent, core, DOM-controller, LLM-client, and UI packages in a documented monorepo
caveats:
  - The core project is designed for client-side web enhancement, not server-side automation
  - An LLM provider configuration and its credentials, terms, and usage costs remain the integrator’s responsibility
  - The bundled demo LLM API is for technical evaluation only and is subject to separate terms
  - Multi-page tasks and the MCP server depend on the optional browser extension; the MCP server is marked beta
