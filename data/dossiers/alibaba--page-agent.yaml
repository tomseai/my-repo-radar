project:
  name: Page Agent
  kind: library
  summary: >-
    A TypeScript library for embedding an AI GUI agent into a web page, where
    a configured language model performs text-based DOM interactions through
    the in-page PageAgent API rather than a headless browser or backend service.
  best_for:
    - Web applications adding an in-page natural-language copilot or form-filling flow
    - Developers who need DOM-based interaction with their own configured language-model provider
key_features:
  - Adds an agent with a script tag or the published page-agent npm package
  - Executes natural-language tasks through text-based DOM manipulation without screenshots
  - Supports configured mainstream or locally deployed language models
  - Offers an optional Chrome extension for multi-page tasks
  - Includes a beta MCP server for controlling the browser through the extension
usage:
  interfaces:
    - embeddable web panel
    - JavaScript API
    - Chrome extension
    - MCP server
  installation:
    - npm install page-agent
    - IIFE script from a CDN
    - build from source with npm workspaces
  setup: moderate
technology:
  languages:
    - TypeScript
  notable_components:
    - npm workspaces
    - PageAgent DOM controller
    - Chrome extension
    - Model Context Protocol server
