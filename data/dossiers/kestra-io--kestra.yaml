project:
  name: Kestra
  kind: service
  summary: >-
    An open-source, event-driven orchestration platform for declarative YAML
    workflows across data, AI, infrastructure, and process automation, with a
    web UI, APIs, scheduling, event triggers, and a plugin ecosystem.
  best_for:
    - Teams operating scheduled or event-driven data, infrastructure, or AI
      workflows
    - Developers who want workflows defined as code but editable and observable
      in a UI

key_features:
  - Defines flows, tasks, inputs, variables, and triggers in declarative YAML
  - Offers AI agents, RAG workflows, and a built-in MCP server
  - Supports scheduled and event-driven execution, including message-bus and
    cloud triggers
  - Provides a built-in editor, visual topology view, completion, and real-time
    validation
  - Extends workflows through plugins for databases, storage, APIs, scripts, and
    cloud services
  - Supports retries, timeouts, error handling, branching, parallel work, and
    backfills
  - Keeps workflow YAML synchronized when flows change through the UI or API

usage:
  interfaces:
    - web UI
    - REST API
    - CLI
    - YAML workflow definitions
  installation:
    - Docker container
    - Docker Compose
    - cloud deployment templates
    - build from source with Gradle
  setup: moderate

