project:
  name: whisperX
  kind: cli
  summary: A Python automatic speech-recognition tool that adds batched Whisper
    transcription, word-level alignment, voice-activity detection, and
    optional speaker diarization.
  best_for:
    - Producing timestamped transcripts and subtitles from recorded audio
    - Python workflows that need speaker labels alongside Whisper transcription
key_features:
  - Batched faster-whisper inference for accelerated transcription
  - Word-level timestamps through wav2vec2 forced alignment
  - Voice-activity detection before transcription and batching
  - Optional pyannote-audio speaker diarization and word-level speaker
    assignment
  - Command-line and Python APIs
  - Offers context-aware batching and optional Numba acceleration for forced
    alignment
usage:
  interfaces:
    - CLI
    - Python API
  installation:
    - PyPI package
    - uvx tool
    - source checkout with uv
  setup: moderate
