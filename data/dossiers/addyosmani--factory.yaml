strengths:
  - Keeps policy, queue semantics, gates, and evidence in the target repository so fresh agent sessions can resume without chat history
  - Separates implementation from verification and requires deterministic, fail-closed checks before producing a draft pull request
  - Preserves explicit human authority over ambiguous requirements, high-impact changes, and every merge
  - Supports Claude Code and Codex through one shared contract while documenting their different automation capabilities
caveats:
  - The packaged unattended scheduling path is Claude-first; Codex schedules are not provisioned by this reference
  - Stock Claude routines lack a new-issue trigger, so triage polls unless the optional API-trigger GitHub Action is installed
  - Effective use requires project-specific charter decisions, real gate commands, GitHub labels, branch protection, and separately configured cloud state
  - Hooks are guardrails rather than a security boundary; GitHub rulesets or branch protection must enforce merge policy
  - The retained release feed has no entries, so no project release can be established
