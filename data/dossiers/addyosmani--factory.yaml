project:
  name: Factory
  kind: starter-template
  summary: >-
    A reference software-factory template and installer that adds a
    repository-owned, human-governed delivery loop for Claude Code and Codex,
    using GitHub issues and pull requests as the queue, deterministic gates,
    independent verification, and human merge authority.
  best_for:
    - Teams introducing bounded coding-agent automation into an existing GitHub repository
    - Projects that need version-controlled agent policy, durable handoffs, and review back-pressure
key_features:
  - Installs a shared charter, contract, queue protocol, gates, run records, and Claude Code and Codex workflow adapters
  - Routes issues through triage, specification, implementation, independent review, pull-request verification, and monitoring
  - Runs fail-closed type, lint, test, build, audit, mutation, and architecture gates at configurable levels
  - Uses a fresh verifier that reads the diff independently and can prove that a new test fails without the implementation
  - Keeps merges human-controlled and stops new work when the configured review queue is full
usage:
  interfaces:
    - shell installer
    - Claude Code workflows and cloud routines
    - Codex repository skills and instructions
    - GitHub issues and pull requests
  installation:
    - clone the repository and run install.sh --dry-run against a target Git repository
    - run install.sh, then configure the target repository's charter, gates, labels, and branch protection
  setup: moderate
