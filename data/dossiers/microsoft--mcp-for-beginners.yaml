project:
  name: MCP for Beginners
  kind: course
  summary: >-
    A hands-on, multilingual curriculum for learning the Model Context Protocol,
    progressing from fundamentals and security through server and client
    examples, testing, deployment, advanced integrations, and case studies.
  best_for:
    - Developers learning to build and integrate MCP clients and servers
    - Teams that want guided examples in C#, Java, JavaScript, Rust, Python, or
      TypeScript

key_features:
  - Explains MCP concepts, client-server architecture, protocol primitives, and
    security considerations
  - Provides progressive guides for first servers, clients, LLM clients, stdio,
    HTTP streaming, testing, and deployment
  - Includes implementation samples in C#, Java, JavaScript, Rust, Python, and
    TypeScript
  - Covers advanced subjects including OAuth2, authorization, scaling,
    multimodality, routing, and context engineering
  - Includes guidance for MCP hosts, VS Code integration, and the MCP Inspector
  - Provides practical examples, case studies, a study guide, and extensive
    translations

