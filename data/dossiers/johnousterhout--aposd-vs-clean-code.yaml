project:
  name: A Philosophy of Software Design vs Clean Code
  kind: documentation
  summary: >-
    A Markdown record of discussions between John Ousterhout and Robert C.
    Martin, held from September 2024 to February 2025, comparing their
    software-design views on method length, comments, example rewrites, and
    test-driven development.
  best_for:
    - Developers studying competing software-design arguments rather than a single prescriptive guide
    - Readers who want detailed primary-author discussion of method length, comments, and TDD
key_features:
  - Presents each participant's arguments in a direct, attributed dialogue format
  - Includes dedicated discussions and summaries for method length, comments, and test-driven development
  - Compares two rewrites of the PrimeGenerator example as concrete design material
  - Links to a follow-up Book Overflow Podcast discussion and the two referenced books
