strengths:
  - Combines structured block knowledge management with familiar Markdown workflows
  - Supports local clients, CLI access, and an optional self-hosted browser mode
  - Includes broad export and search options for personal knowledge bases

caveats:
  - Some features are reserved for paid members despite the AGPL-licensed code
  - Docker mode is browser-only and omits some desktop export and import functions
  - A Docker deployment needs deliberate workspace-volume and access-password configuration
  - The project publishes separate beta builds for testing

