project:
  name: SiYuan
  kind: application
  summary: >-
    A privacy-first personal knowledge-management application with a
    block-based Markdown WYSIWYG editor, desktop and mobile clients, a
    built-in command-line interface, and optional browser-based Docker hosting.
  best_for:
    - Individuals who want a block-oriented personal knowledge base
    - Self-hosters who want local workspace data with a browser interface

key_features:
  - Block references, two-way links, custom attributes, and embedded SQL queries
  - Markdown WYSIWYG editing, large-document editing, and outline views
  - Full-text and asset-content search through the built-in CLI
  - Exports to Markdown, PDF, Word, and HTML
  - Desktop, Android, iOS, and HarmonyOS clients
  - Self-hosting through Docker with a workspace volume and access authentication, or through Kubernetes

