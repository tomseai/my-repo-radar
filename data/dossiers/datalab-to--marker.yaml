project:
  name: marker
  kind: library
  summary: >-
    A Python document-intelligence library and command-line converter that turns
    PDFs, images, office documents, HTML, and EPUB files into structured
    Markdown, JSON, chunks, or HTML while extracting document structure and
    images.
  best_for:
    - Developers preparing heterogeneous documents for search, RAG, or data
      pipelines
    - Python users needing configurable document conversion with local or
      optional LLM assistance
key_features:
  - Converts PDF, image, PPTX, DOCX, XLSX, HTML, and EPUB inputs across languages
  - Preserves or formats tables, forms, equations, math, links, references, code
    blocks, and extracted images
  - Provides CLI commands for individual files, directories, chunks, a Streamlit
    UI, and a small API server
  - Offers CPU-only layout extraction, in-process OCR, hybrid CPU/GPU processing,
    and full-page vLLM OCR modes
  - Supports optional LLM-assisted conversion through Gemini, Vertex, Ollama,
    Claude, OpenAI-compatible, Azure OpenAI, and OpenRouter services
usage:
  interfaces:
    - command-line interface
    - Python API
    - Streamlit interactive application
    - optional FastAPI server
  installation:
    - pip install marker-pdf
    - pip install marker-pdf[full] for non-PDF document dependencies
    - Install Python 3.10 or newer and select the extras for the intended processing mode
  setup: moderate
technology:
  languages:
    - Python
  notable_components:
    - PyTorch
    - Indra OCR and ONNX Runtime
    - Surya OCR and vLLM
    - FastAPI
    - Streamlit
license:
  spdx: Apache-2.0
  name: Apache License 2.0
  notes: The code is Apache-2.0. Model weights have a separate modified AI Pubs
    OpenRAIL-M license. The README directs users to separate terms for
    deployments outside the stated weight-license eligibility.
status:
  lifecycle: active
  archived: false
  latest_release: v2.2.0
  latest_release_at: 2026-11-12
strengths:
  - Accepts a broad range of document types and provides several structured
    output formats
  - Offers CLI, Python, interactive UI, and small-server interfaces from the
    same package
  - Allows optional LLM assistance and custom processors, renderers, providers,
    and configuration
caveats:
  - Complex nested tables and forms are documented limitations, though OCR and
    LLM options may help
  - GPU modes share an inference server across conversion workers and throughput
    depends on its capacity
  - The pinned package declares 2.2.1 while the latest retained GitHub release is v2.2.0
  - The built-in API server is documented as suitable only for small-scale use
