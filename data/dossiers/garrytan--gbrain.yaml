project:
  name: GBrain
  kind: service
  summary: >-
    A self-hostable knowledge layer for agents that syncs Markdown brain
    repositories into local or Postgres-backed retrieval, graph, and cited
    synthesis capabilities.
  best_for:
    - Agent users who need persistent, source-linked personal or team memory
    - Teams willing to operate a Postgres deployment for remote shared access

key_features:
  - Hybrid vector, keyword, reciprocal-rank, reranker, and graph-aware search
  - Cited answer synthesis with explicit knowledge-gap analysis
  - Markdown brain repository as the system of record with database synchronization
  - Auto-linked typed knowledge graph and multi-hop graph queries
  - MCP tools over local stdio and remote HTTP transports
  - Configurable schema packs, ingest paths, and durable background jobs

usage:
  interfaces:
    - CLI
    - MCP server
    - HTTP service
    - web admin dashboard
  installation:
    - Bun package from GitHub
    - agent-guided installation protocol
  setup: moderate

technology:
  languages:
    - TypeScript
  notable_components:
    - Bun
    - Model Context Protocol
    - PGLite
    - PostgreSQL
    - pgvector

