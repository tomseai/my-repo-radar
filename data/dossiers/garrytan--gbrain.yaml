strengths:
  - Provides both inexpensive raw retrieval and answer synthesis with source citations
  - Can start locally with PGLite, then use Postgres and pgvector for shared deployments
  - Exposes a broad agent-facing surface without tying users to one agent host or model provider

caveats:
  - Remote HTTP MCP requires a Postgres engine; PGLite supports local stdio use only
  - Meaningful retrieval requires ingestion, an embedding configuration, and ongoing source hygiene
  - Remote deployments require careful token, OAuth, registration, binding, and CORS configuration
  - The retained release feed contains only an eval-run baseline, not a stable release for the primary GBrain product

