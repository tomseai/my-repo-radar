  latest_release_at: 2026-11-21

strengths:
  - Provides both inexpensive raw retrieval and answer synthesis with source
    citations
  - Can start locally with PGLite, then use Postgres and pgvector for shared
    deployments
  - Exposes a broad agent-facing surface without tying users to one agent host
    or model provider

caveats:
  - Remote access and shared deployments require careful configuration
  - Keyword search works without an embedding key; semantic retrieval requires
    an embedding configuration and ongoing source hygiene
  - Remote deployments require careful token, OAuth, registration, binding, and
    CORS configuration

