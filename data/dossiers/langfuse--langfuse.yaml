project:
  name: Langfuse
  kind: application
  summary: >-
    An LLM engineering platform for tracing, prompt management, evaluation,
    datasets, and debugging AI applications.
  best_for:
    - Teams developing and operating LLM applications that need observability and evaluation
    - Organizations choosing between managed Cloud and self-hosted LLMOps infrastructure
key_features:
  - Trace LLM calls, retrieval, embeddings, agent actions, sessions, and application logic
  - Version, collaboratively manage, and cache prompts
  - Run LLM-as-a-judge, code, feedback, manual-labeling, and custom evaluations
  - Build datasets, test sets, benchmarks, experiments, and pre-deployment tests
  - Use a playground plus API, OpenAPI specification, and typed Python and JS/TS SDKs
usage:
  interfaces:
    - web UI
    - API
    - Python SDK
    - JavaScript/TypeScript SDK
  installation:
    - Langfuse Cloud account
    - Docker Compose self-hosting
    - Helm-based Kubernetes deployment
  setup: moderate
technology:
  languages:
    - TypeScript
  notable_components:
    - Turborepo monorepo
    - Docker
    - ClickHouse
    - PostgreSQL
    - Redis
    - MinIO or S3-compatible object storage
license:
  spdx: null
  name: MIT Expat for non-EE code; separate EE license
  notes: >-
    Code outside ee/, web/src/ee/, and worker/src/ee/ is MIT Expat; those
    Enterprise Edition paths are licensed separately under ee/LICENSE.
status:
  lifecycle: active
  archived: false
  latest_release: v3.221.1
  latest_release_at: "2026-07-17"
strengths:
  - Connects tracing, prompt iteration, datasets, evaluations, and debugging in one platform
  - Supports Cloud as well as documented Docker Compose, VM, and Kubernetes self-hosting
  - Offers flexible manual SDK instrumentation and integrations for common AI frameworks and providers
caveats:
  - "The repository is not wholly MIT: Enterprise Edition directories use a separate license"
  - Self-hosting runs a multi-service stack including ClickHouse, PostgreSQL, Redis, and object storage
  - Instrumentation requires project credentials and application-side SDK or integration configuration
