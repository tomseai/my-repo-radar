project:
  name: Langfuse
  kind: application
  summary: >-
    An LLM engineering platform for tracing, prompt management, evaluation,
    datasets, and debugging AI applications.
  best_for:
    - Teams developing and operating LLM applications that need observability
      and evaluation
    - Organizations choosing between managed Cloud and self-hosted LLMOps
      infrastructure
key_features:
  - Trace LLM calls, retrieval, embeddings, agent actions, sessions, and
    application logic
  - Version, collaboratively manage, and cache prompts
  - Run LLM-as-a-judge, code, feedback, manual-labeling, and custom evaluations
  - Build datasets, test sets, benchmarks, experiments, and pre-deployment tests
  - Optionally routes model requests through an AI gateway for centralized usage
    tracking and cost controls
  - Use a playground plus API, OpenAPI specification, and typed Python and JS/TS
    SDKs
usage:
  interfaces:
    - web UI
    - API
    - Python SDK
    - JavaScript/TypeScript SDK
  installation:
    - Langfuse Cloud account
    - Docker Compose self-hosting
    - Helm-based Kubernetes deployment
  setup: moderate
technology:
  languages:
    - TypeScript
  notable_components:
    - Turborepo monorepo
    - Docker
    - ClickHouse
    - PostgreSQL
    - Redis
    - MinIO or S3-compatible object storage
license:
  spdx: null
  name: MIT Expat for non-EE code; separate EE license
  notes: >-
    MIT Expat generally applies. Enterprise Edition code in ee/, web/src/ee/,
    worker/src/ee/, and packages/shared/src/server/ee/ uses ee/LICENSE.
    Incorporated third-party code retains its own terms.
status:
  lifecycle: active
  archived: false
  latest_release: v4.83.0
  latest_release_at: "2026-11-19"
strengths:
  - Connects tracing, prompt iteration, datasets, evaluations, and debugging in
    one platform
  - Supports Cloud as well as documented Docker Compose, VM, and Kubernetes
    self-hosting
  - Offers flexible manual SDK instrumentation and integrations for common AI
    frameworks and providers
caveats:
  - "The repository is not wholly MIT: Enterprise Edition directories use a
    separate license"
  - Self-hosting runs a multi-service stack including ClickHouse, PostgreSQL,
    Redis, and object storage
  - Instrumentation requires project credentials and application-side SDK or
    integration configuration
