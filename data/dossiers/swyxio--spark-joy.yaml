project:
  name: Spark Joy
  kind: curated-list
  summary: >-
    A large, hand-curated README index of resources for adding visual flair,
    usability, and whimsy to product interfaces, spanning web design, CSS,
    typography, graphics, interaction, and design inspiration.
  best_for:
    - Designers and frontend developers collecting interface and visual-design references
    - Product teams looking for inspiration or a starting point for specific UI details

key_features:
  - Organizes linked resources by CSS frameworks, layout, typography, color, and backgrounds
  - Covers icons, diagrams, illustrations, stock media, and SVG or graphics tools
  - Includes references for form controls, charts, dashboards, and React components
  - Collects animation, transition, loading, onboarding, and empty-state resources
  - Links to Figma, Sketch, canvas, WebGL, 3D, and wider interaction-design inspiration
  - Maintains its long table of contents through a dedicated doctoc workflow

usage:
  interfaces:
    - GitHub README
  installation:
    - browse the repository README
    - clone the repository for an offline copy
  setup: low

