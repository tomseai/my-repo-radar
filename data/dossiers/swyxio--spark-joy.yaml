    - doctoc table-of-contents workflow

license:
  spdx: MIT
  name: MIT License
  notes: >-
    The repository content may be used, copied, modified, and distributed with
    the copyright and permission notice retained; linked third-party resources
    can have separate terms.

status:
  lifecycle: active
  archived: false
  latest_release: null
  latest_release_at: null

strengths:
  - Broad, navigable coverage makes it useful for both visual inspiration and concrete implementation research
  - The category structure helps readers jump directly to a design concern rather than search a flat list
  - It includes practical web resources alongside broader design tools and learning material

caveats:
  - This is a reference collection, not a UI component library or a ready-to-install application
  - Quality, maintenance, licensing, and accessibility of individual linked resources must be evaluated separately
  - The maintainer states that acceptance of suggested resources is discretionary and the collection is primarily personal
  - The retained release feed contains no release entries, so no latest release can be established

