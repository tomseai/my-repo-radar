strengths:
  - A single gateway can apply routing, resiliency, guardrails, and logging consistently
  - Supports local, containerized, and worker-based deployment paths
  - Includes an MCP-focused control plane alongside the model gateway

caveats:
  - Some documented observability, prompt-management, and enterprise controls are hosted or enterprise-only
  - Provider credentials and any exposed gateway deployment need appropriate access controls
  - The README identifies Gateway 2.0 as a pre-release, so its scope should not be assumed for v1.15.2

