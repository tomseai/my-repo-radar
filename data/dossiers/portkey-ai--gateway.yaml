project:
  name: Portkey AI Gateway
  kind: service
  summary: >-
    An MIT-licensed AI gateway that presents one API for routing language and
    multimodal-model requests, with configurable reliability, security, and
    operational controls for applications that use multiple providers.
  best_for:
    - Teams centralizing model-provider routing and reliability policies
    - AI applications that need a self-hosted gateway and local request logs

key_features:
  - Routes requests across language, vision, audio, and image model providers
  - Configurable retries, fallbacks, load balancing, timeouts, and routing rules
  - Input and output guardrails plus secure key-management options
  - OpenAI-compatible request flow with a local console for logs
  - MCP gateway controls for server authentication, access, and tool-call observability

usage:
  interfaces:
    - HTTP API
    - local web console
    - CLI
  installation:
    - npm or npx package
    - Docker image or Docker Compose
    - build from source
    - Cloudflare Workers deployment
  setup: moderate

technology:
  languages:
    - TypeScript
  notable_components:
    - Node.js
    - Hono
    - Cloudflare Workers
    - Docker

