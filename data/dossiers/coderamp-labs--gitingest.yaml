  notes: Permissive license; the repository's LICENSE file carries the standard MIT terms.
status:
  lifecycle: active
  archived: false
  latest_release: v0.3.1
  latest_release_at: 2025-07-31
strengths:
  - Offers both command-line and programmatic digest generation
  - Includes repository structure and token estimates alongside file content
  - Supports local use as well as self-hosting
caveats:
  - A GitHub personal access token is required to ingest private GitHub repositories
  - Digests can include source content, so users should consider the destination and retention of generated files
  - Self-hosting adds Python server dependencies and, for the documented Compose development profile, object-storage services
