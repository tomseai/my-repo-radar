project:
  name: gitingest
  kind: cli
  summary: >-
    A Python CLI and library that converts local or GitHub-hosted Git
    repositories into prompt-friendly text digests for LLM workflows.
  best_for:
    - Preparing repository context for an LLM prompt
    - Generating a text digest from a local directory or GitHub URL
key_features:
  - Creates text digests with repository structure, size, and token-count statistics
  - Accepts local directories, GitHub repository URLs, and repository subdirectories
  - Provides a CLI and importable synchronous and asynchronous Python APIs
  - Supports GitHub tokens for private repositories and optional submodule inclusion
  - Can write a digest file or send output to standard output
usage:
  interfaces:
    - command line
    - Python API
    - hosted web application
  installation:
    - pip or pipx
    - Docker or Docker Compose for self-hosting
    - source build
  setup: low
technology:
  languages:
    - Python
  notable_components:
    - Click
    - GitPython
    - tiktoken
    - optional FastAPI server
