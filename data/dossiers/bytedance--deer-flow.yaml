strengths:
  - Covers agent delegation, memory, skills, tools, sandboxing, and multiple
    user surfaces in one documented runtime
  - Provides both full services and a lighter terminal or embedded-client route
    for different deployment needs
  - Documents local-trusted deployment assumptions and specific safeguards for
    powerful execution capabilities
caveats:
  - The setup wizard requires a configured model provider and may also need
    external tool-provider credentials
  - High-privilege file, shell, and resource operations require a trusted
    deployment or additional network and authentication controls
  - Docker Compose binds to loopback by default and includes multiple services;
    internet-facing deployment requires careful authentication and network configuration
  - The retained release feed establishes v2.2.0 as the latest project release,
    while the pinned backend and frontend manifests identify development version
    2.3.0-dev
  - DeerFlow 2.0 is a ground-up rewrite, so 1.x code and configuration should
    not be assumed compatible
