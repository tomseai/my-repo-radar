project:
  name: DeerFlow
  kind: application
  summary: >-
    A self-hostable super-agent harness and application for long-running work,
    combining a lead agent with scoped sub-agents, persistent memory,
    configurable skills and tools, and sandbox-aware file and command work.
  best_for:
    - Teams deploying an extensible agent workspace for research, coding, and
      multi-step automation
    - Developers who need web, terminal, embedded-Python, or supported
      chat-channel access to one agent runtime
key_features:
  - Orchestrates sub-agents with isolated contexts, scoped tools, termination
    conditions, and structured results
  - Provides persistent local memory, manual context compaction, and goal-based
    task continuation controls
  - Includes web search, web fetch, rendered capture, file operations, shell
    execution, custom Python tools, and MCP servers
  - Supports isolated container execution and warns that host bash is not a
    secure isolation boundary
  - Offers a Web UI, an embedded Python client, and a terminal-native workbench
    that shares configuration and thread storage
usage:
  interfaces:
    - Web UI
    - terminal workbench
    - embedded Python client
    - HTTP Gateway API
    - supported IM channels
  installation:
    - Interactive setup with make setup
    - Docker Compose deployment, requiring Compose 2.24 or later
    - Local source installation with Python, Node.js, pnpm, and uv prerequisites
  setup: high
technology:
  languages:
