project:
  name: LangGraph
  kind: framework
  summary: >-
    A low-level Python framework for building, managing, and deploying
    long-running stateful agents and multi-actor workflows, with durable
    execution, checkpoint-backed state, human oversight, and memory-oriented
    infrastructure.
  best_for:
    - Python teams that need explicit control of resilient, stateful agent workflows
    - Agent systems that must persist state, resume after interruptions, or allow human intervention
key_features:
  - Durable execution that persists work and resumes from the last completed state after failures
  - Human-in-the-loop interrupts for inspecting and modifying agent state during execution
  - Short-term working memory and long-term persistent memory patterns
  - Checkpoint packages with SQLite and PostgreSQL implementations
  - Python library, prebuilt components, SDK, and optional deployment CLI in one repository
