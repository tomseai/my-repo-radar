project:
  name: Alchemy
  kind: infrastructure
  summary: >-
    A TypeScript infrastructure-as-code framework built on Effect that combines
    cloud resources and application logic in one type-safe executable program.
  best_for:
    - TypeScript teams defining application code and cloud infrastructure
      together
    - Effect users deploying to AWS or Cloudflare with typed resource bindings
key_features:
  - Models infrastructure resources and application logic in one Effect program
  - Provides typed bindings, errors, planning, deployment, and local development
  - Supports AWS services, Cloudflare resources, IAM, SDKs, and smoke tests
  - Includes CI workflows and a GitHub Action for deployment
