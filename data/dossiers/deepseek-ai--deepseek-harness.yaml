  notes: Repository code is MIT licensed; the README separately points to
    THIRD_PARTY_NOTICES.md for bundled dependencies and their licenses.
status:
  lifecycle: experimental
  archived: false
  latest_release: null
  latest_release_at: null
strengths:
  - Plugin boundaries cover a broad set of agent concerns rather than limiting
    extensibility to tools alone
  - Provides both an approachable local Web UI and scriptable headless execution with
    structured events
  - The repository exposes extensive build, test, documentation, packaging, and
    invariant-checking infrastructure
caveats:
  - The project explicitly identifies itself as a developer preview with
    compatibility-breaking changes expected
  - Browser use and computer use are documented as experimental
  - Source builds require a large pnpm monorepo and a narrow current Node.js engine
    range
  - External code contributions are not accepted at the reviewed commit; feedback and
    ecosystem plugins are directed to Discussions
  - The latest versioned entries in the retained feed are previews, led by
    dsh-v0.2.3-alpha.2
