project:
  name: DeepSeek Harness
  kind: framework
  summary: A developer-preview agent harness built around an everything-is-a-plugin
    Cordis architecture, with a local Web UI, command-line and headless flows,
    extensible tools, skills, sessions, and experimental browser and computer use.
  best_for:
    - Developers evaluating a highly modular local harness for coding and tool-using
      agents
    - Plugin authors experimenting with DeepSeek Harness services, tools, interfaces,
      and runtime extensions
key_features:
  - Cordis-based plugin architecture used across the agent runtime, tools,
    interfaces, and configuration
  - Local Web UI with session management, file previews, trajectories, and an
    integrated multi-tab terminal
  - Headless operation that accepts tasks on standard input, resumes sessions, and
    streams JSON events
  - Agent skills, subagents, MCP clients and resources, shell and filesystem tools,
    web search, and persistent session components
  - Experimental browser automation through Playwright MCP, Chrome DevTools MCP, or
    Stagehand
  - Experimental computer use through a CUA Driver MCP integration or native driver
usage:
  interfaces:
    - Local Web UI
    - dsh CLI and headless JSON event stream
    - Python SDK
    - Plugin packages and MCP integrations
  installation:
    - Run npx @deepseek-ai/dsh web with a supported Node.js version
    - Clone the monorepo, run pnpm install and pnpm run build, then pnpm dsh web
  setup: moderate
technology:
  languages:
    - TypeScript
    - Python
  notable_components:
    - Cordis plugin framework
    - Node.js and pnpm monorepo
    - React Web UI and Electron desktop packages
    - Model Context Protocol
    - Vitest and Oxlint
license:
  spdx: MIT
