project:
  name: Self-hosted AI Starter Kit
  kind: starter-template
  summary: Docker Compose template for a self-hosted n8n environment with Ollama, Qdrant, and PostgreSQL for AI and low-code workflows.
  best_for:
    - Developers prototyping self-hosted n8n AI workflows with local models and vector search.
    - Teams wanting a working Compose baseline rather than a production-ready platform deployment.
key_features:
  - Runs n8n with PostgreSQL-backed persistence and an imported example workflow.
  - Includes Ollama and an initialization service that pulls the Llama 3.2 model.
  - Includes Qdrant as a persistent vector store exposed on its API port.
  - Offers CPU, NVIDIA GPU, and Linux AMD GPU Docker Compose profiles.
  - Mounts a shared host directory into n8n for local-file workflow nodes.
usage:
  interfaces:
    - Browser-based n8n editor at localhost port 5678.
    - Docker Compose services and profiles.
  installation:
    - Clone the repository, copy .env.example to .env, configure secrets and passwords, then run Docker Compose.
    - Docker Compose CPU, NVIDIA GPU, or AMD GPU profile.
  setup: moderate
technology:
  languages:
    - YAML
  notable_components:
    - Docker Compose
    - n8n
    - Ollama
    - Qdrant
    - PostgreSQL 16
