project:
  name: Awesome Claude Code
  kind: curated-list
  summary: >-
    A maintained Markdown directory of Claude Code learning resources,
    extensions, and adjacent tools, with editorial descriptions grouped by
    workflow areas such as skills, security, orchestration, and observability.
  best_for:
    - Claude Code users comparing learning material, skills, plugins, and supporting tools
    - Developers seeking categorized discovery of agent workflow, security, and monitoring resources
key_features:
  - Curates a start-here section and an official-resource section alongside third-party projects
  - Categorizes entries across documentation, research, providers, remote control, clients, status lines, design, writing, media, DevOps, and security
  - Includes dedicated sections for multi-agent orchestration, skills, memory and context persistence, observability, and linting
  - Provides editorial descriptions for listed resources instead of only titles and links
  - Preserves resources from the previous list iteration in README_ALTERNATIVES while the current list is rebuilt
  - Uses repository automation for resource-submission commands, README regeneration, repo-ticker updates, and issue validation
usage:
  interfaces:
    - GitHub Markdown directory
    - linked third-party repositories and documentation
  installation:
    - no installation; browse the list and follow each selected resource's instructions
    - clone the repository and install Python requirements only to use its list-maintenance tooling
  setup: low
