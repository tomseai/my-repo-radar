strengths:
  - Pairs design guidance with scripts for checking generated pages
  - Documents both skill CLI and linked installations
caveats:
  - Original versions and several specialized skills moved to the separate
    taste-skill-classics repository
  - Browser-based checks require serving the built page over HTTP and running Chrome
  - The guidance is framework-agnostic, so it does not provide
    framework-specific integration guarantees
