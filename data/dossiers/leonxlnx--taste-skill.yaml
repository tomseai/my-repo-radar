strengths:
  - Offers a broad but selectable set of code and image-generation skill variants
  - Documents simple whole-repository and single-skill installation paths
  - Keeps a pinned v1 alternative for users who depend on its prior behavior
caveats:
  - The default design-taste-frontend skill is documented as v2 experimental, with its API intended to stabilize at v2.0.0
  - Image-generation skills produce reference images rather than implementation code
  - The guidance is framework-agnostic, so it does not provide framework-specific integration guarantees
  - The retained release feed has no entries; the documented v2 experimental state is not treated as a stable project release
