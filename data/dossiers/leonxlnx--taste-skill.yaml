project:
  name: Taste Skill
  kind: library
  summary: >-
    A frontend-design skill for coding agents that guides visual direction,
    website implementation, and browser-based quality checks.
  best_for:
    - Developers directing coding agents to build or redesign web interfaces
    - Teams that want design guidance and repeatable checks for finished websites
key_features:
  - Ships design-taste-frontend as the single skill in the main repository
  - Supplies layout, typography, illustration, and motion assets for website design
  - Checks responsive layout, visual consistency, and performance in headless Chrome
  - Provides a quality gate for iterating on failures before delivery
usage:
  interfaces:
    - Agent skill files
    - npx command-line installer
    - ChatGPT, Codex, Cursor, or Claude Code conversations
  installation:
    - Run npx skills add against the repository
    - Install one named skill with the --skill option
    - Copy a SKILL.md into a project or paste it into a conversation
  setup: low
technology:
  languages:
    - Markdown
    - JavaScript
  notable_components:
