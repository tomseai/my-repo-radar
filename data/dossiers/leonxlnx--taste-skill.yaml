project:
  name: Taste Skill
  kind: library
  summary: >-
    A collection of portable agent-skill instruction files for improving the
    visual design and implementation of AI-generated frontend interfaces.
  best_for:
    - Developers directing coding agents to build or redesign web interfaces
    - Teams that want selectable visual-design guidance and image-to-code workflows
key_features:
  - Supplies a default frontend-design skill with configurable variance, motion, and visual-density dials
  - Provides specialized skills for existing-project redesign, image-to-code implementation, and visual styles such as soft, minimalist, and brutalist
  - Includes image-generation skills for web comps, mobile screens, and brand-kit reference boards
  - Preserves the original v1 skill while making an experimental v2 the default install
usage:
  interfaces:
    - Agent skill files
    - npx command-line installer
    - ChatGPT, Codex, Cursor, or Claude Code conversations
  installation:
    - Run npx skills add against the repository
    - Install one named skill with the --skill option
    - Copy a SKILL.md into a project or paste it into a conversation
  setup: low
technology:
  languages:
    - Markdown
    - JavaScript
  notable_components:
    - Agent Skills
    - npx skills add
    - GSAP-oriented motion guidance
