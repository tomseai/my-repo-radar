project:
  name: System Design Interview Notes
  kind: documentation
  summary: >-
    Work-in-progress chapter notes and architecture diagrams based on both
    volumes of System Design Interview – An Insider's Guide, covering system
    design fundamentals and 25 concrete distributed-system design exercises.
  best_for:
    - Readers reviewing system-design interview concepts alongside the source books
    - Engineers seeking a visual index of common scalability patterns and system-design case studies
key_features:
  - Twenty-eight chapters covering scaling, estimation, an interview framework, and system-design case studies
  - Foundational material on load balancing, caching, replication, message queues, consistent hashing, and distributed data
  - Case studies for chat, search autocomplete, video, file sync, maps, email, object storage, payments, wallets, and exchanges
  - Hundreds of locally stored diagrams illustrating architectures, data flows, algorithms, storage models, and failure handling
  - Curated links to papers, engineering posts, talks, and reference implementations for selected topics
