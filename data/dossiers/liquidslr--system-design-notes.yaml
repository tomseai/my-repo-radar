strengths:
  - Organizes a broad range of system-design fundamentals and case studies into a consistent chapter sequence
  - Extensive diagrams make architecture and data-flow trade-offs easier to scan than prose alone
  - Adds primary papers and real-world engineering references for several foundational topics
caveats:
  - The author labels the notes a work in progress, so chapter completeness and accuracy can vary
  - These are derivative study notes rather than the source books or an independently reviewed production-design standard
