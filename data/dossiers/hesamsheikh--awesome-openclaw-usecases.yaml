project:
  name: Awesome OpenClaw Use Cases
  kind: curated-list
  summary: >-
    A community-maintained Markdown collection of tested real-world OpenClaw
    use cases, organized to help people adapt the agent to social, building,
    infrastructure, productivity, research, learning, and finance workflows.
  best_for:
    - OpenClaw users looking for concrete workflow ideas before selecting skills or integrations
    - Contributors who have verified an OpenClaw use case and can document its prompts, skills, and links
key_features:
  - Groups real-life examples across social media, creative building, infrastructure and DevOps, productivity, research, learning, and finance
  - Links each listed use case to a dedicated Markdown document intended to explain its implementation
  - Covers personal assistants, digests, content pipelines, project coordination, knowledge bases, voice use, and specialized multi-agent workflows
  - Requires new contributions to describe the pain point, behavior, prompts or configuration, needed skills, and related tools
  - Accepts only use cases contributors have worked with and verified for at least a day, while allowing meaningfully different approaches
  - Maintains an explicit exclusion for crypto-related use cases
usage:
  interfaces:
    - GitHub Markdown reference list
    - linked use-case documents
  installation:
    - no installation; browse the repository and follow linked use-case guidance
    - contribute a Markdown use-case document and pull request
  setup: low
