project:
  name: portless
  kind: cli
  summary: >-
    A local-development CLI that replaces per-app port numbers with stable,
    named URLs by running a local reverse proxy around existing development
    commands, with configurable TLS, routing, aliases, and sharing modes.
  best_for:
    - Developers who run several local web services and want stable browser URLs
    - Teams or agents whose local commands need predictable URLs without manually managing ports
key_features:
  - Runs an existing development command behind a named local URL such as https://myapp.localhost
  - Assigns an available application port and injects compatible port and host flags for supported frameworks
  - Provides local HTTPS and HTTP/2 with a generated, system-trusted certificate authority by default
  - Supports route aliases, subdomains, custom TLDs, monorepos, and Git worktree URL prefixes
  - Can install the proxy as an OS startup service and explicitly enable LAN, Tailscale, or ngrok sharing
usage:
  interfaces:
    - CLI
    - local HTTPS reverse proxy
    - OS startup service
  installation:
    - npm global package
    - npm project dev dependency
  setup: moderate
