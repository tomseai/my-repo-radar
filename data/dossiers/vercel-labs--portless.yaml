strengths:
  - Gives each development service a readable URL while retaining its existing dev command
  - Covers local TLS, framework port handling, worktrees, and proxy lifecycle in one CLI
  - Defaults to loopback-only binding outside its explicitly enabled sharing modes
caveats:
  - The project is pre-1.0, and its per-user state format can require rerunning trust after version changes
  - Default HTTPS setup creates and trusts a local certificate authority and can require elevation to bind privileged ports
  - LAN, Tailscale, and ngrok modes change the normal loopback-only exposure model and require deliberate configuration
