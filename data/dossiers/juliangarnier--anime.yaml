status:
  lifecycle: active
  archived: false
  latest_release: v4.5.0
  latest_release_at: "2026-06-22"
strengths:
  - Targets CSS, SVG, DOM attributes, and JavaScript objects through a single
    library
  - Offers modular imports and multiple package formats for different
    integration styles
  - Provides advanced composition tools such as timelines, easings, staggering,
    and adapters
caveats:
  - It supplies animation primitives, not a ready-made component or visual
    design system
  - The optional Three.js adapter requires compatible Three.js peer dependencies
  - Version 4 includes migration guidance, and the 4.4 release documents
    behavior and callback-signature changes
  - Animation choices still need application-specific accessibility and
    performance review
