project:
  name: Anime.js
  kind: library
  summary: >-
    A JavaScript animation library for animating CSS properties, SVG, DOM
    attributes, and JavaScript objects through a modular API.
  best_for:
    - Adding programmatic motion and timelines to a web interface
    - Projects that need one animation API across DOM, SVG, and object targets
key_features:
  - Core animate API with easing, stagger, loop, alternate, and timeline modules
  - ESM, CommonJS, UMD, and TypeScript declaration package outputs
  - Modules for SVG, text, layout, scroll, draggable interactions, and the Web
    Animations API
  - Optional Three.js adapter for supported Three.js targets
  - Release 4.5 adds an adapter registration API and three-dimensional stagger
    layouts
usage:
  interfaces:
    - JavaScript and TypeScript module API
    - Browser UMD bundle
  installation:
    - npm package
    - CDN-compatible UMD bundle
    - Source checkout for local development
  setup: low
