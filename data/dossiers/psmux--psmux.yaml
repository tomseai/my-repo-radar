project:
  name: psmux
  kind: application
  summary: >-
    A native Rust terminal multiplexer for Windows that uses ConPTY directly,
    implements the tmux command language and configuration format, persists sessions,
    and supports panes, themes, mouse control, scripting, plugins, and agent-team panes.
  best_for:
    - Windows developers who want tmux-style persistent sessions without WSL or Cygwin
    - Claude Code users who want teammate agents displayed in separate terminal panes
key_features:
  - Native Windows ConPTY implementation with psmux, pmux, and tmux command aliases
  - Reads tmux configuration and supports themes, mouse input, layouts, and copy mode
  - Persists sessions across terminal crashes and SSH disconnects
  - Exposes tmux-compatible commands, hooks, format variables, and scripting primitives
  - Automatically places Claude Code agent-team members in visible panes
