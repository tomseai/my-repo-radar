project:
  name: AgentsMesh
  kind: infrastructure
  summary: >-
    A self-hosted control plane for scheduling, isolating, and supervising
    terminal-based coding agents across a fleet of user-run machines.
  best_for:
    - Teams operating concurrent coding-agent tasks on their own infrastructure
    - Workflows needing isolated Git worktrees, shared terminal visibility, and coordinated agent work
key_features:
  - Self-hosted Runner fleet that schedules AgentPods across user-owned machines
  - Per-pod PTY terminals, private credentials, branches, and isolated Git worktree sandboxes
  - Web, Electron desktop, and iOS clients backed by a shared Rust core
  - Mesh channels with mentions and pod bindings for multi-agent coordination
  - Autopilot control agent with idle detection, iteration limits, and human takeover
  - Control-plane gRPC with mTLS and a separate WebSocket terminal-relay data plane
usage:
  interfaces:
    - Web console
    - Electron desktop client
    - iOS client
    - agentsmesh-runner CLI
  installation:
    - Hosted-service account with a locally installed Runner
    - Runner install script for macOS and Linux
    - Docker Compose deployment
    - Build from source
  setup: high
