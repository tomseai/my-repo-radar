strengths:
  - Separates orchestration control traffic from terminal streaming for fleet-scale operation
  - Keeps agent execution and source code on user-operated Runner machines
  - Provides consistent workflow access across web, desktop, and iOS clients
caveats:
  - Production use is commercially restricted under BSL 1.1 until the stated change date
  - Self-hosting requires a multi-service deployment with PostgreSQL, Redis, object storage, and a reverse proxy
  - "The release feed is Runner-specific: its newest entry is nightly v0.44.5-nightly.20260718 and its newest stable entry is Runner v0.44.4, not an authoritative platform release"
  - The primary product targets terminal-based agents; providers and their credentials must be configured separately
