strengths:
  - Uses a typed Effect RPC boundary between the app and backend
  - Groups message, channel, and organization state into separate Durable Objects
  - Documents local development and an interactive setup workflow
caveats:
  - Local development uses Bun, Docker, MinIO, and the Alchemy runtime.
  - Sign-in and integrations require the corresponding provider credentials when
    enabled.
  - The Functional Source License restricts competing use for its initial period
    before conversion to Apache-2.0.
