project:
  name: Hazel Chat
  kind: application
  summary: >-
    A team chat application with channels and direct messages, a Foldkit web
    interface, and real-time synchronization from Cloudflare Durable Objects
    into TanStack DB.
  best_for:
    - Teams looking for an inspectable, real-time team chat application
    - Developers studying an Effect and Cloudflare Durable Objects application
key_features:
  - Real-time channels and direct messages with presence and typing indicators
  - Emoji reactions, pinned messages, file attachments, and notifications
  - Type-safe Effect RPC for client-server communication
  - WebSocket synchronization from an organization, channel, or user Durable
    Object into TanStack DB
  - Bot gateway and background work for notifications, RSS, webhooks, and thread
    naming
usage:
  interfaces:
    - web application
    - bot gateway
    - interactive setup CLI
  installation:
    - source checkout with Bun and Docker
    - interactive setup and local Alchemy development stack
  setup: high
technology:
  languages:
    - TypeScript
  notable_components:
    - Foldkit
    - Effect
    - Cloudflare Workers and Durable Objects
    - TanStack DB
    - SQLite and D1
    - Bun
    - Alchemy
    - MinIO
