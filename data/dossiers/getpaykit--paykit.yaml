project:
  name: PayKit
  kind: framework
  summary: >-
    An embedded Stripe billing framework for TypeScript that keeps billing state in an
    application's database while managing products, subscriptions, entitlements,
    usage billing, and Stripe webhooks.
  best_for:
    - TypeScript applications that want billing logic and state inside their own
      backend
    - SaaS products defining plans and feature access as code

key_features:
  - Define products, plans, and metered features in TypeScript
  - Manage subscriptions and feature entitlements through one application API
  - Track usage and monthly limits for metered features
  - Handle the Stripe billing lifecycle and webhooks
  - Initialize a project through the paykitjs CLI
  - Core package includes database schema tooling

usage:
  interfaces:
    - TypeScript library
    - CLI
  installation:
    - npx paykitjs init
    - npm package
    - build from source
  setup: moderate

technology:
  languages:
    - TypeScript
  notable_components:
    - Stripe
    - Drizzle ORM
    - PostgreSQL
    - Zod

license:
  spdx: MIT
  name: MIT License
  notes: null

status:
  lifecycle: active
  archived: false
  latest_release: v0.2.0
  latest_release_at: 2026-09-17

strengths:
  - Keeps billing state and business logic in the host application's database
  - Gives TypeScript applications a concise code-first plan and entitlement model
  - Includes CLI initialization and a monorepo development workflow

caveats:
  - The core package describes itself as a Stripe billing framework, so Stripe
    is central to the documented flow
  - The latest release is pre-1.0, so APIs and workflows may change
  - A working deployment needs a database connection plus Stripe secret and
    webhook credentials
  - Local contributor setup requires Node.js 22 or later and pnpm

