project:
  name: PayKit
  kind: framework
  summary: >-
    An embedded TypeScript billing framework that keeps billing state in an
    application's database while managing products, subscriptions,
    entitlements, usage billing, and Stripe webhooks.
  best_for:
    - TypeScript applications that want billing logic and state inside their own backend
    - SaaS products defining plans and feature access as code

key_features:
  - Define products, plans, and metered features in TypeScript
  - Manage subscriptions and feature entitlements through one application API
  - Track usage and monthly limits for metered features
  - Handle the Stripe billing lifecycle and webhooks
  - Initialize a project through the paykitjs CLI
  - Core package includes database schema tooling

usage:
  interfaces:
    - TypeScript library
    - CLI
  installation:
    - npx paykitjs init
    - npm package
    - build from source
  setup: moderate

