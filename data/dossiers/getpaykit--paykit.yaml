  notes: null

status:
  lifecycle: active
  archived: false
  latest_release: v0.0.6
  latest_release_at: 2026-05-23

strengths:
  - Keeps billing state and business logic in the host application's database
  - Gives TypeScript applications a concise code-first plan and entitlement model
  - Includes CLI initialization and a tested monorepo development workflow

caveats:
  - The core package describes itself as a Stripe billing framework, so Stripe is central to the documented flow
  - The pinned core package declares 0.1.6, but the retained GitHub release feed ends at v0.0.6, so publication status beyond that release is unclear
  - The latest release is pre-1.0, so APIs and workflows may change
  - A working deployment needs a database connection plus Stripe secret and webhook credentials
  - Local contributor setup requires Node.js 22 or later and pnpm

