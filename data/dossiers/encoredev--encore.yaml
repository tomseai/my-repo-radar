  summary: A Go and TypeScript backend framework with local infrastructure orchestration and an optional managed cloud deployment platform.
  best_for: [Teams building backend services with consistent local and cloud infrastructure]
key_features:
  - Declare services, databases, messaging, storage, and other infrastructure in application code
  - Run local infrastructure with a dashboard and distributed traces
  - Provision and deploy to AWS or Google Cloud through the optional platform
  - Generate standalone Docker images for self-hosting
  - Configure an MCP server for agent inspection of application resources
