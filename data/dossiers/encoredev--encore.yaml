strengths:
  - Connects application resource declarations to local development and cloud deployment
  - Supports self-hosting without requiring the managed platform
caveats:
  - Application SDK support is limited to Go and TypeScript; Python and Rust are listed as forthcoming
  - Fully automated cloud provisioning is limited to AWS and Google Cloud
  - The managed deployment platform is a separate commercial service
