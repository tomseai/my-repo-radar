project:
  name: Agent Orchestrator
  kind: application
  summary: >-
    A local agent IDE and orchestration layer that supervises parallel
    terminal-based coding agents in isolated Git worktrees, with desktop and
    CLI control plus feedback loops for pull requests, CI, reviews, and conflicts.
  best_for:
    - Developers coordinating several coding-agent sessions in one repository
    - Teams or individuals wanting local visibility into agent terminals, branches, and PR feedback

key_features:
  - Separate Git worktree, terminal, branch, and pull-request context for each session
  - Adapters for multiple terminal-based coding-agent harnesses
  - Desktop session board with embedded terminals and local browser previews
  - Automated routing of CI failures, review comments, and merge conflicts to sessions
  - Local Go daemon with a loopback HTTP API, event stream, and SQLite state store
  - CLI for daemon, project, agent, session, orchestration, and preview operations

usage:
  interfaces:
    - desktop GUI
    - CLI
    - embedded terminal
    - local browser preview
  installation:
    - official desktop download
    - build from source
    - legacy npm CLI package
  setup: moderate

technology:
  languages:
    - Go
    - TypeScript
  notable_components:
