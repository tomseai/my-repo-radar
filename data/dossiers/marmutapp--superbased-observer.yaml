project:
  name: SuperBased Observer
  kind: application
  summary: >-
    A local-first observability tool for AI coding activity that captures usage,
    provider-returned token counts, and costs through a CLI, dashboard, MCP server,
    and optional API proxy.
  best_for:
    - Developers comparing cost and token use across AI coding tools
    - Teams that need local inspection of coding-agent sessions before opting into sharing
key_features:
  - Local dashboard and CLI for sessions, actions, tokens, and costs
  - Optional reverse proxy for provider-returned token counts and compression
  - MCP server exposing local cross-tool usage intelligence
  - Watcher and scan commands for supported coding-agent session data
  - Optional VS Code extension and editor-integrated dashboard
  - Local SQLite storage with no outbound calls by default

usage:
  interfaces:
    - CLI
    - local web dashboard
    - MCP server
    - VS Code extension
  installation:
    - npm package
    - Python package via pip, uv, or pipx
    - Go install or source build
    - prebuilt release archive
  setup: moderate

