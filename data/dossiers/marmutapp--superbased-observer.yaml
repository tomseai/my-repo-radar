strengths:
  - Keeps standard capture, storage, dashboard, CLI, and MCP use local by default
  - Can use provider-returned token data when traffic is routed through its proxy
  - Supports several installation paths and a VS Code integration

caveats:
  - Proxy-grade token accuracy and compression require routing supported tools through the local proxy
  - MCP registration is optional and adds tool schemas to AI-client context
  - Team sharing, OpenTelemetry export, and alerting are separate opt-in paths

