strengths:
  - Provides a core package plus companion integrations from one TypeScript
    monorepo
  - Explicit package exports expose focused functionality through separate
    entry points
  - Supports multiple JavaScript runtime targets and common tooling integrations

caveats:
  - Effect v4 is described as a long-term support release; upgrading from v3
    requires reviewing the migration guide

