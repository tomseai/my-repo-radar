project:
  name: Effect
  kind: library
  summary: >-
    A TypeScript library and package monorepo for building type-safe,
    production-grade applications, centered on the Effect package and companion
    packages for platform, testing, observability, SQL, AI, and UI integrations.
  best_for:
    - TypeScript applications that need a shared foundation for typed application concerns
    - Teams adopting the Effect package ecosystem across Node.js, Bun, or browser targets

key_features:
  - The primary effect package is presented as a TypeScript standard-library foundation for production software
  - A dedicated testing module is exported from the primary package
  - Unstable primary-package exports cover AI, CLI, cluster, HTTP, observability, persistence, RPC, schema, SQL, workflow, and workers
  - Companion packages target Node.js, Bun, browser, OpenTelemetry, and Vitest integrations
  - Provider-specific AI packages are included for Anthropic, OpenAI, and OpenRouter

usage:
  interfaces:
    - TypeScript package imports
    - npm packages
  installation:
    - npm install effect@beta for Effect v4 beta
    - npm install effect@latest for Effect v3
  setup: low

technology:
  languages:
    - TypeScript
  notable_components:
    - effect package
    - platform and integration packages for Node.js, Bun, and browsers

