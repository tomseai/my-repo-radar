strengths:
  - Provides a core package plus companion integrations from one TypeScript monorepo
  - Explicit package exports make stable and unstable entry points distinguishable
  - Supports multiple JavaScript runtime targets and common tooling integrations

caveats:
  - The main branch and newest retained primary-package release are Effect v4 beta; the feed does not establish the latest stable Effect v3 release, so release fields remain unset
  - Several capabilities are explicitly exported under unstable paths
  - Effect v3 remains on a separate branch and uses a different installation channel

