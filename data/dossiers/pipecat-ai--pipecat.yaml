project:
  name: Pipecat
  kind: framework
  summary: >-
    An open-source Python framework for real-time voice and multimodal
    conversational agents, combining media pipelines, AI services, transports,
    structured conversations, and multi-agent coordination.
  best_for:
    - Building production-oriented voice, video, or multimodal conversational
      agents
    - Composing specialist agents that hand off, fan out, or run across
      processes and machines
key_features:
  - Composable pipelines for audio, video, AI services, transports, and
    conversations
  - Speech-to-text, LLM, text-to-speech, speech-to-speech, and vision service
    integrations
  - WebSocket and WebRTC transport options alongside telephony and local
    transports
  - Pipecat Flows for predefined or dynamic structured conversations with state
    management
  - Multi-agent handoff, parallel fan-out, sidecar workers, and distributed
    coordination
  - CLI support for interactive project initialization, monitoring, and
    deployment workflows
usage:
  interfaces:
    - Python library
    - pipecat CLI
    - WebSocket and WebRTC agent transports
  installation:
    - uv add pipecat-ai
    - pip install pipecat-ai
    - uv tool install pipecat-ai[cli]
  setup: high
technology:
  languages:
    - Python
  notable_components:
