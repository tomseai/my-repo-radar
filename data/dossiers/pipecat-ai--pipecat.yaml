  latest_release_at: "2026-11-12"
strengths:
  - Covers the end-to-end real-time media pipeline rather than only model
    invocation
  - Supports both a single voice agent and coordinated multi-agent topologies
  - Lets applications select from many service providers and transports
caveats:
  - Practical deployments require selecting, configuring, and securing
    third-party providers and transports
  - Examples require service credentials in environment variables, and local
    audio needs the PortAudio system dependency
  - The framework requires Python 3.11 or newer; the README recommends Python
    3.12 or newer
  - The base install is intentionally lean, so provider and CLI capabilities can
    require optional extras
