strengths:
  - Broad, task-oriented grouping helps readers find a reconstruction project by
    technology type
  - Direct source links and language labels make the directory easy to scan
  - The collection spans foundational systems work and application-facing
    technologies
caveats:
  - This repository supplies a directory, not a common curriculum, runnable
    codebase, or shared support channel
  - Tutorial depth, maintenance, licenses, and prerequisites vary by
    independently maintained linked resource
  - The CC0 declaration applies to this repository's work, not to the
    independently hosted tutorials it links
  - The cached releases feed has no entries, so no latest versioned release can
    be established
