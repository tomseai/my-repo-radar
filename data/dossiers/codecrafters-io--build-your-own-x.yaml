project:
  name: Build Your Own X
  kind: curated-list
  summary: >-
    A Markdown index of external, step-by-step guides for recreating software
    technologies from scratch, organized by the kind of system to build.
  best_for:
    - Selecting an implementation-oriented tutorial for a familiar technology
    - Exploring systems-programming topics through reconstruction exercises
key_features:
  - Categorized tutorial index spanning distributed systems, databases, network
    stacks, operating systems, and programming languages
  - Additional categories for browsers, web servers, front-end frameworks,
    shells, text editors, games, and renderers
  - Per-entry language labels and direct links to the original tutorial resources
  - Sections covering AI models, neural networks, visual-recognition systems,
    and bots
  - Contribution guidance directing additions through repository pull requests
usage:
  interfaces:
    - GitHub Markdown directory
    - External tutorial links
  installation:
    - No installation; browse README.md
    - Follow a selected guide and use its own prerequisites and toolchain
  setup: low
