project:
  name: OpenHuman
  kind: application
  summary: An early-beta agent harness for desktop, terminal, headless, and embedded
    Rust use, with persistent memory, workflow graphs, tools, and integrations.
  best_for:
    - Individuals who want a local desktop agent with durable personal context
    - Users who want to review agent-proposed workflows and multi-agent runs
    - Rust developers embedding agents or running multiple agents from a headless
      service
key_features:
  - Recalls relevant context from files, repositories, feeds, and apps through a
    configurable memory engine
  - Runs checkpointed agent workflows and provides a Rust API for embedding agents
  - Runs durable workflow graphs with cron, event, or manual triggers and approval
    steps
  - Includes web search, scraping, browser, coding, voice, and media-generation tools
  - Supports OAuth integrations, MCP servers, skills, and messaging channels
  - Offers encrypted on-device data, OS-keyring secrets, and a local-only privacy mode
