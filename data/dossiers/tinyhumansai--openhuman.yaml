project:
  name: OpenHuman
  kind: application
  summary: >-
    A local-first desktop personal-AI application combining persistent memory,
    agent orchestration, visual workflows, research tools, and integrations.
  best_for:
    - Individuals who want a local desktop agent with durable personal context
    - Users who want to review agent-proposed workflows and multi-agent runs
key_features:
  - Builds local Memory Trees and an editable Obsidian-compatible Markdown vault
  - Runs checkpointed agent graphs, sub-agent fleets, and replayable run journals
  - Creates visual, trigger-driven workflows with approval gates for side effects
  - Includes web search, scraping, browser, coding, voice, and media-generation tools
  - Supports OAuth integrations, MCP servers, skills, and messaging channels
  - Offers encrypted on-device data, OS-keyring secrets, and a local-only privacy mode
