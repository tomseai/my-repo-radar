    additional repository-specific restriction is retained in the bundle.

status:
  lifecycle: active
  archived: false
  latest_release: null
  latest_release_at: null

strengths:
  - Combines design guidance, automated checks, and agent-feedback hooks in one
    workflow
  - Runs deterministic detector checks without an LLM or API key
  - Supports multiple coding-agent harnesses and standalone CLI use

caveats:
  - Live copy Apply can launch a local coding agent with approvals and sandboxing disabled unless configured otherwise
  - The npm installer requires Node.js 18.19 or later according to the package manifest
  - Codex users must approve the project hook after install or update
  - The retained release feed contains independent Skill and CLI versions, not a
    single repository-wide release

