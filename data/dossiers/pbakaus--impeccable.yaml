project:
  name: Impeccable
  kind: plugin
  summary: >-
    A design skill and command suite for AI coding tools, paired with browser
    iteration and a standalone CLI that detects deterministic frontend
    anti-patterns in source files, directories, and URLs.
  best_for:
    - Teams guiding AI coding agents toward an established frontend design
      language
    - Reviewing generated interface code for repeatable design and accessibility
      issues

key_features:
  - One skill with 24 design commands, including setup, critique, audit, and
    live iteration
  - Project design context through PRODUCT.md and optional DESIGN.md
  - Standalone CLI detector for directories, HTML files, URLs, and JSON output
  - 62 deterministic rules for AI-design tells and general frontend-quality
    issues
  - Provider-native hooks that return detector findings to agent workflows

usage:
  interfaces:
    - AI coding-tool skill
    - CLI
    - browser iteration
  installation:
    - npx impeccable install
    - Git submodule and link command
    - provider plugin or manual skill copy
  setup: moderate

technology:
  languages:
    - JavaScript
  notable_components:
    - Node.js
    - Puppeteer
    - Astro
    - provider-native hooks

license:
