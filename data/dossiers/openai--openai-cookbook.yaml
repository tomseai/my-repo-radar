project:
  name: OpenAI Cookbook
  kind: documentation
  summary: >-
    An OpenAI-maintained collection of example code and guides for common
    OpenAI API tasks, published as a browsable Cookbook and repository, with
    most examples written in Python.
  best_for:
    - Developers looking for concrete OpenAI API implementation patterns
    - Learners who want runnable examples before adapting concepts to another language

key_features:
  - Example code and guides for common OpenAI API tasks
  - A browsable cookbook.openai.com documentation experience
  - Python-first examples whose concepts are intended to transfer to other languages
  - Instructions for supplying OPENAI_API_KEY through an environment variable or .env file
  - Community-resource contribution guidance

usage:
  interfaces:
    - website documentation
    - repository files
    - Jupyter notebooks
  installation:
    - browse cookbook.openai.com
    - run an individual example after configuring OPENAI_API_KEY
  setup: moderate

