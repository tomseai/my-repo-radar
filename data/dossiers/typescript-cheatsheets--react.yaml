project:
  name: React TypeScript Cheatsheet
  kind: documentation
  summary: >-
    A documentation resource for using React with TypeScript effectively,
    combining opinionated best practices, copy-and-paste examples, setup
    guidance, and advanced generic-type material for reusable utilities and libraries.
  best_for:
    - React developers who are adopting TypeScript or need type-pattern references
    - Library authors who need advanced React and TypeScript generic-type examples
key_features:
  - Covers TypeScript setup, basic type examples, React component patterns, hooks, forms, events, refs, and portals
  - Includes advanced guidance for generic types, reusable utilities, React and TypeScript libraries, and DefinitelyTyped contributions
  - Publishes its content both as the repository README and as a searchable documentation website
  - Provides starter-kit commands for Next.js, Remix, Gatsby, Expo, and Vite TypeScript projects
  - Maintains reference pages for ComponentProps, CSSProperties, ReactNode, and refs
