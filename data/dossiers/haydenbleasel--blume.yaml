project:
  name: Blume
  kind: cli
  summary: >-
    A zero-configuration Node.js CLI that turns a folder of Markdown or MDX
    files into a documentation site with an Astro runtime, static output,
    navigation, search, theming, and optional AI-oriented features.
  best_for:
    - Teams that want a docs site without maintaining an Astro application scaffold
    - Documentation authors who need Markdown or MDX content, local search, and static-host deployment
key_features:
  - Generates and drives a hidden Astro project from Markdown or MDX content, with an eject path for full project control
  - Provides CLI commands for project initialization, development, builds, previews, checks, validation, diagnostics, content sync, and component installation
  - Produces static HTML and a local search index, with support for self-hosted search and optional external search providers
  - Supplies MDX documentation components, type-safe TypeScript configuration, theming, React islands, and source-component overrides
  - Supports local files plus remote MDX, GitHub Releases, Notion, Sanity, and custom content sources
  - Includes llms.txt output, Markdown copy and chat actions, an optional Ask AI assistant, agent skills, and a hosted MCP server
usage:
  interfaces:
    - CLI
    - generated web documentation site
    - optional MCP server
  installation:
    - npx blume init
    - npm package
    - build from source with Bun
  setup: low
