strengths:
  - Avoids a starter scaffold while retaining an explicit eject path when site-level control becomes necessary
  - Covers authoring, local and external search, API references, SEO, and static deployment in one package
  - Has a commit-pinned package version and a release workflow that tests before Changesets publishing
caveats:
  - Requires Node.js 22.12 or newer and at least one Markdown or MDX content file
  - The default generated project is intentionally hidden under .blume, which can be unfamiliar when debugging or extending the site
  - Ask AI, hosted MCP, remote sources, and third-party search adapters can require separate providers, accounts, or deployment configuration
  - The monorepo uses Bun for development and source builds, despite CLI use working through common package managers
