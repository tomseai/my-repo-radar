project:
  name: Dolt
  kind: service
  summary: A Go SQL database that versions tables and schema with Git-like cloning,
    branching, merging, diffing, commits, and remotes, exposed through both a
    command-line client and a MySQL-compatible server.
  best_for:
    - Teams that need versioned data and schema changes alongside SQL workflows
    - Isolating, comparing, merging, and restoring database changes with Git-like
      operations
key_features:
  - Git-like clone, branch, merge, push, pull, commit, diff, and history operations
    for tables
  - MySQL-compatible server and client interfaces for SQL data and schema access
  - SQL system tables, functions, and stored procedures for version-control operations
  - CSV import plus command-line data-repository and remote-management workflows
  - Branch-specific schema changes and SQL queries against historical revisions
usage:
  interfaces:
    - command-line interface
    - MySQL-compatible SQL server
    - MySQL-compatible clients
  installation:
    - official release binaries and installers
    - Homebrew, Chocolatey, Arch Linux, or MacPorts packages
    - official Docker images
    - build from Go source
  setup: moderate
technology:
  languages:
    - Go
  notable_components:
    - MySQL-compatible SQL server
    - Git-style version-control layer for database tables
