strengths:
  - Makes data and schema history available through both SQL and familiar Git-style
    commands
  - Supports standard MySQL-compatible clients as well as its own CLI
  - Lets teams branch and merge database changes instead of coordinating only through
    migrations
caveats:
  - The database model and operational workflow differ materially from a conventional
    MySQL deployment
  - The README documents MySQL 9 authentication as not connecting by default without
    additional configuration
  - Building from source requires Go plus a working C compiler and cgo toolchain
