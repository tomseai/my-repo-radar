project:
  name: Langroid
  kind: framework
  summary: >-
    A Python framework for building LLM applications through first-class agents
    and tasks that exchange messages, delegate sub-tasks, use typed tools and
    vector stores, and support multi-agent workflows with local or remote
    language models.
  best_for:
    - Python developers who want explicit Agent and Task abstractions for collaborative LLM workflows
    - Applications combining LLMs with typed tools, document retrieval, vector stores, or MCP servers
key_features:
  - Agent and Task abstractions that coordinate hierarchical, recursive sub-task delegation
  - Message-based multi-agent orchestration inspired by the actor model
  - Pydantic-based typed tools and function calling with validation feedback
  - MCP tool adapter that exposes server tools as Langroid ToolMessage instances
  - Document-chat and table-chat agents with retrieval-augmented workflows
  - Support for local, remote, and OpenAI-compatible LLMs plus multiple vector-store options
