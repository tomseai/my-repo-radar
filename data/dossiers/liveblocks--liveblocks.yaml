project:
  name: Liveblocks
  kind: monorepo
  summary: A collaboration SDK and hosted infrastructure for adding realtime
    synchronization, contextual comments, and notifications to web applications.
  best_for:
    - Product teams adding realtime collaboration without building synchronization
      infrastructure
    - React and JavaScript teams building collaborative editors and shared workspaces
key_features:
  - Provides Sync, Comments, and Notifications products for composing collaboration
    features
  - Supplies React, JavaScript, Node, REST, Python, and Yjs integrations, plus
    packages for React Flow, CodeMirror, and ProseMirror
  - Includes collaborative UI components and presence, storage, and room primitives
  - Connects SDKs to managed realtime infrastructure
usage:
  interfaces:
    - JavaScript and React SDKs
    - Node and Python SDKs
    - REST API
    - hosted dashboard
  installation:
    - npm packages
    - Liveblocks account and project
