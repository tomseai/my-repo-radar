project:
  name: Asupersync
  kind: framework
  summary: >-
    An experimental Rust async runtime that uses region-owned tasks, explicit
    cancellation protocols, capability-gated effects, and deterministic replay testing.
  best_for:
    - Experimental Rust systems that can validate selected adapters and cancellation boundaries
    - Teams investigating structured shutdown and reproducible concurrency failures

key_features:
  - Region-owned tasks that close to quiescence instead of detaching children
  - Request, drain, and finalize cancellation protocol for covered primitives
  - Capability-gated runtime effects and obligation tracking
  - Lab runtime with virtual time, deterministic scheduling, and trace replay
  - Tokio compatibility layer and native runtime, synchronization, and channel primitives

