status:
  lifecycle: experimental
  archived: false
  latest_release: v0.3.9
  latest_release_at: 2026-07-15

strengths:
  - Makes task ownership and cancellation boundaries explicit in the runtime model
  - Includes deterministic scheduling and replay facilities for concurrency testing
  - Documents compatibility and platform boundaries in detail

caveats:
  - The project describes itself as experimental and pre-1.0, not an established broad runtime replacement
  - Default contributor and release lanes require a pinned nightly Rust toolchain; a restricted stable subset is documented
  - It is not drop-in compatible with Tokio-bound crates, and some adapters and platform paths remain scoped or partial
  - The nonstandard license rider materially limits who may use or receive the software

