strengths:
  - Combines source management, search, chat, notes, and audio generation in one self-hosted application
  - Supports a broad mix of local and hosted AI providers
  - Provides both an interactive UI and programmatic REST API
caveats:
  - Docker is required for the documented quick-start deployment
  - Hosted-model features require configuring the relevant provider credentials
  - Advanced extraction engines are optional and can add first-start downloads or runtime requirements
