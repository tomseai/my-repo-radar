project:
  name: open-notebook
  kind: application
  summary: >-
    A self-hosted research-notebook application for organizing multimodal
    sources, searching them, and using configurable AI models for
    source-grounded chat, notes, and podcast generation.
  best_for:
    - Individuals or teams that want a private research workspace they can host
    - Research workflows that combine documents, media, web sources, and AI chat
key_features:
  - Multiple notebooks for separate research projects
  - Ingestion of PDFs, videos, audio, web pages, and office documents
  - Full-text and vector search across stored content
  - Context-aware chat with source citations and configurable context
  - AI-assisted notes, content transformations, and multi-speaker podcasts
  - Support for hosted and local model providers, including Ollama and LM Studio
usage:
  interfaces:
    - web UI
    - REST API
  installation:
    - Docker Compose
    - build from source
  setup: moderate
