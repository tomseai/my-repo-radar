<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A personal, evidence-backed radar of useful GitHub repositories. Browse topics, search, and compare projects."
    />
    <meta name="color-scheme" content="light dark" />
    <title>My Repo Radar</title>
    <link rel="icon" type="image/svg+xml" href="/radar.svg" />
    <script>
      try {
        const theme = localStorage.getItem("repo-radar-theme");
        document.documentElement.dataset.theme =
          theme === "light" || theme === "dark"
            ? theme
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      } catch {
        document.documentElement.dataset.theme = matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches
          ? "dark"
          : "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript
      >This catalog needs JavaScript. You can also
      <a href="https://github.com/tomseai/my-repo-radar"
        >browse the Markdown catalog on GitHub</a
      >.</noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
